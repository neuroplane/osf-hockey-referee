<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="revision" content="191026">
<title>Тренажёр — вопросы для судей ФХР (1–100)</title>
<link rel="stylesheet" href="../tools/rules.css">
<style>
body { display: block; }
main { max-width: 720px; margin: 0 auto; padding: 76px 16px 60px; }
#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: var(--bg-2); border-bottom: 1px solid var(--border);
}
#topbar .back { color: var(--accent); text-decoration: none; font-size: 14px; white-space: nowrap; }
#progress-wrap { flex: 1; height: 6px; background: var(--bg-3); border-radius: 3px; overflow: hidden; }
#progress { height: 100%; width: 0; background: var(--accent); transition: width .25s; }
#score { font-size: 14px; color: var(--fg-dim); white-space: nowrap; }
#score b { color: var(--fg); }

.qcard { background: var(--bg-2); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
.qnum { color: var(--fg-dim); font-size: 13px; margin-bottom: 6px; }
.qtext { font-size: 16px; line-height: 1.5; margin: 0 0 10px; }
.qtext table.pt { border-collapse: collapse; margin: 12px 0 4px; width: 100%; }
.qtext table.pt th, .qtext table.pt td { border: 1px solid var(--border); padding: 6px 10px; font-size: 13px; text-align: left; }
.qtext table.pt th { background: var(--bg-3); }
.qmedia { margin: 8px 0; }
.qmedia a { color: var(--accent); font-size: 13px; margin-right: 12px; }

.opts { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.opt {
  text-align: left; font: inherit; color: var(--fg); font-size: 14.5px; line-height: 1.45;
  background: var(--bg-3); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 14px; cursor: pointer;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.correct { border-color: #4caf7d; background: #16301f; color: #8fe3ae; }
.opt.wrong { border-color: #b0433a; background: #33191a; color: #f0a49e; }
.opt.dim { opacity: .55; }

.feedback { margin-top: 14px; font-size: 14px; display: none; }
.feedback.show { display: block; }
.feedback .rule { color: var(--fg-dim); font-size: 13px; margin-top: 6px; }
#next-btn {
  margin-top: 16px; width: 100%; padding: 13px; font-size: 15px; font-weight: 600;
  color: #10131a; background: var(--accent); border: none; border-radius: 10px; cursor: pointer;
  display: none;
}
#next-btn.show { display: block; }

#result { display: none; text-align: center; padding-top: 40px; }
#result.show { display: block; }
#result h2 { font-size: 22px; }
#result .big { font-size: 42px; font-weight: 700; color: var(--accent); margin: 8px 0 4px; }
#result .sub { color: var(--fg-dim); }
#mistakes { text-align: left; margin: 24px 0; }
#mistakes details { border-top: 1px solid var(--border); padding: 8px 0; }
#mistakes summary { cursor: pointer; color: var(--fg); font-size: 14px; }
#mistakes .ans { color: #8fe3ae; font-size: 13px; padding: 6px 0 2px; }
#mistakes .rule { color: var(--fg-dim); font-size: 12.5px; }
#result button {
  margin: 8px 6px 0; padding: 11px 22px; font-size: 15px; font-weight: 600;
  border: 1px solid var(--border); border-radius: 10px; cursor: pointer;
  background: var(--bg-3); color: var(--fg);
}
#result button.primary { background: var(--accent); color: #10131a; border: none; }

.toolbar { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; font-size: 13px; color: var(--fg-dim); }
.toolbar label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
</style>
</head>
<body>
<div id="topbar">
  <a class="back" href="../">← Правила</a>
  <a class="back" href="../db/">База вопросов</a>
  <div id="progress-wrap"><div id="progress"></div></div>
  <span id="score"></span>
</div>
<main>
  <div class="toolbar">
    <label><input type="checkbox" id="shuffle"> перемешать вопросы</label>
    <span id="pos"></span>
  </div>
  <div class="qcard" id="card">
    <div class="qnum" id="qnum"></div>
    <p class="qtext" id="qtext"></p>
    <div class="qmedia" id="qmedia"></div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="feedback"></div>
    <button id="next-btn">Дальше →</button>
  </div>
  <div id="result">
    <h2>Готово</h2>
    <div class="big" id="res-big"></div>
    <div class="sub" id="res-sub"></div>
    <div id="mistakes"></div>
    <button class="primary" id="restart">Ещё раз</button>
    <button id="retry-mistakes">Повторить ошибки</button>
  </div>
</main>
<script src="data.js"></script>
<script>
(function () {
  var ALL = window.QUESTIONS;
  var order, idx, score, mistakes, done;
  var KEY = 'trainer_v1';

  var el = {
    pos: document.getElementById('pos'),
    score: document.getElementById('score'),
    progress: document.getElementById('progress'),
    qnum: document.getElementById('qnum'),
    qtext: document.getElementById('qtext'),
    qmedia: document.getElementById('qmedia'),
    opts: document.getElementById('opts'),
    fb: document.getElementById('feedback'),
    next: document.getElementById('next-btn'),
    card: document.getElementById('card'),
    result: document.getElementById('result'),
    resBig: document.getElementById('res-big'),
    resSub: document.getElementById('res-sub'),
    mist: document.getElementById('mistakes'),
    shuffle: document.getElementById('shuffle'),
  };

  function shuffled(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ idx: idx, score: score, mistakes: mistakes.map(function (m) { return m.n; }) })); } catch (e) {}
  }

  function start(list) {
    order = list;
    idx = 0; score = 0; mistakes = []; done = false;
    el.card.style.display = '';
    el.result.classList.remove('show');
    document.querySelector('.toolbar').style.display = '';
    render();
  }

  function render() {
    var q = order[idx];
    el.pos.textContent = 'Вопрос ' + (idx + 1) + ' из ' + order.length;
    el.score.innerHTML = 'Верно: <b>' + score + '</b>';
    el.progress.style.width = (idx / order.length * 100) + '%';
    el.qnum.textContent = '№' + q.n + (q.rule ? ' · ' + q.rule : '');
    el.qtext.innerHTML = q.q + (q.table || '');
    el.qmedia.innerHTML = '';
    (q.media || []).forEach(function (m) {
      var a = document.createElement('a');
      a.href = m.url; a.target = '_blank'; a.textContent = '[' + m.kind + ']';
      el.qmedia.appendChild(a);
    });
    el.fb.className = 'feedback';
    el.fb.innerHTML = '';
    el.next.classList.remove('show');
    el.opts.innerHTML = '';
    q.opts.forEach(function (o, i) {
      var b = document.createElement('button');
      b.className = 'opt';
      b.textContent = o;
      b.addEventListener('click', function () { answer(q, i, b); });
      el.opts.appendChild(b);
    });
  }

  function answer(q, i, btn) {
    var buttons = el.opts.querySelectorAll('.opt');
    buttons.forEach(function (b, j) {
      b.disabled = true;
      if (j === q.correct) b.classList.add('correct');
      else if (j === i) b.classList.add('wrong');
      else b.classList.add('dim');
    });
    var ok = i === q.correct;
    if (ok) score++; else mistakes.push(q);
    el.score.innerHTML = 'Верно: <b>' + score + '</b>';
    el.fb.className = 'feedback show';
    el.fb.innerHTML = (ok ? '<b style="color:#8fe3ae">Верно.</b> ' : '<b style="color:#f0a49e">Неверно.</b> ') +
      'Правильный ответ: <b>' + q.opts[q.correct] + '</b>' +
      (q.rule ? '<div class="rule">' + q.rule + '</div>' : '');
    el.next.classList.add('show');
    save();
  }

  el.next.addEventListener('click', function () {
    idx++;
    if (idx >= order.length) finish(); else render();
  });

  function finish() {
    done = true;
    el.card.style.display = 'none';
    document.querySelector('.toolbar').style.display = 'none';
    el.progress.style.width = '100%';
    var pct = Math.round(score / order.length * 100);
    el.resBig.textContent = score + ' / ' + order.length;
    el.resSub.textContent = pct + '% верных ответов' + (mistakes.length ? ' · ошибок: ' + mistakes.length : '');
    el.mist.innerHTML = '';
    mistakes.forEach(function (q) {
      var d = document.createElement('details');
      var s = document.createElement('summary');
      s.textContent = '№' + q.n + ' — ' + q.q.replace(/<[^>]+>/g, '').slice(0, 90);
      var a = document.createElement('div');
      a.className = 'ans'; a.textContent = '✔ ' + q.opts[q.correct];
      var r = document.createElement('div');
      r.className = 'rule'; r.textContent = q.rule;
      d.appendChild(s); d.appendChild(a); d.appendChild(r);
      el.mist.appendChild(d);
    });
    document.getElementById('retry-mistakes').style.display = mistakes.length ? '' : 'none';
    el.result.classList.add('show');
    try { localStorage.removeItem(KEY); } catch (e) {}
  }

  function begin() {
    var list = el.shuffle.checked ? shuffled(ALL) : ALL.slice();
    start(list);
  }

  document.getElementById('restart').addEventListener('click', begin);
  document.getElementById('retry-mistakes').addEventListener('click', function () { start(shuffled(mistakes)); });
  el.shuffle.addEventListener('change', begin);

  // восстановление прогресса
  var resumed = false;
  try {
    var st = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (st && st.idx > 0 && st.idx < ALL.length) {
      if (confirm('Продолжить с вопроса ' + (st.idx + 1) + '? (было верно: ' + st.score + ')')) {
        order = ALL.slice();
        idx = st.idx; score = st.score;
        mistakes = st.mistakes.map(function (n) { return ALL.find(function (q) { return q.n === n; }); }).filter(Boolean);
        render();
        resumed = true;
      }
    }
  } catch (e) {}
  if (!resumed) begin();
})();
</script>
</body>
</html>
