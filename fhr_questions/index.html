": 365, "active": false, "numRule": "", "text": "В каких ситуациях команде, совершившей проброс, разрешена замена игроков?", "refs": [], "media": []}, {"id": 366, "active": false, "numRule": "", "text": "В каких ситуациях команде, совершившей проброс, разрешена замена игроков?", "refs": [], "media": []}, {"id": 367, "active": false, "numRule": "", "text": "В каких ситуациях команде, совершившей проброс, разрешена замена игроков?", "refs": [], "media": []}, {"id": 371, "active": false, "numRule": "", "text": "Защищающийся игрок посылает шайбу в свои ворота, в то время, когда в площади ворот стоит игрок атакующей команды и инициирует контакт с вратарем. \nВаши действия?", "refs": [], "media": []}, {"id": 378, "active": false, "numRule": "", "text": "Атакующий хоккеист умышленно бьет по шайбе рукой. Шайба, затем последовательно отскакивает от вратаря соперника, другого защищающегося игрока и попадает к другому игроку атакующей команды, который затем забрасывает шайбу в ворота. \nВаши действия?", "refs": [], "media": []}, {"id": 379, "active": false, "numRule": "", "text": "Шайба касается движущейся клюшки атакующего игрока, расположенной выше перекладины ворот, затем касается тела игрока и входит в ворота. \nВаши действия?", "refs": [], "media": []}, {"id": 380, "active": false, "numRule": "", "text": "Шайба касается движущейся клюшки атакующего игрока, расположенной выше перекладины ворот, а затем отскакивает от игрока, вратаря или судьи в ворота. \nВаши действия?", "refs": [], "media": []}, {"id": 381, "active": false, "numRule": "", "text": "Выполнение какого условия необходимо для того, чтобы было засчитано взятие ворот,  если защищайщийся хоккеист сдвигает каркас своих ворот, в то время, как команда соперника,  забрасывает шайбу в ворота?", "refs": [], "media": []}, {"id": 382, "active": false, "numRule": "", "text": "5. В каких ситуациях Главный судья не может просить видеопросмотр взятия ворот?", "refs": [], "media": []}, {"id": 383, "active": false, "numRule": "", "text": "4. В каких ситуациях Главный судья не может просить видеопросмотр взятия ворот?", "refs": [], "media": []}, {"id": 384, "active": false, "numRule": "", "text": "3. В каких ситуациях Главный судья не может просить видеопросмотр взятия ворот?", "refs": [], "media": []}, {"id": 385, "active": false, "numRule": "", "text": "2. В каких ситуациях Главный судья не может просить видеопросмотр взятия ворот?", "refs": [], "media": []}, {"id": 386, "active": false, "numRule": "", "text": "1. В каких ситуациях Главный судья не может запросить видеопросмотр взятия ворот?", "refs": [], "media": []}, {"id": 387, "active": false, "numRule": "", "text": "6. В каких ситуациях Главный судья может запросить видеопросмотр взятия ворот?", "refs": [], "media": []}, {"id": 388, "active": false, "numRule": "", "text": "4. В каких ситуациях Главный судья может запросить видеопросмотр взятия ворот?", "refs": [], "media": []}, {"id": 389, "active": false, "numRule": "", "text": "3. В каких ситуациях Главный судья может запросить видеопросмотр взятия ворот?", "refs": [], "media": []}, {"id": 390, "active": false, "numRule": "", "text": "2. В каких ситуациях Главный судья может запросить видеопросмотр взятия ворот?", "refs": [], "media": []}, {"id": 391, "active": false, "numRule": "", "text": "1. В каких ситуациях Главный судья может запросить видеопросмотр взятия ворот?", "refs": [], "media": []}, {"id": 396, "active": false, "numRule": "", "text": "Дверь, калитки при оштрафованных игроках заклинило. Штрафное время игрока закончилось и он не может выйти на площадку, когда его команда в численном меньшинстве пропускает шайбу. \nВаши действия?", "refs": [], "media": []}, {"id": 402, "active": false, "numRule": "", "text": "Игрок преждевременно покинул скамейку штрафников самовольно в результате своей ошибки  и он находится на льду в тот момент, когда его команда забрасывает шайбу в ворота. \nВаши действия?", "refs": [], "media": []}, {"id": 404, "active": false, "numRule": "", "text": "Шайба находится под контролем обороняющегося хоккеиста, которого атакующий хоккеист направляет вместе с шайбой в ворота, применяя силовой прием. \nВаши действия?", "refs": [], "media": []}, {"id": 405, "active": false, "numRule": "", "text": "После взятия ворот, линейный судья сообщает Главному судье, что на команду забросившую шайбу, должен быть наложен Большой и Дисциплинарный до конца игры штраф. \nВаши действия?", "refs": [], "media": []}, {"id": 415, "active": false, "numRule": "19.1", "text": "Сколько игроков на обеих скамейках оштрафованных в 3:00?\n \nКоманда «А»\nКоманда «Б»\n\nA3 – 2 + 2 мин. в 3:00\nБ8 – 2 + 5 мин. + Дисциплинарный до конца матча штраф в 3:00\n\nA5 – 2 мин. в 3:00\nБ9 – 5 мин. + Дисциплинарный до конца матча штраф в 3:00\n\nA7 – 5 мин. + Дисциплинарный до конца матча штраф в 3:00", "refs": [{"num": "19.1", "doc": null, "key": null}], "media": []}, {"id": 424, "active": false, "numRule": "", "text": "В каких составах будут играть команды в 3:00?\n\nКоманда «А» Команда «Б»\nA6 – 5 мин + Дисциплинарный до конца игры штраф в 3:00                                                   Б7 – Матч-штраф в 3:00", "refs": [], "media": []}, {"id": 425, "active": false, "numRule": "", "text": "В каких составах будут играть команды в 3:00?\n\nКоманда «А» Команда «Б»\nA6 – Матч-штраф в 3:00Б7 – Матч-штраф в 3:00", "refs": [], "media": []}, {"id": 433, "active": false, "numRule": "", "text": "Команда, на которую будет наложен штраф не владеет шайбой. Шайбой владеет команда не нарушившая правила, что должен сделать Главный судья?", "refs": [], "media": []}, {"id": 434, "active": false, "numRule": "103", "text": "Имеет ли право оштрафованный хоккеист, команды играющей в численном меньшинстве, вернуться на лед раньше времени окончания Малого или Малого скамеечного штрафа?", "refs": [{"num": "103", "doc": null, "key": null}], "media": []}, {"id": 435, "active": false, "numRule": "20.1", "text": "Что такое большой штраф?", "refs": [{"num": "20.1", "doc": null, "key": null}], "media": []}, {"id": 437, "active": false, "numRule": "", "text": "Какое время Дисциплинарного до конца матча штрафа записывается в протокол матча?", "refs": [], "media": []}, {"id": 441, "active": false, "numRule": "0", "text": "Какому наказанию будет подвергнут хоккеист, получивший два Дисциплинарных до конца матча штрафа в одном матче?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 442, "active": false, "numRule": "", "text": "Какое время Дисциплинарного штрафа записывается в протокол матча?", "refs": [], "media": []}, {"id": 443, "active": false, "numRule": "110", "text": "Что такое Матч-штраф?", "refs": [{"num": "110", "doc": null, "key": null}], "media": []}, {"id": 444, "active": false, "numRule": "", "text": "Какое время Матч-штрафа записывается в протокол матча?", "refs": [], "media": []}, {"id": 445, "active": false, "numRule": "109", "text": "Какому наказанию будет подвергнут хоккеист, получивший два Матч штрафа в одном матче?", "refs": [{"num": "109", "doc": null, "key": null}], "media": []}, {"id": 447, "active": false, "numRule": "", "text": "Могут ли Линейные судьи остановить игру и наложить двойной малый штраф за колющий удар?", "refs": [], "media": []}, {"id": 448, "active": false, "numRule": "32.4", "text": "Могут ли Линейные судьи остановить игру и наложить двойной малый штраф когда очевидно нанесена травма в результате игры высоко поднятой клюшкой, которая осталась незамеченной Главными судьями?", "refs": [{"num": "32.4", "doc": null, "key": null}], "media": []}, {"id": 449, "active": false, "numRule": "", "text": "Имеет ли право хоккеист, на которого Главный судья наложил Дисциплинарный штраф в последние 5 минут третьего периода, участвовать в дополнительном периоде и серии бросков, определяющих победителя матча?", "refs": [], "media": []}, {"id": 450, "active": false, "numRule": "", "text": "В течение отложенного Малого штрафа команда, владеющая шайбой, забрасывает шайбу в ворота команды соперника. Что s.fhr.ru/static/files/images/exam-platform/iblock/4de/4dedfa24e0205814fbf0e74d6b5d50bc.jpg?1"}]}];
const RULES = {};
let filter = "all", query = "";

function esc(s){ const d=document.createElement("div"); d.textContent=s||""; return d.innerHTML; }

function render(){
  const list = document.getElementById("list");
  const q = query.toLowerCase();
  let html = "", n = 0;
  for (const it of QUESTIONS){
    if (filter==="active" && !it.active) continue;
    if (filter==="deleted" && it.active) continue;
    if (q && !(it.text.toLowerCase().includes(q) || (it.numRule||"").toLowerCase().includes(q))) continue;
    n++;
    html += `<div class="q ${it.active?"":"deleted"}"><div class="meta">`
      + `<span>#${n} · id ${it.id}</span>`
      + (it.numRule ? `<span>правило: ${esc(it.numRule)}</span>` : "")
      + (it.active ? "" : `<span class="badge">УДАЛЁН</span>`)
      + `</div><div class="txt">${esc(it.text)}</div><div>`;
    for (const m of it.media) html += `<a class="media" href="${m.u}" target="_blank">${m.k}</a>`;
    for (const r of it.refs){
      if (r.key) html += `<span class="rule" onclick="showRule('${r.doc}','${r.key}')">§ ${esc(r.num)}</span>`;
      else html += `<span class="rule none">${esc(r.num)}</span>`;
    }
    html += "</div></div>";
  }
  list.innerHTML = html;
  document.getElementById("count").textContent = n + " вопросов";
}

// Разбивает текст из PDF на абзацы: переносы внутри абзаца склеиваются,
// новый абзац — после короткой строки с концом предложения, на строках-заголовках
// капсом и на элементах списка (i. ii. 1. – и т.п.)
function fmtBody(text){
  const lines = (text || "").split("\n").map(s => s.trim()).filter(Boolean);
  if (!lines.length) return "<p>—</p>";
  const lens = lines.map(l => l.length).sort((a,b) => a-b);
  const med = lens[Math.floor(lens.length/2)] || 60;
  const caps = s => { const L = s.replace(/[^A-Za-zА-Яа-яЁё]/g,""); return L.length >= 4 && L === L.toUpperCase(); };
  const item = s => /^([ivxl]{1,4}\.|\d{1,2}[.)]|[–—-]|п\.|[а-я]\))\s/i.test(s);
  let html = "", buf = [], cls = "";
  const flush = () => {
    if (!buf.length) return;
    html += "<p" + (cls ? ' class="' + cls + '"' : "") + ">" + esc(buf.join(" ")) + "</p>";
    buf = []; cls = "";
  };
  for (const ln of lines){
    const isCaps = caps(ln), isItem = item(ln);
    if (buf.length && (isCaps || isItem)) flush();
    buf.push(ln);
    if (isCaps) cls = "h";
    const endTerm = /[.!?:;»"]$/.test(ln);
    if (isCaps || (endTerm && ln.length < med * 0.82)) flush();
  }
  flush();
  return html;
}

function showRule(doc, key){
  const r = RULES[doc + "|" + key]; if(!r) return;
  document.getElementById("p-title").textContent = "Правило " + key + " — " + r.title;
  document.getElementById("p-doc").innerHTML =
    esc(r.docLabel) + ", стр. " + r.page + ' — <a href="' + r.url + '#page=' + r.page + '" target="_blank">открыть PDF</a>';
  document.getElementById("p-body").innerHTML = fmtBody(r.text);
  document.getElementById("panel").classList.add("open");
  document.getElementById("backdrop").classList.add("open");
}
function closePanel(){
  document.getElementById("panel").classList.remove("open");
  document.getElementById("backdrop").classList.remove("open");
}

document.getElementById("search").addEventListener("input", e=>{ query=e.target.value; render(); });
document.querySelectorAll(".filters button").forEach(b=>b.addEventListener("click", ()=>{
  document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); filter=b.dataset.f; render();
}));
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closePanel(); });
render();
</script>
