 117, "active": true, "numRule": "76.4", "text": "Кто из игроков, разыгрывающих вбрасывание, должен поставить клюшку первым, в случае, если вбрасывание проводится в точке вбрасывания в  конечной зоне?", "refs": [{"num": "76.4", "doc": null, "key": null}], "media": []}, {"id": 119, "active": true, "numRule": "76.6", "text": "Что должен сделать судья, если один из игроков, не участвующих в розыгрыше вбрасывания, преждевременно въезжает в круг вбрасывания?", "refs": [{"num": "76.6", "doc": null, "key": null}], "media": []}, {"id": 120, "active": true, "numRule": "76.4", "text": "Кто может принять решение по нарушению процедуры вбрасывания одного из хоккеистов на вбрасывании?", "refs": [{"num": "76.4", "doc": null, "key": null}], "media": []}, {"id": 121, "active": true, "numRule": "87.1", "text": "Какое количество тридцатисекундных перерывов разрешено команде взять в игре?", "refs": [{"num": "87.1", "doc": null, "key": null}], "media": []}, {"id": 122, "active": true, "numRule": "87.1", "text": "Кто имеет право попросить Главного судью о назначении тридцатисекундного перерыва во время остановки матча?", "refs": [{"num": "87.1", "doc": null, "key": null}], "media": []}, {"id": 123, "active": true, "numRule": "56.10.2", "text": "Что должно быть предпринято, если хоккеисту, чья команда владеет шайбой, мешают зрители?", "refs": [{"num": "56.10", "doc": null, "key": null}], "media": []}, {"id": 124, "active": true, "numRule": "81.1", "text": "В какой ситуации проброс не будет зафиксирован?", "refs": [{"num": "81.1", "doc": null, "key": null}], "media": []}, {"id": 125, "active": true, "numRule": "81.6", "text": "Если команда играет в численном меньшинстве по собственной инициативе или невнимательности должен ли линейный судья фиксировать проброс?", "refs": [{"num": "81.6", "doc": null, "key": null}], "media": []}, {"id": 126, "active": true, "numRule": "81.6", "text": "Если команда играет в численном меньшинстве по причине нарушения правил, должен ли линейный судья фиксировать проброс?", "refs": [{"num": "81.6", "doc": null, "key": null}], "media": []}, {"id": 127, "active": true, "numRule": "81.2", "text": "Линейные судьи ошиблись в определении проброса. Где будет вбрасывание?", "refs": [{"num": "81.2", "doc": null, "key": null}], "media": []}, {"id": 129, "active": true, "numRule": "83.1", "text": "Что является определяющим фактором положения «Вне игры»?", "refs": [{"num": "83.1", "doc": null, "key": null}], "media": []}, {"id": 130, "active": true, "numRule": "78", "text": "На какой линии можно определить положение «Вне игры»?", "refs": [{"num": "78", "doc": null, "key": null}], "media": []}, {"id": 131, "active": true, "numRule": "83.1", "text": "В какую зону по ширине входит синяя линия, если будет осуществляться вход в зону?", "refs": [{"num": "83.1", "doc": null, "key": null}], "media": []}, {"id": 132, "active": true, "numRule": "0 методика", "text": "В какую зону по ширине входит синяя линия, если осуществляется выход из зоны?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 133, "active": true, "numRule": "83.1", "text": "Один конек игрока расположен на синей линии или в нейтральной зоне, а другой - в зоне атаки, в момент полного пересечения шайбой синей линии.", "refs": [{"num": "83.1", "doc": null, "key": null}], "media": []}, {"id": 134, "active": true, "numRule": "83.1", "text": "Игрок находится в нейтральной зоне обоими коньками, а его клюшка расположена в зоне атаки в момент полного пересечения шайбой синей линии.\nКакое правильное решение судьи?", "refs": [{"num": "83.1", "doc": null, "key": null}], "media": []}, {"id": 135, "active": true, "numRule": "83.1", "text": "Оба конька игрока полностью расположены в зоне атаки в момент полного пересечения шайбой синей линии.\n\nВаше решение?", "refs": [{"num": "83.1", "doc": null, "key": null}], "media": []}, {"id": 136, "active": true, "numRule": "83.3", "text": "Игрок в нейтральной зоне бросает шайбу вперед по льду, а другой игрок из той же команды, раньше шайбы пересекает синюю линию зоны атаки, но не касается шайбы.", "refs": [{"num": "83.3", "doc": null, "key": null}], "media": []}, {"id": 137, "active": true, "numRule": "83.1", "text": "Один конек игрока находится в нейтральной зоне, а другой на синей линии в момент полного пересечения шайбой синей линии.", "refs": [{"num": "83.1", "doc": null, "key": null}], "media": []}, {"id": 138, "active": true, "numRule": "0 методика", "text": "Атакующая команда владеет шайбой в зоне атаки. Шайба частично находится на синей линии и частично в нейтральной зоне. Атакующий игрок затем перемещает шайбу в зону атаки.", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 140, "active": true, "numRule": "83.7", "text": "Где будет вбрасывание в результате умышленного положения «Вне игры»?", "refs": [{"num": "83.7", "doc": null, "key": null}], "media": []}, {"id": 144, "active": true, "numRule": "1.3", "text": "Какого цвета травмобезопасная накладка, прикрепленная к бортам по всему периметру игровой площадки?", "refs": [{"num": "1.3", "doc": null, "key": null}], "media": []}, {"id": 146, "active": true, "numRule": "1.3, 3.1", "text": "Допускается ли наличие защитного стекла перед скамейками игроков", "refs": [{"num": "1.3", "doc": null, "key": null}, {"num": "3.1", "doc": null, "key": null}], "media": []}, {"id": 149, "active": true, "numRule": "73.2", "text": "Команда, находящаяся на льду,  отказывается начать матч с определенным количеством хоккеистов в своем составе. \nВаши действия?", "refs": [{"num": "73.2", "doc": null, "key": null}], "media": []}, {"id": 150, "active": true, "numRule": "73.2", "text": "Одна из команд, находящихся на льду, отказывается продолжать матч. \nВаши действия?", "refs": [{"num": "73.2", "doc": null, "key": null}], "media": []}, {"id": 151, "active": true, "numRule": "73.2", "text": "Одна из команд, находящихся на льду, отказывается продолжать матч после отведенных 15 секунд. \nВаши действия?", "refs": [{"num": "73.2", "doc": null, "key": null}], "media": []}, {"id": 152, "active": true, "numRule": "73.2", "text": "Одна из команд, находящихся на льду, отказывается продолжать матч после отведенных 15 секунд и наложенного Малого скамеечного штрафа. \nВаши действия?", "refs": [{"num": "73.2", "doc": null, "key": null}], "media": []}, {"id": 155, "active": true, "numRule": "5.2", "text": "Хоккеист не заявлен на матч, но принимает участие в нем. \nВаши действия?", "refs": [{"num": "5.2", "doc": null, "key": null}], "media": []}, {"id": 157, "active": true, "numRule": "5.2", "text": "Хоккеист получает штраф и в ходе его отбывания обнаруживается, что он не имеет допуска к участию в матче. \nВаши действия?", "refs": [{"num": "5.2", "doc": null, "key": null}], "media": []}, {"id": 158, "active": true, "numRule": "70.3", "text": "Может ли запасной игрок, перед выходом на лед, провести разминку на льду?", "refs": [{"num": "70.3", "doc": null, "key": null}], "media": []}, {"id": 161, "active": true, "numRule": "74.1", "text": "Допускается ли замена вратаря игроком в любой момент игровых действий?", "refs": [{"num": "74.1", "doc": null, "key": null}], "media": []}, {"id": 164, "active": true, "numRule": "12.3", "text": "Какое защитное наружное покрытие должны иметь налокотники хоккеиста?", "refs": [{"num": "12.3", "doc": null, "key": null}], "media": []}, {"id": 168, "active": true, "numRule": "10.5", "text": "После проведенных измерений,  клюшка игрока оказалась нестандартных размеров.\nЧто делать с клюшкой?", "refs": [{"num": "10.5", "doc": null, "key": null}], "media": []}, {"id": 169, "active": true, "numRule": "10.7", "text": "Когда во время серии бросков для определения победителя матча, капитан вправе  потребовать замер клюшки соперника?", "refs": [{"num": "10.7", "doc": null, "key": null}], "media": []}, {"id": 170, "active": true, "numRule": "10.7", "text": "Перед выполнением броска, определяющего победителя матча , команда «А» просит измерить клюшку у вратаря команды «Б».\nВаши действия?", "refs": [{"num": "10.7", "doc": null, "key": null}], "media": []}, {"id": 171, "active": true, "numRule": "84.1", "text": "Предусмотрена ли заливка льда перед пятиминутным дополнительным периодом?", "refs": [{"num": "84.1", "doc": null, "key": null}], "media": []}, {"id": 172, "active": true, "numRule": "76.2", "text": "Где будет проводиться вбрасывание, если одной командой совершено два нарушения Правил, повлекшие за собой остановку матча (игра высоко поднятой клюшкой и умышленное положение «вне игры»)?", "refs": [{"num": "76.2", "doc": null, "key": null}], "media": []}, {"id": 174, "active": true, "numRule": "85.1", "text": "Где будет проводиться вбрасывание, если шайба попадает в табло?", "refs": [{"num": "85.1", "doc": null, "key": null}], "media": []}, {"id": 175, "active": true, "numRule": "76.2", "text": "Где будет проводиться вбрасывание, если игра остановлена в зоне атаки по вине атакующего игрока, а на защищающегося игрока должен быть наложен штраф?", "refs": [{"num": "76.2", "doc": null, "key": null}], "media": []}, {"id": 176, "active": true, "numRule": "76.2", "text": "Где будет проводиться вбрасывание, если игра остановлена в зоне атаки по вине атакующего игрока?", "refs": [{"num": "76.2", "doc": null, "key": null}], "media": []}, {"id": 179, "active": true, "numRule": "76.2", "text": "Где будет проводиться вбрасывание, если Малый штраф был наложен до начала периода?", "refs": [{"num": "76.2", "doc": null, "key": null}], "media": []}, {"id": 183, "active": true, "numRule": "76.2", "text": "Штраф должен быть наложен на одну команду, а другая совершает проброс. \nГде будет вбрасывание?", "refs": [{"num": "76.2", "doc": null, "key": null}], "media": []}, {"id": 184, "active": true, "numRule": "8.1", "text": "Травмированный игрок в нейтральной зоне. Где будет проводиться вбрасывание, если его команда владеет шайбой в зоне атаки?", "refs": [{"num": "8.1", "doc": null, "key": null}], "media": []}, {"id": 185, "active": true, "numRule": "8.1", "text": "Травмированный игрок в нейтральной зоне. Где будет проводиться вбрасывание, если его команда владеет шайбой в этой же зоне?", "refs": [{"num": "8.1", "doc": null, "key": null}], "media": []}, {"id": 196, "active": true, "numRule": "83.7", "text": "Где будет вбрасывание, если команда совершает умышленное положение «Вне игры»?", "refs": [{"num": "83.7", "doc": null, "key": null}], "media": []}, {"id": 200, "active": true, "numRule": "76.2", "text": "Взятие ворот не засчитано, так как шайба была заброшена ногой. Где будет вбрасывание?", "refs": [{"num": "76.2", "doc": null, "key": null}], "media": []}, {"id": 201, "active": true, "numRule": "76.2, 80.2", "text": "Взятие ворот не засчитано, так как шайба была заброшена высоко поднятой клюшкой. Где будет вбрасывание?", "refs": [{"num": "76.2", "doc": null, "key": null}, {"num": "80.2", "doc": null, "key": null}], "media": []}, {"id": 202, "active": true, "numRule": "76.2", "text": "Атакующий игрок падает на лед и сдвигает ворота, в результате воздействия на него защищающегося игрока. \nГде будет вбрасывание?", "refs": [{"num": "76.2", "doc": null, "key": null}], "media": []}, {"id": 203, "active": true, "numRule": "63.4", "text": "Атакующий игрок падает на лед и сдвигает ворота, не имея возможности избежать столкновения с воротами. \nГде будет вбрасывание?", "refs": [{"num": "63.4", "doc": null, "key": null}], "media": []}, {"id": 204, "active": true, "numRule": "76.5", "text": "Игроки какой команды должны занять первыми свои позиции на точке вбрасывания в конечной зоне?", "refs": [{"num": "76.5", "doc": null, "key": null}], "media": []}, {"id": 210, "active": true, "numRule": "84.4", "text": "Какая команда первой начинает выполнять серию бросков для выявления победителя матча?", "refs": [{"num": "84.4", "doc": null, "key": null}], "media": []}, {"id": 211, "active": true, "numRule": "8.2", "text": "Можно ли заменить вратаря, если необходимо повторить бросок для определения победителя матча?", "refs": [{"num": "8.2", "doc": null, "key": null}], "media": []}, {"id": 215, "active": true, "numRule": "81.5", "text": "Должен ли судья на льду зафиксировать проброс, в случае, если шайба попадает в  тело соперника или снаряжение и после этого пересекает линию ворот?", "refs": [{"num": "81.5", "doc": null, "key": null}], "media": []}, {"id": 217, "active": true, "numRule": "81.5", "text": "Должен ли судья на льду зафиксировать проброс  в случае, если шайба направлена на проброс непосредственно со вбрасывания?", "refs": [{"num": "81.5", "doc": null, "key": null}], "media": []}, {"id": 220, "active": true, "numRule": "85.1", "text": "Считается ли в игре шайба, застрявшая во время матча на борту игровой площадки в любой ее точке?", "refs": [{"num": "85.1", "doc": null, "key": null}], "media": []}, {"id": 236, "active": true, "numRule": "85.4", "text": "Шайба зашла в ворота от судьи, после рикошета в конечной зоне. Взятие ворот не засчитано. Где будет вбрасывание?", "refs": [{"num": "85.4", "doc": null, "key": null}], "media": []}, {"id": 251, "active": true, "numRule": "83.6", "text": "Линейный судья ошибочно остановил игру из-за положения «Вне игры».\nВход в зону был правильным. \nГде должно быть проведено вбрасывание?", "refs": [{"num": "83.6", "doc": null, "key": null}], "media": []}, {"id": 253, "active": true, "numRule": "83.3", "text": "В ситуации отложенного положения «вне игры» шайба случайно попадает в хоккеиста атакующей команды, который пытается покинуть зону атаки. \nВаши действия?", "refs": [{"num": "83.3", "doc": null, "key": null}], "media": []}, {"id": 256, "active": true, "numRule": "9.7, 202.1", "text": "Какие хоккеисты обязаны носить козырек для защиты глаз?", "refs": [{"num": "9.7", "doc": null, "key": null}, {"num": "202.1", "doc": null, "key": null}], "media": []}, {"id": 257, "active": true, "numRule": "10.5", "text": "Чем необходимо измерять загиб крюка клюшки полевого игрока?", "refs": [{"num": "10.5", "doc": null, "key": null}], "media": []}, {"id": 258, "active": true, "numRule": "10.1", "text": "Как измерить загиб крюка клюшки игрока?", "refs": [{"num": "10.1", "doc": null, "key": null}], "media": []}, {"id": 260, "active": true, "numRule": "10.5", "text": "От команды «А» поступила просьба измерить величину загиба крюка игрока команды «Б», который находится на скамейке оштрафованных игроков.\nВаши действия?", "refs": [{"num": "10.5", "doc": null, "key": null}], "media": []}, {"id": 261, "active": true, "numRule": "10.5", "text": "От капитана команды поступил запрос об измерении клюшки игрока, который забросил шайбу. Клюшка оказалась нестандартных размеров.\nВаши действия?", "refs": [{"num": "10.5", "doc": null, "key": null}], "media": []}, {"id": 264, "active": true, "numRule": "76.5", "text": "Во время проведения вбрасывания в конечной точке, игроки атакующей команды заняли свои позиции на вбрасывании. После чего игроки защищающейся команды поменяли свои позиции.\nВаши действия?", "refs": [{"num": "76.5", "doc": null, "key": null}], "media": []}, {"id": 266, "active": true, "numRule": "87.1", "text": "Команда запросила тридцатисекундный перерыв во время серии бросков для определения победителя матча. \nВаши действия?", "refs": [{"num": "87.1", "doc": null, "key": null}], "media": []}, {"id": 268, "active": true, "numRule": "84.4", "text": "Может ли игрок, у которого не закончилось штрафное время, участвовать в серии бросков для определения победителя матча?", "refs": [{"num": "84.4", "doc": null, "key": null}], "media": []}, {"id": 270, "active": true, "numRule": "85.1", "text": "Игрок команды А, находясь в нейтральной зоне у своей синей линии, выбрасывает шайбу, и она попадает в игрока команды Б, перегнувшегося через борт со скамейки игроков.\nГде судья должен назначить вбрасывание?", "refs": [{"num": "85.1", "doc": null, "key": null}], "media": []}, {"id": 272, "active": true, "numRule": "85.1", "text": "Игрок команды А, находясь в своей зоне защиты или в нейтральной зоне, бросает шайбу, и она попадает в открытую калитку команды соперника (команды Б). \nГде судья должен назначить вбрасывание?", "refs": [{"num": "85.1", "doc": null, "key": null}], "media": []}, {"id": 273, "active": true, "numRule": "80.1, 80.3", "text": "Игрок атакующей команды сбивает шайбу с верхней сетки ворот клюшкой, а затем забрасывает шайбу в ворота. \nВаши действия?", "refs": [{"num": "80.1", "doc": null, "key": null}, {"num": "80.3", "doc": null, "key": null}], "media": []}, {"id": 274, "active": true, "numRule": "80.1, 80.3", "text": "Игрок атакующей команды сбивает шайбу с верхней сетки ворот клюшкой, подбивая сетку изнутри ворот, а затем забрасывает шайбу в ворота. \nВаши действия?", "refs": [{"num": "80.1", "doc": null, "key": null}, {"num": "80.3", "doc": null, "key": null}], "media": []}, {"id": 279, "active": true, "numRule": "80.2", "text": "Игрок касается шайбы высоко поднятой клюшкой выше уровня плеча в зоне атаки, а его товарищ по команде играет в шайбу в этой же зоне. \nГде будет проводиться следующее вбрасывание?", "refs": [{"num": "80.2", "doc": null, "key": null}], "media": []}, {"id": 280, "active": true, "numRule": "80.2", "text": "Игрок касается шайбы высоко поднятой клюшкой в зоне атаки, а его партнер по команде завладевает шайбой в нейтральной зоне. \nГде будет проводиться следующее вбрасывание ?", "refs": [{"num": "80.2", "doc": null, "key": null}], "media": []}, {"id": 281, "active": true, "numRule": "80.3", "text": "Назовите определяющий фактор при определении взятия ворот высоко поднятой клюшкой?", "refs": [{"num": "80.3", "doc": null, "key": null}], "media": []}, {"id": 282, "active": true, "numRule": "83.1", "text": "Один конек игрока находится в воздухе над синей линией (непосредственно над ней, но не касается льда), а другой конек – на льду в зоне атаки, в момент, когда игрок принимает шайбу в зоне атаки. \nВаши действия?", "refs": [{"num": "83.1", "doc": null, "key": null}], "media": []}, {"id": 283, "active": true, "numRule": "83.1", "text": "Игрок, у которого оба конька полностью находятся в зоне атаки, получает передачу от товарища по команде. Он останавливает шайбу своей клюшкой до того, как шайба пересечет синюю линию, а затем перемещает ее за синюю линию.", "refs": [{"num": "83.1", "doc": null, "key": null}], "media": []}, {"id": 287, "active": true, "numRule": "83.2", "text": "Игрок защищающейся команды выбрасывает шайбу из своей зоны защиты и в нейтральной зоне шайба отскакивает от судьи обратно в зону защиты, в то время, когда атакующий игрок все еще находится в зоне атаки.", "refs": [{"num": "83.2", "doc": null, "key": null}], "media": []}, {"id": 289, "active": true, "numRule": "83.1", "text": "Атакующий игрок, находясь в зоне атаки, делает обводку и шайба покидает зону атаки и затем возвращается обратно. Шайба не отрывается от клюшки.", "refs": [{"num": "83.1", "doc": null, "key": null}], "media": []}, {"id": 290, "active": true, "numRule": "83.1", "text": "Один конек игрока за синей линией другой на синей линии, когда он принимает шайбу на клюшку и спиной вперед заезжает в зону, затаскивая за собой шайбу, не отрывая ее от клюшки.", "refs": [{"num": "83.1", "doc": null, "key": null}], "media": []}, {"id": 291, "active": true, "numRule": "83.1", "text": "Игрок, находится за синей линией в зоне атаки, принимает шайбу на клюшку в нейтральной зоне и, двигаясь спиной вперед, затаскивает ее за собой, не открывая клюшку от шайбы.\nРешение Линейного судьи?", "refs": [{"num": "83.1", "doc": null, "key": null}], "media": []}, {"id": 292, "active": true, "numRule": "83.1", "text": "Игрок, стоит на синей линии, принимает шайбу на клюшку в нейтральной зоне и, двигаясь спиной вперед, затаскивает ее за собой, не открывая клюшку от шайбы.\nРешение Линейного судьи?", "refs": [{"num": "83.1", "doc": null, "key": null}], "media": []}, {"id": 294, "active": true, "numRule": "83.6", "text": "В результате броска шайбы в зону атаки создается ситуация отложенного положения  «Вне игры» при котором шайба отскакивает от защищающегося хоккеиста и выходит из игры.\nВаше решение?", "refs": [{"num": "83.6", "doc": null, "key": null}], "media": []}, {"id": 295, "active": true, "numRule": "81.1, 83.3", "text": "В ситуации проброса атакующий игрок оказывается в отложенном положении «Вне игры», и по мнению Линейного судьи,  первым шайбой должен завладеть игрок защищающейся команды. \nЛинейный судья должен:", "refs": [{"num": "81.1", "doc": null, "key": null}, {"num": "83.3", "doc": null, "key": null}], "media": []}, {"id": 296, "active": true, "numRule": "83.1", "text": "В ситуации проброса атакующий игрок оказывается в отложенном положении «Вне игры», и по мнению Линейного судьи, первым шайбой должен завладеть хоккеист атакующей команды. \nЛинейный судья должен:", "refs": [{"num": "83.1", "doc": null, "key": null}], "media": []}, {"id": 299, "active": true, "numRule": "79.3", "text": "Игрок команды «А» пытается остановить шайбу рукой в зоне атаки и шайба отскакивает партнеру, находящемуся в этой же зоне.\nВаши действия?", "refs": [{"num": "79.3", "doc": null, "key": null}], "media": []}, {"id": 301, "active": true, "numRule": "79.2, 79.3", "text": "Игрок из своей зоны защиты намеренно направляет шайбу рукой, а партнер принимает шайбу клюшкой в нейтральной зоне хотя его коньки находятся в зоне защиты?", "refs": [{"num": "79.2", "doc": null, "key": null}, {"num": "79.3", "doc": null, "key": null}], "media": []}, {"id": 302, "active": true, "numRule": "80.2", "text": "Игрок сыграл в шайбу высоко поднятой клюшкой, в зоне атаки. Шайба касается соперника в зоне атаки и отскакивает в нейтральную зону. Между синей линией зоны атаки и центральной красной линией шайбу подхватывает партнер игрока, сыгравшего высоко поднятой клюшкой.\nВаши действия?", "refs": [{"num": "80.2", "doc": null, "key": null}], "media": []}, {"id": 303, "active": true, "numRule": "80.3", "text": "При определении взятия ворот высоко поднятой клюшкой, какая часть клюшки должна рассматриваться в качестве основного критерия?", "refs": [{"num": "80.3", "doc": null, "key": null}], "media": []}, {"id": 304, "active": true, "numRule": "83.1", "text": "Атакующий хоккеист из нейтральной зоны, бросает шайбу в зону атаки, но она попадает в игрока соперника в нейтральной зоне, отскакивает от его тела или клюшки, а затем, пересекая синюю линию, попадает в партнера, который не успел выйти из зоны атаки.", "refs": [{"num": "83.1", "doc": null, "key": null}], "media": []}, {"id": 305, "active": true, "numRule": "15.6", "text": "Матч остановлен по причине отложенного положения «Вне игры», а на другую команду должен быть наложен штраф. Где будет вбрасывание?", "refs": [{"num": "15.6", "doc": null, "key": null}], "media": []}, {"id": 306, "active": true, "numRule": "83.4", "text": "В ситуации отложенного положения «Вне игры» защищающаяся команда забрасывает шайбу в свои ворота. \nВаши действия?", "refs": [{"num": "83.4", "doc": null, "key": null}], "media": []}, {"id": 307, "active": true, "numRule": "83.4", "text": "В ситуации отложенного положения «Вне игры», шайба рикошетом от борта входит в ворота, когда атакующие игроки уже покинули зону атаки. \nВаши действия?", "refs": [{"num": "83.4", "doc": null, "key": null}], "media": []}, {"id": 308, "active": true, "numRule": "83.6", "text": "В ситуации отложенного положения «Вне игры», хоккеист защищающейся команды выбрасывает шайбу за пределы игровой поверхности, когда шайба отскакивая от защитного стекла не пересекает синюю линию.  \nГде будет вбрасывание?", "refs": [{"num": "83.6", "doc": null, "key": null}], "media": []}, {"id": 309, "active": true, "numRule": "83.6", "text": "В ситуации отложенного положения «Вне игры»,  хоккеист обороняющейся команды выбрасывает шайбу за пределы игровой поверхности с рикошетом от защитного стекла, когда шайба не пересекает синюю линию. \nВаши действия?", "refs": [{"num": "83.6", "doc": null, "key": null}], "media": []}, {"id": 310, "active": true, "numRule": "83.6, 63.2.3", "text": "В ситуации отложенного положения «Вне игры», хоккеист защищающейся команды выбрасывает шайбу за пределы игровой поверхности, когда шайба пересекает синюю линию. \nВаши действия?", "refs": [{"num": "83.6", "doc": null, "key": null}, {"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 311, "active": true, "numRule": "83.6", "text": "В ситуации отложенного положения «Вне игры» хоккеист защищающейся команды выбрасывает шайбу за пределы игровой поверхности с рикошетом от защитного стекла, когда шайба пересекает синюю линию. \nВаши действия?", "refs": [{"num": "83.6", "doc": null, "key": null}], "media": []}, {"id": 312, "active": true, "numRule": "0 методика", "text": "К кому должен обратиться судья за медицинской помощью, в случае, если во время матча судья получает незначительную травму на льду?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 314, "active": true, "numRule": "74.1", "text": "Хоккеист, у которого один конек находится на льду, а другой на скамейке игроков, считается находящимся вне льда?", "refs": [{"num": "74.1", "doc": null, "key": null}], "media": []}, {"id": 319, "active": true, "numRule": "74.1", "text": "Во время матча в процессе замены хоккеисты, находятся в полутораметровой зоне замены от борта и по длине всей скамейки хоккеистов и не участвуют в игровых действиях", "refs": [{"num": "74.1", "doc": null, "key": null}], "media": []}, {"id": 320, "active": true, "numRule": "3.1, 5.4", "text": "Разрешено ли хоккеистам одной команды заходить на скамейку команды соперника?", "refs": [{"num": "3.1", "doc": null, "key": null}, {"num": "5.4", "doc": null, "key": null}], "media": []}, {"id": 322, "active": true, "numRule": "81.4", "text": "Команда совершила проброс шайбы. Можно ли этой команде проводить смену игрового состава?", "refs": [{"num": "81.4", "doc": null, "key": null}], "media": []}, {"id": 323, "active": true, "numRule": "78.4", "text": "Шайба попадает в штангу и раскалывается пополам. Одна часть попадает в ворота, другая отскакивает в угол площадки. \nВаши действия?", "refs": [{"num": "78.4", "doc": null, "key": null}], "media": []}, {"id": 324, "active": true, "numRule": "78.4", "text": "Игрок со своей половины площадки забрасывает шайбу в ворота соперника. \nВаши действия?", "refs": [{"num": "78.4", "doc": null, "key": null}], "media": []}, {"id": 325, "active": true, "numRule": "1.7", "text": "Что такое «Площадь ворот»?", "refs": [{"num": "1.7", "doc": null, "key": null}], "media": []}, {"id": 326, "active": true, "numRule": "78.4", "text": "Будет ли засчитано взятие ворот, в случае, если Главный судья дал свисток на остановку матча перед тем, как шайба пересекла линию ворот?", "refs": [{"num": "78.4", "doc": null, "key": null}], "media": []}, {"id": 327, "active": true, "numRule": "0", "text": "Шайба полностью пересекла линию ворот после окончания периода. Ваши действия?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 328, "active": true, "numRule": "Методика Раздел 4,5", "text": "Должен ли Главный судья остановить матч, в случае, если ворота были сдвинуты из нормального положения, но вратарь вернул их на место?", "refs": [{"num": "4", "doc": null, "key": null}, {"num": "5", "doc": null, "key": null}], "media": []}, {"id": 329, "active": true, "numRule": "83.7", "text": "Отложенное положение «вне игры» рассматривается, как умышленное положение «Вне игры», если?", "refs": [{"num": "83.7", "doc": null, "key": null}], "media": []}, {"id": 332, "active": true, "numRule": "83.7", "text": "Отложенное положение «Вне игры» рассматривается, как умышленное положение «Вне игры», если?", "refs": [{"num": "83.7", "doc": null, "key": null}], "media": []}, {"id": 333, "active": true, "numRule": "8.1", "text": "Может ли Главный судья остановить игру, в случае, если  игрок травмирован и не может продолжать игру или вернуться на скамейку, а его команда имеет неминуемую возможность произвести взятие ворот?", "refs": [{"num": "8.1", "doc": null, "key": null}], "media": []}, {"id": 334, "active": true, "numRule": "82.3", "text": "Команда задерживает смену состава, нарушая процедуру замены игроков в остановку матча. \nВаши действия?", "refs": [{"num": "82.3", "doc": null, "key": null}], "media": []}, {"id": 335, "active": true, "numRule": "82.1", "text": "Смена игрового состава проведена. Могут ли команды ещё раз поменять состав после неправильно проведенного вбрасывания?", "refs": [{"num": "82.1", "doc": null, "key": null}], "media": []}, {"id": 336, "active": true, "numRule": "82.1", "text": "Смена игрового состава проведена. Могут ли команды ещё раз поменять состав до возобновления матча?", "refs": [{"num": "82.1", "doc": null, "key": null}], "media": []}, {"id": 337, "active": true, "numRule": "76.7", "text": "Перед вбрасыванием на одну из команд налагается штраф, который влияет на численный состав на льду. Могут ли обе команды провести замену игроков?", "refs": [{"num": "76.7", "doc": null, "key": null}], "media": []}, {"id": 338, "active": true, "numRule": "82.1", "text": "Перед вбрасыванием на обе команды налагается по одному малому штрафу. Могут ли обе команды провести замену игроков?", "refs": [{"num": "82.1", "doc": null, "key": null}], "media": []}, {"id": 339, "active": true, "numRule": "76.7", "text": "Перед вбрасыванием на обе команды налагаются штрафы, приводящие к игре в неравных составах. Могут ли обе команды провести замену игроков?", "refs": [{"num": "76.7", "doc": null, "key": null}], "media": []}, {"id": 341, "active": true, "numRule": "82.2", "text": "Сколько времени дается на смену игроков в остановку матча для каждой команды?", "refs": [{"num": "82.2", "doc": null, "key": null}], "media": []}, {"id": 342, "active": true, "numRule": "82.3", "text": "Какая команда должна первой проводить смену игроков в остановку матча?", "refs": [{"num": "82.3", "doc": null, "key": null}], "media": []}, {"id": 344, "active": true, "numRule": "82.3", "text": "Что должен сделать Главный судья, в случае, если команда пытается провести смену игрового состава после совершенного ей проброса шайбы?", "refs": [{"num": "82.3", "doc": null, "key": null}], "media": []}, {"id": 345, "active": true, "numRule": "81.4", "text": "Вправе ли хоккеист, клюшка которого сломалась при совершении им проброса, подъехать к своей скамейке запасных для замены сломанной клюшки?", "refs": [{"num": "81.4", "doc": null, "key": null}], "media": []}, {"id": 349, "active": true, "numRule": "24.2", "text": "Должно ли быть засчитано взятие ворот, если шайба попадает в ворота маневром в стиле «лакросс», при котором хоккеист помещает шайбу на крюк клюшки и с воздуха направляет шайбу в ворота соперника?", "refs": [{"num": "24.2", "doc": null, "key": null}], "media": []}, {"id": 350, "active": true, "numRule": "78.4", "text": "Защищающийся игрок бьёт по шайбе головой и шайба заходит в собственные ворота. \nВаши действия?", "refs": [{"num": "78.4", "doc": null, "key": null}], "media": []}, {"id": 353, "active": true, "numRule": "37.4, 49.2", "text": "Атакующий игрок наносит удар по шайбе коньком, после чего она заходит в ворота, срикошетив от вратаря или его снаряжения. \nВаши действия?", "refs": [{"num": "37.4", "doc": null, "key": null}, {"num": "49.2", "doc": null, "key": null}], "media": []}, {"id": 354, "active": true, "numRule": "78.5", "text": "Атакующий хоккеист бьёт по шайбе головой и шайба заходит в ворота соперника. \nВаши действия?", "refs": [{"num": "78.5", "doc": null, "key": null}], "media": []}, {"id": 355, "active": true, "numRule": "78.5", "text": "Атакующий хоккеист бьет рукой (перчаткой), либо каким-то иным способом направляет шайбу в ворота любой частью своего тела. \nВаши действия?", "refs": [{"num": "78.5", "doc": null, "key": null}], "media": []}, {"id": 356, "active": true, "numRule": "37.2", "text": "Может ли Главный судья обратиться к судье видеоповтора, для просмотра взятия ворот после того, как было проведено вбрасывание?", "refs": [{"num": "37.2", "doc": null, "key": null}], "media": []}, {"id": 357, "active": true, "numRule": "83.6", "text": "В ситуации проброса, атакующий игрок оказывается в отложенном положении «Вне игры», и первым должен завладеть шайбой игрок защищающейся команды, но шайба попадает в атакующего игрока и Линейный судья останавливает матч на «Вне игры».\nГде будет вбрасывание?", "refs": [{"num": "83.6", "doc": null, "key": null}], "media": []}, {"id": 358, "active": true, "numRule": "83.6", "text": "В ситуации проброса, атакующий игрок оказывается в отложенном положении «Вне игры», и он первым должен завладеть шайбой, но в него попадает шайба и Линейный судья останавливает матч на «Вне игры».\nГде будет вбрасывание?", "refs": [{"num": "83.6", "doc": null, "key": null}], "media": []}, {"id": 359, "active": true, "numRule": "83.3, 81.1", "text": "В ситуации проброса атакующий игрок оказывается в отложенном положении «Вне игры», но Линейный судья дает свисток на «Вне игры», так как первым шайбой должен завладеть игрок атакующей команды. \nГде будет вбрасывание?", "refs": [{"num": "83.3", "doc": null, "key": null}, {"num": "81.1", "doc": null, "key": null}], "media": []}, {"id": 360, "active": true, "numRule": "83.4", "text": "Атакующая команда забивает гол в ситуации отложенного положения «Вне игры» т.е., шайба попадает в ворота непосредственно после броска атакующего игрока", "refs": [{"num": "83.4", "doc": null, "key": null}], "media": []}, {"id": 362, "active": true, "numRule": "83.3", "text": "Во втором периоде, в ситуации отложенного положения «Вне игры», игрок атакующей команды уходит со льда на свою скамейку запасных, которая находится в зоне атаки. Заменяющий его игрок выходит на лед со скамейки запасных в нейтральную зону, пока еще один партнер находится в зоне атаки. \nВаши действия?", "refs": [{"num": "83.3", "doc": null, "key": null}], "media": []}, {"id": 363, "active": true, "numRule": "83.3", "text": "Во втором периоде, в ситуации отложенного положения «Вне игры», игрок атакующей команды уходит со льда на свою скамейку запасных, которая находится в зоне атаки. Заменяющий его игрок выходит на лед со скамейки запасных в зону атаки. \nВаши действия?", "refs": [{"num": "83.3", "doc": null, "key": null}], "media": []}, {"id": 364, "active": true, "numRule": "83.3", "text": "Во втором периоде, в ситуации отложенного положения «Вне игры», игрок атакующей команды уходит со льда на свою скамейку запасных, которая находится в зоне атаки. Заменяющий его игрок выходит на лед со скамейки запасных в нейтральную зону. \nВаши действия?", "refs": [{"num": "83.3", "doc": null, "key": null}], "media": []}, {"id": 368, "active": true, "numRule": "69.1", "text": "Атакующий игрок вкатывается двумя ногами в площадь ворот, в то время как вратарь команды соперника выкатывается под бросок из площади ворот. Шайба проходит мимо вратаря попадает в ногу атакующему игроку, находящемуся в площади ворот, и рикошетом входит в ворота.\nВаши действия?", "refs": [{"num": "69.1", "doc": null, "key": null}], "media": []}, {"id": 369, "active": true, "numRule": "69.1", "text": "Атакующий игрок вкатывается двумя ногами в площадь ворот, в то время как вратарь команды соперника находится в  площади ворот. Шайба проходит мимо вратаря попадает в конек атакующего игрока, находящемуся в площади ворот, и рикошетом входит в ворота.\nВаши действия?", "refs": [{"num": "69.1", "doc": null, "key": null}], "media": []}, {"id": 370, "active": true, "numRule": "69", "text": "Защищающийся игрок посылает шайбу в свои ворота, в то время, когда в площади ворот стоит игрок атакующей команды. \nВаши действия?", "refs": [{"num": "69", "doc": null, "key": null}], "media": []}, {"id": 372, "active": true, "numRule": "69.2", "text": "За пределами площади ворот атакующий  игрок мешает вратарю вернуться в площадь ворот, либо как-то иначе препятствует вратарю занять надлежащую позицию во время взятия ворот. \nВаши действия?", "refs": [{"num": "69.2", "doc": null, "key": null}], "media": []}, {"id": 373, "active": true, "numRule": "69.1", "text": "Атакующий игрок находится в площади ворот, в момент когда шайба пересекает линию ворот и не мешает вратарю отразить шайбу, либо занять правильную позицию вратарю. \nВаши действия?", "refs": [{"num": "69.1", "doc": null, "key": null}], "media": []}, {"id": 374, "active": true, "numRule": "69.1", "text": "Атакующего игрока вталкивают в площадь ворот, когда шайба входит в ворота. \nВаши действия?", "refs": [{"num": "69.1", "doc": null, "key": null}], "media": []}, {"id": 375, "active": true, "numRule": "67.6", "text": "Атакующий игрок бьет по шайбе рукой. Шайба касается клюшки товарища по команде в зоне атаки, а затем непосредственно попадает в ворота команды соперника. \nВаши действия?", "refs": [{"num": "67.6", "doc": null, "key": null}], "media": []}, {"id": 376, "active": true, "numRule": "68.1", "text": "Игрок незаконно вошел в игру со своей скамейки игроков и находится на льду в тот момент, когда его команда забрасывает шайбу в ворота. \nВаши действия?", "refs": [{"num": "68.1", "doc": null, "key": null}], "media": []}, {"id": 377, "active": true, "numRule": "67.6", "text": "Атакующий игрок умышленно бьет по шайбе рукой. Шайба, отскакивая от вратаря соперника, попадает к другому игроку атакующей команды, который затем забрасывает шайбу в ворота. \nВаши действия?", "refs": [{"num": "67.6", "doc": null, "key": null}], "media": []}, {"id": 392, "active": true, "numRule": "37.2", "text": "Если видеопросмотр не проясняет ситуацию, то чье мнение будет решающим?", "refs": [{"num": "37.2", "doc": null, "key": null}], "media": []}, {"id": 393, "active": true, "numRule": "37.2", "text": "Если Судья видеоповторов намерен проконсультироваться с Главным судьей о возможном пересечении шайбой линии ворот, то чье мнение будет решающим?", "refs": [{"num": "37.2", "doc": null, "key": null}], "media": []}, {"id": 394, "active": true, "numRule": "37.2", "text": "Может ли быть засчитано два взятия ворот в одну остановку матча?", "refs": [{"num": "37.2", "doc": null, "key": null}], "media": []}, {"id": 395, "active": true, "numRule": "37.2", "text": "Шайба побывала в воротах команды «А», но матч продолжается. Остановка матча произошла в связи с тем, что теперь команда «А» произвела взятие ворот. По итогам видеопросмотра определено, что первое взятие ворот проведено верно. \nЧто делать со вторым взятием ворот?", "refs": [{"num": "37.2", "doc": null, "key": null}], "media": []}, {"id": 397, "active": true, "numRule": "78.4", "text": "Атакующий игрок наносит удар по шайбе коньком, после чего она отскакивает от вратаря или его снаряжения и партнер по команде добивает шайбу в ворота. \nВаши действия?", "refs": [{"num": "78.4", "doc": null, "key": null}], "media": []}, {"id": 398, "active": true, "numRule": "49.2", "text": "Шайба отскакивает от движущегося конька атакующего игрока и попадает в ворота. \nВаши действия?", "refs": [{"num": "49.2", "doc": null, "key": null}], "media": []}, {"id": 399, "active": true, "numRule": "37.4", "text": "Атакующий игрок бьет своим коньком по своей клюшке, на которой находится шайба и направляет шайбу в ворота. \nВаши действия?", "refs": [{"num": "37.4", "doc": null, "key": null}], "media": []}, {"id": 400, "active": true, "numRule": "78.4", "text": "Атакующий игрок бьет своим коньком по клюшке соперника, на которой находится шайба и своей клюшкой переправляет шайбу в ворота. \nВаши действия?", "refs": [{"num": "78.4", "doc": null, "key": null}], "media": []}, {"id": 401, "active": true, "numRule": "37.4", "text": "Атакующий игрок бьет своим коньком по клюшке соперника, на которой находится шайба и шайба напрямую входит в ворота. \nВаши действия?", "refs": [{"num": "37.4", "doc": null, "key": null}], "media": []}, {"id": 403, "active": true, "numRule": "68.5", "text": "Игрок преждевременно покинул скамейку штрафников в результате ошибки Судьи при оштрафованных игроках, и он находится на льду в тот момент, когда его команда забрасывает шайбу в ворота. \nВаши действия?", "refs": [{"num": "68.5", "doc": null, "key": null}], "media": []}, {"id": 406, "active": true, "numRule": "19.1", "text": "В каких составах будут играть команды в 3:30?\n \nКоманда «А» \n Команда «Б»\n\nA6 – 2 мин 3:00  \n \n\nA9 – 5 мин + Дисциплинарный штраф до конца матча в 3:30\n\nБ14 – 5 мин + Дисциплинарный штраф до конца матча в 3:30", "refs": [{"num": "19.1", "doc": null, "key": null}], "media": []}, {"id": 407, "active": true, "numRule": "19.1", "text": "Сколько игроков на обеих скамейках оштрафованных в 3:30?\n \nКоманда «А»      \nКоманда «Б»\n\nA6 – 2 мин. в 3:00 \n \n\nA9 – 5 мин. + Дисциплинарный штраф до конца матча в 3:30\nБ14 – 5 мин. + Дисциплинарный штраф до конца матча в 3:30", "refs": [{"num": "19.1", "doc": null, "key": null}], "media": []}, {"id": 408, "active": true, "numRule": "19.1", "text": "В каких составах будут играть команды в 4:00?\n \nКоманда «А»\nКоманда «Б»\n\nA6 – 2 мин 3:00 \n \n\nA7 – 2 + 5 мин. + Дисциплинарный штраф до конца матча в 4:00  \nБ19 – 2 + 5 мин. + Дисциплинарный штраф до конца матча в 4:00", "refs": [{"num": "19.1", "doc": null, "key": null}], "media": []}, {"id": 409, "active": true, "numRule": "19.1", "text": "Сколько игроков на обеих скамейках оштрафованных в 4:00?\n \nКоманда «А»\nКоманда «Б»\n\nA6 – 2 мин 3:00 \n \n\nA7 – 2 + 5 мин + Дисциплинарный штраф до матча игры в 4:00\n\nБ19 – 2 + 5 мин +Дисциплинарный штраф до конца матча в 4:00", "refs": [{"num": "19.1", "doc": null, "key": null}], "media": []}, {"id": 410, "active": true, "numRule": "19.1", "text": "В каких составах будут играть команды в 4:00?\n \nКоманда «А»    \nКоманда «Б»\n\nA6 – 2 мин. в 3:00\n \n\nA5 – 2 мин. в 4:00\nA7 – 5 мин.  + Дисциплинарный штраф до конца матча в 4:00\nБ11 – 2 мин. в 4:00\nБ19 – 5 мин.  + Дисциплинарный штраф до конца матча в 4:00", "refs": [{"num": "19.1", "doc": null, "key": null}], "media": []}, {"id": 411, "active": true, "numRule": "19", "text": "Сколько игроков на обеих скамейках оштрафованных в 4:00?\n \nКоманда «А»\nКоманда «Б»\n\nA6 – 2 мин. в 3:00 \n \n\nA5 – 2 мин. в 4:00\nБ11 – 2 мин. в 4:00\n\nA7 – 5 мин + Дисциплинарный штраф до конца матча в 4:00\n \nБ19 – 5 мин + Дисциплинарный штраф до конца матча в  4:00", "refs": [{"num": "19", "doc": null, "key": null}], "media": []}, {"id": 412, "active": true, "numRule": "19.1", "text": "В каких составах будут играть команды в 3:00?\n \nКоманда «А» \nКоманда «Б»\n\nA3 – 2 + 2 мин. в 3:00\nБ8 – 2 + 5 мин.  + Дисциплинарный штраф до конца матча в  3:00", "refs": [{"num": "19.1", "doc": null, "key": null}], "media": []}, {"id": 413, "active": true, "numRule": "19.1", "text": "Сколько игроков на обеих скамейках оштрафованных в 3:00?\n \nКоманда «А»\nКоманда «Б»\n\nA3 –2 + 2 мин. в 3:00\nБ8 – 2 + 5 мин. + Дисциплинарный штраф до конца матча в 3:00", "refs": [{"num": "19.1", "doc": null, "key": null}], "media": []}, {"id": 414, "active": true, "numRule": "16,19", "text": "В каких составах будут играть команды в 3:00?\n Если Команда «А»  не выберет игру 3 на 4.\nКоманда «А»  \nКоманда «Б»\n\nA3 – 2 + 2 мин. в 3:00\nA5 – 2 мин. в 3:00\nA7 – 5 мин. + Дисциплинарный штраф до конца матча в 3:00\n \nБ8 – 2 + 5 мин. + Дисциплинарный штраф до конца матча в 3:00\nБ9 – 5 мин. + Дисциплинарный штраф до конца матча в 3:00", "refs": [{"num": "16", "doc": null, "key": null}, {"num": "19", "doc": null, "key": null}], "media": []}, {"id": 416, "active": true, "numRule": "19.1", "text": "В каких составах будут играть команды в 5:10?\n \nКоманда «А»   \nКоманда «Б»\n\nA7 – 2 мин. в 4:00 \n \n\nA9 – 5 мин. + Дисциплинарный штраф до конца матча в 5:00\nБ4 – 5 мин. + Дисциплинарный штраф до конца матча в 5:00\n\nA8 – 2 мин. в 5:10\nA4 – 2 мин. в 5:10\nБ3 – 2 мин. в 5:10 \nБ7 – 2 мин. в 5:10", "refs": [{"num": "19.1", "doc": null, "key": null}], "media": []}, {"id": 417, "active": true, "numRule": "19.1", "text": "Сколько игроков на обеих скамейках оштрафованных в 5:10?\n \nКоманда «А»   \nКоманда «Б»\n\nA7 – 2 мин. в 4:00\n \n\nA9 – 5 мин. + Дисциплинарный штраф до конца матча в 5:00\nБ4 – 5 мин. в + Дисциплинарный штраф до конца матча в 5:00\n\nA8 – 2 мин. в 5:10  \nA4 – 2 мин. в 5:10\nБ3 – 2 мин. в 5:10\nБ7 – 2 мин. в 5:10", "refs": [{"num": "19.1", "doc": null, "key": null}], "media": []}, {"id": 418, "active": true, "numRule": "19.1", "text": "В каких составах будут играть команды в 3:00?\n \nКоманда «А»\nКоманда «Б»\n\nA3 – 2 + 5 мин. + Дисциплинарный штраф до конца матча в 3:00\nБ8 – 2 + 5 мин. + Дисциплинарный штраф до конца матча в 3:00", "refs": [{"num": "19.1", "doc": null, "key": null}], "media": []}, {"id": 419, "active": true, "numRule": "19.1", "text": "Сколько игроков на обеих скамейках оштрафованных в 3:00?\n \nКоманда «А» \nКоманда «Б»\n\nA3 – 2 + 5 мин. + Дисциплинарный штраф до конца матча в 3:00\n \nБ8 – 2 + 5 мин. + Дисциплинарный штраф до конца матча в 3:00", "refs": [{"num": "19.1", "doc": null, "key": null}], "media": []}, {"id": 420, "active": true, "numRule": "19.1", "text": "В каких составах будут играть команды в 3:00?\n \nКоманда «А»\nКоманда «Б»\n\nA3 – 2 мин 3:00\nA7– 5 мин + Дисциплинарный штраф до конца матча в 3:00     \n \nБ8 – 2 мин 3:00\nБ9 – 5 мин + Дисциплинарный штраф до конца матча в 3:00", "refs": [{"num": "19.1", "doc": null, "key": null}], "media": []}, {"id": 421, "active": true, "numRule": "19.1", "text": "Сколько игроков на обеих скамейках оштрафованных в 3:00?\n \nКоманда «А»        \nКоманда «Б»\n\nA3 – 2 мин в 3:00 \n\n \nБ8 – 2 мин в 3:00\n\n \n\nA7 – 5 мин + Дисциплинарный штраф до конца матча в 3:00     \nБ9 – 5 мин + Дисциплинарный штраф до конца матча в 3:00", "refs": [{"num": "19.1", "doc": null, "key": null}], "media": []}, {"id": 422, "active": true, "numRule": "19.1", "text": "В каких составах будут играть команды в 3:00?\n\n \nКоманда «А»     \nКоманда «Б»\n\nA6 – 5 мин + Дисциплинарный штраф до конца матча в 3:00      \nA9 – 2 мин в 3:00\nБ11 – 2 мин в 3:00", "refs": [{"num": "19.1", "doc": null, "key": null}], "media": []}, {"id": 423, "active": true, "numRule": "19.1", "text": "Сколько игроков на обеих скамейках оштрафованных в 3:00? \n \nКоманда «А»\nКоманда «Б»\n\nA6 – 5 мин + Дисциплинарный штраф до матча  в 3:00 \n                  Б11 – 2 мин в 3:00                                    \n\nА9 – 2 мин в 3:00", "refs": [{"num": "19.1", "doc": null, "key": null}], "media": []}, {"id": 426, "active": true, "numRule": "15.1", "text": "Какой временной отрезок подразумевается под выражением «Штрафы могут налагаться в любое время матча»?", "refs": [{"num": "15.1", "doc": null, "key": null}], "media": []}, {"id": 427, "active": true, "numRule": "15.1", "text": "Какой временной отрезок подразумевается под выражением «Штрафы могут налагаться в любое время матча»?", "refs": [{"num": "15.1", "doc": null, "key": null}], "media": []}, {"id": 428, "active": true, "numRule": "15.1", "text": "Какой временной отрезок подразумевается под выражением «Штрафы могут налагаться в любое время матча»?", "refs": [{"num": "15.1", "doc": null, "key": null}], "media": []}, {"id": 429, "active": true, "numRule": "15.1", "text": "Какой временной отрезок подразумевается под выражением «Штрафы могут налагаться в любое время матча»?", "refs": [{"num": "15.1", "doc": null, "key": null}], "media": []}, {"id": 430, "active": true, "numRule": "15.1", "text": "Какой временной отрезок подразумевается под выражением «Штрафы могут налагаться в любое время матча»?", "refs": [{"num": "15.1", "doc": null, "key": null}], "media": []}, {"id": 431, "active": true, "numRule": "15.1", "text": "Какой временной отрезок подразумевается под выражением «до матча»?", "refs": [{"num": "15.1", "doc": null, "key": null}], "media": []}, {"id": 432, "active": true, "numRule": "0", "text": "Имеет ли право тренер войти в судейскую, чтобы поблагодарить судей за работу?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 436, "active": true, "numRule": "22.1", "text": "Что такое «Дисциплинарный штраф»?", "refs": [{"num": "22.1", "doc": null, "key": null}], "media": []}, {"id": 438, "active": true, "numRule": "8.1", "text": "Кто должен отбывать штрафное время, в случае травмы хоккеиста, на которого был наложен Дисциплинарный штраф?", "refs": [{"num": "8.1", "doc": null, "key": null}], "media": []}, {"id": 439, "active": true, "numRule": "22.3", "text": "Сколько игроков должно находиться на скамейке для оштрафованных, в случае, если на игрока наложен одновременно Малый и Дисциплинарный штрафы?", "refs": [{"num": "22.3", "doc": null, "key": null}], "media": []}, {"id": 440, "active": true, "numRule": "23.1", "text": "Что такое «Дисциплинарный штраф до конца матча»?", "refs": [{"num": "23.1", "doc": null, "key": null}], "media": []}, {"id": 446, "active": true, "numRule": "32.4", "text": "Могут ли Линейные судьи остановить игру, за попытку удара концом клюшки?", "refs": [{"num": "32.4", "doc": null, "key": null}], "media": []}, {"id": 454, "active": true, "numRule": "16.2", "text": "Разрешается ли игроку отбывающему Малый штраф вернуться на лед после того, как команда соперников, играющая в численном большинстве, реализует штрафной бросок?", "refs": [{"num": "16.2", "doc": null, "key": null}], "media": []}, {"id": 455, "active": true, "numRule": "20.1", "text": "На игрока наложен одновременно Малый и Большой плюс автоматически Дисциплинарный штраф до конца матча . В какой последовательности игрок отбывает штрафы?", "refs": [{"num": "20.1", "doc": null, "key": null}], "media": []}, {"id": 459, "active": true, "numRule": "22.1", "text": "На игрока наложен Дисциплинарный штраф, и находясь на скамейке для оштрафованных игроков, он наказывается вторым Дисциплинарным штрафом. \nВаши действия?", "refs": [{"num": "22.1", "doc": null, "key": null}], "media": []}, {"id": 462, "active": true, "numRule": "19.1", "text": "Какие штрафы  влияют на численное соотношение команд на льду?", "refs": [{"num": "19.1", "doc": null, "key": null}], "media": []}, {"id": 463, "active": true, "numRule": "17.1", "text": "На игрока «А» №5 налагается Малый штраф за задержку соперника клюшкой. Во время остановки игры на команду «А» дополнительно налагается Малый скамеечный штраф.\nКак будут отбываться штрафы?", "refs": [{"num": "17.1", "doc": null, "key": null}], "media": []}, {"id": 464, "active": true, "numRule": "17.1", "text": "На команду «А» налагается Малый Скамеечный штраф за Нарушение численного состава. В эту же остановку игры команда «А» просит произвести измерение клюшки у игрока команды «Б». Клюшка оказывается правильных размеров, что приводит к наложению второго Малого Скамеечного штрафа на команду «А».\nКак будут отбываться штрафы?", "refs": [{"num": "17.1", "doc": null, "key": null}], "media": []}, {"id": 467, "active": true, "numRule": "15.3", "text": "В течение отложенного штрафа налагаются два или более Малых штрафа более чем на одного хоккеиста и происходит взятие ворот. Ваши действия?", "refs": [{"num": "15.3", "doc": null, "key": null}], "media": []}, {"id": 468, "active": true, "numRule": "22.1", "text": "На игрока наложен Дисциплинарный штраф, и находясь на скамейке для оштрафованных игроков, он наказывается вторым Дисциплинарным штрафом. Как это должно быть отмечено в протоколе матча?", "refs": [{"num": "22.1", "doc": null, "key": null}], "media": []}, {"id": 472, "active": true, "numRule": "15.5", "text": "На команду, уже играющую в численном меньшинстве по причине Малого штрафа, фиксируется отложенный штраф, за который полагается назначение штрафного броска. Прежде, чем Главный судья смог дать свисток на остановку игры, не нарушившая правило команда осуществляет взятие ворот. \nВаши действия?", "refs": [{"num": "15.5", "doc": null, "key": null}], "media": []}, {"id": 473, "active": true, "numRule": "15.5", "text": "Команда «А» играет в численном меньшинстве по причине малого штрафа, а главный судья сигнализирует нарушение правил, за которое полагается наложить Большой плюс Дисциплинарный штраф до конца матча. Но команда «Б» производит взятие ворот до остановки игры. \nВаши действия?", "refs": [{"num": "15.5", "doc": null, "key": null}], "media": []}, {"id": 475, "active": true, "numRule": "32.5", "text": "Главный судья сигнализирует отложенный штраф на команду «А». Линейный судья фиксирует нарушение правил со стороны команды «Б», за которое полагается Малый скамеечный штраф. \nДействия линейного судьи?", "refs": [{"num": "32.5", "doc": null, "key": null}], "media": []}, {"id": 478, "active": true, "numRule": "68.5", "text": "Оштрафованный игрок вышел на лед после окончания штрафного времени партнера по команде, а не своего. \nВаши действия?", "refs": [{"num": "68.5", "doc": null, "key": null}], "media": []}, {"id": 479, "active": true, "numRule": "19", "text": "Кто выходит на лед в 4:30?\n \nКоманда «А»  \nКоманда «Б»\n\nA6 - 2 мин в 3:00\nБ11 - 2 мин в 3:00\n\nA9 - 2 мин в 4:00  \n \n\n \nГол в 4:30", "refs": [{"num": "19", "doc": null, "key": null}], "media": []}, {"id": 480, "active": true, "numRule": "16,19", "text": "Кто выходит на лед в 4:30?\n \nКоманда «А»\nКоманда «Б»\n\n \nБ11 - 2 мин в 3:00\n\nA6 - 2 мин в 3:30\n \nA9 - 2 мин в 4:00 \n \n\n \nГол в 4:30", "refs": [{"num": "16", "doc": null, "key": null}, {"num": "19", "doc": null, "key": null}], "media": []}, {"id": 481, "active": true, "numRule": "16,19", "text": "Кто выходит на лед в 4:00?\n \nКоманда «А» \nКоманда «Б»\n\nA6 – 2 мин в 3:00\nБ11 – 2 мин в 3:00\n\nA9 – 5 мин + Дисциплинарный штраф до конца матча в 3:30\n \n Гол в 4:00", "refs": [{"num": "16", "doc": null, "key": null}, {"num": "19", "doc": null, "key": null}], "media": []}, {"id": 482, "active": true, "numRule": "16,19", "text": "Кто выходит на лед в 4:00?\n\n \nКоманда «А» \nКоманда «Б»\n\nA6 – 5 мин + Дисциплинарный штраф до конца матча в 3:00\nБ11 – 2 мин в 3:00\n \n\nA9 – 2 мин в 3:30\n \n Гол в 4:00", "refs": [{"num": "16", "doc": null, "key": null}, {"num": "19", "doc": null, "key": null}], "media": []}, {"id": 483, "active": true, "numRule": "16,19", "text": "Кто выходит на лед в 4:00?\n\n \nКоманда «А»\n Команда «Б»\n\nA6 – 5 мин + Дисциплинарный штраф до конца матча в 3:00\n\nA9 – 2 мин в 3:00\nБ11 – 2 мин в 3:00\n\n Гол в 4:00", "refs": [{"num": "16", "doc": null, "key": null}, {"num": "19", "doc": null, "key": null}], "media": []}, {"id": 484, "active": true, "numRule": "16,19", "text": "Кто выходит на лед в 9:15?\n\n \nКоманда «А» Команда «Б»\nA6 – 2 + 5 +Дисциплинарный штраф до конца матча в 4:00\n\n \n\n  \n \nA9 – 2 мин в 8:00\n \n Гол в 9:15", "refs": [{"num": "16", "doc": null, "key": null}, {"num": "19", "doc": null, "key": null}], "media": []}, {"id": 485, "active": true, "numRule": "16.2", "text": "Кто выходит на лед в 9:15?\n \nКоманда «А»\nКоманда «Б»\n\nA6 – 2 + 5 + Дисциплинарный штраф до конца матча в 4:00\n \n\nA9 – 2 мин в 9:10\n \n\n \nГол в 9:15", "refs": [{"num": "16.2", "doc": null, "key": null}], "media": []}, {"id": 486, "active": true, "numRule": "16.2", "text": "Кто выходит на лед в 4:30?\n \nКоманда «А»\nКоманда «Б»\n\nA7 – 5 мин + Дисциплинарный штраф до конца матча в 3:00\n \n\nA11 – 5 мин + Дисциплинарный штраф до конца матча в 3:10\n \n\nA12 – 2 мин в 4:00\n \n Гол в 4:30", "refs": [{"num": "16.2", "doc": null, "key": null}], "media": []}, {"id": 487, "active": true, "numRule": "19.2", "text": "Кто выходит на лед в 12:10?\n \nКоманда «А»\n Команда «Б»\n\nA4 – 2 мин в 10:00\n \n\nA7 – 2 мин в 10:30\n \n\nA9 – 2 мин в 11:00\nБ8 – 2 мин в 11:00\n\n \nГол 12:10", "refs": [{"num": "19.2", "doc": null, "key": null}], "media": []}, {"id": 488, "active": true, "numRule": "16.2", "text": "Кто выходит на лед в 4:30?\n \nКоманда «А»\nКоманда «Б»\n\nA9 – 5 мин + Дисциплинарный штраф до конца матча в 3:00\n \n\nA6 – 2 мин в 3:30\nБ11 – 2 + 2 мин в 3:30\n\n \nГол в 4:30", "refs": [{"num": "16.2", "doc": null, "key": null}], "media": []}, {"id": 489, "active": true, "numRule": "16.2", "text": "Кто выходит на лед в 4:00?\n \nКоманда «А»\nКоманда «Б»\n\nA6 – 5 мин + Дисциплинарный штраф до конца матча в 3:00\n \n\nA9 – 2 мин в 3:30\nБ11 – 5 мин + Дисциплинарный штраф до конца матча в 3:30\n\n \n Гол в 4:00", "refs": [{"num": "16.2", "doc": null, "key": null}], "media": []}, {"id": 490, "active": true, "numRule": "16.2", "text": "Кто выходит на лед в 13:30?\n \nКоманда «А»\nКоманда «Б»\n\nА7 – 2 + 2 мин в 12:00\nБ3 – 2 мин в 12:00\n\nA9 – 2 мин в 13:15 \n \n\n \nГол в 13:30", "refs": [{"num": "16.2", "doc": null, "key": null}], "media": []}, {"id": 491, "active": true, "numRule": "16.2", "text": "Когда выходит на лед А7?\n \nКоманда «А»\nКоманда «Б»\n\nА7 – 2 + 2 мин в 12:00\nБ3 – 2 мин в 12:00\n\nA9 – 2 мин в 13:15\n \n\n \nГол в 13:30", "refs": [{"num": "16.2", "doc": null, "key": null}], "media": []}, {"id": 493, "active": true, "numRule": "16.2", "text": "Кто выходит на лед в 4:00?\n\n \nКоманда «А»\nКоманда «Б»\n\nA6 – 5 мин + Дисциплинарный штраф до конца матча в 3:00\n \n\nA9 – 2 мин в 3:30\nБ11 – 2 мин в 3:30\n\n Гол в 4:00", "refs": [{"num": "16.2", "doc": null, "key": null}], "media": []}, {"id": 494, "active": true, "numRule": "16.2", "text": "Когда возвращается на лед А9?\n \nКоманда «А»\nКоманда «Б»\n\nA6 – 5 мин + Дисциплинарный штраф до конца матча в 3:00\n \n\nA9 – 2 мин в 3:30\nБ11 – 2 мин в 3:30\n\n \nГол в 4:00", "refs": [{"num": "16.2", "doc": null, "key": null}], "media": []}, {"id": 495, "active": true, "numRule": "19", "text": "Когда возвращается на лед заменяющий игрок за А6?\n\n \nКоманда «А»\nКоманда «Б»\n\nA6 – 5 мин + Дисциплинарный штраф до конца матча в  3:00\n \n\nA9 – 2 мин в  3:30  \nБ11 – 2 мин в  3:30\n\n \nГол в  4:00", "refs": [{"num": "19", "doc": null, "key": null}], "media": []}, {"id": 496, "active": true, "numRule": "16.2", "text": "Чей штраф заканчивается после взятия ворот в 4:30?\n \nКоманда «А»\nКоманда «Б»\n\nA8 – 2 + 2 мин в 3:00\n \n\nA9 – 2 мин в 4:00\n \n\n \nГол в 4:30", "refs": [{"num": "16.2", "doc": null, "key": null}], "media": []}, {"id": 497, "active": true, "numRule": "19.5", "text": "Чей штраф заканчивается после взятия ворот в 5:30?\n \nКоманда «А»\nКоманда «Б»\n\nA8 – 2 + 2 мин в 3:00\n \n\nA9 – 2 мин в 4:00\n \n\n \nГол в 4:30\n\n \nГол в 5:30", "refs": [{"num": "19.5", "doc": null, "key": null}], "media": []}, {"id": 498, "active": true, "numRule": "16.2", "text": "Кто выходит на лед в 9:30?\n \nКоманда «А»\n Команда «Б»\n\nА3 – 2 мин в 8.30\nБ13 – 2 мин в 8.30\n\nА7 – 2 мин в 9.00\n \n\n \n Гол в 9.30", "refs": [{"num": "16.2", "doc": null, "key": null}], "media": []}, {"id": 499, "active": true, "numRule": "19.5", "text": "Как будут отбываться штрафы после взятия ворот в 4:30, в ситуации отложенного штрафа?\n \nКоманда «А»\nКоманда «Б»\n\nA15 – 2 мин в 3:00\n \n\nA23 – 2 + 2 мин (О)*\n\n(О)* Отложенный штраф во время игры                    \n\nГол 4:30", "refs": [{"num": "19.5", "doc": null, "key": null}], "media": []}, {"id": 500, "active": true, "numRule": "19", "text": "Кто выходит на лед в 4:10, в ситуации отложенного штрафа?\n \nКоманда «А»\nКоманда «Б»\n\nA15 – 2 мин в  3:00\nБ12 – 2 мин в  3:00\n\nA23 – 2 мин (О)*\n\n(О)* Отложенный штраф во время игры\n \n\n \nГол в  4:10", "refs": [{"num": "19", "doc": null, "key": null}], "media": []}, {"id": 501, "active": true, "numRule": "19", "text": "В каких составах будут играть команды в дополнительном периоде и какие штрафы будут на табло?\n \nКоманда «А»\nКоманда «Б»\n\nА4 – 2 мин в  58:59\n \n\n \nБ35 – 2 мин в  59:30\n\nА16 – 2 мин в  59:40", "refs": [{"num": "19", "doc": null, "key": null}], "media": []}, {"id": 503, "active": true, "numRule": "19.5", "text": "В каких составах будут играть команды в дополнительном периоде?\n\n \nКоманда «А»\nКоманда «Б»\n\nА4 – 2 мин в  58:59\n \n\n Б35 – 2 мин в  59:30", "refs": [{"num": "19.5", "doc": null, "key": null}], "media": []}, {"id": 505, "active": true, "numRule": "19", "text": "Сколько всего игроков будет на обеих скамейках штрафников?\n\n \nКоманда «А»\nКоманда «Б»\n\nА21 – 2 мин. + 5 мин + Дисциплинарный штраф до конца матча в 14:00 \nБ4 – 5 + Дисциплинарный штраф до конца матча в 14:00", "refs": [{"num": "19", "doc": null, "key": null}], "media": []}, {"id": 506, "active": true, "numRule": "15.1, 16.2", "text": "В каких составах будут играть команды в 3:30?\n\n \nКоманда «А»  \nКоманда «Б»\n\nA6 - 2 мин. в 3:00\nБ7 - 2 + 2 мин. в 3:00\n\n Б7 - 2 мин. в 3:30 (находясь на скамейке для оштрафованных)", "refs": [{"num": "15.1", "doc": null, "key": null}, {"num": "16.2", "doc": null, "key": null}], "media": []}, {"id": 508, "active": true, "numRule": "19", "text": "Как будут отбываться штрафы?\n \nКоманда «А»\nКоманда «Б»\n\nА30 (Вратарь) 10 мин. в 3:00\n \nА30 (Вратарь) 2 мин. в 3:30", "refs": [{"num": "19", "doc": null, "key": null}], "media": []}, {"id": 509, "active": true, "numRule": "22.1", "text": "В какое время выйдет на лед А6?\nКоманда \"А\"\nКоманда \"Б\"                                                                    \n\nА6 – 2+2+10 мин. в 13:00\n \n\nА6 – 2 мин. в 20:00  (по окончанию первого периода)", "refs": [{"num": "22.1", "doc": null, "key": null}], "media": []}, {"id": 510, "active": true, "numRule": "19", "text": "В каких составах будут играть команды в дополнительном периоде? Какие штрафы на табло?\n \nКоманда «А»\nКоманда «Б»\n\nА4 – 2 мин. в  58:59\nБ35 – 2 мин. в  58:59\n\nА16 – 2 мин. в 59:40", "refs": [{"num": "19", "doc": null, "key": null}], "media": []}, {"id": 511, "active": true, "numRule": "19", "text": "Как правильно сократить штрафы?\n \nКоманда «А»\nКоманда «Б»\n\nА5 – 2 мин. в 3:00 \nБ8 – 2 мин. в 3:00 \n\nА6 – 2 + 2 мин. в 3:00\nБ9 – 2 мин. в 3:00\n\nА7 – 2 мин. в 3:00", "refs": [{"num": "19", "doc": null, "key": null}], "media": []}, {"id": 512, "active": true, "numRule": "16.2, 22.3", "text": "В каких составах команды начнут второй период?\n \nКоманда «А»   \nКоманда «Б»\n\nA6 - 2 + 2 +10 мин. в 13:00\n \n\nA6 - 2 мин. в 20:00 (по окончанию первого периода)", "refs": [{"num": "16.2", "doc": null, "key": null}, {"num": "22.3", "doc": null, "key": null}], "media": []}, {"id": 513, "active": true, "numRule": "19", "text": "Сколько игроков на обеих скамейках оштрафованных в начале второго периода?\n\n \nКоманда «А»  \nКоманда «Б»\n\nA6 - 2 + 2 +10 мин. в 13:0  "83.2", "text": "Игрок защищающейся команды выбрасывает шайбу из своей зоны защиты и в нейтральной зоне шайба отскакивает от судьи обратно в зону защиты и попадает в атакующего игрока.", "refs": [{"num": "83.2", "doc": null, "key": null}], "media": []}, {"id": 579, "active": true, "numRule": "19", "text": "Штрафы каких игроков  будут на табло в дополнительном периоде?\n \nКоманда «А»\nКоманда «Б»\n\nА4 – 2 мин в  58:59  \n \n\n \nБ35 – 2 мин в  59:30", "refs": [{"num": "19", "doc": null, "key": null}], "media": []}, {"id": 580, "active": true, "numRule": "19", "text": "Штрафы каких игроков будут на табло в дополнительном периоде?\n \nКоманда «А»    \nКоманда «Б»\n\nА4 – 2 мин в  58:59      \nБ35 – 2 мин в  58:59\n\nА16 – 2 мин в  59:40", "refs": [{"num": "19", "doc": null, "key": null}], "media": []}, {"id": 581, "active": true, "numRule": "19", "text": "Штрафы каких игроков будут на табло в дополнительном периоде, если он проводится в формате 3 на 3?\n \nКоманда «А»\n Команда «Б»\n\nА4 – 2 мин в  58:59\nБ35 – 2 мин в  58:59", "refs": [{"num": "19", "doc": null, "key": null}], "media": []}, {"id": 582, "active": true, "numRule": "19", "text": "Штрафы каких игроков будут на табло в дополнительном периоде?\n \nКоманда «А» \nКоманда «Б»\n\nА4 – 2 мин в  58:59  \n \n\n \n Б35 – 2 мин в  59:29\n\nА16 – 2 мин в  59:40", "refs": [{"num": "19", "doc": null, "key": null}], "media": []}, {"id": 583, "active": true, "numRule": "19", "text": "Штрафы каких игроков будут на табло в дополнительном периоде?\n \nКоманда «А»\nКоманда «Б»\n\nА4 – 2 мин в  58:59\nБ35 – 2 мин в  58:59\n\nА16 – 2 мин в  59:40\n \n\n \n Б15 – 2 мин в  59:45", "refs": [{"num": "19", "doc": null, "key": null}], "media": []}, {"id": 584, "active": true, "numRule": "19.4", "text": "Штрафы каких игроков будут на табло в дополнительном периоде, если он проводится в формате 5 на 5?\n \nКоманда «А» \n Команда «Б»\n\nА4 – 2 мин в  58:59\n Б35 – 5 мин в  58:59", "refs": [{"num": "19.4", "doc": null, "key": null}], "media": []}, {"id": 585, "active": true, "numRule": "19", "text": "В каких составах будут играть команды в дополнительном периоде?\n \nКоманда «А»\nКоманда «Б»\n\nА4 – 2 мин в  58.59\nБ35 – 2 мин в  58.59\n\nА16 – 2 мин в 59.40\n \n\n \n Б15 – 2 мин в 59.45", "refs": [{"num": "19", "doc": null, "key": null}], "media": []}, {"id": 586, "active": true, "numRule": "84.3", "text": "В каких составах будут играть команды в дополнительном периоде?\n\n \n \nКоманда «А»\nКоманда «Б»\n\nА4 – 2 мин в  58.59\n \n\n \nБ35 – 2 мин в  59.29\n\nА16 – 2 мин в 59.40\n \n\n \nБ15 – 2 мин в 59.45", "refs": [{"num": "84.3", "doc": null, "key": null}], "media": []}, {"id": 587, "active": true, "numRule": "19", "text": "Штрафы каких игроков будут на табло в дополнительном периоде?\n \nКоманда «А»\n Команда «Б»\n\nА4 – 2 мин в  58:59\n \n\n \n Б35 – 2 мин в  59:29\n\nА16 – 2 мин в  59:40\n \n\n \nБ15 – 2 мин в  59:45", "refs": [{"num": "19", "doc": null, "key": null}], "media": []}, {"id": 588, "active": true, "numRule": "84.1", "text": "В каких составах будут играть команды в дополнительном периоде?\n\n \n \nКоманда «А»\nКоманда «Б»\n\nА4 – 2 мин в  58.59", "refs": [{"num": "84.1", "doc": null, "key": null}], "media": []}, {"id": 590, "active": true, "numRule": "19.1", "text": "Какие штрафы считаются совпадающими?", "refs": [{"num": "19.1", "doc": null, "key": null}], "media": []}, {"id": 591, "active": true, "numRule": "19.1", "text": "Если совпадающие штрафы наложены в ходе матча, нужно ли их выводить на табло?", "refs": [{"num": "19.1", "doc": null, "key": null}], "media": []}, {"id": 592, "active": true, "numRule": "19.1", "text": "Если Главный судья сократил все Малые совпадающие штрафы, могут ли хоккеисты отбывать свои штрафы на скамейке запасных?", "refs": [{"num": "19.1", "doc": null, "key": null}], "media": []}, {"id": 593, "active": true, "numRule": "19.1", "text": "Можно ли сократить Малый и Малый скамеечный штраф?", "refs": [{"num": "19.1", "doc": null, "key": null}], "media": []}, {"id": 595, "active": true, "numRule": "20.4", "text": "Если на хоккеистов наложены совпадающие Большие плюс Дисциплинарные штрафы до конца матча , обязаны хоккеисты отбывать свои штрафы на скамейке оштрафованных ?", "refs": [{"num": "20.4", "doc": null, "key": null}], "media": []}, {"id": 599, "active": true, "numRule": "26.1", "text": "Когда начнется отсчет штрафного времени третьего хоккеиста, если два партнера уже отбывают свои штрафы?", "refs": [{"num": "26.1", "doc": null, "key": null}], "media": []}, {"id": 600, "active": true, "numRule": "39.2.3", "text": "Какой штраф должен быть наложен на хоккеиста, который с силой бьет по защитному стеклу клюшкой или другим предметом в знак протеста против решения судьи на льду?", "refs": [{"num": "39.2", "doc": null, "key": null}], "media": []}, {"id": 601, "active": true, "numRule": "39.2.3", "text": "Какой штраф должен быть наложен на хоккеиста, который с силой бьет по борту клюшкой или другим предметом в знак протеста против решения судьи на льду?", "refs": [{"num": "39.2", "doc": null, "key": null}], "media": []}, {"id": 602, "active": true, "numRule": "39.3.1", "text": "Какой штраф должен быть наложен на представителя команды, который бьет клюшкой или иным предметом по борту в знак протеста против решения судьи на льду?", "refs": [{"num": "39.3", "doc": null, "key": null}], "media": []}, {"id": 603, "active": true, "numRule": "0", "text": "Кто должен определить хоккеиста для отбывания Малого штрафа за вратаря, если Главный тренер оштрафованной команды отказывается это сделать?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 604, "active": true, "numRule": "10.3", "text": "Игрок сломал свою клюшку, но подобрал клюшку своего вратаря, которую тот выронил, и принял участие в матче. \nВаши действия?", "refs": [{"num": "10.3", "doc": null, "key": null}], "media": []}, {"id": 607, "active": true, "numRule": "44.1", "text": "Что такое «Отсечение»?", "refs": [{"num": "44.1", "doc": null, "key": null}], "media": []}, {"id": 608, "active": true, "numRule": "67.2.3", "text": "Какой штраф должен быть наложен Главным судьей, если хоккеист подбирает шайбу со льда перчаткой во время игровых действий, за пределами своей площади ворот?", "refs": [{"num": "67.2", "doc": null, "key": null}], "media": []}, {"id": 610, "active": true, "numRule": "59.1", "text": "Что такое «Толчок клюшкой»?", "refs": [{"num": "59.1", "doc": null, "key": null}], "media": []}, {"id": 614, "active": true, "numRule": "85.5", "text": "Хоккеист выбрасывает шайбу за пределы игровой площадки из своей зоны защиты, срикошетив от партнера в этой зоне.\nВаши действия?", "refs": [{"num": "85.5", "doc": null, "key": null}], "media": []}, {"id": 615, "active": true, "numRule": "85.5", "text": "Хоккеист из своей зоны защиты выбрасывает шайбу. Шайба рикошетит от соперника, находящегося в этой же зоне и улетает за пределы игровой площадки. \nВаши действия?", "refs": [{"num": "85.5", "doc": null, "key": null}], "media": []}, {"id": 616, "active": true, "numRule": "63.2, 63.3, 85.5", "text": "Хоккеист выбрасывает шайбу за пределы игровой площадки из своей зоны защиты, где нет защитного стекла.\nВаши действия?", "refs": [{"num": "63.2", "doc": null, "key": null}, {"num": "63.3", "doc": null, "key": null}, {"num": "85.5", "doc": null, "key": null}], "media": []}, {"id": 617, "active": true, "numRule": "85.1", "text": "Хоккеист выбрасывает шайбу на скамейку запасных игроков, непосредственно через борт из зоны защиты.\nВаши действия?", "refs": [{"num": "85.1", "doc": null, "key": null}], "media": []}, {"id": 618, "active": true, "numRule": "19.1", "text": "Если одна из команд играет в неполном составе (игрок этой команды отбывает штраф), будет ли действовать правило сокращения совпадающих штрафов?", "refs": [{"num": "19.1", "doc": null, "key": null}], "media": []}, {"id": 620, "active": true, "numRule": "19.5", "text": "Сколько совпадающих штрафов может сократить главный судья?", "refs": [{"num": "19.5", "doc": null, "key": null}], "media": []}, {"id": 621, "active": true, "numRule": "78.5", "text": "Команда, контролирующая шайбу, в ситуации отложенного штрафа на соперника, забрасывает шайбу в свои ворота. \nВаши действия?", "refs": [{"num": "78.5", "doc": null, "key": null}], "media": []}, {"id": 622, "active": true, "numRule": "78.5", "text": "При отложенном штрафе команда, нарушившая правила, посредством своих действий (не играя в шайбу) направляет ее в ворота команды соперника. \nВаши действия?", "refs": [{"num": "78.5", "doc": null, "key": null}], "media": []}, {"id": 623, "active": true, "numRule": "39.4", "text": "Какой штраф должен быть наложен на хоккеиста, который намеренно отбрасывает шайбу, чтобы судья на льду не смог ее подобрать?", "refs": [{"num": "39.4", "doc": null, "key": null}], "media": []}, {"id": 624, "active": true, "numRule": "39.4", "text": "Какой штраф должен быть наложен на хоккеиста, который входит в площадь судей на льду в ходе их совещания между собой?", "refs": [{"num": "39.4", "doc": null, "key": null}], "media": []}, {"id": 626, "active": true, "numRule": "41.2", "text": "Какой штраф должен наложить Главный судья на хоккеиста, за толчок  соперника на борт?", "refs": [{"num": "41.2", "doc": null, "key": null}], "media": []}, {"id": 627, "active": true, "numRule": "10.3", "text": "Имеет ли право хоккеист бросать, подбрасывать или посылать по льду свою клюшку партнеру по команде, у которого сломалась клюшка ?", "refs": [{"num": "10.3", "doc": null, "key": null}], "media": []}, {"id": 628, "active": true, "numRule": "10.3", "text": "В процессе игры хоккеист теряет деревянную вставку на конце клюшки, но продолжает участвовать в игре своей клюшкой. \nВаши действия?", "refs": [{"num": "10.3", "doc": null, "key": null}], "media": []}, {"id": 629, "active": true, "numRule": "10.3", "text": "Хоккеист подбирает клюшку, брошенную на лед со скамейки игроков его команды. \nВаши действия?", "refs": [{"num": "10.3", "doc": null, "key": null}], "media": []}, {"id": 630, "active": true, "numRule": "24.2", "text": "Какой из критериев нужно учитывать, когда шайба попадает в ворота маневром в стиле «лакросс», при котором игрок помещает шайбу на крюк клюшки и с воздуха направляет шайбу в ворота соперника. \n\nУровень плеча или перекладины ворот? Или обо критерия?", "refs": [{"num": "24.2", "doc": null, "key": null}], "media": []}, {"id": 631, "active": true, "numRule": "9.8", "text": "Кому выносится предупреждение о замене или приведении в порядок любого опасного элемента снаряжения?", "refs": [{"num": "9.8", "doc": null, "key": null}], "media": []}, {"id": 632, "active": true, "numRule": "9.8", "text": "Кому выносится предупреждение о замене или приведении в порядок любого нестандартного элемента снаряжения?", "refs": [{"num": "9.8", "doc": null, "key": null}], "media": []}, {"id": 633, "active": true, "numRule": "9.8", "text": "Если хоккеист после предупреждения продолжает использовать треснувшую защиту лица, то:", "refs": [{"num": "9.8", "doc": null, "key": null}], "media": []}, {"id": 638, "active": true, "numRule": "76.6", "text": "За повторное нарушение процедуры вбрасывания на команду, нарушившую правила должен быть наложен Малый скамеечный штраф за Задержку матча. \nКакой игрок должен отбывать штраф?", "refs": [{"num": "76.6", "doc": null, "key": null}], "media": []}, {"id": 643, "active": true, "numRule": "15.2", "text": "Если команда, нарушившая правила, не контролирует шайбу, а Главный судья поднимает руку, показывая намерение наложить штраф. Когда он сможет остановить матч и наложить штраф?", "refs": [{"num": "15.2", "doc": null, "key": null}], "media": []}, {"id": 645, "active": true, "numRule": "15.2", "text": "Если команда, нарушившая правила, не контролирует шайбу, а Главный судья поднимает руку, показывая намерение наложить штраф. Когда он сможет остановить матч и наложить штраф?", "refs": [{"num": "15.2", "doc": null, "key": null}], "media": []}, {"id": 646, "active": true, "numRule": "39.4", "text": "Какой штраф должен быть наложен на хоккеиста команды, который бьет клюшкой или иным предметом о борт в знак протеста против решения судьи на льду, если он ранее уже был наказан за это действие Малым штрафом?", "refs": [{"num": "39.4", "doc": null, "key": null}], "media": []}, {"id": 647, "active": true, "numRule": "10.3", "text": "Игрок потерял клюшку, а его партнер поднял её со льда, положил на ворота и продолжил игровые действия. Игрок, потерявший клюшку, взял клюшку с ворот и продолжил игру.\nВаши действия?", "refs": [{"num": "10.3", "doc": null, "key": null}], "media": []}, {"id": 648, "active": true, "numRule": "10.3", "text": "А5 участвует в игре без клюшки. В процессе игры, А8 передает ему свою клюшку, а А11 передает свою клюшку А8, и игра продолжается.", "refs": [{"num": "10.3", "doc": null, "key": null}], "media": []}, {"id": 650, "active": true, "numRule": "53.3", "text": "Игрок, находящийся на скамейке для оштрафованных игроков, бросил свою клюшку вратарю, у которого сломалась на льду клюшка.\nВаши действия?", "refs": [{"num": "53.3", "doc": null, "key": null}], "media": []}, {"id": 651, "active": true, "numRule": "58.2", "text": "Какой штраф должен быть наложен Главным судьей на хоккеиста, пытающегося нанести сопернику удар концом клюшки?", "refs": [{"num": "58.2", "doc": null, "key": null}], "media": []}, {"id": 652, "active": true, "numRule": "58.3, 58.5", "text": "Какой штраф должен быть наложен Главным судьей на хоккеиста, который наносит сопернику удар концом клюшки?", "refs": [{"num": "58.3", "doc": null, "key": null}, {"num": "58.5", "doc": null, "key": null}], "media": []}, {"id": 659, "active": true, "numRule": "67.4", "text": "Какой штраф должен быть наложен Главным судьей, если игрок ловит шайбу перчаткой, в трехмерном пространстве своей площади ворот и выбрасывает шайбу в угол площадки, когда его вратарь находится на льду?", "refs": [{"num": "67.4", "doc": null, "key": null}], "media": []}, {"id": 660, "active": true, "numRule": "59.3 59.5", "text": "Какой штраф должен быть наложен Главным судьей на хоккеиста, который безответственно наносит травму сопернику толчком клюшкой?", "refs": [{"num": "59.3", "doc": null, "key": null}, {"num": "59.5", "doc": null, "key": null}], "media": []}, {"id": 661, "active": true, "numRule": "59.3 59.5", "text": "Какой штраф должен быть наложен Главным судьей на хоккеиста, который подвергает опасности жизнь и здоровье соперника с возможным нанесением травмы толчком клюшкой?", "refs": [{"num": "59.3", "doc": null, "key": null}, {"num": "59.5", "doc": null, "key": null}], "media": []}, {"id": 662, "active": true, "numRule": "12.1", "text": "Какой штраф должен быть наложен на хоккеиста, который игнорирует уже сделанное Главным судьей предупреждение о замене или приведении в порядок любого незаконного снаряжения?", "refs": [{"num": "12.1", "doc": null, "key": null}], "media": []}, {"id": 666, "active": true, "numRule": "63.2", "text": "Игрок намеренно сдвигает чужие ворота с нормального положения в течение основного времени матча, когда вратарь находится на льду. \nВаши действия?", "refs": [{"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 668, "active": true, "numRule": "63.2", "text": "Шайба застревает в коньках или снаряжении хоккеиста, когда он блокирует бросок или перехватывает передачу. \nВаши действия?", "refs": [{"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 670, "active": true, "numRule": "63.9", "text": "Тренер своевременно не выпустил на лед необходимое количество хоккеистов для начала периода. \nВаши действия?", "refs": [{"num": "63.9", "doc": null, "key": null}], "media": []}, {"id": 671, "active": true, "numRule": "63.3", "text": "Команда, после предупреждения Главного судьи, продолжает не своевременно выпускать на лед необходимое количество хоккеистов для начала дополнительного периода.\nВаши действия?", "refs": [{"num": "63.3", "doc": null, "key": null}], "media": []}, {"id": 675, "active": true, "numRule": "82 и 63", "text": "Какое решение должен принять Главный судья по отношению к тренеру, который пытается произвести замену хоккеистов после совершенного его командой проброса, что приводит к задержке игры?", "refs": [{"num": "82", "doc": null, "key": null}, {"num": "63", "doc": null, "key": null}], "media": []}, {"id": 676, "active": true, "numRule": "63.3, 81.4", "text": "Какое решение должен принять Главный судья по отношению к тренеру, который после предупреждения пытается произвести замену хоккеистов после совершенного его командой проброса, что приводит к задержке игры?", "refs": [{"num": "63.3", "doc": null, "key": null}, {"num": "81.4", "doc": null, "key": null}], "media": []}, {"id": 678, "active": true, "numRule": "78.5.11", "text": "Отложенный штраф должен быть наложен на игрока команды «А», а команда «Б» заменяет вратаря на дополнительного игрока. Хоккеист команды «Б» совершает передачу шайбы и она отскакивает от хоккеиста команды «А» и заходит в пустые ворота команды «Б».", "refs": [{"num": "78.5", "doc": null, "key": null}], "media": []}, {"id": 679, "active": true, "numRule": "15.3", "text": "На команду должно быть наложено два Малых штрафа, а не нарушившая правила команда забивает гол. Какой из двух штрафов будет наложен?", "refs": [{"num": "15.3", "doc": null, "key": null}], "media": []}, {"id": 680, "active": true, "numRule": "15.5", "text": "Команда играет в численном меньшинстве в результате Малого штрафа, и соперник забрасывает шайбу в ее ворота в течение отложенного Малого штрафа. Какой штраф должен закончится?", "refs": [{"num": "15.5", "doc": null, "key": null}], "media": []}, {"id": 681, "active": true, "numRule": "15.5", "text": "Команда играет в численном меньшинстве в результате Большого штрафа, и соперник забрасывает шайбу в ее ворота в течение отложенного Малого штрафа. Какой штраф должен закончится?", "refs": [{"num": "15.5", "doc": null, "key": null}], "media": []}, {"id": 682, "active": true, "numRule": "15.5", "text": "Команда играет в численном меньши
