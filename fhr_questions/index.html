": 1541, "active": true, "numRule": "10.3", "text": "Хоккеист, находящийся на льду, направляет клюшку в сторону партнера по команде, который ее уронил, не создавая помех соперникам. Ваши действия?", "refs": [{"num": "10.3", "doc": null, "key": null}], "media": []}, {"id": 1543, "active": true, "numRule": "76.4", "text": "Команда уже получила первое предупреждение о нарушении процедуры вбрасывания и игрок этой команды не спешит занять соответствующую позицию на вбрасывании. Ваши действия, как линейного судьи?", "refs": [{"num": "76.4", "doc": null, "key": null}], "media": []}, {"id": 1544, "active": true, "numRule": "76.3", "text": "Хоккеист, не участвующий в розыгрыше вбрасывания, въезжает в круг вбрасывания до момента вбрасывания шайбы. Ваши действия?", "refs": [{"num": "76.3", "doc": null, "key": null}], "media": []}, {"id": 1545, "active": true, "numRule": "69.1", "text": "Атакующий игрок находится (стоит) в площади ворот, и не препятствует вратарю выполнять свои обязанности, когда шайба напрямую попадает в ворота.", "refs": [{"num": "69.1", "doc": null, "key": null}], "media": []}, {"id": 1546, "active": true, "numRule": "69.1", "text": "Атакующий игрок находится (стоит) в площади ворот, и препятствует вратарю выполнять свои обязанности и занять необходимую позицию для защиты ворот, когда шайба попадает в них.", "refs": [{"num": "69.1", "doc": null, "key": null}], "media": []}, {"id": 1547, "active": true, "numRule": "69.4", "text": "Вратарь оказался за пределами площади ворот, а атакующий игрок препятствует ему вернуться в площадь ворот и занять надлежащую позицию в ситуации взятия ворот.", "refs": [{"num": "69.4", "doc": null, "key": null}], "media": []}, {"id": 1548, "active": true, "numRule": "69.1", "text": "Атакующий  игрок толкает соперника на вратаря и в этот момент шайба попадает в ворота", "refs": [{"num": "69.1", "doc": null, "key": null}], "media": []}, {"id": 1549, "active": true, "numRule": "69.1", "text": "Атакующий игрок толкает партнера по команде на вратаря соперника и в этот момент шайба попадает в ворота", "refs": [{"num": "69.1", "doc": null, "key": null}], "media": []}, {"id": 1550, "active": true, "numRule": "24.6", "text": "Ваши действия, если во время выхода один на один защищающийся игрок дважды делает сопернику подножку?", "refs": [{"num": "24.6", "doc": null, "key": null}], "media": []}, {"id": 1551, "active": true, "numRule": "10.4", "text": "Игрок на льду посылает свою клюшку вратарю, который уронил свою клюшку. Можно ли так играть?", "refs": [{"num": "10.4", "doc": null, "key": null}], "media": []}, {"id": 1552, "active": true, "numRule": "27.8", "text": "Может ли вратарь играть в шайбу в ограниченной зоне вратаря, если один его конек касается площади ворот?", "refs": [{"num": "27.8", "doc": null, "key": null}], "media": []}, {"id": 1553, "active": true, "numRule": "63.2", "text": "Может ли вратарь прижимать шайбу в ограниченной зоне вратаря?", "refs": [{"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 1554, "active": true, "numRule": "67.2", "text": "Имеет ли право вратарь, находясь в зоне трапеции, ловить шайбу?", "refs": [{"num": "67.2", "doc": null, "key": null}], "media": []}, {"id": 1556, "active": true, "numRule": "63.6", "text": "Может ли вратарь покидать площадь ворот в попытке опередить соперника в борьбе за шайбу, чтобы прыгнуть на нее и вызвать остановку игры, если он подвергся давлению со стороны соперника", "refs": [{"num": "63.6", "doc": null, "key": null}], "media": []}, {"id": 1560, "active": true, "numRule": "41.5", "text": "Какой штраф должен наложить Главный судья, в случае, если хоккеист совершает толчок на борт и своими безответственными действиями наносит очевидную травму сопернику?", "refs": [{"num": "41.5", "doc": null, "key": null}], "media": []}, {"id": 1561, "active": true, "numRule": "58.3", "text": "Какой штраф должен быть наложен Главным судьей на хоккеиста, который безответственно подвергает опасности соперника в результате удара концом клюшки?", "refs": [{"num": "58.3", "doc": null, "key": null}], "media": []}, {"id": 1562, "active": true, "numRule": "58.2", "text": "Какой штраф должен наложить Главный судья на хоккеиста, пытающегося нанести сопернику удар концом клюшки?", "refs": [{"num": "58.2", "doc": null, "key": null}], "media": []}, {"id": 1563, "active": true, "numRule": "42.3", "text": "Какой штраф должен быть наложен Главным судьей на хоккеиста, который безответственно подвергает опасности соперника с нанесением травмы, в результате неправильной атаки?", "refs": [{"num": "42.3", "doc": null, "key": null}], "media": []}, {"id": 1566, "active": true, "numRule": "44.1", "text": "Какой штраф должен быть наложен Главным судьей на игрока, который безответственно подвергает опасности соперника применяя отсечение, чтобы избежать применения силового приема, в результате чего соперник совершает кувырок через него и ударяется о борт?", "refs": [{"num": "44.1", "doc": null, "key": null}], "media": []}, {"id": 1567, "active": true, "numRule": "59.2", "text": "Какой штраф должен быть наложен Главным судьей, за Толчок соперника клюшкой?", "refs": [{"num": "59.2", "doc": null, "key": null}], "media": []}, {"id": 1568, "active": true, "numRule": "59.3", "text": "Какой штраф должен быть наложен Главным судьей на хоккеиста, который безответственно  подвергает опасности  соперника толчком клюшки, и по мнению Главного судьи Малого штрафа будет недостаточно?", "refs": [{"num": "59.3", "doc": null, "key": null}], "media": []}, {"id": 1569, "active": true, "numRule": "12", "text": "Какой штраф должен быть наложен на хоккеиста, который не заменил и не исправил снаряжение после предупреждения и уже наложенного ранее Малого штрафа?", "refs": [{"num": "12", "doc": null, "key": null}], "media": []}, {"id": 1570, "active": true, "numRule": "12", "text": "Какой штраф должен быть наложен, если хоккеист не заменил или не исправил снаряжение после предупреждения и наложения Малого штрафа?", "refs": [{"num": "12", "doc": null, "key": null}], "media": []}, {"id": 1571, "active": true, "numRule": "45.3", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который ударом локтем безответственно подвергает опасности соперника, и если Малый штраф будет недостаточным наказанием?", "refs": [{"num": "45.3", "doc": null, "key": null}], "media": []}, {"id": 1572, "active": true, "numRule": "23.8", "text": "Какое решение должен принять Главный судья, по отношению к неигровому персоналу команды, который вступает в физическую конфронтацию со зрителем?", "refs": [{"num": "23.8", "doc": null, "key": null}], "media": []}, {"id": 1573, "active": true, "numRule": "23.8.1", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который вступает в физическую конфронтацию со зрителем?", "refs": [{"num": "23.8", "doc": null, "key": null}], "media": []}, {"id": 1574, "active": true, "numRule": "46.3", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который является зачинщиком драки в ВХЛ?", "refs": [{"num": "46.3", "doc": null, "key": null}], "media": []}, {"id": 1575, "active": true, "numRule": "47.3", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который наносит удар сопернику головой?", "refs": [{"num": "47.3", "doc": null, "key": null}], "media": []}, {"id": 1576, "active": true, "numRule": "47.2", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который пытается нанести удар сопернику головой?", "refs": [{"num": "47.2", "doc": null, "key": null}], "media": []}, {"id": 1577, "active": true, "numRule": "60.4", "text": "Хоккеист, безответственно подвергает опасности соперника в связи с игрой высоко поднятой клюшкой с нанесением травмы. Ваши действия?", "refs": [{"num": "60.4", "doc": null, "key": null}], "media": []}, {"id": 1578, "active": true, "numRule": "60.3", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который случайно наносит повреждение (в виде появления крови, ссадины) сопернику высоко поднятой клюшкой?", "refs": [{"num": "60.3", "doc": null, "key": null}], "media": []}, {"id": 1580, "active": true, "numRule": "56.4, 56.6", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который наносит травму или безответственно подвергает опасности жизнь и здоровье соперника, в результате Блокировки?", "refs": [{"num": "56.4", "doc": null, "key": null}, {"num": "56.6", "doc": null, "key": null}], "media": []}, {"id": 1582, "active": true, "numRule": "49.3", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который наносит удар ногой по хоккеисту команды соперника?", "refs": [{"num": "49.3", "doc": null, "key": null}], "media": []}, {"id": 1583, "active": true, "numRule": "50.3", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который безответственно подвергает опасности соперника, нанося ему удар коленом?", "refs": [{"num": "50.3", "doc": null, "key": null}], "media": []}, {"id": 1585, "active": true, "numRule": "75.5 п.4", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который замахивается клюшкой на другого хоккеиста во время конфронтации?", "refs": [{"num": "75.5", "doc": null, "key": null}, {"num": "4", "doc": null, "key": null}], "media": []}, {"id": 1590, "active": true, "numRule": "62.3", "text": "Хоккеист наносит сопернику колющий удар, удерживая клюшку двумя руками. \nВаши действия?", "refs": [{"num": "62.3", "doc": null, "key": null}], "media": []}, {"id": 1591, "active": true, "numRule": "75.5.6", "text": "Какое решение должен принять Главный судья, по отношению к тренеру команды, который плюет в соперника на игровой площадке во время матча?", "refs": [{"num": "75.5", "doc": null, "key": null}], "media": []}, {"id": 1592, "active": true, "numRule": "39.5.8", "text": "Какое решение должен принять Главный судья, по отношению к неигровому персоналу команды, который плюет в судью?", "refs": [{"num": "39.5", "doc": null, "key": null}], "media": []}, {"id": 1595, "active": true, "numRule": "75.5.2", "text": "Какое решение должен принять Главный судья, по отношению к тренеру команды, который делает оскорбительные жесты в адрес любого лица?", "refs": [{"num": "75.5", "doc": null, "key": null}], "media": []}, {"id": 1596, "active": true, "numRule": "75.5.2", "text": "Какое решение должен принять Главный судья, по отношению к неигровому персоналу команды, который использует комментарии сексуального характера в адрес любого лица?", "refs": [{"num": "75.5", "doc": null, "key": null}], "media": []}, {"id": 1597, "active": true, "numRule": "75.5.2", "text": "Какое решение должен принять Главный судья, по отношению к тренеру команды, который использует расовые оскорбления?", "refs": [{"num": "75.5", "doc": null, "key": null}], "media": []}, {"id": 1598, "active": true, "numRule": "24.8", "text": "Какое решение должен принять Главный судья, если против атакующего игрока, выходящего один на один с вратарем, нарушены правила сзади?", "refs": [{"num": "24.8", "doc": null, "key": null}], "media": []}, {"id": 1599, "active": true, "numRule": "10.5", "text": "Может ли Главный судья, по своему усмотрению, измерить клюшку вратаря?", "refs": [{"num": "10.5", "doc": null, "key": null}], "media": []}, {"id": 1600, "active": true, "numRule": "92", "text": "Может ли Главный судья, по своему усмотрению, измерить шорты игрока?", "refs": [{"num": "92", "doc": null, "key": null}], "media": []}, {"id": 1601, "active": true, "numRule": "10.5", "text": "Может ли Главный судья, по своему усмотрению, измерить клюшку игрока?", "refs": [{"num": "10.5", "doc": null, "key": null}], "media": []}, {"id": 1602, "active": true, "numRule": "9.13", "text": "Рожденные после какой даты игроки должны использовать капу?", "refs": [{"num": "9.13", "doc": null, "key": null}], "media": []}, {"id": 1604, "active": true, "numRule": "84.4", "text": "Имеет ли право хоккеист, на которого Главный судья наложил Дисциплинарный штраф в 4:59 до конца третьего периода, участвовать в серии бросков, определяющих победителя матча?", "refs": [{"num": "84.4", "doc": null, "key": null}], "media": []}, {"id": 1609, "active": true, "numRule": "5.5", "text": "Имеет ли право неигровой командный персонал, который находится рядом со скамейкой игроков во время матча, использовать какую-либо радиотехнику?", "refs": [{"num": "5.5", "doc": null, "key": null}], "media": []}, {"id": 1611, "active": true, "numRule": "9.7", "text": "Может ли  игрок использовать тонированный козырек для защиты глаз?", "refs": [{"num": "9.7", "doc": null, "key": null}], "media": []}, {"id": 1612, "active": true, "numRule": "63.9.1", "text": "Хоккеист ногой выбрасывает шайбу за пределы игровой площадки из своей зоны защиты в любое место арены (за исключением случаев, где нет защитного стекла и это не скамейки запасных игроков).\n\nВаши действия?", "refs": [{"num": "63.9", "doc": null, "key": null}], "media": []}, {"id": 1613, "active": true, "numRule": "63.2.3", "text": "Хоккеист клюшкой выбрасывает шайбу за пределы игровой площадки из своей зоны защиты в любое место арены (за исключением случаев, где нет защитного стекла и это не скамейки запасных игроков).\n\nВаши действия?", "refs": [{"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 1615, "active": true, "numRule": "37 и 80.3", "text": "Назовите определяющий фактор при определении взятия ворот высоко поднятой клюшкой?", "refs": [{"num": "37", "doc": null, "key": null}, {"num": "80.3", "doc": null, "key": null}], "media": []}, {"id": 1616, "active": true, "numRule": "12.1", "text": "Ваши действия по отношению к игроку, если Вы уже делали ему предупреждение по опасной экипировке и накладывали Малый штраф?", "refs": [{"num": "12.1", "doc": null, "key": null}], "media": []}, {"id": 1617, "active": true, "numRule": "17.1", "text": "Команда «А» получила Малый скамеечный штраф за нарушение численного состава. Тренер команды «А» протестует до такой степени, что на него налагается Малый скамеечный штраф (неспортивное поведение). Ваши действия?", "refs": [{"num": "17.1", "doc": null, "key": null}], "media": []}, {"id": 1618, "active": true, "numRule": "86.3", "text": "Кто имеет право выбора какие ворота защищать в начале матча?", "refs": [{"num": "86.3", "doc": null, "key": null}], "media": []}, {"id": 1621, "active": true, "numRule": "73.2", "text": "Одна из команда, находящаяся на льду, повторяет инцидент,  отказывается играть после указаний главного судьи начать матч. Ваши действия?", "refs": [{"num": "73.2", "doc": null, "key": null}], "media": []}, {"id": 1622, "active": true, "numRule": "5.4", "text": "Допустимо ли наличие 3 вратарей в официальном протоколе матча?", "refs": [{"num": "5.4", "doc": null, "key": null}], "media": []}, {"id": 1624, "active": true, "numRule": "35.7", "text": "Кто должен иметь официальный шаблон и рулетку для измерения клюшки?", "refs": [{"num": "35.7", "doc": null, "key": null}], "media": []}, {"id": 1625, "active": true, "numRule": "35.7", "text": "Кто будет ответственным за запись в официальном протоколе матча о результатах любого измерения клюшки?", "refs": [{"num": "35.7", "doc": null, "key": null}], "media": []}, {"id": 1626, "active": true, "numRule": "35.7", "text": "Кто должен проводить измерение клюшки?", "refs": [{"num": "35.7", "doc": null, "key": null}], "media": []}, {"id": 1627, "active": true, "numRule": "83.2", "text": "Игрок защищающейся команды выбрасывает шайбу из зоны защиты и в нейтральной зоне шайба отскакивает от  партнера по команде, находящегося под давлением соперника, обратно в зону защиты, в то время, когда атакующий игрок все еще находится в зоне атаки. Ваши действия?", "refs": [{"num": "83.2", "doc": null, "key": null}], "media": []}, {"id": 1628, "active": true, "numRule": "83.2", "text": "Игрок защищающейся команды выбрасывает шайбу из зоны защиты и в нейтральной зоне шайба отскакивает от  партнера по команде, находящегося под давлением соперника, обратно в зону защиты и попадает в соперника. Ваши действия?", "refs": [{"num": "83.2", "doc": null, "key": null}], "media": []}, {"id": 1631, "active": true, "numRule": "37.3", "text": "7. В каких ситуациях Главный судья может запросить видеопросмотр взятия ворот?", "refs": [{"num": "37.3", "doc": null, "key": null}], "media": []}, {"id": 1632, "active": true, "numRule": "37.3", "text": "8. В каких ситуациях Главный судья может запросить видеопросмотр взятия ворот?", "refs": [{"num": "37.3", "doc": null, "key": null}], "media": []}, {"id": 1633, "active": true, "numRule": "37.3", "text": "9. В каких ситуациях Главный судья может запросить видеопросмотр взятия ворот?", "refs": [{"num": "37.3", "doc": null, "key": null}], "media": []}, {"id": 1636, "active": true, "numRule": "20.1", "text": "Что такое «Большой штраф»?", "refs": [{"num": "20.1", "doc": null, "key": null}], "media": []}, {"id": 1637, "active": true, "numRule": "39", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который намеренно отбрасывает шайбу из зоны досягаемости судьи, который ее подбирает?", "refs": [{"num": "39", "doc": null, "key": null}], "media": []}, {"id": 1638, "active": true, "numRule": "6.1", "text": "Имеет ли право играющий тренер выполнять функции  капитана команды?", "refs": [{"num": "6.1", "doc": null, "key": null}], "media": []}, {"id": 1640, "active": true, "numRule": "10.2", "text": "Какой толщины должен может быть набалдашник на конце клюшки вратаря?", "refs": [{"num": "10.2", "doc": null, "key": null}], "media": []}, {"id": 1641, "active": true, "numRule": "20.6", "text": "Главный судья накладывает Большой штраф. После видеопросмотра определяет, что нарушения нет. Что должен сделать главный судья?", "refs": [{"num": "20.6", "doc": null, "key": null}], "media": []}, {"id": 1642, "active": true, "numRule": "38.2", "text": "Тренер\nкоманды берет запрос на то, что команда забросила шайбу с нарушением\nчисленного состава. Судьи просматриваю\nигровую ситуацию и определяют, что\nнарушения численного состава нет. Ваши действия?", "refs": [{"num": "38.2", "doc": null, "key": null}], "media": []}, {"id": 1643, "active": true, "numRule": "63", "text": "Атакующий игрок в зоне атаки,  прижимает шайбу клюшкой к борту,  давая идти времени штрафа своего партнёра, в то время как соперник безрезультатно пытается завладеть шайбой после предупреждения судьи о необходимости играть.   Ваши действия?", "refs": [{"num": "63", "doc": null, "key": null}], "media": []}, {"id": 1644, "active": true, "numRule": "76.1 76.2", "text": "Могут ли игроки атакующей команды выбрать точку вбрасывания в конечной зоне, если там произошла остановка игры?", "refs": [{"num": "76.1", "doc": null, "key": null}, {"num": "76.2", "doc": null, "key": null}], "media": []}, {"id": 1645, "active": true, "numRule": "38.2", "text": "Тренер команды берет запрос на то, что команда забросила шайбу с нарушением численного состава. Судьи просматриваю игровую ситуацию и определяют, что пропущено нарушение численного состава. Ваши действия?", "refs": [{"num": "38.2", "doc": null, "key": null}], "media": []}, {"id": 1646, "active": true, "numRule": "10.4", "text": "Игрок по льду пододвигает клюшку вратарю, который ее уронил, своей клюшкой. Можно ли так играть?", "refs": [{"num": "10.4", "doc": null, "key": null}], "media": []}, {"id": 1647, "active": true, "numRule": "10.4", "text": "Игрок со скамейки игроков бросает вратарскую клюшку вратарю, который сломал свою клюшку. \nМожно ли так играть?", "refs": [{"num": "10.4", "doc": null, "key": null}], "media": []}, {"id": 1648, "active": true, "numRule": "10.4", "text": "Кто-то со скамейки игроков бросает вратарскую клюшку вратарю, который сломал свою клюшку. Ваши действия?", "refs": [{"num": "10.4", "doc": null, "key": null}], "media": []}, {"id": 1649, "active": true, "numRule": "8.2", "text": "Травмированный вратарь во время тридцатисекундного перерыва был заменен на запасного вратаря. Можно ли провести обратную замену после вбрасывания шайбы во время матча?", "refs": [{"num": "8.2", "doc": null, "key": null}], "media": []}, {"id": 1650, "active": true, "numRule": "82.1", "text": "Вратарь во время остановки матча был заменен на игрока. Можно ли провести обратную замену до вбрасывания шайбы?", "refs": [{"num": "82.1", "doc": null, "key": null}], "media": []}, {"id": 1652, "active": true, "numRule": "67.2 п.3", "text": "Какое решение должен принять Главный судья, по отношению к игроку, который поднимает шайбу руками со льда в последние две минуты основного времени матча?", "refs": [{"num": "67.2", "doc": null, "key": null}, {"num": "3", "doc": null, "key": null}], "media": []}, {"id": 1654, "active": true, "numRule": "10.4", "text": "Может ли Вратарь продолжать играть сломанной клюшкой?", "refs": [{"num": "10.4", "doc": null, "key": null}], "media": []}, {"id": 1655, "active": true, "numRule": "71.1", "text": "Какой штраф должен быть наложен за преждевременную замену вратаря на игрока?", "refs": [{"num": "71.1", "doc": null, "key": null}], "media": []}, {"id": 1656, "active": true, "numRule": "202.5", "text": "Обязан ли вратарь команды  U-20 носить защиту горла?", "refs": [{"num": "202.5", "doc": null, "key": null}], "media": []}, {"id": 1659, "active": true, "numRule": "67.2", "text": "Может ли вратарь покидать площадь ворот в попытке опередить соперника в борьбе за шайбу и ловить ее, если, если он подвергся давлению со стороны соперника?", "refs": [{"num": "67.2", "doc": null, "key": null}], "media": []}, {"id": 1662, "active": true, "numRule": "69.4", "text": "Вратарь за пределами площади ворот преднамеренно блокирует соперника, который пытается завладеть шайбой. Ваши решение?", "refs": [{"num": "69.4", "doc": null, "key": null}], "media": []}, {"id": 1663, "active": true, "numRule": "10.4", "text": "Игрок подбросил клюшку вратарю, который ее потерял. Ваши действия?", "refs": [{"num": "10.4", "doc": null, "key": null}], "media": []}, {"id": 1664, "active": true, "numRule": "", "text": "Могут ли игроки атакующей команды выбрать точку вбрасывания в конечной зоне, если там произошла остановка игры?", "refs": [], "media": []}, {"id": 1665, "active": true, "numRule": "75.2.2, 20.1", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который хватает или удерживает руками маску, хоккеиста команды соперника?", "refs": [{"num": "75.2", "doc": null, "key": null}, {"num": "20.1", "doc": null, "key": null}], "media": []}, {"id": 1666, "active": true, "numRule": "23.8", "text": "Какой штраф должен наложить Главный судья на хоккеиста, который кусает соперника с нанесением травмы?", "refs": [{"num": "23.8", "doc": null, "key": null}], "media": []}, {"id": 1667, "active": true, "numRule": "62", "text": "Хоккеист пытается нанести колющий удар сопернику, удерживая клюшку одной рукой.\nВаши действия?", "refs": [{"num": "62", "doc": null, "key": null}], "media": []}, {"id": 1668, "active": true, "numRule": "10.5", "text": "Можно ли измерить клюшку хоккеиста находящегося на скамейке игроков?", "refs": [{"num": "10.5", "doc": null, "key": null}], "media": []}, {"id": 1669, "active": true, "numRule": "67.2 п.3", "text": "Какое решение должен принять Главный судья, по отношению к игроку, который поднимает шайбу руками со льда?", "refs": [{"num": "67.2", "doc": null, "key": null}, {"num": "3", "doc": null, "key": null}], "media": []}, {"id": 1670, "active": true, "numRule": "63.3", "text": "После взятия ворот на лед вышло больше хоккеистов, чем находилось на льду, во время взятия ворот. Это не привело к задержке продолжения матча.\nВаши действия?", "refs": [{"num": "63.3", "doc": null, "key": null}], "media": []}, {"id": 1671, "active": true, "numRule": "53.8", "text": "Запасной вратарь со своей скамейки игроков бросает клюшку в шайбу, находящуюся в зоне защиты вратаря.\nВаши действия?", "refs": [{"num": "53.8", "doc": null, "key": null}], "media": []}, {"id": 1672, "active": true, "numRule": "53.8", "text": "Запасной вратарь со своей скамейки игроков бросает клюшку в соперника, владеющего шайбой в зоне защиты команды вратаря.\nВаши действия?", "refs": [{"num": "53.8", "doc": null, "key": null}], "media": []}, {"id": 1673, "active": true, "numRule": "53.8", "text": "Запасной вратарь со своей скамейки игроков бросает шлем в шайбу, находящуюся в зоне защиты команды вратаря.\nВаши действия?", "refs": [{"num": "53.8", "doc": null, "key": null}], "media": []}, {"id": 1674, "active": true, "numRule": "53.8", "text": "Запасной вратарь со своей скамейки игроков бросает шлем в соперника, владеющего шайбой в зоне защиты команды вратаря.\nВаши действия?", "refs": [{"num": "53.8", "doc": null, "key": null}], "media": []}, {"id": 1675, "active": true, "numRule": "53.8", "text": "Тренер со своей скамейки игроков бросает клюшку в шайбу, находящуюся в зоне защиты команды тренера.\nВаши действия?", "refs": [{"num": "53.8", "doc": null, "key": null}], "media": []}, {"id": 1676, "active": true, "numRule": "53.8", "text": "Тренер со своей скамейки игроков бросает шлем в шайбу, находящуюся в зоне защиты команды тренера.\nВаши действия?", "refs": [{"num": "53.8", "doc": null, "key": null}], "media": []}, {"id": 1678, "active": true, "numRule": "53.8", "text": "Врач команды со скамейки игроков бросает шлем в соперника, владеющего шайбой в зоне защиты команды врача.\nВаши действия?", "refs": [{"num": "53.8", "doc": null, "key": null}], "media": []}, {"id": 1679, "active": true, "numRule": "53.8", "text": "Игрок со скамейки оштрафованных бросает клюшку в шайбу, находящуюся в зоне защиты команды бросающего клюшку игрока.\nВаши действия?", "refs": [{"num": "53.8", "doc": null, "key": null}], "media": []}, {"id": 1690, "active": true, "numRule": "70", "text": "Какие штрафы должны быть наложены, если хоккеисты обеих команд первыми покидают свои скамейки, во время конфрантации, в одно и то же время?", "refs": [{"num": "70", "doc": null, "key": null}], "media": []}, {"id": 1691, "active": true, "numRule": "37.3 пункт 9", "text": "Будет ли засчитано взятие ворот, когда Главный судья потерял шайбу из виду после броска по воротам и даёт свисток на остановку матча, но одновременно со свистком шайба выпала из вратарской экипировки и попала в ворота?", "refs": [{"num": "37.3", "doc": null, "key": null}, {"num": "9", "doc": null, "key": null}], "media": []}, {"id": 1692, "active": true, "numRule": "10.4", "text": "Может ли вратарь играть сломанной клюшкой?", "refs": [{"num": "10.4", "doc": null, "key": null}], "media": []}, {"id": 1693, "active": true, "numRule": "57.6", "text": "В ситуации выхода «один на один» вратарь первоначально выбивает шайбу клюшкой, после чего совершает подножку заставляя соперника упасть на лед. \nВаши действия?", "refs": [{"num": "57.6", "doc": null, "key": null}], "media": []}, {"id": 1694, "active": true, "numRule": "74.5", "text": "В овертайме вратаря заменили на дополнительного игрока. Когда вратарь может вернуться в игру?", "refs": [{"num": "74.5", "doc": null, "key": null}], "media": []}, {"id": 1695, "active": true, "numRule": "74.5", "text": "В овертайме вратаря заменили на дополнительного игрока. Когда вратарь может вернуться в игру?", "refs": [{"num": "74.5", "doc": null, "key": null}], "media": []}, {"id": 1697, "active": true, "numRule": "МОМ", "text": "Выберите правильный порядок действий по спасению жизни и сохранению здоровья Хоккеиста:", "refs": [], "media": []}, {"id": 1698, "active": true, "numRule": "МОМ", "text": "Какие существуют способы временной остановки наружных кровотечений?", "refs": [], "media": []}, {"id": 1699, "active": true, "numRule": "МОМ", "text": "Какие меры необходимо предпринять для снятия боли и уменьшения кровоизлияния в ткани сразу же после ушиба?", "refs": [], "media": []}, {"id": 1701, "active": true, "numRule": "МОМ", "text": "На какой срок на конечность можно накладывать кровоостанавливающий жгут в холодное время года?", "refs": [], "media": []}, {"id": 1702, "active": true, "numRule": "МОМ", "text": "Каким образом производится обработка раны раствором йода?", "refs": [], "media": []}, {"id": 1703, "active": true, "numRule": "МОМ", "text": "Что такое «иммобилизация»?", "refs": [], "media": []}, {"id": 1704, "active": true, "numRule": "МОМ", "text": "Что необходимо сделать перед началом транспортировки Хоккеиста?", "refs": [], "media": []}, {"id": 1705, "active": true, "numRule": "МОМ", "text": "По каким признакам можно определить, что кровоостанавливающий жгут наложен правильно?", "refs": [], "media": []}, {"id": 1706, "active": true, "numRule": "МОМ", "text": "Какое количество времени отводится оказывающему помощь на определение состояния клинической смерти пострадавшего?", "refs": [], "media": []}, {"id": 1707, "active": true, "numRule": "МОМ", "text": "Каким образом осуществляется транспортировка Хоккеиста с повреждением грудной клетки?", "refs": [], "media": []}, {"id": 1708, "active": true, "numRule": "МОМ", "text": "По истечении какого времени с начала кислородного голодания головного мозга восстановление его деятельности становится невозможным?", "refs": [], "media": []}, {"id": 1709, "active": true, "numRule": "МОМ", "text": "В чем заключается оказание первой помощи при вывихе сустава?", "refs": [], "media": []}, {"id": 1710, "active": true, "numRule": "МОМ", "text": "Каким образом осуществляется транспортировка Хоккеиста с подозрением на перелом позвоночника?", "refs": [], "media": []}, {"id": 1711, "active": true, "numRule": "МОМ", "text": "Каким образом производится иммобилизация пострадавшего с переломом позвоночника?", "refs": [], "media": []}, {"id": 1712, "active": true, "numRule": "МОМ", "text": "Каким образом осуществляется транспортировка пострадавших в бессознательном состоянии?", "refs": [], "media": []}, {"id": 1713, "active": true, "numRule": "МОМ", "text": "Где находится точка давления на грудину при проведении непрямого массажа сердца?", "refs": [], "media": []}, {"id": 1714, "active": true, "numRule": "МОМ", "text": "Каким образом производится иммобилизация Хоккеиста с переломом костей таза?", "refs": [], "media": []}, {"id": 1715, "active": true, "numRule": "МОМ", "text": "Хоккеиста с какими травмами допускается перемещать «волоком»?", "refs": [], "media": []}, {"id": 1716, "active": true, "numRule": "МОМ", "text": "Укажите правильный порядок проведения сердечно-легочной реанимации:", "refs": [], "media": []}, {"id": 1717, "active": true, "numRule": "МОМ", "text": "Каким образом проводится сердечно-легочная реанимация при участии одного спасателя?", "refs": [], "media": []}, {"id": 1718, "active": true, "numRule": "МОМ", "text": "Чем состояние комы отличается от обморочного состояния?", "refs": [], "media": []}, {"id": 1719, "active": true, "numRule": "МОМ", "text": "Каким образом проводится сердечно-легочная реанимация при участии двух спасателей?", "refs": [], "media": []}, {"id": 1720, "active": true, "numRule": "МОМ", "text": "При каком кровотечении кровь, поступающая из раны, бьет фонтаном?", "refs": [], "media": []}, {"id": 1721, "active": true, "numRule": "МОМ", "text": "Разрешено ли давать Хоккеисту лекарственные средства при оказании ему первой помощи?", "refs": [], "media": []}, {"id": 1722, "active": true, "numRule": "МОМ", "text": "В чем заключается первая помощь Хоккеисту, находящемуся в сознании, при повреждении позвоночника?", "refs": [], "media": []}, {"id": 1723, "active": true, "numRule": "МОМ", "text": "Как проверить наличие дыхания у Хоккеиста при внезапной потере сознания?", "refs": [], "media": []}, {"id": 44, "active": true, "numRule": "16.1", "text": "Что такое «Малый штраф»?", "refs": [{"num": "16.1", "doc": null, "key": null}], "media": []}, {"id": 45, "active": true, "numRule": "17.1", "text": "Что такое «Малый скамеечный штраф»?", "refs": [{"num": "17.1", "doc": null, "key": null}], "media": []}, {"id": 46, "active": true, "numRule": "86.1", "text": "Что такое «игровые действия»?", "refs": [{"num": "86.1", "doc": null, "key": null}], "media": []}, {"id": 47, "active": true, "numRul
