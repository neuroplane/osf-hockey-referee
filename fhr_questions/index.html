<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вопросы для судей ФХР</title>
<style>
  :root { --bg:#0f1420; --panel:#171e2e; --line:#26304a; --txt:#dfe6f3;
          --dim:#8b97b3; --acc:#4da3ff; --del:#e05555; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.55 -apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--txt); }
  header { position:sticky; top:0; z-index:10; background:var(--panel);
           border-bottom:1px solid var(--line); padding:10px 16px;
           display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  input[type=search] { flex:1; min-width:180px; padding:7px 12px; border-radius:8px;
           border:1px solid var(--line); background:var(--bg); color:var(--txt); }
  .filters button { margin-right:6px; padding:6px 12px; border-radius:8px;
           border:1px solid var(--line); background:transparent; color:var(--dim);
           cursor:pointer; }
  .filters button.on { background:var(--acc); border-color:var(--acc); color:#04121f; font-weight:600; }
  main { display:flex; align-items:flex-start; }
  #list { flex:1; min-width:0; padding:8px 16px 60px; }
  .q { border-bottom:1px solid var(--line); padding:12px 4px; }
  .q .meta { font-size:12.5px; color:var(--dim); margin-bottom:4px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .q .txt { white-space:pre-wrap; }
  .q.deleted .txt { color:var(--dim); }
  .badge { font-size:11px; font-weight:700; color:#fff; background:var(--del);
           border-radius:4px; padding:1px 6px; }
  .rule { display:inline-block; margin:2px 6px 0 0; padding:2px 8px; font-size:12.5px;
          border:1px solid var(--acc); border-radius:12px; color:var(--acc);
          cursor:pointer; user-select:none; }
  .rule:hover { background:var(--acc); color:#04121f; }
  .rule.none { border-color:var(--line); color:var(--dim); cursor:default; }
  .rule.none:hover { background:transparent; color:var(--dim); }
  .q a.media { font-size:12.5px; color:var(--dim); margin-right:10px; }
  .backdrop { position:fixed; inset:0; background:rgba(0,0,0,.55);
              z-index:20; display:none; }
  .backdrop.open { display:block; }
  aside { position:fixed; left:50%; top:8vh; transform:translateX(-50%);
          width:min(95%,360px); max-height:84vh; overflow-y:auto;
          background:var(--panel); border:1px solid var(--line); border-radius:14px;
          box-shadow:0 18px 60px rgba(0,0,0,.6);
          padding:22px 24px; display:none; z-index:21; }
  aside.open { display:block; }
  aside h2 { font-size:15px; margin:0 0 6px; padding-right:26px; line-height:1.35; }
  aside .doc { font-size:12.5px; color:var(--dim); margin-bottom:16px; }
  aside .doc a { color:var(--acc); }
  aside .body { font-size:12.5px; line-height:1.7; }
  aside .body p { margin:0 0 12px; }
  aside .body p:last-child { margin-bottom:0; }
  aside .body p.h { font-weight:700; color:var(--acc); margin-top:16px; }
  aside .close { position:absolute; top:10px; right:12px; cursor:pointer;
          color:var(--dim); font-size:20px; border:none; background:none; }
</style>
</head>
<body>
<header>
  <h1>Вопросы судей ФХР</h1>
  <input type="search" id="search" placeholder="Поиск по тексту / номеру правила…">
  <span class="filters">
    <button data-f="all" class="on">Все</button>
    <button data-f="active">Активные</button>
    <button data-f="deleted">Удалённые</button>
  </span>
  <span id="count" style="color:var(--dim);font-size:12.5px"></span>
</header>
<main>
  <div id="list"></div>
  <div class="backdrop" id="backdrop" onclick="closePanel()"></div>
  <aside id="panel">
    <button class="close" onclick="closePanel()">&times;</button>
    <h2 id="p-title"></h2>
    <div class="doc" id="p-doc"></div>
    <div class="body" id="p-body"></div>
  </aside>
</main>
<script>
const QUESTIONS = [{"id": 1724, "active": true, "numRule": "МОМ", "text": "Как следует уложить Хоккеиста при потере им сознания и наличии пульса на сонной артерии для оказания первой помощи?", "refs": [], "media": []}, {"id": 1725, "active": true, "numRule": "МОМ", "text": "При первичном осмотре Хоккеиста оценивают следующее:", "refs": [], "media": []}, {"id": 1726, "active": true, "numRule": "МОМ", "text": "Если у Хоккеиста отсутствует сознание, то следующее ваше действие будет:", "refs": [], "media": []}, {"id": 1727, "active": true, "numRule": "МОМ", "text": "Основная задача оказания первой помощи Хоккеисту:", "refs": [], "media": []}, {"id": 1728, "active": true, "numRule": "МОМ", "text": "Если у Хоккеиста нет сознания, но есть пульс и дыхание, то его надо:", "refs": [], "media": []}, {"id": 1730, "active": true, "numRule": "24.2", "text": "Могут ли не участвующие в броске игроки находится на льду во время выполнения штрафного броска?", "refs": [{"num": "24.2", "doc": null, "key": null}], "media": []}, {"id": 1731, "active": true, "numRule": "20.1", "text": "Какой штраф должен наложить Главный судья на хоккеиста, который атакует соперника с нарушением правил и безответственно подвергает опасности соперника ?", "refs": [{"num": "20.1", "doc": null, "key": null}], "media": []}, {"id": 1732, "active": true, "numRule": "81.1", "text": "Атакующий Хоккеист бросил шайбу со своей половины поля до центральной красной линии, шайба попадает в перекладину или стойку ворот, и пересекает линию ворот. Шайба не попадает в ворота.\nВаше решение?", "refs": [{"num": "81.1", "doc": null, "key": null}], "media": []}, {"id": 1733, "active": true, "numRule": "82.3", "text": "По Правилу смены игрового состава какая из команд должна проводить смену игроков второй?", "refs": [{"num": "82.3", "doc": null, "key": null}], "media": []}, {"id": 1735, "active": true, "numRule": "56", "text": "Во время матча, шайбу летящую мимо скамейки игроков, останавливает запасной Вратарь вытаскивая ловушку за борт. Шайба не покидала ледовую площадку. Что вы сделаете?", "refs": [{"num": "56", "doc": null, "key": null}], "media": []}, {"id": 1736, "active": true, "numRule": "57.3", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который наносит опасный удар по ноге соперника сзади и одновременно тянет его рукой или клюшкой назад, тем самым сбивает его с ног? \nПри этом травму не наносит.", "refs": [{"num": "57.3", "doc": null, "key": null}], "media": []}, {"id": 4298, "active": true, "numRule": "70.3", "text": "Какой штраф должен быть наложен на первого хоккеиста любой из команд, покинувшего скамейку игроков или скамейку штрафников во время конфронтации хоккеистов на льду?", "refs": [{"num": "70.3", "doc": null, "key": null}], "media": []}, {"id": 4299, "active": true, "numRule": "19.4", "text": "Штрафы каких игроков будут на табло в дополнительном периоде, если он проводится в формате 5 на 5?\n \nКоманда «А» \n Команда «Б»\n\nА4 – 2 мин в  58:59\n Б35 – 5 мин в  58:59", "refs": [{"num": "19.4", "doc": null, "key": null}], "media": []}, {"id": 4300, "active": true, "numRule": "19.1", "text": "Сколько игроков на обеих скамейках оштрафованных в 3:00?\nЕсли, Команда «А» выбрала игру 3 на 4\nКоманда «А»\nКоманда «Б»\n\nA3 – 2 + 2 мин. в 3:00\nБ8 – 2 + 5 мин. + Дисциплинарный штраф до конца матча в 3:00\n\nA5 – 2 мин. в 3:00\nБ9 – 5 мин. + Дисциплинарный штраф до конца матча в 3:00\n\nA7 – 5 мин. + Дисциплинарный штраф до конца матча в 3:00", "refs": [{"num": "19.1", "doc": null, "key": null}], "media": []}, {"id": 4301, "active": true, "numRule": "19.1", "text": "Сколько игроков на обеих скамейках оштрафованных в 3:00?\nЕсли, Команда «А» выбрала игру 4 на 4\nКоманда «А»\nКоманда «Б»\n\nA3 – 2 + 2 мин. в 3:00\nБ8 – 2 + 5 мин. + Дисциплинарный штраф до конца матча в 3:00\n\nA5 – 2 мин. в 3:00\nБ9 – 5 мин. + Дисциплинарный штраф до конца матча в 3:00\n\nA7 – 5 мин. + Дисциплинарный штраф до конца матча в 3:00", "refs": [{"num": "19.1", "doc": null, "key": null}], "media": []}, {"id": 4302, "active": true, "numRule": "39.5.7", "text": "Официальный представитель команды, находящийся за пределами льда выбрасывает на лед клюшку или любой другой предмет в протест на решение судьи.\nВаши действия?", "refs": [{"num": "39.5", "doc": null, "key": null}], "media": []}, {"id": 4303, "active": true, "numRule": "5.3", "text": "Допускается ли внесение в заявку на матч третьего Вратаря ?", "refs": [{"num": "5.3", "doc": null, "key": null}], "media": []}, {"id": 4304, "active": true, "numRule": "9.12", "text": "Игрок на льду теряет защиту шеи во время игровых действий.\nРазрешается ли ему подобрать защиту шеи и надеть ?", "refs": [{"num": "9.12", "doc": null, "key": null}], "media": []}, {"id": 4305, "active": true, "numRule": "10.6", "text": "Перед выполнением штрафного броска игрок команды «А» отказался передать свою клюшку для измерения по просьбе капитана команды «Б».\nВаши действия ?", "refs": [{"num": "10.6", "doc": null, "key": null}], "media": []}, {"id": 4306, "active": true, "numRule": "57.6", "text": "В ситуации выхода «один на один» игрок первоначально выбивает шайбу клюшкой, после чего совершает подножку заставляя соперника упасть на лед.\nВаши действия?", "refs": [{"num": "57.6", "doc": null, "key": null}], "media": []}, {"id": 4307, "active": true, "numRule": "51.2", "text": "Какой штраф необходимо наложить на хоккеиста, который наносит ответный удар сопернику рукой в перчатке?", "refs": [{"num": "51.2", "doc": null, "key": null}], "media": []}, {"id": 4308, "active": true, "numRule": "51.2", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который намеренно сбивает шлем с головы соперника?", "refs": [{"num": "51.2", "doc": null, "key": null}], "media": []}, {"id": 4309, "active": true, "numRule": "75.4", "text": "Ранее команде было вынесено предупреждение об использовании персональных аксессуаров. Один из игроков этой команды проигнорировал предупреждение Главного судьи и продолжил использовать персональные аксессуары.\nДействия Главного судьи?", "refs": [{"num": "75.4", "doc": null, "key": null}], "media": []}, {"id": 4310, "active": true, "numRule": "27.1", "text": "Кто должен отбывать штраф за нарушение, которое совершил Вратарь?", "refs": [{"num": "27.1", "doc": null, "key": null}], "media": []}, {"id": 4311, "active": true, "numRule": "75.4", "text": "После остановки матча, хоккеист проезжает мимо шайбы и бросает в сторону ворот соперника.\nВаши действия?", "refs": [{"num": "75.4", "doc": null, "key": null}], "media": []}, {"id": 4312, "active": true, "numRule": "79.2", "text": "Игрок из своей зоны защиты намеренно направляет шайбу рукой, а партнер принимает шайбу клюшкой в нейтральной зоне хотя его коньки находятся в зоне защиты?", "refs": [{"num": "79.2", "doc": null, "key": null}], "media": []}, {"id": 4314, "active": true, "numRule": "39.4", "text": "Игрок отказывается отправиться непосредственно на скамейку штрафников после драки или конфронтации. \nДействия главного судьи?", "refs": [{"num": "39.4", "doc": null, "key": null}], "media": []}, {"id": 4315, "active": true, "numRule": "9.7", "text": "Может ли игрок использовать шлем с решетчатой маской на которой отсутствует мягкая защита подбородка ?", "refs": [{"num": "9.7", "doc": null, "key": null}], "media": []}, {"id": 4316, "active": true, "numRule": "85.1", "text": "В результате броска шайбы защищающимся игроком, шайба попадает на свою скамейку игроков через открытую калитку. Бросок совершен из зоны защиты.\nГде будет проводиться вбрасывание?", "refs": [{"num": "85.1", "doc": null, "key": null}], "media": []}, {"id": 4317, "active": true, "numRule": "85.1", "text": "Первый период. Где будет проводиться вбрасывание, если после броска шайбы игроком команд А находящимся в нейтральной зоне, она попадает в партнера по команде перегнувшегося через борт со скамейки игроков ?", "refs": [{"num": "85.1", "doc": null, "key": null}], "media": []}, {"id": 4318, "active": true, "numRule": "85.1", "text": "Игрок команды А, находясь в своей зоне защиты, бросает шайбу. Шайба попадает в партнёра по команде в нейтральной зоне, перегнувшегося через борт со скамейки игроков. \nГде будет произведено вбрасывание?", "refs": [{"num": "85.1", "doc": null, "key": null}], "media": []}, {"id": 4321, "active": true, "numRule": "10.3", "text": "Оштрафованный игрок отдает свою клюшку со скамейки штрафников партнеру по команде, у которого сломалась клюшка.\nВаши действия ?", "refs": [{"num": "10.3", "doc": null, "key": null}], "media": []}, {"id": 4322, "active": true, "numRule": "10.7", "text": "Перед выполнением бросков определяющих победителя матча , команда «А» просит измерить клюшку у вратаря команды «Б». Вратарь команды «Б» отказывается передать клюшку для измерения.\nВаши действия?", "refs": [{"num": "10.7", "doc": null, "key": null}], "media": []}, {"id": 4324, "active": true, "numRule": "53.2", "text": "В ситуации выхода «один на один», Вратарь бросает клюшку в направлении игрока находящегося в нейтральной зоне, и не попадает в него. \nВаше решение?", "refs": [{"num": "53.2", "doc": null, "key": null}], "media": []}, {"id": 4325, "active": true, "numRule": "9.6", "text": "В ситуации выхода  «один на один», Вратарь снимает шлем.\nВаше решение?", "refs": [{"num": "9.6", "doc": null, "key": null}], "media": []}, {"id": 4326, "active": true, "numRule": "9.6", "text": "В ситуации выхода «один на один», Вратарь снимает шлем.\nВаше решение?", "refs": [{"num": "9.6", "doc": null, "key": null}], "media": []}, {"id": 4327, "active": true, "numRule": "24.4", "text": "Хоккеист команды соперника отвлекает игрока, выполняющего штрафной бросок, в результате чего бросок оказывается неудачным. \nВаши действия?", "refs": [{"num": "24.4", "doc": null, "key": null}], "media": []}, {"id": 4328, "active": true, "numRule": "24.4", "text": "Представитель команды соперника отвлекает игрока, выполняющего штрафной бросок, в результате чего бросок оказывается неудачным. \nВаши действия?", "refs": [{"num": "24.4", "doc": null, "key": null}], "media": []}, {"id": 4329, "active": true, "numRule": "80.3", "text": "Шайба касается клюшки атакующего игрока, расположенной выше перекладины ворот, отскакивает от судьи, попадает к игроку атакующей команды, который забрасывает шайбу в ворота. \nВаши действия?", "refs": [{"num": "80.3", "doc": null, "key": null}], "media": []}, {"id": 4330, "active": true, "numRule": "75.4", "text": "Если хоккеист не может снять персональные аксессуары, которые, по мнению Главного судьи, могут представлять потенциальную опасность, то:", "refs": [{"num": "75.4", "doc": null, "key": null}], "media": []}, {"id": 4331, "active": true, "numRule": "75.4", "text": "Вратарь получил второе предупреждение в матче, в связи с опасными персональными аксессуарами.\nВаши действия?", "refs": [{"num": "75.4", "doc": null, "key": null}], "media": []}, {"id": 4332, "active": true, "numRule": "83.1", "text": "Игрок останавливается обеими ногами на синей линии и получает шайбу на клюшку. Далее он въезжает спиной вперёд в зону соперника, держа шайбу. В момент, когда оба конька оказываются внутри зоны, он кратковременно отпускает шайбу от клюшки, но немедленно восстанавливает контроль над ней, затягивая её в зону. \n\nНарушено ли правило положение «Вне игры»?", "refs": [{"num": "83.1", "doc": null, "key": null}], "media": []}, {"id": 4334, "active": true, "numRule": "63.2.5", "text": "Нужно ли назначить Штрафной бросок или засчитать взятие ворот, если вратарь заменён на игрока, который блокирует бросок в площади ворот, шайба застревает под ним, а сам игрок не пытается накрыть её, упасть на неё или каким-либо образом скрыть её положение?", "refs": [{"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 4335, "active": true, "numRule": "75.2", "text": "Какой штраф должен наложить Главный судья на хоккеиста, укусившего соперника за снаряжение (свитер, краги, шлем)?", "refs": [{"num": "75.2", "doc": null, "key": null}], "media": []}, {"id": 4336, "active": true, "numRule": "9.3", "text": "Игрок заменил свой порванный свитер запасным. Запасной свитер оказался слишком большим и скрывает шорты игрока.\nМожно играть в таком свитере?", "refs": [{"num": "9.3", "doc": null, "key": null}], "media": []}, {"id": 4337, "active": true, "numRule": "46.1", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который является зачинщиком драки в РХЛ и ЖХЛ?", "refs": [{"num": "46.1", "doc": null, "key": null}], "media": []}, {"id": 4338, "active": true, "numRule": "46.4", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который является агрессором драки в РХЛ и ЖХЛ?", "refs": [{"num": "46.4", "doc": null, "key": null}], "media": []}, {"id": 4339, "active": true, "numRule": "46.4", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который является агрессором в драке?", "refs": [{"num": "46.4", "doc": null, "key": null}], "media": []}, {"id": 4340, "active": true, "numRule": "46.4", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который является агрессором в драке?", "refs": [{"num": "46.4", "doc": null, "key": null}], "media": []}, {"id": 4341, "active": true, "numRule": "60.1", "text": "Какое решение должен принять Главный судья относительно хоккеиста, который контактирует своей клюшкой с верхней частью тела соперника после броска?", "refs": [{"num": "60.1", "doc": null, "key": null}], "media": []}, {"id": 4342, "active": true, "numRule": "60.1", "text": "Какое решение должен принять Главный судья относительно хоккеиста, который контактирует своей клюшкой с верхней частью тела соперника после передачи шайбы?", "refs": [{"num": "60.1", "doc": null, "key": null}], "media": []}, {"id": 4343, "active": true, "numRule": "60.1", "text": "Какое решение должен принять Главный судья относительно хоккеиста, который контактирует своей клюшкой с верхней частью тела соперника после передачи шайбы?", "refs": [{"num": "60.1", "doc": null, "key": null}], "media": []}, {"id": 4344, "active": true, "numRule": "60.1", "text": "Какое решение должен принять Главный судья относительно хоккеиста, который контактирует своей клюшкой с верхней частью тела соперника после броска?", "refs": [{"num": "60.1", "doc": null, "key": null}], "media": []}, {"id": 4346, "active": true, "numRule": "10.5", "text": "Клюшка имеет два крюка. Нужно ли произвести замер клюшки?", "refs": [{"num": "10.5", "doc": null, "key": null}], "media": []}, {"id": 4347, "active": true, "numRule": "32.4", "text": "Должен ли Линейный судья остановить матч, если он стал свидетелем нарушения \"Игры высоко поднятой клюшкой\" с нанесением травмы которая осталась незамеченной Главными судьями?\nНарушение требует наложения двойной Малый штраф.", "refs": [{"num": "32.4", "doc": null, "key": null}], "media": []}, {"id": 4348, "active": true, "numRule": "83.7", "text": "Возникает отложенное положение «Вне игры», защищающаяся команда не прилагает усилий по выводу шайбы из своей зоны, а атакующая команда продвигается вглубь зоны и не пытается выйти из зоны после указаний Линейного судьи.\nСчитается это умышленным положением «Вне игры»?", "refs": [{"num": "83.7", "doc": null, "key": null}], "media": []}, {"id": 4349, "active": true, "numRule": "11.9", "text": "Может ли Главный судья измерить блин Вратаря после овертайма?\nОвертайм закончился ничьей.", "refs": [{"num": "11.9", "doc": null, "key": null}], "media": []}, {"id": 4350, "active": true, "numRule": "76.2", "text": "В нейтральной зоне на игрока наложен Дисциплинарный штраф до конца матча.\nГде будет вбрасывание?", "refs": [{"num": "76.2", "doc": null, "key": null}], "media": []}, {"id": 4351, "active": true, "numRule": "37.3", "text": "10. В каких ситуациях Главный судья может запросить видеопросмотр взятия ворот?", "refs": [{"num": "37.3", "doc": null, "key": null}], "media": []}, {"id": 4352, "active": true, "numRule": "37.3", "text": "1. В каких ситуациях Главный судья может запросить видеопросмотр взятия ворот?", "refs": [{"num": "37.3", "doc": null, "key": null}], "media": []}, {"id": 4353, "active": true, "numRule": "37.3", "text": "4. В каких ситуациях Главный судья может запросить видеопросмотр взятия ворот?", "refs": [{"num": "37.3", "doc": null, "key": null}], "media": []}, {"id": 4354, "active": true, "numRule": "37.3", "text": "5.  В каких ситуациях Главный судья может запросить видеопросмотр взятия ворот?", "refs": [{"num": "37.3", "doc": null, "key": null}], "media": []}, {"id": 4355, "active": true, "numRule": "19.4", "text": "Штрафы каких игроков будут на табло в дополнительном периоде, если он проводится в формате 5 на 5?\n \nКоманда «А» \n Команда «Б»\n\nА4 – 2 мин в  57:00\n Б35 – 5 мин в  57:00", "refs": [{"num": "19.4", "doc": null, "key": null}], "media": []}, {"id": 4357, "active": true, "numRule": "20.4", "text": "Если хоккеист был оштрафован Большим штрафом.\nНакладывается ли автоматический Дисциплинарный штраф до конца матча ?", "refs": [{"num": "20.4", "doc": null, "key": null}], "media": []}, {"id": 4358, "active": true, "numRule": "8.2", "text": "Травмированный вратарь во время тридцатисекундного перерыва был заменен на запасного вратаря. Можно ли провести обратную замену после вбрасывания шайбы во время матча?", "refs": [{"num": "8.2", "doc": null, "key": null}], "media": []}, {"id": 4359, "active": true, "numRule": "16.2", "text": "Сколько игроков на скамейке оштрафованных в 12:00?\n \nКоманда «А»\nКоманда «Б»\n\nА7 – 2 + 2 мин в 12:00\nБ3 – 2 мин в 12:00\n\nA9 – 2 мин в 13:15", "refs": [{"num": "16.2", "doc": null, "key": null}], "media": []}, {"id": 4360, "active": true, "numRule": "16.2", "text": "Сколько игроков на скамейке оштрафованных игроков в 6:00?\nКоманда «А»\nКоманда «Б»\n\nА15 - 5 мин + Дисциплинарный штраф до конца матча в 3:00\n \n ГОЛ в 4:30\n\nА10 - 2 + 2 мин в 5:00\nБ25 - 2 мин в 5:00\n\nГОЛ в 6:00", "refs": [{"num": "16.2", "doc": null, "key": null}], "media": []}, {"id": 4361, "active": true, "numRule": "16.2", "text": "В какое время выйдет А10?\nКоманда «А»\nКоманда «Б»\n\nА15 - 5 мин + Дисциплинарный штраф до конца матча в 3:00\n \n ГОЛ в 4:30\n\nА10 - 2 + 2 мин в 5:00\nБ25 - 2 мин в 5:00\n\n \nГОЛ в 6:00", "refs": [{"num": "16.2", "doc": null, "key": null}], "media": []}, {"id": 4362, "active": true, "numRule": "85.5", "text": "Атакующий игрок, находясь в нейтральной зоне на половине поля соперника, бросает шайбу в направлении ворот соперника. Шайба попадает в защитную сетку за воротами непосредственно после броска.\nГде проводить вбрасывание?", "refs": [{"num": "85.5", "doc": null, "key": null}], "media": []}, {"id": 4365, "active": true, "numRule": "80.2", "text": "Игрок касается шайбы высоко поднятой клюшкой в зоне атаки, и шайба летит в его зону защиты где Вратарь ее останавливает. \nГде будет проводиться следующее вбрасывание ?", "refs": [{"num": "80.2", "doc": null, "key": null}], "media": []}, {"id": 4366, "active": true, "numRule": "80.2", "text": "Во втором периоде, игрок касается шайбы высоко поднятой клюшкой в зоне атаки, и шайба улетает на скамейку игроков соперника.\nГде будет проводиться следующее вбрасывание ?", "refs": [{"num": "80.2", "doc": null, "key": null}], "media": []}, {"id": 4367, "active": true, "numRule": "57.2", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который выставляет или использует колено для удара соперника в колено или бедро? \nКакая трактовка штрафа?", "refs": [{"num": "57.2", "doc": null, "key": null}], "media": []}, {"id": 4368, "active": true, "numRule": "57.3", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который безответственно подвергает опасности соперника с возможным нанесением травмы, нанося ему удар коленом?\nКакая трактовка штрафа?", "refs": [{"num": "57.3", "doc": null, "key": null}], "media": []}, {"id": 4369, "active": true, "numRule": "57.2", "text": "В овертайме атакующий игрок, обыграв в средней зоне двух соперников, выходит один на один против защитника. При попытке обыгрыша защитник выставляет колено, чтобы помешать нападающему выполнить маневр, и сбивает его с ног.\nПо какому правилу нужно удалить защитника?", "refs": [{"num": "57.2", "doc": null, "key": null}], "media": []}, {"id": 4371, "active": true, "numRule": "57.6", "text": "В ситуации выхода «один на один» вратарь первоначально выбивает шайбу клюшкой, после чего совершает подножку заставляя соперника упасть на лед. \nВаши действия?", "refs": [{"num": "57.6", "doc": null, "key": null}], "media": []}, {"id": 4372, "active": true, "numRule": "53.8", "text": "Игрок на льду бросает свою клюшку в направлении соперника, выходящего один на один с вратарем и промахивается.\nВаши действия?", "refs": [{"num": "53.8", "doc": null, "key": null}], "media": []}, {"id": 4373, "active": true, "numRule": "39.5.3", "text": "Какой штраф должен быть наложен на официального представителя команды за контакт с Судьей в бригаде?", "refs": [{"num": "39.5", "doc": null, "key": null}], "media": []}, {"id": 4376, "active": true, "numRule": "19.4", "text": "Штрафы каких игроков будут на табло в дополнительном периоде, если он проводится в формате 5 на 5?\n\n \nКоманда «А» \n Команда «Б»\n\n  Б35 – 5 мин в  55:00\n\nА4 – 2 мин в  58:00", "refs": [{"num": "19.4", "doc": null, "key": null}], "media": []}, {"id": 4377, "active": true, "numRule": "69", "text": "Какие критерии учитываются для определения \"Существенного Контакта\" между атакующим игроком и Вратарем?", "refs": [{"num": "69", "doc": null, "key": null}], "media": []}, {"id": 4380, "active": true, "numRule": "63.2", "text": "Может ли запасной Вратарь со скамейки игроков высунуть ловушку за борт и поймать летящую вдоль борта шайбу?", "refs": [{"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 4383, "active": true, "numRule": "57.6", "text": "Ваши действия, если во время выхода один на один защищающийся игрок сзади дважды делает сопернику подножку?", "refs": [{"num": "57.6", "doc": null, "key": null}], "media": []}, {"id": 4384, "active": true, "numRule": "24.6", "text": "Ваши действия, если во время выхода один на один защищающийся игрок сзади сначала совершает задержку клюшкой после делает подножку?", "refs": [{"num": "24.6", "doc": null, "key": null}], "media": []}, {"id": 4385, "active": true, "numRule": "24.6", "text": "В одной остановке матча происходят две игровые ситуации с участием команды Б:\nИгрок команды Б нарушает правила против игрока команды А, выходящего один на один с вратарём, совершая подножку. В том же игровом эпизоде, до того как игра будет остановлена, шайба оказывается в площади ворот команды Б. Вратарь команды Б намеренно бросает свою клюшку в шайбу, предотвращая взятие ворот.\nКакое решение Главного судьи?", "refs": [{"num": "24.6", "doc": null, "key": null}], "media": []}, {"id": 4386, "active": true, "numRule": "24.6", "text": "Может ли быть назначено два Штрафных броска в пользу одной команды и в одну остановку матча?", "refs": [{"num": "24.6", "doc": null, "key": null}], "media": []}, {"id": 4387, "active": true, "numRule": "67.3", "text": "Как вы поступите, если вратарь выбросил шайбу вперед по направлению ворот соперника, шайба вышла в среднюю зону, и первым играет в шайбу его партнёр?", "refs": [{"num": "67.3", "doc": null, "key": null}], "media": []}, {"id": 4388, "active": true, "numRule": "67.3", "text": "Как вы поступите, если вратарь выбросил шайбу вперед по направлению ворот соперника, шайба вышла в среднюю зону, и первым играет в шайбу его партнёр?", "refs": [{"num": "67.3", "doc": null, "key": null}], "media": []}, {"id": 4389, "active": true, "numRule": "67.3", "text": "Как вы поступите, если вратарь выбросил шайбу вперед по направлению ворот соперника, шайба вышла в среднюю зону, и первым играет в шайбу соперник?", "refs": [{"num": "67.3", "doc": null, "key": null}], "media": []}, {"id": 4390, "active": true, "numRule": "19.1", "text": "В каких составах будут играть команды в 3:30?\nКоманда «А»  \nКоманда «Б»\n\nA6 - 2 мин. в 3:00\nБ7 - 2 + 2 мин. в 3:00\n\n Б7 - 2 мин. в 3:30 \n(находясь на скамейке для оштрафованных)", "refs": [{"num": "19.1", "doc": null, "key": null}], "media": []}, {"id": 4391, "active": true, "numRule": "9.2", "text": "Какой вид штрафа предусмотрен для хоккеиста, который после предупреждения продолжает играть с длинными волосами, закрывающими номер на спине свитера?", "refs": [{"num": "9.2", "doc": null, "key": null}], "media": []}, {"id": 4392, "active": true, "numRule": "20.4", "text": "Если хоккеист оштрафован вторым Дисциплинарным штрафом в одном и том же матче.\nКакой штраф необходимо наложить?", "refs": [{"num": "20.4", "doc": null, "key": null}], "media": []}, {"id": 4393, "active": true, "numRule": "20.4", "text": "Если хоккеист оштрафован вторым Большим штрафом в одном и том же матче.\nКакой штраф необходимо наложить?", "refs": [{"num": "20.4", "doc": null, "key": null}], "media": []}, {"id": 4394, "active": true, "numRule": "10.1", "text": "Максимально разрешенный загиб крюка клюшки игрока?", "refs": [{"num": "10.1", "doc": null, "key": null}], "media": []}, {"id": 4395, "active": true, "numRule": "10.2", "text": "Максимально разрешенный загиб крюка клюшки вратаря?", "refs": [{"num": "10.2", "doc": null, "key": null}], "media": []}, {"id": 4396, "active": true, "numRule": "79.2", "text": "Игрок из своей зоны защиты намеренно направляет шайбу рукой, а партнер принимает шайбу клюшкой в нейтральной зоне хотя его коньки находятся в зоне защиты?", "refs": [{"num": "79.2", "doc": null, "key": null}], "media": []}, {"id": 4397, "active": true, "numRule": "5.4", "text": "С каким минимальным количеством представителей команды, команда может начать матч?", "refs": [{"num": "5.4", "doc": null, "key": null}], "media": []}, {"id": 4398, "active": true, "numRule": "5.4", "text": "Что происходит, если у команды отсутствует собственный медицинский работник во время матча?", "refs": [{"num": "5.4", "doc": null, "key": null}], "media": []}, {"id": 4399, "active": true, "numRule": "49.2", "text": "Можно ли засчитать гол, если шайба отскочила от конька атакующего игрока, который находится в процессе остановки?", "refs": [{"num": "49.2", "doc": null, "key": null}], "media": []}, {"id": 4400, "active": true, "numRule": "49.2", "text": "Можно ли засчитать гол, если шайба отскочила от тела атакующего игрока, который находится в процессе остановки?", "refs": [{"num": "49.2", "doc": null, "key": null}], "media": []}, {"id": 4401, "active": true, "numRule": "49.2", "text": "На пятаке происходит столкновение, в результате которого у атакующего игрока слетает шлем. Шайба оказывается внутри этого шлема. Другой нападающий ударом конька забивает шлем вместе с шайбой в ворота. \nКак квалифицировать этот эпизод главному арбитру?", "refs": [{"num": "49.2", "doc": null, "key": null}], "media": []}, {"id": 4402, "active": true, "numRule": "10.7", "text": "В серии послематчевых бросков, определяющих победителя матча, команда «А» требует проверить клюшку вратаря команды «Б» до свистка судьи. Вратарь отказывается предоставить клюшку для измерения. \nКакое решение обязан принять главный судья?", "refs": [{"num": "10.7", "doc": null, "key": null}], "media": []}, {"id": 4403, "active": true, "numRule": "10.7", "text": "В серии бросков, определяющих победителя матча, команда «Б» подаёт запрос на измерение клюшки игрока команды «А» перед его попыткой. Игрок команды «А» отказывается передать клюшку судье для измерения. \nКаковы должны быть действия судьи?", "refs": [{"num": "10.7", "doc": null, "key": null}], "media": []}, {"id": 4404, "active": true, "numRule": "202.1", "text": "Каким образом должна быть сконструирована маска вратаря в категории «до 21 года» ?", "refs": [{"num": "202.1", "doc": null, "key": null}], "media": []}, {"id": 4405, "active": true, "numRule": "81.1", "text": "Где будет проводиться следующее вбрасывание, если шайба брошена атакующим хоккеистом из зоны защиты. Шайба пересекает лицевую линию и попадает в сетку ворот, после чего выходит из игры?", "refs": [{"num": "81.1", "doc": null, "key": null}], "media": []}, {"id": 4406, "active": true, "numRule": "85.5", "text": "Игрок бросает шайбу в зону атаки по закруглению, находясь на половине поля соперника, у центральной красной линии.  Шайба попадает в стекло в зоне атаки и выходит из игры.\nГде будет вбрасывание?", "refs": [{"num": "85.5", "doc": null, "key": null}], "media": []}, {"id": 4407, "active": true, "numRule": "63.6", "text": "Хоккеист в дополнительном периоде намеренно сдвигает свои ворота, при этом шайба не находится в его зоне защиты (его команда атакует соперника). Ваши действия?", "refs": [{"num": "63.6", "doc": null, "key": null}], "media": []}, {"id": 4408, "active": true, "numRule": "63.6", "text": "Хоккеист намеренно сдвигает свои ворота с нормального положения в течение последних двух минут основного времени матча, при этом шайба не находится в его зоне защиты (его команда атакует соперника). Ваши действия?", "refs": [{"num": "63.6", "doc": null, "key": null}], "media": []}, {"id": 4409, "active": true, "numRule": "63.6", "text": "Вратарь намеренно сдвигает каркас своих ворот в последние две минуты основного времени матча, при этом шайба находится в зоне защиты соперника. Ваши действия?", "refs": [{"num": "63.6", "doc": null, "key": null}], "media": []}, {"id": 4410, "active": true, "numRule": "63.6", "text": "Вратарь сдвигает каркас своих ворот в дополнительном периоде, при этом шайба находится в зоне защиты соперника. Ваши действия?", "refs": [{"num": "63.6", "doc": null, "key": null}], "media": []}, {"id": 4411, "active": true, "numRule": "63.2", "text": "Хоккеист намеренно сдвигает свои ворота с нормального положения, кроме последних двух минут и дополнительного времени матча.", "refs": [{"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 4412, "active": true, "numRule": "63.2", "text": "Атакующий игрок намеренно сдвигает ворота соперника в течение последних двух минут основного времени матча. Ваши действия?", "refs": [{"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 4413, "active": true, "numRule": "63.6", "text": "Вратарь намеренно сдвигает каркас своих ворот с их нормального положения в последние 2 минуты матча или дополнительном периоде. Ваши действия?", "refs": [{"num": "63.6", "doc": null, "key": null}], "media": []}, {"id": 4414, "active": true, "numRule": "53.8", "text": "Хоккеист на льду бросает клюшку в шайбу в своей зоне защиты.\nВаши действия?", "refs": [{"num": "53.8", "doc": null, "key": null}], "media": []}, {"id": 4415, "active": true, "numRule": "69.2.", "text": "Вратарь владеет шайбой позади своих ворот, а атакующий игрок осуществляет преднамеренный существенный контакт и завладевает шайбой. \nВаши действия?", "refs": [{"num": "69.2", "doc": null, "key": null}], "media": []}, {"id": 4416, "active": true, "numRule": "85.1", "text": "Игрок команды А, находясь в своей зоне защиты, выбрасывает шайбу, и она попадает в игрока команды Б, перегнувшегося через борт со скамейки игроков. \nГде судья должен назначить вбрасывание?", "refs": [{"num": "85.1", "doc": null, "key": null}], "media": []}, {"id": 4417, "active": true, "numRule": "85.1", "text": "Игрок команды А, находясь в зоне атаки, отдаёт пас своему защитнику. В этот момент соперник (игрок команды Б) пытается перехватить шайбу и подставляет клюшку. Шайба отскакивает от клюшки, выходит из зоны атаки и попадает в игрока команды Б, перегнувшегося через борт со скамейки игроков. \nГде судья должен назначить вбрасывание?", "refs": [{"num": "85.1", "doc": null, "key": null}], "media": []}, {"id": 4418, "active": true, "numRule": "85.1", "text": "Игрок команды А, находясь в зоне атаки, отдаёт пас своему защитнику. Защитник не смог принять пас, и шайба отскакивает от него, выходит из зоны атаки и попадает в игрока команды Б, перегнувшегося через борт со скамейки игроков. \nГде судья должен назначить вбрасывание?", "refs": [{"num": "85.1", "doc": null, "key": null}], "media": []}, {"id": 4419, "active": true, "numRule": "27.1", "text": "Вратарь вовлечен в наложении совпадающих штрафов, и в результате, его команде придется играть в меньшинстве, вследствие дополнительных штрафов, наложенных на вратаря. Кто будет отбывать штраф за вратаря?", "refs": [{"num": "27.1", "doc": null, "key": null}], "media": []}, {"id": 1347, "active": true, "numRule": "85.5", "text": "Если атакующий хоккеист, находясь в средней зоне на своей половине площадки до центральной красной линии, бросает шайбу в зону атак. Шайба влетает в зону атаки, и не долетая до лицевой линии отскакивает от борта или защитного стекла и выходит из игры, игра останавливается.\nГде будет вбрасывание?", "refs": [{"num": "85.5", "doc": null, "key": null}], "media": []}, {"id": 1349, "active": true, "numRule": "85.5", "text": "Шайба, брошенная атакующим игроком, из зоны атаки попадает в защитную сетку за воротами непосредственно после броска.\nГде будет вбрасывание?", "refs": [{"num": "85.5", "doc": null, "key": null}], "media": []}, {"id": 1350, "active": true, "numRule": "85.5", "text": "Шайба, брошенная атакующим игроком в зоне атаки, попадает в защитную сетку за воротами, срикошетив от соперника.\nГде будет вбрасывание?", "refs": [{"num": "85.5", "doc": null, "key": null}], "media": []}, {"id": 1351, "active": true, "numRule": "85.1", "text": "Шайба, брошенная атакующим хоккеистом, из нейтральной зоны попадает в защитную сетку за воротами, срикошетив в нейтральной зоне от соперника.\nГде будет вбрасывание?", "refs": [{"num": "85.1", "doc": null, "key": null}], "media": []}, {"id": 1352, "active": true, "numRule": "85.1", "text": "Шайба, брошенная атакующим хоккеистом из нейтральной зоны, после рикошета от соперника в его зоне защиты, попадает в защитную сетку за воротами.\nГде будет вбрасывание?", "refs": [{"num": "85.1", "doc": null, "key": null}], "media": []}, {"id": 1353, "active": true, "numRule": "81.5", "text": "Хоккеист бросил шайбу со своей половины поля, до центральной красной линии. Шайба срикошетила от хоккеиста защищающейся команды в его зоне защиты и упала на сетку ворот.\nГде будет вбрасывание?", "refs": [{"num": "81.5", "doc": null, "key": null}], "media": []}, {"id": 1354, "active": true, "numRule": "19", "text": "Сколько игроков на обеих скамейках оштрафованных в 3:30?\n \nКоманда «А»       \n   Команда «Б»\n\nA6 –  2 мин. в 3:00   \nБ7 –  2 + 2 мин. в 3:00\n\n \nБ7 –  2 мин. в 3:30 (находясь на скамейке для оштрафованных)", "refs": [{"num": "19", "doc": null, "key": null}], "media": []}, {"id": 1355, "active": true, "numRule": "83.1", "text": "Оба конька атакующего игрока находятся полностью в зоне атаки, в то время, когда соперник, владеющей шайбой в нейтральной зоне, пасует шайбу обратно в зону своей защиты, в которой все еще находится атакующий игрок.", "refs": [{"num": "83.1", "doc": null, "key": null}], "media": []}, {"id": 1356, "active": true, "numRule": "67.4", "text": "Какое решение должен принять Главный судья, по отношению к  игроку, который поднимает шайбу руками со льда в своей площади ворот?", "refs": [{"num": "67.4", "doc": null, "key": null}], "media": []}, {"id": 1357, "active": true, "numRule": "83.3", "text": "Игрок защищающейся команды выбрасывает шайбу из зоны защиты и в нейтральной зоне шайба отскакивает от соперника обратно в зону защиты, в то время, когда другой атакующий игрок все еще находится в зоне атаки.\nВаши действия?", "refs": [{"num": "83.3", "doc": null, "key": null}], "media": []}, {"id": 1358, "active": true, "numRule": "83.2", "text": "Игрок защищающейся команды выбрасывает шайбу из зоны защиты и в нейтральной зоне шайба отскакивает от  партнера по команде, не находящегося под давлением соперника, обратно в зону защиты, в то время, когда атакующий игрок все еще находится в зоне атаки. Ваши действия?", "refs": [{"num": "83.2", "doc": null, "key": null}], "media": []}, {"id": 1359, "active": true, "numRule": "83.2", "text": "Игрок защищающейся команды выбрасывает шайбу из зоны защиты и в нейтральной зоне шайба отскакивает от соперника обратно в зону защиты и попадает в атакующего игрока.\nВаши действия?", "refs": [{"num": "83.2", "doc": null, "key": null}], "media": []}, {"id": 1360, "active": true, "numRule": "83.2", "text": "Игрок защищающейся команды выбрасывает шайбу из зоны защиты и в нейтральной зоне шайба отскакивает от  партнера по команде, не находящегося под давлением соперника, обратно в зону защиты и попадает в соперника. Ваши действия?", "refs": [{"num": "83.2", "doc": null, "key": null}], "media": []}, {"id": 1361, "active": true, "numRule": "8.1", "text": "Травмированный игрок в зоне атаки. Где будет проводиться вбрасывание, если его команда владеет шайбой в нейтральной зоне?", "refs": [{"num": "8.1", "doc": null, "key": null}], "media": []}, {"id": 1362, "active": true, "numRule": "8.1", "text": "Травмированный  игрок в зоне атаки. Где будет проводиться вбрасывание, если его команда владеет шайбой в этой же зоне?", "refs": [{"num": "8.1", "doc": null, "key": null}], "media": []}, {"id": 1363, "active": true, "numRule": "8.1", "text": "Травмированный игрок в зоне атаки. Где будет проводиться вбрасывание, если его команда владеет шайбой в зоне защиты?", "refs": [{"num": "8.1", "doc": null, "key": null}], "media": []}, {"id": 1364, "active": true, "numRule": "15.2", "text": "Если команда, нарушившая правила, не контролирует шайбу, Главный судья поднимает руку, показывая намерение наложить штраф. Когда он сможет остановить матч и наложить штраф?", "refs": [{"num": "15.2", "doc": null, "key": null}], "media": []}, {"id": 1365, "active": true, "numRule": "15.1", "text": "Если команда, нарушившая правила, не контролирует шайбу, Главный судья поднимает руку, показывая намерение наложить штраф. Когда он сможет остановить матч и наложить штраф?", "refs": [{"num": "15.1", "doc": null, "key": null}], "media": []}, {"id": 1366, "active": true, "numRule": "15.2", "text": "Если команда, нарушившая правила, не контролирует шайбу, Главный судья поднимает руку, показывая намерение наложить штраф. Когда он сможет остановить матч и наложить штраф?", "refs": [{"num": "15.2", "doc": null, "key": null}], "media": []}, {"id": 1367, "active": true, "numRule": "15.2", "text": "Если команда, нарушившая правила, не контролирует шайбу, Главный судья поднимает руку, показывая намерение наложить штраф. Когда он сможет остановить матч и наложить штраф?", "refs": [{"num": "15.2", "doc": null, "key": null}], "media": []}, {"id": 1368, "active": true, "numRule": "64.2", "text": "Главный судья фиксирует нарушение правил Задержка клюшкой, а не нарушивший правила игрок приукрашивает нарушение падая на лед, показывая тем самым судье, что против него нарушены правила.\nВаши действия по отношению к обоим хоккеистам?", "refs": [{"num": "64.2", "doc": null, "key": null}], "media": []}, {"id": 1369, "active": true, "numRule": "61.1, 61.5", "text": "Какие штрафы могут быть наложены на хоккеиста, который поднимает клюшку, расположенную между ног соперника и ударяет хоккеиста в область паха?", "refs": [{"num": "61.1", "doc": null, "key": null}, {"num": "61.5", "doc": null, "key": null}], "media": []}, {"id": 1372, "active": true, "numRule": "5.2", "text": "Команда забрасывает шайбу в ворота соперника, но один из хоккеистов этой команды, находящийся на льду, не заявлен на матч. \nВаши действия?", "refs": [{"num": "5.2", "doc": null, "key": null}], "media": []}, {"id": 1373, "active": true, "numRule": "83.6", "text": "Атакующий хоккеист, находящийся вне зоны атаки, вбрасывает шайбу в зону атаки, когда его партнер оказался раньше шайбы в зоне атаки, и шайба попадает в защиную сетку за воротами.\nГде будет вбрасывание?", "refs": [{"num": "83.6", "doc": null, "key": null}], "media": []}, {"id": 1374, "active": true, "numRule": "80.3", "text": "Шайба касается клюшки атакующего игрока, расположенной выше перекладины ворот, отскакивает от судьи, касается тела защищающегося игрока и заходит в ворота. \nВаши действия?", "refs": [{"num": "80.3", "doc": null, "key": null}], "media": []}, {"id": 1376, "active": true, "numRule": "80.3", "text": "Шайба касается клюшки атакующего игрока, расположенной выше перекладины ворот, а затем отскакивает от вратаря в ворота. \nВаши действия?", "refs": [{"num": "80.3", "doc": null, "key": null}], "media": []}, {"id": 1377, "active": true, "numRule": "80.3", "text": "Шайба касается клюшки атакующего игрока, расположенной выше перекладины ворот, а затем отскакивает от судьи в ворота. \nВаши действия?", "refs": [{"num": "80.3", "doc": null, "key": null}], "media": []}, {"id": 1378, "active": true, "numRule": "81.4", "text": "2. В каких ситуациях команде, совершившей проброс, разрешена замена игроков?", "refs": [{"num": "81.4", "doc": null, "key": null}], "media": []}, {"id": 1379, "active": true, "numRule": "81.4", "text": "3. В каких ситуациях команде, совершившей проброс, разрешена замена игроков?", "refs": [{"num": "81.4", "doc": null, "key": null}], "media": []}, {"id": 1380, "active": true, "numRule": "81.4", "text": "1. В каких ситуациях команде, совершившей проброс, разрешена замена игроков?", "refs": [{"num": "81.4", "doc": null, "key": null}], "media": []}, {"id": 1383, "active": true, "numRule": "24.4", "text": "Вратарь сдвигает ворота с их установленного положения во время выполнения штрафного броска.\nВаши действия?", "refs": [{"num": "24.4", "doc": null, "key": null}], "media": []}, {"id": 1384, "active": true, "numRule": "85.2", "text": "Шайба попала на внешнюю часть сетки  (на основание позади рамы ворот либо сверху на ворота). Защищающийся игрок пытается сбить шайбу с сетки ворот.\nВаши действия?", "refs": [{"num": "85.2", "doc": null, "key": null}], "media": []}, {"id": 1385, "active": true, "numRule": "85.2", "text": "Шайба попала на внешнюю поверхность сетки ворот (на основание позади рамы ворот либо на верхнюю часть ворот). Атакующий игрок пытается сбить шайбу с внешней части сетки ворот.\n\nДействия арбитра?", "refs": [{"num": "85.2", "doc": null, "key": null}], "media": []}, {"id": 1386, "active": true, "numRule": "19.5", "text": "Выберите критерий необходимый для правильного сокращения совпадающих штрафов?", "refs": [{"num": "19.5", "doc": null, "key": null}], "media": []}, {"id": 1387, "active": true, "numRule": "19.5", "text": "2. Выберите критерий необходимый для правильного сокращения совпадающих штрафов?", "refs": [{"num": "19.5", "doc": null, "key": null}], "media": []}, {"id": 1388, "active": true, "numRule": "19.5", "text": "Выберите критерий необходимый для правильного сокращения совпадающих штрафов?", "refs": [{"num": "19.5", "doc": null, "key": null}], "media": []}, {"id": 1389, "active": true, "numRule": "58.3, 58.5", "text": "Какой штраф должен быть наложен Главным судьей на хоккеиста, который безответственно подвергает опасности соперника в результате удара концом клюшки?", "refs": [{"num": "58.3", "doc": null, "key": null}, {"num": "58.5", "doc": null, "key": null}], "media": []}, {"id": 1390, "active": true, "numRule": "42.3", "text": "Какой штраф должен быть наложен Главным судьей на хоккеиста, который безответственно подвергает опасности соперника в результате неправильной атаки?", "refs": [{"num": "42.3", "doc": null, "key": null}], "media": []}, {"id": 1392, "active": true, "numRule": "44.1", "text": "Какой штраф должен быть наложен Главным судьей на игрока, который низко приседает у борта, чтобы избежать применения силового приема, в результате чего соперник совершает кувырок через него и ударяется о борт?", "refs": [{"num": "44.1", "doc": null, "key": null}], "media": []}, {"id": 1393, "active": true, "numRule": "44.3, 44.5", "text": "Какой штраф должен быть наложен Главным судьей на игрока, который безответственно подвергает опасности соперника применяя отсечение, чтобы избежать применения силового приема, в результате чего соперник совершает кувырок через него и ударяется о борт?", "refs": [{"num": "44.3", "doc": null, "key": null}, {"num": "44.5", "doc": null, "key": null}], "media": []}, {"id": 1402, "active": true, "numRule": "63.2", "text": "Хоккеист выбрасывает шайбу, играя высоко поднятой клюшкой из зоны защиты и попадает в табло над игровой площадкой, в результате чего происходит остановка матча.\nВаши действия?", "refs": [{"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 1404, "active": true, "numRule": "63.9", "text": "Шайба, брошена защищающимся хоккеистом из зоны защиты и попадает в защитную сетку за воротами в противоположном конце площадки. \nВаши действия?", "refs": [{"num": "63.9", "doc": null, "key": null}], "media": []}, {"id": 1405, "active": true, "numRule": "24.2", "text": "Когда штрафной бросок считается выполненным?", "refs": [{"num": "24.2", "doc": null, "key": null}], "media": []}, {"id": 1406, "active": true, "numRule": "24.2", "text": "Когда штрафной бросок считается выполненным?", "refs": [{"num": "24.2", "doc": null, "key": null}], "media": []}, {"id": 1407, "active": true, "numRule": "24.2", "text": "Когда штрафной бросок считается выполненным?", "refs": [{"num": "24.2", "doc": null, "key": null}], "media": []}, {"id": 1408, "active": true, "numRule": "24.2", "text": "Когда штрафной бросок считается выполненным?", "refs": [{"num": "24.2", "doc": null, "key": null}], "media": []}, {"id": 1409, "active": true, "numRule": "24.2", "text": "Когда штрафной бросок считается выполненным?", "refs": [{"num": "24.2", "doc": null, "key": null}], "media": []}, {"id": 1410, "active": true, "numRule": "24.3", "text": "Кто может выполнить штрафной бросок, если игрок, против которого были нарушены правила, травмирован?", "refs": [{"num": "24.3", "doc": null, "key": null}], "media": []}, {"id": 1411, "active": true, "numRule": "5.3, 24.2", "text": "Имеет ли право  игрок выполнять функции вратаря при выполнении Штрафного броска?", "refs": [{"num": "5.3", "doc": null, "key": null}, {"num": "24.2", "doc": null, "key": null}], "media": []}, {"id": 1414, "active": true, "numRule": "45.2", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который нанес сопернику удар локтем?", "refs": [{"num": "45.2", "doc": null, "key": null}], "media": []}, {"id": 1417, "active": true, "numRule": "60.3", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который случайно наносит повреждение (в виде появления крови, ссадины) сопернику высоко поднятой клюшкой?", "refs": [{"num": "60.3", "doc": null, "key": null}], "media": []}, {"id": 1418, "active": true, "numRule": "10.5", "text": "После измерения клюшка оказалась правильных размеров. \nВаши действия?", "refs": [{"num": "10.5", "doc": null, "key": null}], "media": []}, {"id": 1419, "active": true, "numRule": "10.5", "text": "После измерения клюшка признана нестандартной. \nКто будет отбывать штраф?", "refs": [{"num": "10.5", "doc": null, "key": null}], "media": []}, {"id": 1421, "active": true, "numRule": "8.1, 75.1", "text": "Хоккеист отказывается покинуть лед для оказания ему медицинской помощи. \nВаши действия?", "refs": [{"num": "8.1", "doc": null, "key": null}, {"num": "75.1", "doc": null, "key": null}], "media": []}, {"id": 1422, "active": true, "numRule": "8.1, 75.4", "text": "Хоккеист отказывается покинуть лед для оказания медицинской помощи после наложения на него Малого штрафа. \nВаши действия?", "refs": [{"num": "8.1", "doc": null, "key": null}, {"num": "75.4", "doc": null, "key": null}], "media": []}, {"id": 1423, "active": true, "numRule": "8.3, 63.2", "text": "Хоккеист возвращается на лед в испачканной в крови экипировке.\nВаши действия?", "refs": [{"num": "8.3", "doc": null, "key": null}, {"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 1424, "active": true, "numRule": "56.2", "text": "Во время матча, хоккеист со скамейки игроков играет в шайбу, проходящую рядом с бортом.\nВаши действия?", "refs": [{"num": "56.2", "doc": null, "key": null}], "media": []}, {"id": 1425, "active": true, "numRule": "56.2", "text": "Во время матча, игрок со скамейки оштрафованных играет в шайбу, проходящую рядом с бортом.\nВаши действия?", "refs": [{"num": "56.2", "doc": null, "key": null}], "media": []}, {"id": 1426, "active": true, "numRule": "69.1", "text": "Атакующий игрок, владеющий шайбой, движется лицом вперед и совершает контакт с вратарем, который находится в площади своих ворот, а шайба при этом заходит в ворота.\nВаши действия?", "refs": [{"num": "69.1", "doc": null, "key": null}], "media": []}, {"id": 1427, "active": true, "numRule": "69.2", "text": "Атакующий игрок, владеющий шайбой, движется спиной вперед и совершает контакт с вратарем, который находится в площади своих ворот, а шайба при этом заходит в ворота\nВаши действия?", "refs": [{"num": "69.2", "doc": null, "key": null}], "media": []}, {"id": 1428, "active": true, "numRule": "69.1", "text": "Атакующий игрок, во время выполнения штрафного броска, двигается спиной вперед  с шайбой и совершает контакт с вратарем, который находится в площади своих ворот, а шайба при этом заходит в ворота.\nВаши действия?", "refs": [{"num": "69.1", "doc": null, "key": null}], "media": []}, {"id": 1429, "active": true, "numRule": "69.1", "text": "Атакующий игрок, во время выполнения штрафного броска, двигается лицом вперед с шайбой и совершает контакт с вратарем, находящимся в площади своих ворот, а шайба при этом заходит в ворота.\nВаши действия?", "refs": [{"num": "69.1", "doc": null, "key": null}], "media": []}, {"id": 1430, "active": true, "numRule": "69.1", "text": "Атакующий игрок, во время выполнения бросков, определяющих победителя матча, двигается лицом вперед с шайбой и контактирует с вратарем, находящимся в площади своих ворот, а шайба при этом заходит в ворота.\nВаши действия?", "refs": [{"num": "69.1", "doc": null, "key": null}], "media": []}, {"id": 1431, "active": true, "numRule": "69.2", "text": "Атакующий игрок, во время выполнения бросков, определяющих победителя матча, двигается спиной вперед с шайбой и контактирует с вратарем, находящимся в площади своих ворот, а шайба при этом заходит в ворота.\nВаши действия?", "refs": [{"num": "69.2", "doc": null, "key": null}], "media": []}, {"id": 1433, "active": true, "numRule": "57.3, 57.5", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который безответственно подвергает опасности соперника, применив подножку?", "refs": [{"num": "57.3", "doc": null, "key": null}, {"num": "57.5", "doc": null, "key": null}], "media": []}, {"id": 1434, "active": true, "numRule": "75.4", "text": "Несмотря на предупреждения, хоккеист продолжает провоцировать соперника на ответные действия.\nКакой штраф наложить на провокатора?", "refs": [{"num": "75.4", "doc": null, "key": null}], "media": []}, {"id": 1436, "active": true, "numRule": "24.8", "text": "Игрок, выходящий \"один на один\", сохраняет контроль над шайбой после совершения против него нарушения правил сзади.\nВаши действия?", "refs": [{"num": "24.8", "doc": null, "key": null}], "media": []}, {"id": 1437, "active": true, "numRule": "24.6", "text": "Игрок команды «А», в положении «выхода один на один», атакован сзади игроком команды «Б» с нарушением правил, за которое полагается наложение Малого плюс Дисциплинарного штрафа.\nВаши действия?", "refs": [{"num": "24.6", "doc": null, "key": null}], "media": []}, {"id": 1440, "active": true, "numRule": "24.2", "text": "При выполнении штрафного броска шайба попадает в заградительное стекло позади вратаря, отскакивает обратно, попадает в спину вратаря и заходит в ворота. \nВаши действия?", "refs": [{"num": "24.2", "doc": null, "key": null}], "media": []}, {"id": 1441, "active": true, "numRule": "24.2", "text": "Игрок, выполняющий штрафной бросок, совершает бросок шайбы. Шайба отскакивает от вратаря в игрока, выполняющего бросок, и заходит в ворота. \nВаши действия?", "refs": [{"num": "24.2", "doc": null, "key": null}], "media": []}, {"id": 1442, "active": true, "numRule": "24.2", "text": "Игрок, выполняющий штрафной бросок, совершает бросок шайбы и она попадает в штангу ворот, затем отскакивает от вратаря и заходит в ворота.\nВаши действия?", "refs": [{"num": "24.2", "doc": null, "key": null}], "media": []}, {"id": 1443, "active": true, "numRule": "61.1, 56.2", "text": "Атакующий игрок выбил клюшку из рук вратаря.\nВаши действия?", "refs": [{"num": "61.1", "doc": null, "key": null}, {"num": "56.2", "doc": null, "key": null}], "media": []}, {"id": 1444, "active": true, "numRule": "9.6", "text": "Шайба попадает в маску вратаря и, срикошетив от нее, заходит в ворота.\nВаши действия?", "refs": [{"num": "9.6", "doc": null, "key": null}], "media": []}, {"id": 1445, "active": true, "numRule": "71.1", "text": "Остановка матча связана с преждевременной заменой вратаря на игрока. Шайба находится за центральной красной линией, на половине поля соперника. \nГде будет вбрасывание?", "refs": [{"num": "71.1", "doc": null, "key": null}], "media": []}, {"id": 1446, "active": true, "numRule": "71.1", "text": "Остановка матча связана с преждевременной заменой вратаря на игрока. Шайба находится в зоне атаки команды, нарушившей правила. \nГде будет вбрасывание?", "refs": [{"num": "71.1", "doc": null, "key": null}], "media": []}, {"id": 1447, "active": true, "numRule": "71.1", "text": "Остановка матча связана с преждевременной заменой вратаря на игрока. Шайба находится до центральной красной линии, на половине поля команды нарушившей правила замены игроков. \nГде будет вбрасывание?", "refs": [{"num": "71.1", "doc": null, "key": null}], "media": []}, {"id": 1449, "active": true, "numRule": "27.1", "text": "Может ли игрок отбывать штраф за вратаря, если на него тоже будет наложен штраф в эту же остановку матча?", "refs": [{"num": "27.1", "doc": null, "key": null}], "media": []}, {"id": 1450, "active": true, "numRule": "10.5", "text": "Команда «А» играет 3 на 5. Во время остановки на последней минуте матча капитан команды «А» просит Главного судью измерить клюшку игрока команды «Б». Размер клюшки оказывается правильным. \nВаши действия?", "refs": [{"num": "10.5", "doc": null, "key": null}], "media": []}, {"id": 1451, "active": true, "numRule": "79.2", "text": "Игрок команды «А» пытается остановить шайбу рукой в нейтральной зоне и шайба отскакивает к партнеру, находящимуся в зоне защиты команды «А»\nВаши действия?", "refs": [{"num": "79.2", "doc": null, "key": null}], "media": []}, {"id": 1452, "active": true, "numRule": "94", "text": "Дверь, калитки при оштрафованных игроках заклинило. Штрафное время игрока закончилось и он не может выйти на площадку, когда его команда в численном меньшинстве пропускает шайбу. \nВаши действия?", "refs": [{"num": "94", "doc": null, "key": null}], "media": []}, {"id": 1453, "active": true, "numRule": "37.4", "text": "Шайба отскакивает от конька атакующего игрока и заходит в ворота. \nВаши действия?", "refs": [{"num": "37.4", "doc": null, "key": null}], "media": []}, {"id": 1454, "active": true, "numRule": "68.5", "text": "Игрок преждевременно покинул скамейку штрафников по своей ошибке и успел смениться в тот момент, когда его команда забрасывает шайбу в ворота. \nВаши действия?", "refs": [{"num": "68.5", "doc": null, "key": null}], "media": []}, {"id": 1455, "active": true, "numRule": "65.8", "text": "Игрок преждевременно покинул скамейку штрафников по своей ошибке и находится на льду в тот момент, когда его команда забрасывает шайбу в ворота. \nВаши действия?", "refs": [{"num": "65.8", "doc": null, "key": null}], "media": []}, {"id": 1456, "active": true, "numRule": "78.5", "text": "Шайба находится под контролем защищающегося хоккеиста, которого атакующий игрок направляет вместе с шайбой в ворота, применяя силовой прием. \nВаши действия?", "refs": [{"num": "78.5", "doc": null, "key": null}], "media": []}, {"id": 1457, "active": true, "numRule": "15.3", "text": "В ситуации выхода «один на один» должен быть наложен Большой штраф плюс Дисциплинарный штраф до конца матча и назначен штрафной бросок. Что делать с Большим штрафом, если штрафной бросок реализован?", "refs": [{"num": "15.3", "doc": null, "key": null}], "media": []}, {"id": 1458, "active": true, "numRule": "39.5.3", "text": "Какой штраф должен быть наложен на хоккеиста, который замахнулся клюшкой на Судью?", "refs": [{"num": "39.5", "doc": null, "key": null}], "media": []}, {"id": 1459, "active": true, "numRule": "32.4", "text": "После взятия ворот, линейный судья сообщает Главному судье, что на команду забросившую шайбу, должен быть наложен Большой и Дисциплинарный штраф до конца матча. \nВаши действия?", "refs": [{"num": "32.4", "doc": null, "key": null}], "media": []}, {"id": 1460, "active": true, "numRule": "39.2.7", "text": "После наложения штрафа хоккеист отказывается пройти на скамейку штрафников. \nВаши действия?", "refs": [{"num": "39.2", "doc": null, "key": null}], "media": []}, {"id": 1461, "active": true, "numRule": "39.5.3", "text": "Какой штраф должен быть наложен на хоккеиста, который намеренно толкнул Судью на льду?", "refs": [{"num": "39.5", "doc": null, "key": null}], "media": []}, {"id": 1462, "active": true, "numRule": "39.5.3", "text": "Какой штраф должен быть наложен на официального представителя команды, который совершил контакт с Судьей на льду?", "refs": [{"num": "39.5", "doc": null, "key": null}], "media": []}, {"id": 1463, "active": true, "numRule": "39.5.3", "text": "Какой штраф должен быть наложен на официального представителя команды, который намеренно и безответственно причиняет вред любому Судье на льду?", "refs": [{"num": "39.5", "doc": null, "key": null}], "media": []}, {"id": 1466, "active": true, "numRule": "41.3, 41.4", "text": "Какой штраф должен наложить Главный судья на хоккеиста, который безответственно подвергает опасности жизнь и здоровье соперника с возможным нанесением травмы, за толчок  соперника на борт?", "refs": [{"num": "41.3", "doc": null, "key": null}, {"num": "41.4", "doc": null, "key": null}], "media": []}, {"id": 1467, "active": true, "numRule": "70.3", "text": "Игрок первым покидает скамейку штрафников до истечения его штрафного времени, чтобы спровоцировать конфронтацию.\nВаши действия?", "refs": [{"num": "70.3", "doc": null, "key": null}], "media": []}, {"id": 1468, "active": true, "numRule": "10.3", "text": "Хоккеист сломал свою клюшку и выхватил клюшку у соперника, находящегося на скамейке запасных игроков. \nВаши действия?", "refs": [{"num": "10.3", "doc": null, "key": null}], "media": []}, {"id": 1470, "active": true, "numRule": "75.4.6", "text": "Если хоккеист после предупреждения продолжает использовать персональные аксессуары, которые по мнению Главного судьи, могут представлять потенциальную опасность то:", "refs": [{"num": "75.4", "doc": null, "key": null}], "media": []}, {"id": 1471, "active": true, "numRule": "70.3", "text": "Какой штраф должен быть наложен на хоккеистов одной команды, покидающих скамейку игроков вслед за партнером по команде, который был первым хоккеистом, покинувшим скамейку во время конфликта?", "refs": [{"num": "70.3", "doc": null, "key": null}], "media": []}, {"id": 1472, "active": true, "numRule": "60.4, 60.6", "text": "Хоккеист, безответственно подвергает опасности соперника в связи с игрой высоко поднятой клюшкой. \nВаши действия?", "refs": [{"num": "60.4", "doc": null, "key": null}, {"num": "60.6", "doc": null, "key": null}], "media": []}, {"id": 1473, "active": true, "numRule": "60.1", "text": "Какое решение должен принять Главный судья относительно хоккеиста, который контактирует своей клюшкой с верхней частью тела соперника во время замаха при броске?", "refs": [{"num": "60.1", "doc": null, "key": null}], "media": []}, {"id": 1474, "active": true, "numRule": "60.1", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который совершает контакт с соперником высоко поднятой клюшкой?", "refs": [{"num": "60.1", "doc": null, "key": null}], "media": []}, {"id": 1475, "active": true, "numRule": "55.3, 55.4", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который безответственно подвергает опасности соперника, задерживая его клюшкой?", "refs": [{"num": "55.3", "doc": null, "key": null}, {"num": "55.4", "doc": null, "key": null}], "media": []}, {"id": 1477, "active": true, "numRule": "69.2", "text": "Игрок команды «А», не владеющий шайбой, находится за воротами команды «Б», после чего двигается через площадь ворот и сталкивается с вратарём команды «Б», который выкатился под бросок. \nВаши действия?", "refs": [{"num": "69.2", "doc": null, "key": null}], "media": []}, {"id": 1478, "active": true, "numRule": "69.2", "text": "Какое решение должен принять Главный судья, по отношению к игроку, который располагается вне площади ворот спиной к вратарю соперника и начинает размахивать руками или клюшкой перед лицом вратаря?", "refs": [{"num": "69.2", "doc": null, "key": null}], "media": []}, {"id": 1480, "active": true, "numRule": "57.3", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который наносит опасный удар по ноге соперника сзади и одновременно тянет его рукой или клюшкой назад, тем самым пытаясь сбить его с ног?", "refs": [{"num": "57.3", "doc": null, "key": null}], "media": []}, {"id": 1482, "active": true, "numRule": "23.8, 75.5.6", "text": "Какое решение должен принять Главный судья, по отношению к тренеру или неигровому персоналу, который  плюет в кого-либо на игровой площадке во время матча?", "refs": [{"num": "23.8", "doc": null, "key": null}, {"num": "75.5", "doc": null, "key": null}], "media": []}, {"id": 1483, "active": true, "numRule": "23.8, 75.5.6", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который  плюет в соперника на игровой площадке во время матча?", "refs": [{"num": "23.8", "doc": null, "key": null}, {"num": "75.5", "doc": null, "key": null}], "media": []}, {"id": 1484, "active": true, "numRule": "23.8, 75.5.5", "text": "Какое решение должен принять Главный судья, по отношению к официальному представителю команды, который  плюет в кого-либо на игровой площадке во время матча?", "refs": [{"num": "23.8", "doc": null, "key": null}, {"num": "75.5", "doc": null, "key": null}], "media": []}, {"id": 1485, "active": true, "numRule": "23.8, 75.5.7", "text": "Хоккеист, у которого имеется кровотечение, умышленно вытирает кровь о кого-либо на игровой площадке.\nВаши действия?", "refs": [{"num": "23.8", "doc": null, "key": null}, {"num": "75.5", "doc": null, "key": null}], "media": []}, {"id": 1486, "active": true, "numRule": "23.8, 75.5.6", "text": "Хоккеист, у которого имеется кровотечение, умышленно вытирает кровь о соперника на игровой площадке.\nВаши действия?", "refs": [{"num": "23.8", "doc": null, "key": null}, {"num": "75.5", "doc": null, "key": null}], "media": []}, {"id": 1487, "active": true, "numRule": "53.3", "text": "Врач команды со скамейки игроков бросает шлем в соперника, владеющего шайбой в своей зоне защиты.\nВаши действия?", "refs": [{"num": "53.3", "doc": null, "key": null}], "media": []}, {"id": 1488, "active": true, "numRule": "53.2", "text": "Хоккеист со скамейки игроков направляет потерянную клюшку, лежащую на льду, в шайбу, находящуюся в зоне защиты команды соперника. \nВаши действия?", "refs": [{"num": "53.2", "doc": null, "key": null}], "media": []}, {"id": 1489, "active": true, "numRule": "53.3", "text": "Игрок со скамейки оштрафованных направляет перчатку, лежащую на льду в шайбу, находящуюся в зоне защиты команды соперника. \nВаши действия?", "refs": [{"num": "53.3", "doc": null, "key": null}], "media": []}, {"id": 1490, "active": true, "numRule": "53.2.1", "text": "Игрок на льду бросает клюшку в шайбу, находящуюся в нейтральной зоне.\nВаши действия?", "refs": [{"num": "53.2", "doc": null, "key": null}], "media": []}, {"id": 1491, "active": true, "numRule": "53.8", "text": "Хоккеист на льду бросает перчатку, лежащую на льду, в соперника, выходящего один на один с вратарем.\nВаши действия?", "refs": [{"num": "53.8", "doc": null, "key": null}], "media": []}, {"id": 1492, "active": true, "numRule": "53.9", "text": "Игрок на льду бросает свою клюшку в соперника, выходящего один на один с пустыми воротами. В ситуации когда вратарь покинул игровую площадку.\nВаши действия?", "refs": [{"num": "53.9", "doc": null, "key": null}], "media": []}, {"id": 1496, "active": true, "numRule": "32.4", "text": "Главный судья фиксирует взятие ворот, после этого Линейный судья сообщает Главному, что команда, забросившая шайбу, играла с нарушением численного состава.\nВаши действия?", "refs": [{"num": "32.4", "doc": null, "key": null}], "media": []}, {"id": 1497, "active": true, "numRule": "71.1", "text": "Главный судья фиксирует взятие ворот, после этого Линейный судья сообщает Главному судье, что команда, забросившая шайбу, произвела неправильную замену игроков перед голом.\nВаши действия?", "refs": [{"num": "71.1", "doc": null, "key": null}], "media": []}, {"id": 1498, "active": true, "numRule": "56.8", "text": "Вратарь заменен на игрока. В нейтральной зоне игрок команды соперника владея шайбой, движется к пустым воротам, при этом между ним и воротами нет помех или препятствий. В этот момент замененный вратарь незаконно выходит на лед со скамейки запасных и атакует соперника. \nВаши действия?", "refs": [{"num": "56.8", "doc": null, "key": null}], "media": []}, {"id": 1499, "active": true, "numRule": "57.5.3", "text": "Представитель команды, после окончания матча использует непристойные, грубые или оскорбительные выражения в адрес любого лица на льду. Малый скамеечный штраф на него ранее не был наложен.\nВаши действия?", "refs": [{"num": "57.5", "doc": null, "key": null}], "media": []}, {"id": 1500, "active": true, "numRule": "39.5.6", "text": "Определенный хоккеист, находящейся за пределами льда швыряет на лед клюшку в протест на решение судьи в направлении его, но не попадает.\nВаши действия?", "refs": [{"num": "39.5", "doc": null, "key": null}], "media": []}, {"id": 1501, "active": true, "numRule": "39.5.6", "text": "Определенный хоккеист, находящейся за пределами льда швыряет на лед пустую пластиковую бутылку в направлении судьи в протест на его решение, но не попадает.\nВаши действия?", "refs": [{"num": "39.5", "doc": null, "key": null}], "media": []}, {"id": 1505, "active": true, "numRule": "56.8", "text": "Во время матча, игрок со скамейки запасных  клюшкой играет в шайбу, проходящую рядом с бортом, за пределами синей линии зоны защиты. Вратарь убран со льда.\nВаши действия?", "refs": [{"num": "56.8", "doc": null, "key": null}], "media": []}, {"id": 1506, "active": true, "numRule": "56.8", "text": "Во время матча, игрок со скамейки запасных  рукой играет в шайбу, летящую рядом с бортом, за пределами синей линии зоны защиты. Вратарь убран со льда.\nВаши действия?", "refs": [{"num": "56.8", "doc": null, "key": null}], "media": []}, {"id": 1507, "active": true, "numRule": "56.8", "text": "Во время матча, представитель команды со скамейки запасных клюшкой играет в шайбу, проходящую рядом с бортом, за пределами синей линии зоны защиты. Вратарь убран со льда.\nВаши действия?", "refs": [{"num": "56.8", "doc": null, "key": null}], "media": []}, {"id": 1508, "active": true, "numRule": "56.8", "text": "Во время матча, представитель команды со скамейки запасных рукой играет в шайбу, проходящую рядом с бортом, за пределами синей линии зоны защиты. Вратарь убран со льда.\nВаши действия?", "refs": [{"num": "56.8", "doc": null, "key": null}], "media": []}, {"id": 1509, "active": true, "numRule": "81.3", "text": "Вратарь направляется к своей скамейке во время матча и пытается играть в шайбу, идущую на проброс.\nВаши действия?", "refs": [{"num": "81.3", "doc": null, "key": null}], "media": []}, {"id": 1510, "active": true, "numRule": "27.1", "text": "Вратарь, находясь на скамейке для игроков, во время игровых действий, совершает нарушение правил против игрока команды соперника. \nКто будет отбывать штраф?", "refs": [{"num": "27.1", "doc": null, "key": null}], "media": []}, {"id": 1511, "active": true, "numRule": "27.1", "text": "Вратарь, находясь на скамейке для игроков, во время остановки матча, совершает нарушение правил против игрока команды соперника. \nКто будет отбывать штраф?", "refs": [{"num": "27.1", "doc": null, "key": null}], "media": []}, {"id": 1513, "active": true, "numRule": "53.9", "text": "Игрок на льду бросает часть сломанной клюшки, лежащей на льду, в соперника, который выходит один на один с пустыми воротами. В ситуации когда вратарь покинул игровую площадку.\nВаши действия?", "refs": [{"num": "53.9", "doc": null, "key": null}], "media": []}, {"id": 1514, "active": true, "numRule": "53.9", "text": "Игрок на льду бросает часть сломанной клюшки, лежащей на льду, в соперника, который владеет шайбой в нейтральной зоне. В ситуации когда вратарь покинул игровую площадку.\nВаши действия?", "refs": [{"num": "53.9", "doc": null, "key": null}], "media": []}, {"id": 1515, "active": true, "numRule": "5.1", "text": "Какое минимальное количество ХОККЕИСТОВ может находится на льду во время матча, в результате наложения штрафов?", "refs": [{"num": "5.1", "doc": null, "key": null}], "media": []}, {"id": 1516, "active": true, "numRule": "53.2.1", "text": "Игрок команды «А», преследуя противника в нейтральной зоне, проезжает мимо сломанной клюшки лежащей на льду и толкает её в направлении игрока ведущего шайбу. \nВаши действия?", "refs": [{"num": "53.2", "doc": null, "key": null}], "media": []}, {"id": 1518, "active": true, "numRule": "5.3", "text": "Имеет ли право игрок выполнять функции вратаря при выполнении серии бросков, определяющих победителя матча?", "refs": [{"num": "5.3", "doc": null, "key": null}], "media": []}, {"id": 1519, "active": true, "numRule": "5.3", "text": "Имеет ли право игрок выполнять функции вратаря при выполнении серии бросков, определяющих победителя матча?", "refs": [{"num": "5.3", "doc": null, "key": null}], "media": []}, {"id": 1520, "active": true, "numRule": "67.3", "text": "Вратарь перчаткой выбрасывает шайбу вперед, и первым шайбы касается партнер по команде.\nВаши действия?", "refs": [{"num": "67.3", "doc": null, "key": null}], "media": []}, {"id": 1521, "active": true, "numRule": "10.5", "text": "Где должно проводиться измерение клюшки игрока?", "refs": [{"num": "10.5", "doc": null, "key": null}], "media": []}, {"id": 1522, "active": true, "numRule": "10.5", "text": "Где должно проводиться измерение клюшки вратаря?", "refs": [{"num": "10.5", "doc": null, "key": null}], "media": []}, {"id": 1523, "active": true, "numRule": "1.8", "text": "В какой цвет окрашена ограниченная зона игры вратаря?", "refs": [{"num": "1.8", "doc": null, "key": null}], "media": []}, {"id": 1524, "active": true, "numRule": "83.1", "text": "Один конек игрока находится в воздухе над синей линией, а другой конек в зоне атаки, в момент полного пересечения шайбой синей линии.", "refs": [{"num": "83.1", "doc": null, "key": null}], "media": []}, {"id": 1525, "active": true, "numRule": "83.1", "text": "Атакующий игрок, у которого оба конька полностью находятся в зоне атаки, принимает пас от партнера по команде из нейтральной зоны. Он останавливает шайбу своей клюшкой до того, как она пересечет синюю линию, перемещает один конек назад на синюю линию, и перемещает шайбу через синюю линию в зону атаки, сохраняя положение конька на синей линии.", "refs": [{"num": "83.1", "doc": null, "key": null}], "media": []}, {"id": 1526, "active": true, "numRule": "83.1", "text": "Игрок принимает шайбу на клюшку, находясь обоими коньками полностью в зоне атаки, тогда как сама шайба ещё находится на синей линии.\nНарушает ли такая ситуация правило «Вне игры»?", "refs": [{"num": "83.1", "doc": null, "key": null}], "media": []}, {"id": 1527, "active": true, "numRule": "82", "text": "Где будет проводиться вбрасывание, если атакующий игрок  принимает шайбу в зоне атаки, посланную партнером по команде из своей зоны защиты, но еще один партнер по команде не успел покинуть зону атаки и линейный судья останавливает игру из-за положения «вне игры».", "refs": [{"num": "82", "doc": null, "key": null}], "media": []}, {"id": 1528, "active": true, "numRule": "83.6 ситуации", "text": "Где будет вбрасывание, если при отложенном положении «Вне игры» хоккеист защищающейся команды выбрасывает шайбу с отскоком от партнера по команде, а шайба покидает игровую площадку до синей линии?", "refs": [{"num": "83.6", "doc": null, "key": null}], "media": []}, {"id": 1529, "active": true, "numRule": "83.6 ситуации", "text": "Где будет проводиться вбрасывание, если атакующая команда вбрасывает шайбу, создавая отложенное положение «Вне игры», а шайба, отскакивая от хоккеиста защищающейся команды, выходит из игры?", "refs": [{"num": "83.6", "doc": null, "key": null}], "media": []}, {"id": 1530, "active": true, "numRule": "83.6 ситуации", "text": "Где будет проводиться вбрасывание, если атакующий  игрок находится двумя ногами в нейтральной зоне и правильно принимает шайбу в зоне атаки, но партнер по команде не успел покинуть зону атаки и линейный судья останавливает игру из-за положения «Вне игры»?", "refs": [{"num": "83.6", "doc": null, "key": null}], "media": []}, {"id": 1531, "active": true, "numRule": "83.3, 836.3, 81.1 рекомендации", "text": "Где будет проводиться вбрасывание, если атакующий  игрок пытаясь не допустить фиксацию проброса пересекает синюю линию зоны атаки раньше шайбы, создавая тем самым отложенное положение «Вне игры», а Линейный судья определяет, что атакующий  игрок может быть первым, кто коснется шайбы, и судья останавливает матч из-за положения «вне игры»?", "refs": [{"num": "83.3", "doc": null, "key": null}, {"num": "836.3", "doc": null, "key": null}, {"num": "81.1", "doc": null, "key": null}], "media": []}, {"id": 1532, "active": true, "numRule": "37.2", "text": "Команда \"А\" забрасывает шайбу в ворота. После чего следует остановка по причине гола команды \"Б\". Во время видеопросмотра, становится очевидным, что первое взятие ворот произведено с нарушением правил. \nВаши действия?", "refs": [{"num": "37.2", "doc": null, "key": null}], "media": []}, {"id": 1533, "active": true, "numRule": "80.1", "text": "Что является ключевым аспектом при выполнении движения в стиле «лакросс», когда хоккеист помещает шайбу на крюк клюшки и выполняет маневр в воздухе?", "refs": [{"num": "80.1", "doc": null, "key": null}], "media": []}, {"id": 1534, "active": true, "numRule": "69.1", "text": "Вратарь находится в площади ворот, а шайба попадает в ворота в результате отскока от клюшки атакующего игрока, который находился в площади ворот раньше чем туда попала шайба", "refs": [{"num": "69.1", "doc": null, "key": null}], "media": []}, {"id": 1535, "active": true, "numRule": "69.1", "text": "Вратарь находится в площади ворот, а шайба попадает в ворота в результате отскока от тела атакующего игрока, который находился в площади ворот раньше чем туда попала шайба", "refs": [{"num": "69.1", "doc": null, "key": null}], "media": []}, {"id": 1536, "active": true, "numRule": "10.3", "text": "Хоккеист, находящийся на льду, посылает клюшку по льду партнеру по команде, не создавая помех соперникам. Ваши действия?", "refs": [{"num": "10.3", "doc": null, "key": null}], "media": []}, {"id": 1537, "active": true, "numRule": "58.1", "text": "Хоккеист выбрасывает шайбу через открытую калитку скамейки запасных игроков. Ваши действия?", "refs": [{"num": "58.1", "doc": null, "key": null}], "media": []}, {"id": 1538, "active": true, "numRule": "49.2.4", "text": "Игрок находится в процессе остановки и шайба отскакивает от ноги и пересекает линию ворот. Ваше решение?", "refs": [{"num": "49.2", "doc": null, "key": null}], "media": []}, {"id": 1539, "active": true, "numRule": "49.2", "text": "Игрок разворачивает свою ногу таким образом, чтобы переправить шайбу в ворота. Шайба пересекает линию ворот. Ваше решение?", "refs": [{"num": "49.2", "doc": null, "key": null}], "media": []}, {"id": 1540, "active": true, "numRule": "10.3", "text": "Хоккеист, находящийся на льду, бросает по воздуху клюшку партнеру по команде, не создавая помех соперникам. Ваши действия?", "refs": [{"num": "10.3", "doc": null, "key": null}], "media": []}, {"id
