нстве в результате Малого штрафа, и соперник забрасывает шайбу в ее ворота в течение отложенного Большого штрафа. Какой штраф должен закончится?", "refs": [{"num": "15.5", "doc": null, "key": null}], "media": []}, {"id": 687, "active": true, "numRule": "10.3", "text": "Игрок везет вратарскую клюшку вратарю, который потерял или сломал свою клюшку. Перед тем, как вступить в игру, игрок выпускает из рук вратарскую клюшку. \nВаши действия?", "refs": [{"num": "10.3", "doc": null, "key": null}], "media": []}, {"id": 689, "active": true, "numRule": "10.3", "text": "Хоккеист сломал свою клюшку и выхватил клюшку у партнера, находящегося на скамейке запасных игроков. \nВаши действия?", "refs": [{"num": "10.3", "doc": null, "key": null}], "media": []}, {"id": 690, "active": true, "numRule": "10.3", "text": "Хоккеист сломал свою клюшку и взял запасную клюшку, находящуюся на скамейке запасных игроков своей команды. \nВаши действия?", "refs": [{"num": "10.3", "doc": null, "key": null}], "media": []}, {"id": 691, "active": true, "numRule": "10.3", "text": "Хоккеист сломал свою клюшку и выхватил запасную клюшку, находящуюся на скамейке запасных игроков команды соперника. \nВаши действия?", "refs": [{"num": "10.3", "doc": null, "key": null}], "media": []}, {"id": 692, "active": true, "numRule": "10.3", "text": "Игрок везет вратарскую клюшку вратарю, который потерял или сломал свою клюшку, и вступает в игру с двумя клюшками. \nВаши действия?", "refs": [{"num": "10.3", "doc": null, "key": null}], "media": []}, {"id": 693, "active": true, "numRule": "10.3", "text": "Игрок команды «А» сломал свою клюшку и подбирает клюшку, брошенную на лед со скамейки игроков команды «Б», предназначенную игроку команды «Б», который тоже сломал свою клюшку.\nВаши действия?", "refs": [{"num": "10.3", "doc": null, "key": null}], "media": []}, {"id": 695, "active": true, "numRule": "67.4", "text": "Защищающийся игрок  накрывает шайбу на льду перчаткой в площади ворот, и по льду направляет шайбу из площади ворот, когда его вратарь находится на льду. Ваши действия?\n \nВаши действия?", "refs": [{"num": "67.4", "doc": null, "key": null}], "media": []}, {"id": 697, "active": true, "numRule": "79.1", "text": "Игрок направляет шайбу по льду открытой перчаткой из площади ворот. \nВаши действия?", "refs": [{"num": "79.1", "doc": null, "key": null}], "media": []}, {"id": 698, "active": true, "numRule": "9.8", "text": "Главный судья посчитал, что клюшка хоккеиста относится к опасному снаряжению.", "refs": [{"num": "9.8", "doc": null, "key": null}], "media": []}, {"id": 699, "active": true, "numRule": "12.1", "text": "Хоккеист продолжает использовать опасную клюшку, после указания Главного судьи исключить такую клюшку из игры. \nВаши действия?", "refs": [{"num": "12.1", "doc": null, "key": null}], "media": []}, {"id": 700, "active": true, "numRule": "75.4.6", "text": "Хоккеист использует персональные аксессуары, которые по мнению Главного судьи, могут представлять потенциальную опасность. \nВаши действия?", "refs": [{"num": "75.4", "doc": null, "key": null}], "media": []}, {"id": 703, "active": true, "numRule": "63.7", "text": "Вратаря нет на льду, а его партнер по команде сдвигает ворота, когда атакующий игрок выходит один на один с пустыми воротами. \nВаши действия?", "refs": [{"num": "63.7", "doc": null, "key": null}], "media": []}, {"id": 704, "active": true, "numRule": "63.2.1", "text": "Игрок, находящийся за пределами своей площади ворот, с помощью своей руки выгребает шайбу из площади ворот под себя, при этом не накрывает или не хватает шайбу в момент нахождения шайбы в площади ворот. Происходит остановка матча.\nВаши действия?", "refs": [{"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 705, "active": true, "numRule": "63.2.5", "text": "Шайба застревает в коньках или снаряжении игрока, когда он блокирует бросок в площади ворот. Вратарь находится на льду. \nВаши действия?", "refs": [{"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 708, "active": true, "numRule": "59.3 59.5", "text": "Какой штраф должен быть наложен Главным судьей на хоккеиста, который умышленно или  безответственно наносит травму или подвергает опасности жизнь и здоровье соперника толчком клюшки?", "refs": [{"num": "59.3", "doc": null, "key": null}, {"num": "59.5", "doc": null, "key": null}], "media": []}, {"id": 713, "active": true, "numRule": "60.1", "text": "Что такое «Опасная игра высоко поднятой клюшкой»?", "refs": [{"num": "60.1", "doc": null, "key": null}], "media": []}, {"id": 714, "active": true, "numRule": "10.5", "text": "Сколько замеров клюшки от одной команды можно осуществить в одном матче?", "refs": [{"num": "10.5", "doc": null, "key": null}], "media": []}, {"id": 716, "active": true, "numRule": "69.3", "text": "Атакующий игрок  телом загораживает вратарю путь в площади ворот, тем самым блокируя его – вратарь не может свободно передвигаться и выбирать удобное положение.\nВаши действия?", "refs": [{"num": "69.3", "doc": null, "key": null}], "media": []}, {"id": 717, "active": true, "numRule": "69.2", "text": "Атакующий игрок, с помощью своей клюшки, препятствует перемещению вратаря в площади ворот и не дает ему возможности занять надлежащую позицию.\nВаши действия?", "refs": [{"num": "69.2", "doc": null, "key": null}], "media": []}, {"id": 718, "active": true, "numRule": "69", "text": "Может ли атакующий игрок проезжать по площади ворот?", "refs": [{"num": "69", "doc": null, "key": null}], "media": []}, {"id": 720, "active": true, "numRule": "75.2.2, 20.1", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который хватает или удерживает руками маску, хоккеиста команды соперника?", "refs": [{"num": "75.2", "doc": null, "key": null}, {"num": "20.1", "doc": null, "key": null}], "media": []}, {"id": 721, "active": true, "numRule": "75.2.2", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который хватает или удерживает руками волосы хоккеиста команды соперника?", "refs": [{"num": "75.2", "doc": null, "key": null}], "media": []}, {"id": 722, "active": true, "numRule": "51.2", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который намеренно сбивает шлем с головы соперника?", "refs": [{"num": "51.2", "doc": null, "key": null}], "media": []}, {"id": 724, "active": true, "numRule": "57.1", "text": "Хоккеист, первоначально выбивает шайбу клюшкой, после чего совершает подножку заставляя соперника упасть на лед.\nВаши действия?", "refs": [{"num": "57.1", "doc": null, "key": null}], "media": []}, {"id": 725, "active": true, "numRule": "46.2", "text": "Что такое «Конфронтация»?", "refs": [{"num": "46.2", "doc": null, "key": null}], "media": []}, {"id": 727, "active": true, "numRule": "10.5", "text": "Какое основное условие необходимо для измерения клюшки?", "refs": [{"num": "10.5", "doc": null, "key": null}], "media": []}, {"id": 728, "active": true, "numRule": "70.4", "text": "Какое решение должен принять Главный судья, по отношению к оштрафованному игроку, который по своей ошибке покидает скамейку штрафников до истечения назначенного ему штрафного времени?", "refs": [{"num": "70.4", "doc": null, "key": null}], "media": []}, {"id": 729, "active": true, "numRule": "70.4", "text": "Какое решение должен принять Главный судья, по отношению к оштрафованному игроку, который покинул скамейку штрафников до истечения назначенного ему штрафного времени вследствие ошибки судьи при оштрафованных игроках?", "refs": [{"num": "70.4", "doc": null, "key": null}], "media": []}, {"id": 730, "active": true, "numRule": "19.6", "text": "Хоккеист потерял свой шлем в ходе игры и продолжил бороться за шайбу.\nВаши действия?", "refs": [{"num": "19.6", "doc": null, "key": null}], "media": []}, {"id": 731, "active": true, "numRule": "62", "text": "Хоккеист пытается нанести колющий удар сопернику.\nВаши действия?", "refs": [{"num": "62", "doc": null, "key": null}], "media": []}, {"id": 734, "active": true, "numRule": "39.4", "text": "Хоккеист выбрасывает клюшку за пределы игровой поверхности.\nВаши действия?", "refs": [{"num": "39.4", "doc": null, "key": null}], "media": []}, {"id": 738, "active": true, "numRule": "17.1", "text": "Кто должен отбывать штраф за нарушение численного состава команды?", "refs": [{"num": "17.1", "doc": null, "key": null}], "media": []}, {"id": 739, "active": true, "numRule": "75.2", "text": "Какой штраф должен быть наложен на определенного хоккеиста, использующего оскорбительные выражения в адрес любого лица на льду?", "refs": [{"num": "75.2", "doc": null, "key": null}], "media": []}, {"id": 740, "active": true, "numRule": "75.3", "text": "Какой штраф должен быть наложен если Вы не смогли точно определить хоккеиста, который использует оскорбительные выражения в адрес любого лица на льду, но оскорбление прозвучало со скамейки данной команды?", "refs": [{"num": "75.3", "doc": null, "key": null}], "media": []}, {"id": 741, "active": true, "numRule": "75.2", "text": "Какой штраф должен быть наложен на хоккеиста, который поздравляет товарища по команде после того, как тот нанес травму хоккеисту команды соперника?", "refs": [{"num": "75.2", "doc": null, "key": null}], "media": []}, {"id": 742, "active": true, "numRule": "75.3", "text": "Какой штраф должен быть наложен если Вы не смогли точно определить номер хоккеиста, который поздравляет товарища по команде после того, как тот нанес травму хоккеисту команды соперника, но знаете точно, что это хоккеист данной команды?", "refs": [{"num": "75.3", "doc": null, "key": null}], "media": []}, {"id": 746, "active": true, "numRule": "101.1", "text": "Что означает Незаконный силовой прием в женском хоккее?", "refs": [{"num": "101.1", "doc": null, "key": null}], "media": []}, {"id": 747, "active": true, "numRule": "64.2", "text": "Хоккеист явно приукрашивает нарушение падая на лед, показывая тем самым судье, что против него нарушены правила.\nВаши действия по отношению к такому хоккеисту?", "refs": [{"num": "64.2", "doc": null, "key": null}], "media": []}, {"id": 748, "active": true, "numRule": "64.2", "text": "Хоккеист явно симулирует получение травмы, показывая тем самым судье, что против него применен запрещенный прием.\nВаши действия по отношению к такому хоккеисту?", "refs": [{"num": "64.2", "doc": null, "key": null}], "media": []}, {"id": 751, "active": true, "numRule": "23.8, 75.5", "text": "Какое решение должен принять Главный судья, по отношению к официальному представителю команды, который вступает в физическую конфронтацию со зрителем?", "refs": [{"num": "23.8", "doc": null, "key": null}, {"num": "75.5", "doc": null, "key": null}], "media": []}, {"id": 757, "active": true, "numRule": "8.1, 64.2", "text": "Хоккеист лежит на льду, симулируя травму, и отказывается встать и покинуть лед.\nВаши действия?", "refs": [{"num": "8.1", "doc": null, "key": null}, {"num": "64.2", "doc": null, "key": null}], "media": []}, {"id": 758, "active": true, "numRule": "8.3, 63.2", "text": "Хоккеист, у которого есть кровотечение, возвращается в игру со скамейки запасных. \nВаши действия?", "refs": [{"num": "8.3", "doc": null, "key": null}, {"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 759, "active": true, "numRule": "8.3", "text": "Хоккеист возвращается на лед со следами крови на своем снаряжении. \nВаши действия?", "refs": [{"num": "8.3", "doc": null, "key": null}], "media": []}, {"id": 769, "active": true, "numRule": "75.4", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который допускает себе чрезмерное празднование взятия ворот или насмешки над соперниками, проезжая мимо их скамейки?", "refs": [{"num": "75.4", "doc": null, "key": null}], "media": []}, {"id": 770, "active": true, "numRule": "53.8", "text": "Игрок команды «А», преследуя противника в своей зоне защиты, проезжает мимо сломанной клюшки лежащей на льду. Он толкает сломанную клюшку в направлении игрока ведущего шайбу и мешает ему тем самым.", "refs": [{"num": "53.8", "doc": null, "key": null}], "media": []}, {"id": 772, "active": true, "numRule": "39.2, 75.2", "text": "Хоккеист произвел бросок шайбы после свистка судьи на остановку игры.", "refs": [{"num": "39.2", "doc": null, "key": null}, {"num": "75.2", "doc": null, "key": null}], "media": []}, {"id": 773, "active": true, "numRule": "75.2", "text": "Хоккеист бросил шайбу по воротам после окончания периода.", "refs": [{"num": "75.2", "doc": null, "key": null}], "media": []}, {"id": 774, "active": true, "numRule": "75.4", "text": "Хоккеист, наказанный Малым штрафом за Неспортивное поведение, продолжает использовать непристойные, грубые или оскорбительные выражения в адрес любого лица на льду.", "refs": [{"num": "75.4", "doc": null, "key": null}], "media": []}, {"id": 777, "active": true, "numRule": "75.4 п.3", "text": "Хоккеист, зашел на скамейку игроков соперника для выяснения отношений с соперником.\nВаши действия?", "refs": [{"num": "75.4", "doc": null, "key": null}, {"num": "3", "doc": null, "key": null}], "media": []}, {"id": 778, "active": true, "numRule": "101.1", "text": "Если хоккеистка с шайбой едет прямо на неподвижно стоящую соперницу, то:", "refs": [{"num": "101.1", "doc": null, "key": null}], "media": []}, {"id": 779, "active": true, "numRule": "101.1", "text": "Две хоккеистки в погоне за шайбой умеренно применяют друг против друга толчки, наваливание корпусом друг на друга.\nВаши действия?", "refs": [{"num": "101.1", "doc": null, "key": null}], "media": []}, {"id": 780, "active": true, "numRule": "101.1", "text": "Если две или более хоккеистки ведут борьбу за шайбу, имеют ли они право использовать борт, чтобы вывести соперницу из игры, толкнув ее на борт?", "refs": [{"num": "101.1", "doc": null, "key": null}], "media": []}, {"id": 783, "active": true, "numRule": "70.3", "text": "Какой штраф должен быть наложен на первого хоккеиста любой из команд, покинувшего скамейку игроков или скамейку штрафников во время конфронтации хоккеистов на льду?", "refs": [{"num": "70.3", "doc": null, "key": null}], "media": []}, {"id": 784, "active": true, "numRule": "70.3", "text": "Какой штраф должен быть наложен на хоккеистов, покидающих скамейку игроков вслед за первым хоккеистом, покинувшим скамейку во время конфрантации хоккеистов на льду?", "refs": [{"num": "70.3", "doc": null, "key": null}], "media": []}, {"id": 786, "active": true, "numRule": "70", "text": "Какие штрафы должны быть наложены, если хоккеисты обеих команд первыми покидают свои скамейки, во время конфрантации, в одно и то же время?", "refs": [{"num": "70", "doc": null, "key": null}], "media": []}, {"id": 790, "active": true, "numRule": "60.1", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который совершает контакт с верхней частью тела соперника, во время замаха при броске?", "refs": [{"num": "60.1", "doc": null, "key": null}], "media": []}, {"id": 793, "active": true, "numRule": "54.2", "text": "Какое решение должен принять Главный судья, по отношению к игроку, который владеет шайбой и в тоже время держит клюшку соперника другой рукой?", "refs": [{"num": "54.2", "doc": null, "key": null}], "media": []}, {"id": 795, "active": true, "numRule": "10.5", "text": "Замер клюшки показал, что хоккеист использует нестандартную клюшку. \nВаши действия?", "refs": [{"num": "10.5", "doc": null, "key": null}], "media": []}, {"id": 796, "active": true, "numRule": "10.5", "text": "Хоккеист отказывается передать свою клюшку для замера.\nВаши действия?", "refs": [{"num": "10.5", "doc": null, "key": null}], "media": []}, {"id": 797, "active": true, "numRule": "10.5", "text": "Хоккеист отказывается передать свою клюшку для замера и ломает её.\nВаши действия?", "refs": [{"num": "10.5", "doc": null, "key": null}], "media": []}, {"id": 801, "active": true, "numRule": "56.4, 56.6", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который наносит травму или безответственно подвергает опасности жизнь и здоровье соперника, в результате Блокировки?", "refs": [{"num": "56.4", "doc": null, "key": null}, {"num": "56.6", "doc": null, "key": null}], "media": []}, {"id": 803, "active": true, "numRule": "69.2", "text": "Какое решение должен принять Главный судья, по отношению к игроку, который располагается в площади ворот лицом к вратарю соперника и начинает размахивать руками или клюшкой перед лицом вратаря?", "refs": [{"num": "69.2", "doc": null, "key": null}], "media": []}, {"id": 807, "active": true, "numRule": "70.4", "text": "Если игрок покидает скамейку штрафников до истечения его штрафного времени, чтобы оспорить или подвергнуть сомнению решение Судьи на льду.\nВаши действия?", "refs": [{"num": "70.4", "doc": null, "key": null}], "media": []}, {"id": 813, "active": true, "numRule": "62", "text": "Хоккеист пытается нанести колющий удар сопернику, удерживая клюшку одной рукой.\nВаши действия?", "refs": [{"num": "62", "doc": null, "key": null}], "media": []}, {"id": 814, "active": true, "numRule": "62.5", "text": "Хоккеист наносит сопернику колющий удар, удерживая клюшку одной рукой.\nВаши действия?", "refs": [{"num": "62.5", "doc": null, "key": null}], "media": []}, {"id": 816, "active": true, "numRule": "62", "text": "Хоккеист пытается нанести колющий удар сопернику, удерживая клюшку двумя руками.\nВаши действия?", "refs": [{"num": "62", "doc": null, "key": null}], "media": []}, {"id": 817, "active": true, "numRule": "62.5", "text": "Хоккеист наносит сопернику колющий удар, удерживая клюшку двумя руками.\nВаши действия?", "refs": [{"num": "62.5", "doc": null, "key": null}], "media": []}, {"id": 824, "active": true, "numRule": "23.8, 75.5.6", "text": "Хоккеист, у которого имеется кровотечение, умышленно вытирает кровь о кого-либо на игровой площадке.\nВаши действия?", "refs": [{"num": "23.8", "doc": null, "key": null}, {"num": "75.5", "doc": null, "key": null}], "media": []}, {"id": 825, "active": true, "numRule": "70.5", "text": "Главный тренер команды вышел на лед в остановку матча во втором периоде. \nВаши действия?", "refs": [{"num": "70.5", "doc": null, "key": null}], "media": []}, {"id": 826, "active": true, "numRule": "8.1", "text": "Врач команды вышел на лед в остановку матча, для оказания медицинской помощи хоккеисту, не дождавшись разрешения Главного судьи.\nВаши действия?", "refs": [{"num": "8.1", "doc": null, "key": null}], "media": []}, {"id": 827, "active": true, "numRule": "8.1", "text": "Врач команды вышел на лед во время остановки матча, для оказания медицинской помощи хоккеисту, не дождавшись разрешения Линейного судьи.\nВаши действия?", "refs": [{"num": "8.1", "doc": null, "key": null}], "media": []}, {"id": 828, "active": true, "numRule": "53.2.1", "text": "Игрок на льду бросает клюшку в соперника, который владеет шайбой в нейтральной зоне.\nВаши действия?", "refs": [{"num": "53.2", "doc": null, "key": null}], "media": []}, {"id": 829, "active": true, "numRule": "53.2.1", "text": "Игрок на льду бросает клюшку в соперника, который владеет шайбой в своей зоне защиты.\nВаши действия?", "refs": [{"num": "53.2", "doc": null, "key": null}], "media": []}, {"id": 830, "active": true, "numRule": "53.2.1", "text": "Игрок на льду бросает клюшку в шайбу, находящуюся в зоне защиты команды соперника.\nВаши действия?", "refs": [{"num": "53.2", "doc": null, "key": null}], "media": []}, {"id": 831, "active": true, "numRule": "53.2.1", "text": "Игрок на льду бросает сломанную клюшку в соперника, который владеет шайбой в нейтральной зоне.\nВаши действия?", "refs": [{"num": "53.2", "doc": null, "key": null}], "media": []}, {"id": 832, "active": true, "numRule": "53.2.1", "text": "Игрок на льду бросает сломанную клюшку в соперника, который владеет шайбой в своей зоне защиты.\nВаши действия?", "refs": [{"num": "53.2", "doc": null, "key": null}], "media": []}, {"id": 833, "active": true, "numRule": "53.2.1", "text": "Игрок на льду бросает сломанную клюшку в шайбу, которая находится в нейтральной зоне.\nВаши действия?", "refs": [{"num": "53.2", "doc": null, "key": null}], "media": []}, {"id": 835, "active": true, "numRule": "53.8", "text": "Хоккеист на льду бросает перчатку, лежащую на льду, в соперника, который владеет шайбой в своей зоне атаки.\nВаши действия?", "refs": [{"num": "53.8", "doc": null, "key": null}], "media": []}, {"id": 836, "active": true, "numRule": "53.8", "text": "Хоккеист на льду бросает перчатку, лежащую на льду, в шайбу в своей зоне защиты.\nВаши действия?", "refs": [{"num": "53.8", "doc": null, "key": null}], "media": []}, {"id": 837, "active": true, "numRule": "53.8", "text": "Хоккеист на льду бросает сломанную клюшку в соперника, который владеет шайбой в своей зоне атаки.\nВаши действия?", "refs": [{"num": "53.8", "doc": null, "key": null}], "media": []}, {"id": 838, "active": true, "numRule": "53.8", "text": "Хоккеист на льду бросает клюшку в шайбу, находящуюся в зоне защиты бросающего клюшку хоккеиста.\nВаши действия?", "refs": [{"num": "53.8", "doc": null, "key": null}], "media": []}, {"id": 839, "active": true, "numRule": "53.2.1", "text": "Игрок на льду бросает сломанную клюшку в шайбу, находящуюся в зоне защиты команды соперника.\nВаши действия?", "refs": [{"num": "53.2", "doc": null, "key": null}], "media": []}, {"id": 840, "active": true, "numRule": "53.8", "text": "Хоккеист на льду бросает сломанную клюшку в шайбу, которая находится в его зоне защиты.\nВаши действия?", "refs": [{"num": "53.8", "doc": null, "key": null}], "media": []}, {"id": 847, "active": true, "numRule": "53.9", "text": "Отложенный штраф должен быть наложен на команду «А». Команда «Б» заменяет своего вратаря на дополнительного игрока. Прежде, чем игра была остановлена, игрок команды «Б» бросает свою клюшку в шайбу в своей зоне защиты.", "refs": [{"num": "53.9", "doc": null, "key": null}], "media": []}, {"id": 849, "active": true, "numRule": "15.3", "text": "Главный судья фиксирует взятие ворот, после этого Линейный судья сообщает Главному, что команда, пропустившая гол, произвела неправильную замену игроков перед голом.\nВаши действия?", "refs": [{"num": "15.3", "doc": null, "key": null}], "media": []}, {"id": 851, "active": true, "numRule": "15.5", "text": "При игре команд 5 на 4. Команда играющая в большинстве, забрасывает шайбу в ворота и Главный судья фиксирует взятие ворот, после этого Линейный судья сообщает Главному судье, что команда, пропустившая гол, играла с нарушением численного состава.", "refs": [{"num": "15.5", "doc": null, "key": null}], "media": []}, {"id": 852, "active": true, "numRule": "75.5.2", "text": "Какое решение должен принять Главный судья, по отношению к официальному представителю команды, который допускает устные выпады расистского или этнического характера к сопернику?", "refs": [{"num": "75.5", "doc": null, "key": null}], "media": []}, {"id": 853, "active": true, "numRule": "23.8, 75.5.5", "text": "Какое решение должен принять Главный судья, по отношению к официальному представителю команды, который плюет в соперника?", "refs": [{"num": "23.8", "doc": null, "key": null}, {"num": "75.5", "doc": null, "key": null}], "media": []}, {"id": 854, "active": true, "numRule": "75.5.2", "text": "Какое решение должен принять Главный судья, по отношению к официальному представителю команды, который отпускает реплики сексуального характера в адрес любого лица?", "refs": [{"num": "75.5", "doc": null, "key": null}], "media": []}, {"id": 855, "active": true, "numRule": "75.5.2", "text": "Какое решение должен принять Главный судья, по отношению к официальному представителю команды, который делает оскорбительные жесты в адрес любого лица?", "refs": [{"num": "75.5", "doc": null, "key": null}], "media": []}, {"id": 856, "active": true, "numRule": "23.8", "text": "Хоккеист замахнулся клюшкой на зрителя.\nВаши действия?", "refs": [{"num": "23.8", "doc": null, "key": null}], "media": []}, {"id": 857, "active": true, "numRule": "75.5.3", "text": "Представитель команды продолжает вести себя недисциплинированно, за что уже был наказан Малым скамеечным штрафом. \nВаши действия?", "refs": [{"num": "75.5", "doc": null, "key": null}], "media": []}, {"id": 858, "active": true, "numRule": "75.5.3", "text": "Представитель команды продолжает использовать непристойные, грубые или оскорбительные выражения в адрес любого лица на льду, за которые на него уже ранее был наложен Малый скамеечный штраф.\nВаши действия?", "refs": [{"num": "75.5", "doc": null, "key": null}], "media": []}, {"id": 862, "active": true, "numRule": "101.1", "text": "Какой штраф может быть наложен на хоккеистку за применение Незаконного силового приема?", "refs": [{"num": "101.1", "doc": null, "key": null}], "media": []}, {"id": 863, "active": true, "numRule": "101.1", "text": "Какой штраф может быть наложен на хоккеистку, которая безответственно подвергает опасности соперницу используя Незаконный силовой прием?", "refs": [{"num": "101.1", "doc": null, "key": null}], "media": []}, {"id": 866, "active": true, "numRule": "24.3", "text": "Кто может выполнить штрафной бросок?", "refs": [{"num": "24.3", "doc": null, "key": null}], "media": []}, {"id": 867, "active": true, "numRule": "24.2", "text": "Может ли тренер заменить вратаря до начала выполнения штрафного броска?", "refs": [{"num": "24.2", "doc": null, "key": null}], "media": []}, {"id": 868, "active": true, "numRule": "24.2", "text": "Могут ли не участвующие в броске игроки находится на льду во время выполнения штрафного броска?", "refs": [{"num": "24.2", "doc": null, "key": null}], "media": []}, {"id": 869, "active": true, "numRule": "24.2", "text": "В какой момент начинается штрафной бросок?", "refs": [{"num": "24.2", "doc": null, "key": null}], "media": []}, {"id": 870, "active": true, "numRule": "24.2", "text": "В начале выполнения штрафного броска игрок проехал мимо шайбы, расположенной в центральной точке, и не коснулся ее.\nВаши действия?", "refs": [{"num": "24.2", "doc": null, "key": null}], "media": []}, {"id": 871, "active": true, "numRule": "24.2", "text": "Игрок начинает выполнение штрафного броска, касается шайбы и проскакивает вперед. Шайба остается в центральной точке.\nВаши действия?", "refs": [{"num": "24.2", "doc": null, "key": null}], "media": []}, {"id": 872, "active": true, "numRule": "24.5", "text": "Штрафной бросок закончился взятием ворот. Где будет вбрасывание?", "refs": [{"num": "24.5", "doc": null, "key": null}], "media": []}, {"id": 873, "active": true, "numRule": "24.5", "text": "Штрафной бросок не закончился взятием ворот. Где будет вбрасывание?", "refs": [{"num": "24.5", "doc": null, "key": null}], "media": []}, {"id": 875, "active": true, "numRule": "24.2", "text": "Игрок во время исполнения штрафного броска использует движение типа \"спин-о-рама\" (разворот в движении на 360°).\nВаши действия?", "refs": [{"num": "24.2", "doc": null, "key": null}], "media": []}, {"id": 876, "active": true, "numRule": "24.2", "text": "Игрок во время исполнения штрафного броска использует маневр типа  \"лакросс\".\nВаши действия?", "refs": [{"num": "24.2", "doc": null, "key": null}], "media": []}, {"id": 877, "active": true, "numRule": "24.7", "text": "Должно ли быть остановлено время матча на табло во время выполнения штрафного броска?", "refs": [{"num": "24.7", "doc": null, "key": null}], "media": []}, {"id": 882, "active": true, "numRule": "24.8", "text": "Игрок, выходящий один на один, теряет шайбу после совершения против него нарушения правил сзади. Остановка игры.\nВаши действия?", "refs": [{"num": "24.8", "doc": null, "key": null}], "media": []}, {"id": 884, "active": true, "numRule": "74.4", "text": "Какой штраф предусмотрен за Умышленное нарушение численного состава в последние две минуты матча?", "refs": [{"num": "74.4", "doc": null, "key": null}], "media": []}, {"id": 885, "active": true, "numRule": "74.4", "text": "Какой штраф предусмотрен за Умышленное нарушение численного состава в дополнительное время матча?", "refs": [{"num": "74.4", "doc": null, "key": null}], "media": []}, {"id": 886, "active": true, "numRule": "74.4", "text": "Какой штраф предусмотрен за Умышленное нарушение численного состава в основное время матча (за исключением последних двух минут матча)?", "refs": [{"num": "74.4", "doc": null, "key": null}], "media": []}, {"id": 887, "active": true, "numRule": "24.2", "text": "Игрок, выполняющий штрафной бросок, падает на лед пока шайба продолжает движение вперед.\nВаши действия?", "refs": [{"num": "24.2", "doc": null, "key": null}], "media": []}, {"id": 888, "active": true, "numRule": "25.1", "text": "Против игрока, выходящего один на один с пустыми воротами, применяется запрещенный прием сзади с целью предотвращения явного голевого момента.\nВаши действия?", "refs": [{"num": "25.1", "doc": null, "key": null}], "media": []}, {"id": 889, "active": true, "numRule": "74.4", "text": "В какое время матча может произойти Умышленное нарушение численного состава?", "refs": [{"num": "74.4", "doc": null, "key": null}], "media": []}, {"id": 890, "active": true, "numRule": "74.4", "text": "В какое время матча за Умышленное нарушение численного состава будет назначен штрафной бросок?", "refs": [{"num": "74.4", "doc": null, "key": null}], "media": []}, {"id": 894, "active": true, "numRule": "24.8", "text": "Игрок, выходящий один на один, сохраняет контроль над шайбой после совершения против него нарушения правил сзади и забрасывает шайбу в ворота.\nВаши действия?", "refs": [{"num": "24.8", "doc": null, "key": null}], "media": []}, {"id": 897, "active": true, "numRule": "24.6", "text": "Игрок команды «А», в положении выхода один на один, атакован сзади игроком команды «Б» с нарушением правил, за которое полагается наложение Большого плюс Дисциплинарного штрафа до конца матча.\nВаши действия?", "refs": [{"num": "24.6", "doc": null, "key": null}], "media": []}, {"id": 898, "active": true, "numRule": "53.3", "text": "Запасной вратарь со своей скамейки игроков бросает клюшку в шайбу, находящуюся в зоне защиты команды соперника.\nВаши действия?", "refs": [{"num": "53.3", "doc": null, "key": null}], "media": []}, {"id": 899, "active": true, "numRule": "53.3", "text": "Запасной вратарь со своей скамейки игроков бросает клюшку в соперника, владеющего шайбой в своей зоне защиты.\nВаши действия?", "refs": [{"num": "53.3", "doc": null, "key": null}], "media": []}, {"id": 900, "active": true, "numRule": "53.3", "text": "Запасной вратарь со своей скамейки игроков бросает шлем в шайбу, находящуюся в зоне защиты команды соперника.\nВаши действия?", "refs": [{"num": "53.3", "doc": null, "key": null}], "media": []}, {"id": 901, "active": true, "numRule": "53.3", "text": "Запасной вратарь со своей скамейки игроков бросает шлем в соперника, владеющего шайбой в своей зоне защиты.\nВаши действия?", "refs": [{"num": "53.3", "doc": null, "key": null}], "media": []}, {"id": 902, "active": true, "numRule": "53.3", "text": "Тренер со своей скамейки игроков бросает клюшку в шайбу, находящуюся в зоне защиты команды соперника.\nВаши действия?", "refs": [{"num": "53.3", "doc": null, "key": null}], "media": []}, {"id": 903, "active": true, "numRule": "53.3", "text": "Врач команды со скамейки игроков бросает клюшку в соперника, владеющего шайбой в своей зоне защиты.\nВаши действия?", "refs": [{"num": "53.3", "doc": null, "key": null}], "media": []}, {"id": 904, "active": true, "numRule": "53.3", "text": "Тренер со своей скамейки игроков бросает шлем в шайбу, находящуюся в зоне защиты команды соперника.\nВаши действия?", "refs": [{"num": "53.3", "doc": null, "key": null}], "media": []}, {"id": 906, "active": true, "numRule": "53.3", "text": "Игрок со скамейки оштрафованных бросает клюшку в шайбу, находящуюся в зоне защиты команды соперника.\nВаши действия?", "refs": [{"num": "53.3", "doc": null, "key": null}], "media": []}, {"id": 907, "active": true, "numRule": "53.3", "text": "Игрок со скамейки оштрафованных бросает клюшку в соперника, владеющего шайбой в своей зоне защиты.\nВаши действия?", "refs": [{"num": "53.3", "doc": null, "key": null}], "media": []}, {"id": 908, "active": true, "numRule": "53.2", "text": "Игрок со скамейки оштрафованных бросает перчатку в шайбу, находящуюся в зоне защиты команды соперника.\nВаши действия?", "refs": [{"num": "53.2", "doc": null, "key": null}], "media": []}, {"id": 909, "active": true, "numRule": "75.2", "text": "Игрок со скамейки оштрафованных бросает перчатку на лед.\nВаши действия?", "refs": [{"num": "75.2", "doc": null, "key": null}], "media": []}, {"id": 910, "active": true, "numRule": "53.3", "text": "Представитель команды со скамейки игроков направляет потерянную клюшку, лежащую на льду в шайбу, находящуюся в зоне защиты команды соперника. \nВаши действия?", "refs": [{"num": "53.3", "doc": null, "key": null}], "media": []}, {"id": 914, "active": true, "numRule": "67.4", "text": "Какое решение должен принять Главный судья, по отношению к игроку, который падает на шайбу в своей площади ворот и удерживает ее?", "refs": [{"num": "67.4", "doc": null, "key": null}], "media": []}, {"id": 916, "active": true, "numRule": "24.3", "text": "Главный судья не может определить против кого были нарушены правила в ситуации выхода «один на один».\nКто будет выполнять штрафной бросок?", "refs": [{"num": "24.3", "doc": null, "key": null}], "media": []}, {"id": 917, "active": true, "numRule": "5.3, 24.2", "text": "Имеет ли право игрок выполнять функции вратаря при выполнении Штрафного броска?", "refs": [{"num": "5.3", "doc": null, "key": null}, {"num": "24.2", "doc": null, "key": null}], "media": []}, {"id": 924, "active": true, "numRule": "24.4", "text": "Игрок, выполняющий штрафной бросок, пытается выполнить бросок по воротам, но не совершает контакта с шайбой. Шайба продолжает движение в направлении ворот и со второй попытки игрок совершает контакт с шайбой и забрасывает шайбу в ворота.\nВаши действия?", "refs": [{"num": "24.4", "doc": null, "key": null}], "media": []}, {"id": 925, "active": true, "numRule": "24.4", "text": "Вратарь во время выполнения штрафного броска досрочно покидает площадь своих ворот.\nВаши действия?", "refs": [{"num": "24.4", "doc": null, "key": null}], "media": []}, {"id": 926, "active": true, "numRule": "24.4", "text": "Вратарь во время выполнения штрафного броска досрочно покидает площадь своих ворот второй раз подряд. \nВаши действия?", "refs": [{"num": "24.4", "doc": null, "key": null}], "media": []}, {"id": 927, "active": true, "numRule": "24.4", "text": "Вратарь во время выполнения штрафного броска досрочно покидает площадь своих ворот третий раз подряд\nВаши действия?", "refs": [{"num": "24.4", "doc": null, "key": null}], "media": []}, {"id": 928, "active": true, "numRule": "24.4", "text": "Вратарь в ходе выполнения штрафного броска нарушает правила против игрока, и взятие ворот не происходит.\nВаши действия?", "refs": [{"num": "24.4", "doc": null, "key": null}], "media": []}, {"id": 929, "active": true, "numRule": "24.4", "text": "Вратарь в ходе выполнения штрафного броска во второй раз нарушает правила против игрока, и взятие ворот не происходит.\nВаши действия?", "refs": [{"num": "24.4", "doc": null, "key": null}], "media": []}, {"id": 930, "active": true, "numRule": "24.4", "text": "Вратарь в ходе выполнения штрафного броска в третий раз нарушает правила против игрока, и взятие ворот не происходит.\nВаши действия?", "refs": [{"num": "24.4", "doc": null, "key": null}], "media": []}, {"id": 935, "active": true, "numRule": "24.4", "text": "Зритель вмешивается в выполнение штрафного броска, в результате чего,  игрок оказывается не в состоянии должным образом выполнять свои функции. \nВаши действия?", "refs": [{"num": "24.4", "doc": null, "key": null}], "media": []}, {"id": 936, "active": true, "numRule": "24.4", "text": "Зритель вмешивается в выполнение штрафного броска, в результате чего вратарь оказывается не в состоянии должным образом выполнять свои функции. \nВаши действия?", "refs": [{"num": "24.4", "doc": null, "key": null}], "media": []}, {"id": 939, "active": true, "numRule": "24.2", "text": "Игрок, выполняющий штрафной бросок, совершает бросок шайбы и она попадает в штангу ворот и отскакивает в ворота.\nВаши действия?", "refs": [{"num": "24.2", "doc": null, "key": null}], "media": []}, {"id": 940, "active": true, "numRule": "24.2", "text": "Игрок, выполняющий штрафной бросок, совершает бросок шайбы и она попадает во вратаря и отскакивает в ворота.\nВаши действия?", "refs": [{"num": "24.2", "doc": null, "key": null}], "media": []}, {"id": 942, "active": true, "numRule": "24.2", "text": "Игрок, выполняющий штрафной бросок, совершает бросок шайбы и она попадает во вратаря, а затем входит в ворота от штанги.\nВаши действия?", "refs": [{"num": "24.2", "doc": null, "key": null}], "media": []}, {"id": 943, "active": true, "numRule": "24.2", "text": "Игрок, выполняющий штрафной бросок, совершает бросок шайбы и вратарь вместе с шайбой скользит в ворота, а шайба пересекает линию ворот.\nВаши действия?", "refs": [{"num": "24.2", "doc": null, "key": null}], "media": []}, {"id": 944, "active": true, "numRule": "24.2", "text": "Во время серии бросков для определения победителя, вратарь одновременно коньком сдвигает ворота и ловит шайбу за линией ворот.\nВаши действия?", "refs": [{"num": "24.2", "doc": null, "key": null}], "media": []}, {"id": 945, "active": true, "numRule": "57.6", "text": "Против игрока, выходящего один на один, производят подножку, и шайба становится ничейной. Его товарищ по команде, находящийся сзади, подбирает шайбу, и совершает без помех бросок по воротам, но не забрасывает шайбу в ворота. \nВаши действия?", "refs": [{"num": "57.6", "doc": null, "key": null}], "media": []}, {"id": 946, "active": true, "numRule": "24.8", "text": "Игрок, выходящий один на один, сохраняет контроль над шайбой после совершения против него нарушения правил, за которое полагается назначить штрафной бросок, и совершает без помех бросок по воротам, но не забрасывает шайбу в ворота.\nВаши действия?", "refs": [{"num": "24.8", "doc": null, "key": null}], "media": []}, {"id": 947, "active": true, "numRule": "56.8", "text": "Вратарь убран со льда, но в ситуации выхода «один на один» он незаконно выходит на ледовую поверхность со скамейки игроков и препятствует в продвижении атакующему игроку за пределами его собственной зоны защиты. \nВаши действия?", "refs": [{"num": "56.8", "doc": null, "key": null}], "media": []}, {"id": 950, "active": true, "numRule": "24.6", "text": "В одни ворота назначено два штрафных броска. Первый штрафной бросок реализован. Что делать со вторым?", "refs": [{"num": "24.6", "doc": null, "key": null}], "media": []}, {"id": 951, "active": true, "numRule": "24.6", "text": "В одни ворота назначено два штрафных броска. Первый штрафной бросок не реализован. Что делать со вторым?", "refs": [{"num": "24.6", "doc": null, "key": null}], "media": []}, {"id": 952, "active": true, "numRule": "56.8", "text": "Вратарь убран со льда, а игрок совершает незаконный выход на ледовую поверхность со скамейки игроков, и препятствует атакующему игроку за пределами его собственной зоны защиты в ситуации, выхода \"один на один\". \nВаши действия?", "refs": [{"num": "56.8", "doc": null, "key": null}], "media": []}, {"id": 953, "active": true, "numRule": "56.8", "text": "Вратарь убран со льда, а затем запасной вратарь совершает незаконный выход на ледовую поверхность со скамейки игроков, и препятствует атакующему игроку за пределами его собственной зоны защиты в ситуации, выхода \"один на один\".  \nВаши действия?", "refs": [{"num": "56.8", "doc": null, "key": null}], "media": []}, {"id": 954, "active": true, "numRule": "56.8", "text": "Вратарь убран со льда, а представитель команды со скамейки игроков задерживает руками игрока за пределами его собственной зоны защиты в ситуации, выхода \"один на один\".  \nВаши действия?", "refs": [{"num": "56.8", "doc": null, "key": null}], "media": []}, {"id": 955, "active": true, "numRule": "54.4", "text": "Вратарь убран со льда, а игрок со скамейки игроков задерживает руками соперника за пределами его собственной зоны защиты в ситуации, выхода \"один на один\".  \nВаши действия?", "refs": [{"num": "54.4", "doc": null, "key": null}], "media": []}, {"id": 958, "active": true, "numRule": "24.4", "text": "Игрок, выполняющий штрафной бросок,  движется в сторону ворот и бросает свои перчатки, чтобы отвлечь вратаря, а затем забрасывает шайбу в ворота.\nВаши действия?", "refs": [{"num": "24.4", "doc": null, "key": null}], "media": []}, {"id": 959, "active": true, "numRule": "67.5", "text": "Вратарь, предотвращая попадание шайбы в ворота, оставляет клюшку перед своими воротами и направляется на замену, а шайба попадает в эту клюшку.\nВаши действия?", "refs": [{"num": "67.5", "doc": null, "key": null}], "media": []}, {"id": 960, "active": true, "numRule": "67.5", "text": "Вратарь, предотвращая попадание шайбы в ворота, перед своей заменой, сделал преграду из снега перед своими воротами, а шайба попадает в это препятствие.\nВаши действия?", "refs": [{"num": "67.5", "doc": null, "key": null}], "media": []}, {"id": 961, "active": true, "numRule": "67.5", "text": "Вратарь, предотвращая попадание шайбы в ворота, оставляет ловушку перед своими воротами и направляется на замену, а шайба попадает в эту ловушку.\nВаши действия?", "refs": [{"num": "67.5", "doc": null, "key": null}], "media": []}, {"id": 962, "active": true, "numRule": "53.2.1", "text": "Игрок на льду бросает перчатку, лежащую на льду, в соперника, который владеет шайбой в своей зоне защиты.\nВаши действия?", "refs": [{"num": "53.2", "doc": null, "key": null}], "media": []}, {"id": 963, "active": true, "numRule": "53.2.1", "text": "Игрок на льду бросает перчатку, лежащую на льду, в шайбу, находящуюся в зоне защиты команды соперника.\nВаши действия?", "refs": [{"num": "53.2", "doc": null, "key": null}], "media": []}, {"id": 967, "active": true, "numRule": "68.5, 70.9", "text": "Игрок преждевременно покинул скамейку штрафников в результате ошибки Судьи при оштрафованных игроках, и он успел смениться в тот момент, когда его команда забрасывает шайбу в ворота. \nВаши действия?", "refs": [{"num": "68.5", "doc": null, "key": null}, {"num": "70.9", "doc": null, "key": null}], "media": []}, {"id": 969, "active": true, "numRule": "53.8", "text": "Хоккеист на льду бросает клюшку в соперника, который владеет шайбой в своей зоне атаки.\nВаши действия?", "refs": [{"num": "53.8", "doc": null, "key": null}], "media": []}, {"id": 970, "active": true, "numRule": "37.4", "text": "Атакующий игрок бьет своим коньком по клюшке партнера по команде, на которой находится шайба и шайба напрямую входит в ворота. \nВаши действия?", "refs": [{"num": "37.4", "doc": null, "key": null}], "media": []}, {"id": 971, "active": true, "numRule": "78.4", "text": "Атакующий игрок бьет своим коньком по клюшке партнера по команде, на которой находится шайба и своей клюшкой переправляет шайбу в ворота. \nВаши действия?", "refs": [{"num": "78.4", "doc": null, "key": null}], "media": []}, {"id": 972, "active": true, "numRule": "67.4", "text": "Какое решение должен принять Главный судья, по отношению к игроку, который падает на лед и подбирает под себя шайбу руками в своей площади ворот?", "refs": [{"num": "67.4", "doc": null, "key": null}], "media": []}, {"id": 973, "active": true, "numRule": "37.2", "text": "Шайба побывала в воротах команды «А», но матч продолжается. Остановка матча произошла в связи с тем, что шайба еще раз зашла в ворота команды «А». По итогам видеопросмотра определено, что первое взятие ворот проведено верно. \nЧто делать со вторым взятием ворот?", "refs": [{"num": "37.2", "doc": null, "key": null}], "media": []}, {"id": 974, "active": true, "numRule": "79.1", "text": "Какой штраф должен быть наложен Главным судьей, если игрок отбивает шайбу открытой перчаткой, в трехмерном пространстве своей площади ворот, в угол площадки, когда его вратарь находится на льду?", "refs": [{"num": "79.1", "doc": null, "key": null}], "media": []}, {"id": 976, "active": true, "numRule": "69", "text": "Может ли атакующий игрок проезжать через площадь ворот команды соперника?", "refs": [{"num": "69", "doc": null, "key": null}], "media": []}, {"id": 978, "active": true, "numRule": "10.5", "text": "Можно ли измерить клюшку вратаря после второго периода?", "refs": [{"num": "10.5", "doc": null, "key": null}], "media": []}, {"id": 980, "active": true, "numRule": "11.9", "text": "Можно ли измерить ловушку вратаря перед дополнительным временем матча?", "refs": [{"num": "11.9", "doc": null, "key": null}], "media": []}, {"id": 981, "active": true, "numRule": "11.4", "text": "Допускается ли наличие внутренних или внешних прокладок в нижней или поясничной части шорт вратаря?", "refs": [{"num": "11.4", "doc": null, "key": null}], "media": []}, {"id": 982, "active": true, "numRule": "11.7", "text": "Какой формы должен быть блин вратаря?", "refs": [{"num": "11.7", "doc": null, "key": null}], "media": []}, {"id": 983, "active": true, "numRule": "11.7", "text": "Допускается ли наличие отогнутых краев на любой части блина вратаря?", "refs": [{"num": "11.7", "doc": null, "key": null}], "media": []}, {"id": 984, "active": true, "numRule": "11.8", "text": "Каким образом должна быть сконструирована маска вратаря?", "refs": [{"num": "11.8", "doc": null, "key": null}], "media": []}, {"id": 985, "active": true, "numRule": "202.2", "text": "Каким образом должна быть сконструирована маска вратаря в категории «до 18 лет» ?", "refs": [{"num": "202.2", "doc": null, "key": null}], "media": []}, {"id": 986, "active": true, "numRule": "11.8", "text": "Разрешено ли вратарю носить шлем, который отличается от шлемов его партнеров по команде по цвету и конструкции?", "refs": [{"num": "11.8", "doc": null, "key": null}], "media": []}, {"id": 987, "active": true, "numRule": "202.6", "text": "Обязан ли вратарь команды U-18 носить защиту шеи и горла?", "refs": [{"num": "202.6", "doc": null, "key": null}], "media": []}, {"id": 989, "active": true, "numRule": "9.11", "text": "Какая должна быть длина лезвия вратарского конька?", "refs": [{"num": "9.11", "doc": null, "key": null}], "media": []}, {"id": 990, "active": true, "numRule": "9.11", "text": "Допускается ли наличие дополнительных лезвий, выступов или иных «обманок» к ботинкам, обеспечивающие вратарю дополнительный контакт с ледовой поверхностью для устойчивости?", "refs": [{"num": "9.11", "doc": null, "key": null}], "media": []}, {"id": 991, "active": true, "numRule": "0", "text": "Разрешается ли заполнять полый черенок вратарской клюшки, каким бы то ни было материалом, ведущему к изменению веса, предназначения или цели использования?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 992, "active": true, "numRule": "10.2", "text": "Максимальная длина клюшки вратаря?", "refs": [{"num": "10.2", "doc": null, "key": null}], "media": []}, {"id": 994, "active": true, "numRule": "10.2", "text": "Максимальная длина расширенной части клюшки вратаря?", "refs": [{"num": "10.2", "doc": null, "key": null}], "media": []}, {"id": 995, "active": true, "numRule": "10.2", "text": "Максимальная ширина расширенной части клюшки вратаря?", "refs": [{"num": "10.2", "doc": null, "key": null}], "media": []}, {"id": 996, "active": true, "numRule": "10.2", "text": "Максимальная длина крюка клюшки вратаря?", "refs": [{"num": "10.2", "doc": null, "key": null}], "media": []}, {"id": 997, "active": true, "numRule": "10.2", "text": "Максимальная ширина крюка клюшки вратаря, за исключением пятки?", "refs": [{"num": "10.2", "doc": null, "key": null}], "media": []}, {"id": 998, "active": true, "numRule": "10.2", "text": "Максимальная ширина крюка клюшки вратаря в пятке?", "refs": [{"num": "10.2", "doc": null, "key": null}], "media": []}, {"id": 999, "active": true, "numRule": "9.4", "text": "Какая майка вратаря считается незаконной?", "refs": [{"num": "9.4", "doc": null, "key": null}], "media": []}, {"id": 1000, "active": true, "numRule": "9.12", "text": "Разрешается ли вратарю закреплять защиту горла к подбородку лицевой маски?", "refs": [{"num": "9.12", "doc": null, "key": null}], "media": []}, {"id": 1001, "active": true, "numRule": "0", "text": "Разрешается ли вратарю использовать перчатки, отличающиеся по цвету и дизайну от перчаток его партнеров по команде?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 1002, "active": true, "numRule": "10.4", "text": "Вратарь в обычную остановку матча приехал к скамейке игроков для замены клюшки.\nВаши действия?", "refs": [{"num": "10.4", "doc": null, "key": null}], "media": []}, {"id": 1003, "active": true, "numRule": "87.1", "text": "Вратарь во время телевизионного тридцатисекундного перерыва направляется к скамейке запасных для замены клюшки.\nВаши действия?", "refs": [{"num": "87.1", "doc": null, "key": null}], "media": []}, {"id": 1004, "active": true, "numRule": "10.4", "text": "Что должен сделать вратарь в остановку матча, если у него сломалась клюшка?", "refs": [{"num": "10.4", "doc": null, "key": null}], "media": []}, {"id": 1005, "active": true, "numRule": "8.2", "text": "Команда планирует произвести замену вратаря. Сколько времени для разминки  на льду ему будет предоставлено?", "refs": [{"num": "8.2", "doc": null, "key": null}], "media": []}, {"id": 1006, "active": true, "numRule": "5.3", "text": "Оба вратаря травмированы.\nВаши действия?", "refs": [{"num": "5.3", "doc": null, "key": null}], "media": []}, {"id": 1009, "active": true, "numRule": "76.1", "text": "Разрешено ли вратарю участвовать в процедуре вбрасывания шайбы?", "refs": [{"num": "76.1", "doc": null, "key": null}], "media": []}, {"id": 1010, "active": true, "numRule": "27", "text": "Можно ли на вратаря наложить штраф за нарушение правил?", "refs": [{"num": "27", "doc": null, "key": null}], "media": []}, {"id": 1011, "active": true, "numRule": "10.4", "text": "Может ли вратарь играть сломанной клюшкой?", "refs": [{"num": "10.4", "doc": null, "key": null}], "media": []}, {"id": 1012, "active": true, "numRule": "10.4", "text": "Имеет ли право вратарь использовать клюшку игрока?", "refs": [{"num": "10.4", "doc": null, "key": null}], "media": []}, {"id": 1013, "active": true, "numRule": "10.5", "text": "Имеет ли право вратарь использовать клюшку вратаря и игрока одновременно?", "refs": [{"num": "10.5", "doc": null, "key": null}], "media": []}, {"id": 1018, "active": true, "numRule": "69.1", "text": "Атакующий  игрок ударил по ловушке вратарю, после того, как вратарь прижал шайбу ловушкой ко льду.\nВаши действия?", "refs": [{"num": "69.1", "doc": null, "key": null}], "media": []}, {"id": 1019, "active": true, "numRule": "69.1", "text": "Атакующий игрок занял позицию в площади ворот, и по указанию Главного судьи не покидает её.\nВаши действия?", "refs": [{"num": "69.1", "doc": null, "key": null}], "media": []}, {"id": 1020, "active": true, "numRule": "11.9", "text": "Капитан команды «А» попросил измерить щитки вратаря команды «Б» во время первого периода.\nВаше решение?", "refs": [{"num": "11.9", "doc": null, "key": null}], "media": []}, {"id": 1023, "active": true, "numRule": "87.1", "text": "Вратарь подъехал к скамейке запасных хоккеистов во время тридцатисекундного перерыва, взятого его командой.\nВаши действия?", "refs": [{"num": "87.1", "doc": null, "key": null}], "media": []}, {"id": 1024, "active": true, "numRule": "87.1", "text": "Вратарь подъехал к скамейке запасных хоккеистов во время тридцатисекундного перерыва, взятого командой соперника.\nВаши действия?", "refs": [{"num": "87.1", "doc": null, "key": null}], "media": []}, {"id": 1027, "active": true, "numRule": "27.1", "text": "Какие штрафы вратарь может отбывать на скамейке штрафников?", "refs": [{"num": "27.1", "doc": null, "key": null}], "media": []}, {"id": 1029, "active": true, "numRule": "27.4", "text": "На вратаря наложен второй Дисциплинарный штраф в одном матче.\nКто будет отбывать штраф?", "refs": [{"num": "27.4", "doc": null, "key": null}], "media": []}, {"id": 1030, "active": true, "numRule": "27.7", "text": "У вратаря оба конька находятся за центральной красной линией (по отношению к его воротам), а он играет клюшкой в шайбу, которая находится до центральной красной линии. \nВаши действия?", "refs": [{"num": "27.7", "doc": null, "key": null}], "media": []}, {"id": 1031, "active": true, "numRule": "27.7", "text": "У вратаря оба конька находятся до центральной красной линии (по отношению к его воротам), и он играет клюшкой в шайбу, которая находится за центральной красной линией. \nВаши действия?", "refs": [{"num": "27.7", "doc": null, "key": null}], "media": []}, {"id": 1032, "active": true, "numRule": "10.4", "text": "Имеет ли право вратарь подъехать к своей скамейке игроков для замены клюшки во время игровых действий?", "refs": [{"num": "10.4", "doc": null, "key": null}], "media": []}, {"id": 1036, "active": true, "numRule": "63.2", "text": "Вратарь, прижимает шайбу клюшкой к борту с целью остановки матча.\nВаши действия?", "refs": [{"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 1039, "active": true, "numRule": "61.1, 69.3", "text": "Атакующий игрок находится в площади ворот и блокирует обзор вратарю, когда шайба попадает в ворота.\nВаши действия?", "refs": [{"num": "61.1", "doc": null, "key": null}, {"num": "69.3", "doc": null, "key": null}], "media": []}, {"id": 1040, "active": true, "numRule": "69.1", "text": "Атакующий игрок вне площади ворот и блокирует обзор вратарю, находясь спиной к вратарю, когда шайба попадает в ворота.\nВаши действия?", "refs": [{"num": "69.1", "doc": null, "key": null}], "media": []}, {"id": 1041, "active": true, "numRule": "9.5", "text": "Допускается ли использование вратарем защитных прокладок для локтя, сложенных в несколько слоев?", "refs": [{"num": "9.5", "doc": null, "key": null}], "media": []}, {"id": 1043, "active": true, "numRule": "82.1", "text": "Вратарь во время тридцатисекундного перерыва был заменен на игрока. Можно ли провести обратную замену до вбрасывания шайбы?", "refs": [{"num": "82.1", "doc": null, "key": null}], "media": []}, {"id": 1044, "active": true, "numRule": "82.1", "text": "Вратарь во время тридцатисекундного перерыва  был заменен на запасного вратаря. Можно ли провести обратную замену до вбрасывания шайбы?", "refs": [{"num": "82.1", "doc": null, "key": null}], "media": []}, {"id": 1045, "active": true, "numRule": "82.1", "text": "Вратарь во время тридцатисекундного перерыва  был заменен на запасного вратаря. Можно ли провести обратную замену после вбрасывания шайбы во время матча?", "refs": [{"num": "82.1", "doc": null, "key": null}], "media": []}, {"id": 1050, "active": true, "numRule": "71.1", "text": "При отложенном штрафе, команда, не нарушившая правила, совершает преждевременную замену вратаря на игрока, и остановка игры происходит в зоне защиты команды не нарушившей правила. \nГде будет вбрасывание?", "refs": [{"num": "71.1", "doc": null, "key": null}], "media": []}, {"id": 1055, "active": true, "numRule": "24.4", "text": "Вратарь сдвигает ворота с их установленного положения в серии бросков, определяющих победителя матча.\nВаши действия?", "refs": [{"num": "24.4", "doc": null, "key": null}], "media": []}, {"id": 1056, "active": true, "numRule": "69.4", "text": "Вратарь, находящийся за пределами своей площади ворот, атакует соперника в корпус, который пытается завладеть шайбой. \nВаши действия?", "refs": [{"num": "69.4", "doc": null, "key": null}], "media": []}, {"id": 1058, "active": true, "numRule": "9.6", "text": "Шлем вратаря слетает с его головы во время матча и шайба влетает в сетку ворот до того, как Главный судья дал свисток на остановку матча.\nВаши действия?", "refs": [{"num": "9.6", "doc": null, "key": null}], "media": []}, {"id": 1059, "active": true, "numRule": "9.6", "text": "Шлем вратаря слетает с его головы во время матча, а его команда в этот момент владеет шайбой.\nВаши действия?", "refs": [{"num": "9.6", "doc": null, "key": null}], "media": []}, {"id": 1060, "active": true, "numRule": "9.6", "text": "Шлем вратаря слетает с его головы во время матча, а шайбой владеет команда соперника в зоне защиты вратаря.\nВаши действия?", "refs": [{"num": "9.6", "doc": null, "key": null}], "media": []}, {"id": 1061, "active": true, "numRule": "9.6", "text": "Шлем вратаря слетает с его головы во время матча, а его команда в этот момент владеет шайбой в нейтральной зоне.\nГде будет вбрасывание?", "refs": [{"num": "9.6", "doc": null, "key": null}], "media": []}, {"id": 1062, "active": true, "numRule": "81.3", "text": "Вратарь оказался за пределами площади ворот в момент, когда шайба направлена на проброс, и возвращается в ворота, но делает движение в направлении шайбы.\nВаши действия?", "refs": [{"num": "81.3", "doc": null, "key": null}], "media": []}, {"id": 1063, "active": true, "numRule": "81.3", "text": "Вратарь оказался за пределами площади ворот в момент, когда шайба направлена на проброс, и возвращается в ворота не пытаясь играть в шайбу. Ваши действия?", "refs": [{"num": "81.3", "doc": null, "key": null}], "media": []}, {"id": 1064, "active": true, "numRule": "81.3", "text": "Вратарь оказался за пределами площади ворот в момент, когда шайба направлена на проброс, и не пытается вернуться в ворота.\nВаши действия?", "refs": [{"num": "81.3", "doc": null, "key": null}], "media": []}, {"id": 1065, "active": true, "numRule": "81.3", "text": "Вратарь направляется к своей скамейке во время матча и не пытается играть в шайбу, идущую на проброс.\nВаши действия?", "refs": [{"num": "81.3", "doc": null, "key": null}], "media": []}, {"id": 1068, "active": true, "numRule": "27.7", "text": "Какое решение должен принять Главный судья, по отношению к вратарю, в случае, если он участвует в праздновании заброшенной шайбы на половине поля команды соперника?", "refs": [{"num": "27.7", "doc": null, "key": null}], "media": []}, {"id": 1069, "active": true, "numRule": "12.1", "text": "Главный судья ранее предупредил Вратаря о приведении в порядок опасного элемента снаряжения, но Вратарь проигнорировал предупреждение судьи.\nВаши действия?", "refs": [{"num": "12.1", "doc": null, "key": null}], "media": []}, {"id": 1070, "active": true, "numRule": "71.1", "text": "Вратарь команды, владеющей шайбой, направляется к скамейке для замены на дополнительного игрока, однако замена происходит преждевременно.\nКогда нужно остановить матч?", "refs": [{"num": "71.1", "doc": null, "key": null}], "media": []}, {"id": 1071, "active": true, "numRule": "84.4", "text": "Может ли вратарь команды \"А\" находится на льду во время выполнения штрафного броска в ворота команды \"Б\"?", "refs": [{"num": "84.4", "doc": null, "key": null}], "media": []}, {"id": 1072, "active": true, "numRule": "27.6", "text": "Вратарь подъехал к своей скамейке игроков для замены клюшки во время остановки матча и направился обратно к своим воротам. \nВаши действия?", "refs": [{"num": "27.6", "doc": null, "key": null}], "media": []}, {"id": 1073, "active": true, "numRule": "5.3", "text": "Игрок переоделся во вратаря, так как два вратаря травмированны. Можно ли ему провести разминку на льду?", "refs": [{"num": "5.3", "doc": null, "key": null}], "media": []}, {"id": 1077, "active": true, "numRule": "69.2", "text": "Какое решение должен принять Главный судья, по отношению к игроку, который располагается вне площади ворот спиной к вратарю соперника и начинает размахивать руками или клюшкой перед лицом вратаря?", "refs": [{"num": "69.2", "doc": null, "key": null}], "media": []}, {"id": 1078, "active": true, "numRule": "69.2", "text": "Какое решение должен принять Главный судья, по отношению к игроку, который располагается в площади ворот спиной к вратарю соперника и начинает размахивать руками или клюшкой перед лицом вратаря?", "refs": [{"num": "69.2", "doc": null, "key": null}], "media": []}, {"id": 1079, "active": true, "numRule": "32.4", "text": "Главный судья фиксирует взятие ворот, после этого Линейный судья сообщает Главному, что команда, пропустившая гол, играла с нарушением численного состава.\nВаши действия?", "refs": [{"num": "32.4", "doc": null, "key": null}], "media": []}, {"id": 1081, "active": true, "numRule": "16.2", "text": "1. Выберите правильный вопрос, с помощью которого Вы должны определить может ли выйти на лед удаленный игрок со скамейки штрафников после взятия ворот", "refs": [{"num": "16.2", "doc": null, "key": null}], "media": []}, {"id": 1086, "active": true, "numRule": "1.2", "text": "Стандартный размер игровой площадки для проведения соревнований?", "refs": [{"num": "1.2", "doc": null, "key": null}], "media": []}, {"id": 1088, "active": true, "numRule": "5.5", "text": "Имеет ли право неигровой командный персонал, который находится на скамейке игроков во время матча, использовать какие-либо видеотехнические средства?", "refs": [{"num": "5.5", "doc": null, "key": null}], "media": []}, {"id": 1089, "active": true, "numRule": "5.5", "text": "Имеет ли право неигровой командный персонал, который находится рядом со скамейкой игроков во время матча, использовать какие-либо видеотехнические средства?", "refs": [{"num": "5.5", "doc": null, "key": null}], "media": []}, {"id": 1090, "active": true, "numRule": "6.1", "text": "Имеет ли право команда заменить своего капитана,  если он удален до конца матча?", "refs": [{"num": "6.1", "doc": null, "key": null}], "media": []}, {"id": 1091, "active": true, "numRule": "6.1", "text": "Имеет ли право команда заменить своего капитана,  если он получил травму и выбыл из игры?", "refs": [{"num": "6.1", "doc": null, "key": null}], "media": []}, {"id": 1092, "active": true, "numRule": "6.1, 6.2", "text": "Кто может обсуждать с Главным судьей  вопросы, связанные с применением и интерпретации Правил, во время матча?", "refs": [{"num": "6.1", "doc": null, "key": null}, {"num": "6.2", "doc": null, "key": null}], "media": []}, {"id": 1093, "active": true, "numRule": "6.1", "text": "Капитан выходит со скамейки игроков на лед, для обсуждения с Главным судьёй наложенного штрафа.\nВаши действия?", "refs": [{"num": "6.1", "doc": null, "key": null}], "media": []}, {"id": 1094, "active": true, "numRule": "6.1", "text": "Ассистент капитана выходит со скамейки игроков на лед, для обсуждения с Главным судьёй наложенного штрафа.\nВаши действия?", "refs": [{"num": "6.1", "doc": null, "key": null}], "media": []}, {"id": 1096, "active": true, "numRule": "102.2 и 202.2", "text": "Какая конструкция полной маски игрока до 18 лет разрешена?", "refs": [{"num": "102.2", "doc": null, "key": null}, {"num": "202.2", "doc": null, "key": null}], "media": []}, {"id": 1097, "active": true, "numRule": "202.2", "text": "У хоккеиста, во время игры сломалась решетчатая маска, каковы его дальнейшие действия?", "refs": [{"num": "202.2", "doc": null, "key": null}], "media": []}, {"id": 1098, "active": true, "numRule": "9.5", "text": "Хоккеист, у которого треснул козырек для защиты глаз покинул лед, разрешено ли ему дальнейшее участие в матче?", "refs": [{"num": "9.5", "doc": null, "key": null}], "media": []}, {"id": 1099, "active": true, "numRule": "9.7", "text": "У хоккеиста, во время игры сломался козырек для защиты глаз, каковы его дальнейшие действия?", "refs": [{"num": "9.7", "doc": null, "key": null}], "media": []}, {"id": 1101, "active": true, "numRule": "9.9", "text": "Разрешается ли  игроку приделывать к щиткам какие-либо выступы или дополнения, увеличивающие их размер?", "refs": [{"num": "9.9", "doc": null, "key": null}], "media": []}, {"id": 1102, "active": true, "numRule": "9.10", "text": "Разрешается ли  игроку использовать какие-либо приспособления, которые могли бы повысить скорость и маневренность?", "refs": [{"num": "9.10", "doc": null, "key": null}], "media": []}, {"id": 1103, "active": true, "numRule": "9.2", "text": "Может ли хоккеист принимать участие в матче с длинными волосами, которые закрывают фамилию или номер на майке?", "refs": [{"num": "9.2", "doc": null, "key": null}], "media": []}, {"id": 1104, "active": true, "numRule": "76.4", "text": "Может ли судья проводить вбрасывание шайбы, если один из игроков, разыгрывающих вбрасывание не готов к вбрасыванию шайбы, а другие хоккеисты заняли соответствующие позиции?", "refs": [{"num": "76.4", "doc": null, "key": null}], "media": []}, {"id": 1105, "active": true, "numRule": "76.6", "text": "После первого предупреждения команде на вбрасывании происходит повторное нарушение порядка вбрасывания той же командой. Действия судей?", "refs": [{"num": "76.6", "doc": null, "key": null}], "media": []}, {"id": 1107, "active": true, "numRule": "8.1", "text": "Имеет ли право хоккеист, из-за травмы которого был остановлен матч, оставаться на льду для продолжения матча?", "refs": [{"num": "8.1", "doc": null, "key": null}], "media": []}, {"id": 1108, "active": true, "numRule": "0 методика", "text": "Когда запасной (резервный) судья должен выйти на лед, если один из судей на льду получает травму, которая не дает ему возможности продолжать матч?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 1111, "active": true, "numRule": "74.1", "text": "Хоккеист, выходящий на лед, играет в шайбу, когда он и его партнер, уходящий со льда, находятся в полутораметровой зоне замены игроков?", "refs": [{"num": "74.1", "doc": null, "key": null}], "media": []}, {"id": 1112, "active": true, "numRule": "74.1", "text": "Хоккеист, уходящий со льда, играет в шайбу, когда он и его партнер, выходящий на лед, находятся в полутораметровой зоне замены игроков?", "refs": [{"num": "74.1", "doc": null, "key": null}], "media": []}, {"id": 1113, "active": true, "numRule": "74.1", "text": "Хоккеист, уходящий со льда, участвует в игровых действиях, когда он и его партнер, выходящий на лед, находятся в полутораметровой зоне замены игроков?", "refs": [{"num": "74.1", "doc": null, "key": null}], "media": []}, {"id": 1114, "active": true, "numRule": "63.3", "text": "После взятия ворот на лед вышло больше хоккеистов, чем находилось на льду, во время взятия ворот. Это привело к задержке продолжэения матча, и предупреждение этой команде уже было вынесено.\nВаши действия?", "refs": [{"num": "63.3", "doc": null, "key": null}], "media": []}, {"id": 1115, "active": true, "numRule": "63.3", "text": "После взятия ворот на лед вышло больше хоккеистов, чем находилось на льду, во время взятия ворот. Это привело к задержке продолжения матча.\nВаши действия?", "refs": [{"num": "63.3", "doc": null, "key": null}], "media": []}, {"id": 1116, "active": true, "numRule": "15.2", "text": "Шайбой владеет команда, на которую будет наложен штраф, что должен сделать Главный судья?", "refs": [{"num": "15.2", "doc": null, "key": null}], "media": []}, {"id": 1117, "active": true, "numRule": "15.2", "text": "Шайбой владеет команда не нарушившая правила, что должен сделать Главный судья?", "refs": [{"num": "15.2", "doc": null, "key": null}], "media": []}, {"id": 1118, "active": true, "numRule": "16.2", "text": "Что такое «игра команды в численном меньшинстве»?", "refs": [{"num": "16.2", "doc": null, "key": null}], "media": []}, {"id": 1119, "active": true, "numRule": "28.1", "text": "Что такое «Уполномоченные органы»?", "refs": [{"num": "28.1", "doc": null, "key": null}], "media": []}, {"id": 1120, "active": true, "numRule": "16.2", "text": "Имеет ли право оштрафованный игрок, команды играющей в численном меньшинстве, вернуться на лед раньше времени окончания Малого скамеечного штрафа?", "refs": [{"num": "16.2", "doc": null, "key": null}], "media": []}, {"id": 1121, "active": true, "numRule": "22.1", "text": "Какое суммарное время Дисциплинарного штрафа записывается в протокол матча?", "refs": [{"num": "22.1", "doc": null, "key": null}], "media": []}, {"id": 1122, "active": true, "numRule": "23.1", "text": "Какое суммарное время Дисциплинарного до конца матча штрафа записывается в протокол матча?", "refs": [{"num": "23.1", "doc": null, "key": null}], "media": []}, {"id": 1125, "active": true, "numRule": "22.1", "text": "Если в любое время матча на хоккеиста налагается второй Дисциплинарный штраф, то?", "refs": [{"num": "22.1", "doc": null, "key": null}], "media": []}, {"id": 1128, "active": true, "numRule": "19.2", "text": "Если на хоккеистов наложены совпадающие Большие плюс Дисциплинарные штрафы до конца матча, нужно ли помещать на скамейку оштрафованных дополнительных игроков?", "refs": [{"num": "19.2", "doc": null, "key": null}], "media": []}, {"id": 1130, "active": true, "numRule": "42.1", "text": "У хоккеиста было достаточно времени, что бы избежать контакт с соперником, после остановки матча, но он атакует соперника. \nВаши действия?", "refs": [{"num": "42.1", "doc": null, "key": null}], "media": []}, {"id": 1131, "active": true, "numRule": "59.2", "text": "Какой штраф должен быть наложен Главным судьей, за Толчок клюшкой?", "refs": [{"num": "59.2", "doc": null, "key": null}], "media": []}, {"id": 1132, "active": true, "numRule": "63.2.3", "text": "Хоккеист рукой выбрасывает шайбу за пределы игровой площадки из своей зоны защиты в любое место арены (за исключением случаев, где нет защитного стекла и это не скамейки запасных игроков).\nВаши действия?", "refs": [{"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 1133, "active": true, "numRule": "46.3", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который является зачинщиком драки?", "refs": [{"num": "46.3", "doc": null, "key": null}], "media": []}, {"id": 1134, "active": true, "numRule": "51.2", "text": "Какой штраф необходимо наложить на хоккеиста, который наносит ответный удар сопернику рукой в перчатке?", "refs": [{"num": "51.2", "doc": null, "key": null}], "media": []}, {"id": 1135, "active": true, "numRule": "47.2", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который пытается нанести удар сопернику головой?", "refs": [{"num": "47.2", "doc": null, "key": null}], "media": []}, {"id": 1137, "active": true, "numRule": "56", "text": "Игрок блокирует соперника, не давая ему возможности занять позицию для приема передачи. \nВаши действия?", "refs": [{"num": "56", "doc": null, "key": null}], "media": []}, {"id": 1138, "active": true, "numRule": "56.1, 56.2", "text": "Игрок \"ловит\" на бедро соперника, который пробросил шайбу в зону атаки, и мешает ему свободно катиться в зону атаки.\nВаши действия?", "refs": [{"num": "56.1", "doc": null, "key": null}, {"num": "56.2", "doc": null, "key": null}], "media": []}, {"id": 1139, "active": true, "numRule": "57.1", "text": "Хоккеист, первоначально выбивает шайбу клюшкой, после чего совершает подножку заставляя соперника упасть на лед.\nВаши действия?", "refs": [{"num": "57.1", "doc": null, "key": null}], "media": []}, {"id": 1142, "active": true, "numRule": "84.4.5", "text": "Могут ли вратари противоположных команд находиться одновременно на льду  в воротах во время выполнения штрафного броска?", "refs": [{"num": "84.4", "doc": null, "key": null}], "media": []}, {"id": 1143, "active": true, "numRule": "24.2", "text": "Игрок ломает клюшку в процессе выполнения штрафного броска и промахивается по воротам.\nВаши действия?", "refs": [{"num": "24.2", "doc": null, "key": null}], "media": []}, {"id": 1144, "active": true, "numRule": "67.5", "text": "Шайба находится в площади ворот, а защищающийся игрок намеренно падает на шайбу, когда вратарь убран со льда.\nВаши действия?", "refs": [{"num": "67.5", "doc": null, "key": null}], "media": []}, {"id": 1145, "active": true, "numRule": "67.5", "text": "Шайба находится в площади ворот, а защищающийся  игрок умышленно падает на шайбу, когда вратарь убран со льда.\nВаши действия?", "refs": [{"num": "67.5", "doc": null, "key": null}], "media": []}, {"id": 1146, "active": true, "numRule": "67.5", "text": "Шайба находится в площади ворот, а защищающийся игрок поднимает со льда шайбу рукой, когда вратарь убран со льда.\nВаши действия?", "refs": [{"num": "67.5", "doc": null, "key": null}], "media": []}, {"id": 1147, "active": true, "numRule": "67.5", "text": "Шайба находится в площади ворот,  защищающийся игрок подгребает под себя шайбу рукой, когда вратарь убран со льда.\nВаши действия?", "refs": [{"num": "67.5", "doc": null, "key": null}], "media": []}, {"id": 1148, "active": true, "numRule": "67.5", "text": "Шайба находится в площади ворот, а защищающийся игрок накрывает шайбу рукой, когда вратарь убран со льда.\nВаши действия?", "refs": [{"num": "67.5", "doc": null, "key": null}], "media": []}, {"id": 1149, "active": true, "numRule": "67.2", "text": "Шайба находится в площади ворот команды соперника, а атакующий  игрок намеренно падает на шайбу, когда вратарь убран со льда.\nВаши действия?", "refs": [{"num": "67.2", "doc": null, "key": null}], "media": []}, {"id": 1150, "active": true, "numRule": "6.1", "text": "Имеет ли право вратарь выполнять функции капитана команды?", "refs": [{"num": "6.1", "doc": null, "key": null}], "media": []}, {"id": 1151, "active": true, "numRule": "6.1", "text": "Имеет ли право вратарь выполнять функции ассистента капитана команды?", "refs": [{"num": "6.1", "doc": null, "key": null}], "media": []}, {"id": 1153, "active": true, "numRule": "11.9", "text": "Можно ли измерить ловушку вратаря после второго периода?", "refs": [{"num": "11.9", "doc": null, "key": null}], "media": []}, {"id": 1156, "active": true, "numRule": "11.8", "text": "Разрешается ли вратарю использовать  шлем, который отличается по цвету от шлемов его партнеров по команде?", "refs": [{"num": "11.8", "doc": null, "key": null}], "media": []}, {"id": 1157, "active": true, "numRule": "11.8", "text": "Разрешается ли вратарю использовать  шлем, который конструктивно отличается от шлемов его партнеров по команде?", "refs": [{"num": "11.8", "doc": null, "key": null}], "media": []}, {"id": 1158, "active": true, "numRule": "11.2", "text": "Допускается ли использование защиты из любого материала, закрывающией пространство между ледовой поверхностью и нижней кромкой вратарских щитков перед коньками?", "refs": [{"num": "11.2", "doc": null, "key": null}], "media": []}, {"id": 1159, "active": true, "numRule": "5.3", "text": "После замены обоих травмированных вратарей на переодетого, во вратарскую экипировку игрока, один из замененных вратарей хочет вернуться обратно в игру.\nВаши действия?", "refs": [{"num": "5.3", "doc": null, "key": null}], "media": []}, {"id": 1160, "active": true, "numRule": "5.1", "text": "Хоккеисты это?", "refs": [{"num": "5.1", "doc": null, "key": null}], "media": []}, {"id": 1162, "active": true, "numRule": "1.4", "text": "Является ли обязательным установка защитной сетки позади обоих ворот в конечных зонах при проведении соревнований по хоккею?", "refs": [{"num": "1.4", "doc": null, "key": null}], "media": []}, {"id": 1164, "active": true, "numRule": "66.1", "text": "Команда не может выставить на лед требуемое количество игроков, по причине наложенных штрафов. \nВаши действия?", "refs": [{"num": "66.1", "doc": null, "key": null}], "media": []}, {"id": 1165, "active": true, "numRule": "66.1", "text": "Команда не может выставить на лед требуемое количество игроков, по причине полученных травм. \nВаши действия?", "refs": [{"num": "66.1", "doc": null, "key": null}], "media": []}, {"id": 1166, "active": true, "numRule": "84.4.", "text": "Одна из команд отказывается от выполнения серии бросков, определяющих победителя матча.\nВаши действия?", "refs": [{"num": "84.4", "doc": null, "key": null}], "media": []}, {"id": 1167, "active": true, "numRule": "39.2", "text": "Какое наказание должен понести хоккеист, который оспаривает свое удаление?", "refs": [{"num": "39.2", "doc": null, "key": null}], "media": []}, {"id": 1168, "active": true, "numRule": "10.5", "text": "Сколько раз в течение  хоккейного матча,  можно требовать замер клюшки соперника?", "refs": [{"num": "10.5", "doc": null, "key": null}], "media": []}, {"id": 1169, "active": true, "numRule": "10.5", "text": "Сколько измерений клюшки соперника можно требовать в одну остановку матча?", "refs": [{"num": "10.5", "doc": null, "key": null}], "media": []}, {"id": 1170, "active": true, "numRule": "84.1", "text": "Производится ли заливка льда перед пятиминутным дополнительным периодом?", "refs": [{"num": "84.1", "doc": null, "key": null}], "media": []}, {"id": 1171, "active": true, "numRule": "76.2", "text": "Где будет проводиться вбрасывание, если сразу после взятия ворот, на пропустившую шайбу команду, будет наложен Малый штраф?", "refs": [{"num": "76.2", "doc": null, "key": null}], "media": []}, {"id": 1172, "active": true, "numRule": "76.2", "text": "Где будет проводиться вбрасывание, если сразу после взятия ворот, на забросившую шайбу команду, будет наложен Малый штраф?", "refs": [{"num": "76.2", "doc": null, "key": null}], "media": []}, {"id": 1173, "active": true, "numRule": "15.6, 76.2", "text": "Где будет проводиться вбрасывание, если на хоккеиста атакующей команды налагается штраф во время проведения вбрасывания в зоне атаки?", "refs": [{"num": "15.6", "doc": null, "key": null}, {"num": "76.2", "doc": null, "key": null}], "media": []}, {"id": 1181, "active": true, "numRule": "81.1", "text": "Атакующий Хоккеист бросил шайбу со своей половины поля до центральной красной линии, шайба попадает в перекладину или стойку ворот, и пересекает линию ворот. Шайба не попадает в ворота.\nВаше решение?", "refs": [{"num": "81.1", "doc": null, "key": null}], "media": []}, {"id": 1182, "active": true, "numRule": "76.2", "text": "Штраф должен быть наложен на защищающуюся команду, а атакующий игрок пересекает воображаемую линию, соединяющую внешние края кругов конечного вбрасывания в ситуации конфронитации.\nГде будет вбрасывание?", "refs": [{"num": "76.2", "doc": null, "key": null}], "media": []}, {"id": 1183, "active": true, "numRule": "76.2", "text": "В зоне атаки на игрока наложен Дисциплинарный штраф.\nГде будет вбрасывание?", "refs": [{"num": "76.2", "doc": null, "key": null}], "media": []}, {"id": 1184, "active": true, "numRule": "76.2", "text": "В зоне атаки на игрока наложен Дисциплинарный штраф до конца матча.\nГде будет вбрасывание?", "refs": [{"num": "76.2", "doc": null, "key": null}], "media": []}, {"id": 1185, "active": true, "numRule": "8.1, 76.2", "text": "Травмированный игрок в нейтральной зоне. \nГде будет проводиться вбрасывание, если его команда владеет шайбой в зоне защиты?", "refs": [{"num": "8.1", "doc": null, "key": null}, {"num": "76.2", "doc": null, "key": null}], "media": []}, {"id": 1186, "active": true, "numRule": "8.1, 76.2", "text": "Травмированный хоккеист в зоне защиты. \nГде будет проводиться вбрасывание, если его команда владеет шайбой в этой же зоне?", "refs": [{"num": "8.1", "doc": null, "key": null}, {"num": "76.2", "doc": null, "key": null}], "media": []}, {"id": 1187, "active": true, "numRule": "8.1", "text": "Травмированный хоккеист в зоне защиты.  \nГде будет проводиться вбрасывание, если его команда владеет шайбой в нейтральной зоне?", "refs": [{"num": "8.1", "doc": null, "key": null}], "media": []}, {"id": 1188, "active": true, "numRule": "8.1", "text": "Травмированный хоккеист в зоне защиты. \nГде будет проводиться вбрасывание, если его команда владеет шайбой в зоне атаки?", "refs": [{"num": "8.1", "doc": null, "key": null}], "media": []}, {"id": 1193, "active": true, "numRule": "76.2", "text": "Где будет проводиться вбрасывание, в случае, если кто-то из судей на льду получает травму?", "refs": [{"num": "76.2", "doc": null, "key": null}], "media": []}, {"id": 1194, "active": true, "numRule": "85.5", "text": "Где будет вбрасывание, если атакующий игрок совершает бросок по воротам, а шайба отскакивает от защищающегося хоккеиста, находящегося в своей зоне защиты и выходит из игры?", "refs": [{"num": "85.5", "doc": null, "key": null}], "media": []}, {"id": 1195, "active": true, "numRule": "85.5", "text": "Где будет вбрасывание, если атакующий игрок делает передачу вперед по льду, а шайба отскакивает за пределы площадки от защищающегося хоккеиста, находящегося в своей зоне защиты?", "refs": [{"num": "85.5", "doc": null, "key": null}], "media": []}, {"id": 1196, "active": true, "numRule": "85.5", "text": "Где будет проведено вбрасывание, если атакующий игрок бросает шайбу по воротам, а шайба отскакивает от защищающегося игрока, находящегося в нейтральной зоне и выходит из игры?", "refs":
