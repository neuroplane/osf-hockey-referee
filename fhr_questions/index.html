"media": []}, {"id": 733, "active": false, "numRule": "", "text": "Хоккеист наносит сопернику травму или  безответственно ставит под угрозу его жизнь и здоровье, в результате колющего удара.\nВаши действия?", "refs": [], "media": []}, {"id": 735, "active": false, "numRule": "", "text": "Хоккеист выбрасывает перчатку хоккеиста за пределы игровой поверхности.\nВаши действия?", "refs": [], "media": []}, {"id": 736, "active": false, "numRule": "", "text": "Что означает фраза \"На льду\" применительно к замене игроков во время матча?", "refs": [], "media": []}, {"id": 737, "active": false, "numRule": "", "text": "Что означает фраза \"Вне льда\" применительно к замене игроков во время матча?", "refs": [], "media": []}, {"id": 743, "active": false, "numRule": "", "text": "Какой штраф должен быть наложен на атакующего хоккеиста, который намеренно тормозит перед вратарем и направляет осколки льда во вратаря команды соперника, прижимающего шайбу для остановки матча?", "refs": [], "media": []}, {"id": 744, "active": false, "numRule": "", "text": "Какой штраф необходимо наложить, если невозможно определить, того кто бросил клюшку со скамейки запасных на лед?", "refs": [], "media": []}, {"id": 745, "active": false, "numRule": "", "text": "Какой штраф необходимо наложить, если невозможно определить, того кто бросил пластиковую бутылку со скамейки запасных на лед?", "refs": [], "media": []}, {"id": 749, "active": false, "numRule": "", "text": "Главный судья фиксирует нарушение правил Задержка клюшкой, а не нарушивший правила игрок приукрашивает нарушение падая на лед, показывая тем самым судье, что против него нарушены правила.\nВаши действия по отношению к такому хоккеисту?", "refs": [], "media": []}, {"id": 750, "active": false, "numRule": "", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который нанес сопернику удар локтем?", "refs": [], "media": []}, {"id": 752, "active": false, "numRule": "", "text": "Какое решение должен принять Главный судья, по отношению к официальному представителю команды, который предпринимает ответные действия зрителю?", "refs": [], "media": []}, {"id": 753, "active": false, "numRule": "", "text": "Хоккеист определен, как Зачинщик и Агрессор в Драке. Какой дополнительный штраф на него должны быть наложен, помимо прочих возможных?", "refs": [], "media": []}, {"id": 754, "active": false, "numRule": "", "text": "Во время стычки перед воротами двое игроков выясняют отношения, в это время в стычку вступает третий игрок. Главный судья накладывает на одного игрока Малый штраф, а на другого Большой плюс Дисциплинарный до конца матча штраф за грубость. \nДействия главного судьи в отношении третьего игрока?", "refs": [], "media": []}, {"id": 755, "active": false, "numRule": "", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который случайно наносит травму сопернику высоко поднятой клюшкой?", "refs": [], "media": []}, {"id": 756, "active": false, "numRule": "", "text": "Хоккеист, получивший травму, отказывается покинуть лед для оказания медицинской помощи после наложения на него Малого штрафа. \nВаши действия?", "refs": [], "media": []}, {"id": 760, "active": false, "numRule": "", "text": "Во время матча, игрок со скамейки запасных  играет в шайбу, проходящую рядом с бортом.\nВаши действия?", "refs": [], "media": []}, {"id": 761, "active": false, "numRule": "", "text": "Атакующий хоккеист контролирует шайбу и двигается лицом вперед и контактирует с вратарем, находящимся в площади своих ворот, а шайба при этом входит в ворота.\nВаши действия?", "refs": [], "media": []}, {"id": 762, "active": false, "numRule": "", "text": "Атакующий хоккеист контролирует шайбу и двигается спиной вперед и контактирует с вратарем, находящимся в площади своих ворот, а шайба при этом входит в ворота.\nВаши действия?", "refs": [], "media": []}, {"id": 763, "active": false, "numRule": "", "text": "Атакующий хоккеист, во время выполнения Штрафного броска, контролирует шайбу и двигается спиной вперед и контактирует с вратарем, находящимся в площади своих ворот, а шайба при этом входит в ворота.\nВаши действия?", "refs": [], "media": []}, {"id": 764, "active": false, "numRule": "", "text": "Атакующий хоккеист, во время выполнения Штрафного броска, контролирует шайбу и двигается лицом вперед и контактирует с вратарем, находящимся в площади своих ворот, а шайба при этом входит в ворота.\nВаши действия?", "refs": [], "media": []}, {"id": 765, "active": false, "numRule": "", "text": "Атакующий хоккеист, во время выполнения бросков, определяющих победителя матча, контролирует шайбу и двигается лицом вперед и контактирует с вратарем, находящимся в площади своих ворот, а шайба при этом входит в ворота.\nВаши действия?", "refs": [], "media": []}, {"id": 766, "active": false, "numRule": "", "text": "Атакующий хоккеист, во время выполнения бросков, определяющих победителя матча, контролирует шайбу и двигается спиной вперед и контактирует с вратарем, находящимся в площади своих ворот, а шайба при этом входит в ворота.\nВаши действия?", "refs": [], "media": []}, {"id": 767, "active": false, "numRule": "", "text": "Вратарь владеет шайбой позади своих ворот, а атакующий хоккеист с силой отталкивает его и завладевает шайбой. \nВаши действия?", "refs": [], "media": []}, {"id": 768, "active": false, "numRule": "", "text": "Какие штрафы могут быть на наложены на хоккеиста, который поднимает клюшку, поставленную между ног соперника, чтобы ударить хоккеиста в область паха?", "refs": [], "media": []}, {"id": 771, "active": false, "numRule": "", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который наносит травму сопернику или безответственно подвергает опасности его жизнь и здоровье, применив против него подножку?", "refs": [], "media": []}, {"id": 775, "active": false, "numRule": "", "text": "Хоккеист отказывается отправиться непосредственно на скамейку штрафников после наложения на него штрафа за драку.", "refs": [], "media": []}, {"id": 776, "active": false, "numRule": "", "text": "После предупреждений хоккеист, продолжает провоцировать соперника к ответным действиям, за которые он может быть подвергнут штрафу.\nВаши действия?", "refs": [], "media": []}, {"id": 781, "active": false, "numRule": "", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который опрометчиво наносит сопернику удар локтем подвергая его здоровье опасности?", "refs": [], "media": []}, {"id": 782, "active": false, "numRule": "", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который нанес сопернику травму в результате удара локтем?", "refs": [], "media": []}, {"id": 785, "active": false, "numRule": "", "text": "Какой штраф должен быть наложен на хоккеистов, покидающих скамейку штрафников вслед за первым хоккеистом, покинувшим скамейку во время конфрантации хоккеистов на льду?", "refs": [], "media": []}, {"id": 787, "active": false, "numRule": "", "text": "Какие штрафы должны быть наложены, если хоккеисты одной команды покидают свою скамейку, увидев, что соперники уже покинули свою скамейку первыми во время конфрантации?", "refs": [], "media": []}, {"id": 788, "active": false, "numRule": "141", "text": "Можно ли наложить на одного хоккеиста одновременно Дисциплинарный до конца матча штраф и Матч-штраф за продолжение Драки?", "refs": [{"num": "141", "doc": null, "key": null}], "media": []}, {"id": 789, "active": false, "numRule": "", "text": "Хоккеист безответственно подвергает опстности соперника в связи с игрой высоко поднятой клюшкой. \nВаши действия?", "refs": [], "media": []}, {"id": 791, "active": false, "numRule": "", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который совершает контакт с верхней частью тела соперника после броска шайбы?", "refs": [], "media": []}, {"id": 792, "active": false, "numRule": "", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который задерживает соперника у борта с помощью нижней части тела, чтобы не позволить тому отъехать от бортов площадки, не предпринимая усилий сыграть в шайбу?", "refs": [], "media": []}, {"id": 794, "active": false, "numRule": "", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который наносит травму или безответственно подвергает опасности жизнь и здоровье соперника, задерживая его клюшкой?", "refs": [], "media": []}, {"id": 798, "active": false, "numRule": "10.5", "text": "Клюшка имеет два крюка. Как необходимо произвести замер?", "refs": [{"num": "10.5", "doc": null, "key": null}], "media": []}, {"id": 799, "active": false, "numRule": "", "text": "Игрок команды «А», преследуя противника в нейтральной зоне, проезжает мимо сломанной клюшки лежащей на льду и толкает её в направлении игрока ведущего шайбу. \nВаши действия?", "refs": [], "media": []}, {"id": 800, "active": false, "numRule": "", "text": "Игрок команды «А» №7  не владеет шайбой и находится за воротами команды «Б», затем он двигается через площадь ворот и сталкивается с вратарём команды «Б», который выкатился под бросок. \nВаши действия?", "refs": [], "media": []}, {"id": 802, "active": false, "numRule": "", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который располагается вне площади ворот лицом к вратарю соперника и начинает размахивать руками или клюшкой перед лицом вратаря?", "refs": [], "media": []}, {"id": 804, "active": false, "numRule": "49.3, 49.5", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который наносит удар ногой по хоккеисту команды соперника?", "refs": [{"num": "49.3", "doc": null, "key": null}, {"num": "49.5", "doc": null, "key": null}], "media": []}, {"id": 805, "active": false, "numRule": "49.3, 49.5", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который пытается нанести удар ногой по хоккеисту команды соперника?", "refs": [{"num": "49.3", "doc": null, "key": null}, {"num": "49.5", "doc": null, "key": null}], "media": []}, {"id": 806, "active": false, "numRule": "", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который наносит травму или безответственно подвергает опасности жизнь и здоровье соперника, нанося ему удар коленом?", "refs": [], "media": []}, {"id": 808, "active": false, "numRule": "", "text": "Хоккеист, покидает скамейку штрафников до истечения его штрафного времени, чтобы инициировать конфрантацию.\nВаши действия?", "refs": [], "media": []}, {"id": 809, "active": false, "numRule": "", "text": "Хоккеист, покидает скамейку штрафников до истечения его штрафного времени, чтобы вступить в уже идущую драку.\nВаши действия?", "refs": [], "media": []}, {"id": 810, "active": false, "numRule": "61", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который замахивается клюшкой на другого хоккеиста во время конфронтации?", "refs": [{"num": "61", "doc": null, "key": null}], "media": []}, {"id": 811, "active": false, "numRule": "", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который наносит опасный удар по ноге хоккеиста команды соперника сзади, одновременно оттаскивая его назад, тем самым пытаясь сбить его с ног?", "refs": [], "media": []}, {"id": 812, "active": false, "numRule": "", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который наносит опасный удар по коньку хоккеиста команды соперника сзади, одновременно оттаскивая его назад, тем самым пытаясь сбить его с ног?", "refs": [], "media": []}, {"id": 815, "active": false, "numRule": "", "text": "Хоккеист наносит сопернику травму, в результате колющего удара, удерживая клюшку одной рукой.\nВаши действия?", "refs": [], "media": []}, {"id": 818, "active": false, "numRule": "", "text": "Хоккеист наносит сопернику травму, в результате колющего удара, удерживая клюшку двумя руками.\nВаши действия?", "refs": [], "media": []}, {"id": 819, "active": false, "numRule": "", "text": "Какое решение должен принять Главный судья, по отношению к официальному представителю команды, который  плюет в соперника на ледовой площадке во время матча?", "refs": [], "media": []}, {"id": 820, "active": false, "numRule": "", "text": "Какое решение должен принять Главный судья, по отношению к официальному представителю команды, который  плюет в кого-либо на ледовой площадке во время матча?", "refs": [], "media": []}, {"id": 821, "active": false, "numRule": "", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который  плюет в соперника на ледовой площадке во время матча?", "refs": [], "media": []}, {"id": 822, "active": false, "numRule": "", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который  плюет в кого-либо на ледовой площадке во время матча?", "refs": [], "media": []}, {"id": 823, "active": false, "numRule": "", "text": "Хоккеист, у которого имеется кровотечение, умышленно вытирает кровь о соперника на ледовой площадке.\nВаши действия?", "refs": [], "media": []}, {"id": 834, "active": false, "numRule": "", "text": "Хоккеист на льду бросает сломанную клюшку в шайбу в своей зоне атаки.\nВаши действия?", "refs": [], "media": []}, {"id": 841, "active": false, "numRule": "", "text": "Хоккеист бросает перчатку, лежащую на льду, в соперника, выходящего один на один с вратарем.\nВаши действия?", "refs": [], "media": []}, {"id": 842, "active": false, "numRule": "", "text": "Хоккеист бросает свою клюшку в соперника, выходящего один на один с вратарем.\nВаши действия?", "refs": [], "media": []}, {"id": 843, "active": false, "numRule": "", "text": "Хоккеист бросает свою клюшку в соперника, выходящего один на один с пустыми воротами. В ситуации когда вратарь покинул ледовую площадку.\nВаши действия?", "refs": [], "media": []}, {"id": 844, "active": false, "numRule": "", "text": "Хоккеист бросает часть сломанной клюшки, лежащей на льду, в соперника, который выходит один на один с пустыми воротами. В ситуации когда вратарь покинул ледовую площадку.\nВаши действия?", "refs": [], "media": []}, {"id": 845, "active": false, "numRule": "", "text": "Хоккеист бросает часть сломанной клюшки, лежащей на льду, в соперника, который владеет шайбой в нейтральной зоне. В ситуации когда вратарь покинул ледовую площадку.\nВаши действия?", "refs": [], "media": []}, {"id": 846, "active": false, "numRule": "", "text": "Вратарь меняется во время матча на дополнительного хоккеиста, оставляя свои ворота пустыми. При каком условии вратарь будет считаться покинувшим лед?", "refs": [], "media": []}, {"id": 848, "active": false, "numRule": "", "text": "Главный судья фиксирует взятие ворот, после этого Линейный судья сообщает Главному судье, что команда, забившая гол, произвела неправильную замену игроков перед голом.\nВаши действия?", "refs": [], "media": []}, {"id": 850, "active": false, "numRule": "", "text": "Главный судья фиксирует взятие ворот, после этого Линейный судья сообщает Главному, что команда, забивая гол, играла с нарушением численного состава.\nВаши действия?", "refs": [], "media": []}, {"id": 859, "active": false, "numRule": "", "text": "Представитель команды, после окончания матча использует непристойные, грубые или оскорбительные выражения в адрес любого лица на льду после окончания матча. Малый или Малый скамеечные штрафы на него ранее не были наложены.\nВаши действия?", "refs": [], "media": []}, {"id": 860, "active": false, "numRule": "", "text": "Определенный хоккеист, находящейся за пределами льда выбрасывает на лед клюшку или любой другой предмет.\nВаши действия?", "refs": [], "media": []}, {"id": 861, "active": false, "numRule": "", "text": "Представитель команды, находящейся за пределами льда выбрасывает на лед клюшку или любой другой предмет.\nВаши действия?", "refs": [], "media": []}, {"id": 864, "active": false, "numRule": "", "text": "Какое решение должен принять Главный судья, если против атакующего полевого игрока, выходящего один на один с вратарем применяется запрещенный прием сзади?", "refs": [], "media": []}, {"id": 865, "active": false, "numRule": "", "text": "В какое время матча может применяться термин  \"Умышленное нарушение численного состава\"?", "refs": [], "media": []}, {"id": 874, "active": false, "numRule": "", "text": "Полевой игрок ломает клюшку в процессе выполнения Штрафного броска.\nВаши действия?", "refs": [], "media": []}, {"id": 878, "active": false, "numRule": "179", "text": "Шайба находится в площади ворот, а полевой игрок намеренно падает на шайбу, когда вратарь убран со льда.\nВаши действия?", "refs": [{"num": "179", "doc": null, "key": null}], "media": []}, {"id": 879, "active": false, "numRule": "179", "text": "Шайба находится в площади ворот, а полевой игрок накрывает шайбу рукой, когда вратарь убран со льда.\nВаши действия?", "refs": [{"num": "179", "doc": null, "key": null}], "media": []}, {"id": 880, "active": false, "numRule": "179", "text": "Шайба находится в площади ворот, а полевой игрок поднимает со льда шайбу рукой, когда вратарь убран со льда.\nВаши действия?", "refs": [{"num": "179", "doc": null, "key": null}], "media": []}, {"id": 881, "active": false, "numRule": "", "text": "Сможет ли хоккеист, штрафное время  которого не закончилось в основное время матча участвовать в проведения серии бросков, определяющих победителя матча?", "refs": [], "media": []}, {"id": 883, "active": false, "numRule": "", "text": "Полевой игрок, выходящий один на один, сохраняет контроль над шайбой после совершения против него нарушения правил сзади.\nВаши действия?", "refs": [], "media": []}, {"id": 891, "active": false, "numRule": "", "text": "Если команда, нарушившая правила, не контролирует шайбу, а Главный судья поднимает руку, показывая намерение наложить штраф. Когда он сможет остановить матч и наложить штраф?", "refs": [], "media": []}, {"id": 892, "active": false, "numRule": "", "text": "1. Если команда, нарушившая правила, не контролирует шайбу, а Главный судья поднимает руку, показывая намерение наложить штраф. Когда он сможет остановить матч и наложить штраф?", "refs": [], "media": []}, {"id": 893, "active": false, "numRule": "", "text": "Игрок команды «А» находится в положении выхода один на один. Игрок защищающейся команды, находясь за своими воротами, сдвигает их.", "refs": [], "media": []}, {"id": 895, "active": false, "numRule": "", "text": "Игрок команды «А», в положении выхода один на один, атакован сзади игроком команды «Б» с нарушением правил, за которое полагается наложение Малого плюс Дисциплинарного штрафа.\nВаши действия?", "refs": [], "media": []}, {"id": 896, "active": false, "numRule": "", "text": "Игрок команды «А», в положении выхода один на один, атакован сзади игроком команды «Б» с нарушением правил, за которое полагается наложение Матч-штрафа.", "refs": [], "media": []}, {"id": 905, "active": false, "numRule": "", "text": "Врач команды со скамейки игроков бросает шлем в соперника, владеющего шайбой в своей зоне защиты.\nВаши действия?", "refs": [], "media": []}, {"id": 911, "active": false, "numRule": "", "text": "Хоккеист со скамейки игроков направляет потерянную клюшку, лежащую на льду, в шайбу, находящуюся в зоне защиты команды соперника. \nВаши действия?", "refs": [], "media": []}, {"id": 912, "active": false, "numRule": "", "text": "Хоккеист со скамейки штрафников направляет перчатку, лежащую на льду в шайбу, находящуюся в зоне защиты команды соперника. \nВаши действия?", "refs": [], "media": []}, {"id": 913, "active": false, "numRule": "", "text": "Хоккеист сдвигает свои ворота с их нормального положения в момент, когда полевой игрок выходит один на один с вратарем.\nВаши действия?", "refs": [], "media": []}, {"id": 915, "active": false, "numRule": "", "text": "Какое решение должен принять Главный судья, по отношению к полевому игроку, который прячет подобранную со льда шайбу в руках в своей площади ворот?", "refs": [], "media": []}, {"id": 918, "active": false, "numRule": "", "text": "Имеет ли право полевой игрок выполнять функции вратаря при выполнении серии бросков, определяющих победителя матча?", "refs": [], "media": []}, {"id": 919, "active": false, "numRule": "", "text": "Имеет ли право полевой игрок выполнять функции вратаря при выполнении Штрафных бросков?", "refs": [], "media": []}, {"id": 920, "active": false, "numRule": "", "text": "Имеет ли право полевой игрок выполнять функции вратаря при выполнении серии бросков, определяющих победителя матча?", "refs": [], "media": []}, {"id": 921, "active": false, "numRule": "", "text": "Полевой игрок, выполняющий Штрафной бросок, падает, но шайба продолжает двигаться вперед. Может ли он встать и продолжить выполнение Штрафного броска?", "refs": [], "media": []}, {"id": 922, "active": false, "numRule": "", "text": "При выполнении штрафного броска шайба попадает в заградительное стекло позади вратаря, отскакивает обратно, попадает в спину вратаря и входит в ворота. \nВаши действия?", "refs": [], "media": []}, {"id": 923, "active": false, "numRule": "", "text": "Полевой игрок, выполняющий штрафной бросок, бросает шайбу. Она отскакивает обратно от вратаря, попадает в игрока, выполняющего бросок, и попадает в ворота. \nВаши действия?", "refs": [], "media": []}, {"id": 931, "active": false, "numRule": "", "text": "Когда Штрафной бросок считается выполненным?", "refs": [], "media": []}, {"id": 932, "active": false, "numRule": "", "text": "Когда Штрафной бросок считается выполненным?", "refs": [], "media": []}, {"id": 933, "active": false, "numRule": "", "text": "Когда Штрафной бросок считается выполненным?", "refs": [], "media": []}, {"id": 934, "active": false, "numRule": "", "text": "Когда Штрафной бросок считается выполненным?", "refs": [], "media": []}, {"id": 937, "active": false, "numRule": "24.4", "text": "Хоккеист команды соперника отвлекает игрока, выполняющего штрафной бросок, в результате чего бросок оказывается неудачным. \nВаши действия?", "refs": [{"num": "24.4", "doc": null, "key": null}], "media": []}, {"id": 938, "active": false, "numRule": "24.4", "text": "Представитель команды соперника отвлекает игрока, выполняющего штрафной бросок, в результате чего бросок оказывается неудачным. \nВаши действия?", "refs": [{"num": "24.4", "doc": null, "key": null}], "media": []}, {"id": 941, "active": false, "numRule": "", "text": "Полевой игрок, выполняющий штрафной бросок, совершает бросок шайбы и она попадает в штангу ворот, а затем пересекает линию ворот рикошетом от вратаря.\nВаши действия?", "refs": [], "media": []}, {"id": 948, "active": false, "numRule": "", "text": "Как определить, что полевой игрок травмирован и не может выполнять Штрафной бросок?", "refs": [], "media": []}, {"id": 949, "active": false, "numRule": "24.6", "text": "Может ли быть назначено два Штрафных броска в пользу одной команды и в одну остановку матча?", "refs": [{"num": "24.6", "doc": null, "key": null}], "media": []}, {"id": 956, "active": false, "numRule": "", "text": "Во время матча, игрок со скамейки запасных  играет в шайбу, проходящую рядом с бортом, за пределами синей линии зоны защиты. Вратарь убран со льда.\nВаши действия?", "refs": [], "media": []}, {"id": 957, "active": false, "numRule": "", "text": "Во время матча, представитель команды со скамейки запасных  играет в шайбу, проходящую рядом с бортом, за пределами синей линии зоны защиты. Вратарь убран со льда.\nВаши действия?", "refs": [], "media": []}, {"id": 964, "active": false, "numRule": "", "text": "Шайба попала в судью. В каких случаях игра должна быть остановлена?", "refs": [], "media": []}, {"id": 965, "active": false, "numRule": "", "text": "Кто может быть привлечен  к ответственности в соответствии с Кодексом поведения ИИХФ за деятельность связанную с подтасовкой результатов соревнований?", "refs": [], "media": []}, {"id": 966, "active": false, "numRule": "", "text": "Игрок преждевременно покинул скамейку штрафников самовольно в результате своей ошибки  и он успел смениться в тот момент, когда его команда забрасывает шайбу в ворота. \nВаши действия?", "refs": [], "media": []}, {"id": 968, "active": false, "numRule": "", "text": "Шайба, брошенная атакующим хоккеистом из нейтральной зоны, попадает в защитную сетку за воротами, срикошетив в зоне атаки от защищающегося хоккеиста.\nГде будет вбрасывание?", "refs": [], "media": []}, {"id": 975, "active": false, "numRule": "", "text": "Может ли вратарь выполнять функции ассистента капитана команды?", "refs": [], "media": []}, {"id": 977, "active": false, "numRule": "", "text": "Можно ли измерить клюшку вратаря перед дополнительным периодом?", "refs": [], "media": []}, {"id": 979, "active": false, "numRule": "", "text": "Можно ли измерить ловушку вратаря после второго периода?", "refs": [], "media": []}, {"id": 988, "active": false, "numRule": "", "text": "Допускается ли наличие какой бы то ни было защиты из любого материала, закрывающих пространство между ледовой поверхностью и нижней кромкой вратарских щитков перед коньками?", "refs": [], "media": []}, {"id": 993, "active": false, "numRule": "0", "text": "Максимальная ширина и толщина черенка клюшки вратаря?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 1007, "active": false, "numRule": "", "text": "После замены обоих травмированных вратарей на переодетого, во вратарскую экипировку, полевого игрока один из замененных вратарей хочет вернуться обратно в игру.\nВаши действия?", "refs": [], "media": []}, {"id": 1008, "active": false, "numRule": "202", "text": "Можно ли заявить на матч трех вратарей?", "refs": [{"num": "202", "doc": null, "key": null}], "media": []}, {"id": 1014, "active": false, "numRule": "63.2", "text": "Вратарь намеренно сдвигает каркас ворот с его нормального положения во втором периоде матча.\nВаши действия?", "refs": [{"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 1015, "active": false, "numRule": "", "text": "Допускается ли контакт с вратарем, инициированный полевым игроком?", "refs": [], "media": []}, {"id": 1016, "active": false, "numRule": "", "text": "Допускается ли случайный контакт полевого игрока с вратарем?", "refs": [], "media": []}, {"id": 1017, "active": false, "numRule": "", "text": "Соперник толкает атакующего полевого хоккеиста на своего вратаря. Можно ли считать, что такой контакт с вратарем инициировал атакующий хоккеист?", "refs": [], "media": []}, {"id": 1021, "active": false, "numRule": "", "text": "Вратарь выбрасывает шайбу вперед, и первым шайбы касается хоккеист команды соперника. \nВаши действия?", "refs": [], "media": []}, {"id": 1022, "active": false, "numRule": "", "text": "Вратарь выбрасывает шайбу вперед, и первым шайбы касается партнер по команде.\nВаши действия?", "refs": [], "media": []}, {"id": 1025, "active": false, "numRule": "", "text": "Вратарь подъехал к скамейке запасных хоккеистов во время тридцатисекундного перерыва , взятого его командой.\nВаши действия?", "refs": [], "media": []}, {"id": 1026, "active": false, "numRule": "", "text": "Вратарь подъехал к скамейке запасных хоккеистов во время  тридцатисекундного перерыва, взятого командой соперника.\nВаши действия?", "refs": [], "media": []}, {"id": 1028, "active": false, "numRule": "", "text": "На вратаря наложен Дисциплинарный штраф.\nКак будет отбываться штраф?", "refs": [], "media": []}, {"id": 1033, "active": false, "numRule": "", "text": "Какое решение должен принять Главный судья, по отношению к вратарю, действия которого приводят к остановке или задержке игры в результате ремонта либо подгонки своего снаряжения?", "refs": [], "media": []}, {"id": 1034, "active": false, "numRule": "63.6", "text": "Если вратарь защищающейся команды намеренно сдвигает каркас своих ворот с их нормального положения в последние две минуты основного времени матча, при этом шайба находится в его зоне защиты, какой штраф должен наложить Главный судья?", "refs": [{"num": "63.6", "doc": null, "key": null}], "media": []}, {"id": 1035, "active": false, "numRule": "63.6", "text": "Если вратарь защищающейся команды намеренно сдвигает каркас своих ворот с их нормального положения в дополнительном периоде, при этом шайба находится в его зоне защиты, какой штраф должен наложить Главный судья?", "refs": [{"num": "63.6", "doc": null, "key": null}], "media": []}, {"id": 1037, "active": false, "numRule": "63.2", "text": "Вратарь, прижимает шайбу коньками к борту с целью остановки матча.\nВаши действия?", "refs": [{"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 1038, "active": false, "numRule": "", "text": "Атакующий полевой игрок выбил клюшку из рук вратаря.\nВаши действия?", "refs": [], "media": []}, {"id": 1042, "active": false, "numRule": "", "text": "Шайба попадает в маску вратаря и, срикошетив от нее, и пересекает линию ворот.\nВаши действия?", "refs": [], "media": []}, {"id": 1046, "active": false, "numRule": "", "text": "Вратарь направляется к скамейке хоккеистов с целью его замены на дополнительного полевого хоккеиста, но замена производится преждевременно.\nНужно ли останавливать матч?", "refs": [], "media": []}, {"id": 1047, "active": false, "numRule": "", "text": "Остановка матча связана с преждевременной заменой вратаря на полевого игрока. Шайба находится за центральной красной линией, на половине поля соперника. \nГде будет вбрасывание?", "refs": [], "media": []}, {"id": 1048, "active": false, "numRule": "", "text": "Остановка матча связана с преждевременной заменой вратаря на полевого игрока. Шайба находится в зоне атаки команды, нарушившей правила. \nГде будет вбрасывание?", "refs": [], "media": []}, {"id": 1049, "active": false, "numRule": "", "text": "Остановка матча связана с преждевременной заменой вратаря на полевого игрока. Шайба находится до центральной красной линии, на половине поля команды нарушившей правила. \nГде будет вбрасывание?", "refs": [], "media": []}, {"id": 1051, "active": false, "numRule": "", "text": "Какой хоккеист может отбывать штрафное время за нарушение, которое совершил вратарь?", "refs": [], "media": []}, {"id": 1052, "active": false, "numRule": "", "text": "Может ли полевой игрок отбывать штраф за вратаря, если на него тоже наложен штраф в эту остановку матча?", "refs": [], "media": []}, {"id": 1053, "active": false, "numRule": "210", "text": "Имеет ли право вратарь, подъехать к своей скамейке игроков для замены клюшки в ходе игры?", "refs": [{"num": "210", "doc": null, "key": null}], "media": []}, {"id": 1054, "active": false, "numRule": "", "text": "Вратарь сдвигает ворота с их установленного положения во время выполнения штрафного броска.\nВаши действия?", "refs": [], "media": []}, {"id": 1057, "active": false, "numRule": "75.4.6", "text": "Вратарь получил второе предупреждение в матче, в связи с опасными персональными аксессуарами.\nВаши действия?", "refs": [{"num": "75.4", "doc": null, "key": null}], "media": []}, {"id": 1066, "active": false, "numRule": "", "text": "Вратарь, находясь на скамейке для игроков, во время остановки матча, совершает нарушение правил против игрока команды соперника. \nКто будет отбывать штраф?", "refs": [], "media": []}, {"id": 1067, "active": false, "numRule": "", "text": "Вратарь, находясь на скамейке для игроков, во время игровых действий, совершает нарушение правил против игрока команды соперника. \nКто будет отбывать штраф?", "refs": [], "media": []}, {"id": 1074, "active": false, "numRule": "", "text": "Главный судья фиксирует нарушение правил Задержка клюшкой, а не нарушивший правила игрок приукрашивает нарушение падая на лед, показывая тем самым судье, что против него нарушены правила.\nВаши действия по отношению к такому хоккеисту?", "refs": [], "media": []}, {"id": 1075, "active": false, "numRule": "59", "text": "Вбрасывание выиграно пасом рукой и шайбой завладел партнер по команде. Ваши действия?", "refs": [{"num": "59", "doc": null, "key": null}], "media": []}, {"id": 1076, "active": false, "numRule": "116", "text": "Какой штраф должен быть наложен на официального представителя команды, который совершил  контакт с Судей на льду?", "refs": [{"num": "116", "doc": null, "key": null}], "media": []}, {"id": 1080, "active": false, "numRule": "", "text": "1. Выберите правильный вопрос, с помощью которого Вы должны определить может ли выйти на лед удаленный игрок со скамейки штрафников после взятия ворот", "refs": [], "media": []}, {"id": 1082, "active": false, "numRule": "", "text": "2. Выберите правильный вопрос, с помощью которого Вы должны определить может ли выйти на лед удаленный игрок со скамейки штрафников после взятия ворот", "refs": [], "media": []}, {"id": 1083, "active": false, "numRule": "", "text": "2. Выберите правильный вопрос, с помощью которого Вы должны определить может ли выйти на лед удаленный игрок со скамейки штрафников после взятия ворот", "refs": [], "media": []}, {"id": 1084, "active": false, "numRule": "16.2", "text": "3. Выберите правильный вопрос, с помощью которого Вы должны определить может ли выйти на лед удаленный игрок со скамейки штрафников после взятия ворот", "refs": [{"num": "16.2", "doc": null, "key": null}], "media": []}, {"id": 1085, "active": false, "numRule": "", "text": "1. В каких ситуациях главный судья не может попросить видеопросмотр взятия ворот?", "refs": [], "media": []}, {"id": 1087, "active": false, "numRule": "12", "text": "Что делать организаторам, если невозможно соблюсти стандартные размеры ледовой площадки, на соревнованиях ФХР?", "refs": [{"num": "12", "doc": null, "key": null}], "media": []}, {"id": 1095, "active": false, "numRule": "31", "text": "До какого возраста хоккеисты должны использовать капу?", "refs": [{"num": "31", "doc": null, "key": null}], "media": []}, {"id": 1100, "active": false, "numRule": "", "text": "Какую часть руки должны закрывать перчатки полевого игрока?", "refs": [], "media": []}, {"id": 1106, "active": false, "numRule": "0", "text": "Может ли судья возобновить матч, если защитное стекло еще не восстановлено?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 1109, "active": false, "numRule": "87", "text": "Будет ли считаться хоккеист находящимся на льду, если он играет в шайбу, когда один конек находится на льду, а другой вне льда?", "refs": [{"num": "87", "doc": null, "key": null}], "media": []}, {"id": 1110, "active": false, "numRule": "87/149 п.8", "text": "Будет ли считаться хоккеист находящимся на льду, если он участвует в игре против соперника, в то время когда один конек находится на льду, а другой вне льда?", "refs": [{"num": "87", "doc": null, "key": null}, {"num": "149", "doc": null, "key": null}, {"num": "8", "doc": null, "key": null}], "media": []}, {"id": 1123, "active": false, "numRule": "", "text": "Какое суммарное время Матч-штрафа записывается в протокол матча?", "refs": [], "media": []}, {"id": 1124, "active": false, "numRule": "107", "text": "Если в любое время матча на хоккеиста налагается второй Дисциплинарный штраф, то?", "refs": [{"num": "107", "doc": null, "key": null}], "media": []}, {"id": 1126, "active": false, "numRule": "110", "text": "Какое суммарное время Матч-штрафа записывается в протокол матча?", "refs": [{"num": "110", "doc": null, "key": null}], "media": []}, {"id": 1127, "active": false, "numRule": "112", "text": "Можно ли сократить Большой плюс Дисциплинарный до конца матча штраф с Матч-штрафом?", "refs": [{"num": "112", "doc": null, "key": null}], "media": []}, {"id": 1129, "active": false, "numRule": "112", "text": "Если на хоккеистов наложены совпадающие Матч-штрафы, нужно ли помещать на скамейку оштрафованных дополнительных игроков?", "refs": [{"num": "112", "doc": null, "key": null}], "media": []}, {"id": 1136, "active": false, "numRule": "47", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который наносит удар сопернику головой?", "refs": [{"num": "47", "doc": null, "key": null}], "media": []}, {"id": 1140, "active": false, "numRule": "57.6", "text": "В ситуации выхода \"один на один\" игрок первоначально выбивает шайбу клюшкой, после чего совершает подножку заставляя соперника упасть на лед.\nВаши действия?", "refs": [{"num": "57.6", "doc": null, "key": null}], "media": []}, {"id": 1141, "active": false, "numRule": "173", "text": "В какое время матча за \"Умышленное нарушение численного состава\" будет засчитано взятие ворот?", "refs": [{"num": "173", "doc": null, "key": null}], "media": []}, {"id": 1152, "active": false, "numRule": "0", "text": "Можно ли измерить клюшку вратаря перед дополнительным периодом?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 1154, "active": false, "numRule": "41", "text": "Где должно производиться измерение клюшки полевого игрока?", "refs": [{"num": "41", "doc": null, "key": null}], "media": []}, {"id": 1155, "active": false, "numRule": "41", "text": "Где должно производиться измерение клюшки вратаря?", "refs": [{"num": "41", "doc": null, "key": null}], "media": []}, {"id": 1161, "active": false, "numRule": "5.1", "text": "Полевые игроки это?", "refs": [{"num": "5.1", "doc": null, "key": null}], "media": []}, {"id": 1163, "active": false, "numRule": "", "text": "Где будет проводиться следующее вбрасывание, если шайба брошена атакующим хоккеистом из нейтральной зоны и попадает в каркас или в сетку ворот, после чего выходит из игры, не коснувшись соперника?", "refs": [], "media": []}, {"id": 1174, "active": false, "numRule": "", "text": "Шайба, брошенная атакующим хоккеистом, из нейтральной зоны и попадает в защитную сетку за воротами, срикошетив в нейтральной зоне от соперника.\nГде будет вбрасывание?", "refs": [], "media": []}, {"id": 1175, "active": false, "numRule": "", "text": "Шайба, брошенная атакующим хоккеистом,  в зоне атаки попадает в защитную сетку за воротами, срикошетив от соперника.\nГде будет вбрасывание?", "refs": [], "media": []}, {"id": 1176, "active": false, "numRule": "", "text": "Шайба, брошенная атакующим хоккеистом из нейтральной зоны, попадает в защитную сетку за воротами, срикошетив в зоне атаки от защищающегося хоккеиста.\nГде будет вбрасывание?", "refs": [], "media": []}, {"id": 1177, "active": false, "numRule": "", "text": "Шайба, брошенная атакующим хоккеистом, в зоне атаки попадает в защитную сетку за воротами непосредственно после броска.\nГде будет вбрасывание?", "refs": [], "media": []}, {"id": 1178, "active": false, "numRule": "", "text": "Шайба, брошенная атакующим хоккеистом, в зоне атаки попадает в защитную сетку за воротами непосредственно после броска.\nГде будет вбрасывание?", "refs": [], "media": []}, {"id": 1179, "active": false, "numRule": "", "text": "Шайба, брошенная атакующим хоккеистом, находящимся на своей половине поля до центральной красной линии  попадает на сетку ворот, срикошетив от хоккеиста обороняющейся команды в своей зоне защиты.\nГде будет вбрасывание?", "refs": [], "media": []}, {"id": 1180, "active": false, "numRule": "", "text": "Шайба, брошенная атакующим хоккеистом, находящимся на своей половине поля до центральной красной линии попадает на сетку ворот, в результате отскока от борта или защитного стекла. \nГде будет вбрасывание?", "refs": [], "media": []}, {"id": 1189, "active": false, "numRule": "", "text": "Травмированный полевой игрок в зоне атаки. \nГде будет проводиться вбрасывание, если его команда владеет шайбой в этой же зоне?", "refs": [], "media": []}, {"id": 1190, "active": false, "numRule": "", "text": "Травмированный полевой игрок в зоне атаки. \nГде будет проводится вбрасывание, если его команда владеет шайбой в нейтральной зоне?", "refs": [], "media": []}, {"id": 1191, "active": false, "numRule": "", "text": "Травмированный полевой игрок в зоне атаки. \nГде будет проводится вбрасывание, если его команда владеет шайбой в нейтральной зоне?", "refs": [], "media": []}, {"id": 1192, "active": false, "numRule": "", "text": "Травмированный полевой игрок в зоне атаки. \nГде будет проводиться вбрасывание, если его команда владеет шайбой в зоне защиты?", "refs": [], "media": []}, {"id": 1200, "active": false, "numRule": "", "text": "Где будет проводиться вбрасывание, если атакующий хоккеист бросает шайбу через защитное стекло в зоне атаки и шайба при этом не задевает соперника?", "refs": [], "media": []}, {"id": 1201, "active": false, "numRule": "", "text": "Где будет проводиться вбрасывание, если атакующий хоккеист бросает шайбу через защитное стекло в зоне атаки и шайба при этом не задевает соперника?", "refs": [], "media": []}, {"id": 1211, "active": false, "numRule": "", "text": "Шайба, брошенная на проброс, задевает тело соперника.\nВаши действия?", "refs": [], "media": []}, {"id": 1216, "active": false, "numRule": "", "text": "Шайба попала на внешнюю часть сетки (на основание позади рамы ворот либо сверху на ворота). Атакующий полевой игрок пытается сбить шайбу с сетки dорот.\nВаши действия?", "refs": [], "media": []}, {"id": 1217, "active": false, "numRule": "", "text": "Шайба попала на внешнюю часть сетки  (на основание позади рамы ворот либо сверху на ворота). Защищающийся полевой игрок пытается сбить шайбу с сетки ворот.\nВаши действия?", "refs": [], "media": []}, {"id": 1218, "active": false, "numRule": "", "text": "Шайба попала на внешнюю часть сетки (на основание позади рамы ворот либо сверху на ворота). Защищающийся полевой игрок пытается сбить шайбу с сетки ворот.\nВаши действия?", "refs": [], "media": []}, {"id": 1220, "active": false, "numRule": "", "text": "Шайба, брошенная защищающимся хоккеистом, из зоны защиты, срикошетив в этой же зоне от соперника, попадает в защитную сетку за противоположными воротами.\nГде будет вбрасывание?", "refs": [], "media": []}, {"id": 1229, "active": false, "numRule": "", "text": "Шайба покидает игровую площадку после попадания в судью в нейтральной зоне. \nГде будет вбрасывание?", "refs": [], "media": []}, {"id": 1233, "active": false, "numRule": "", "text": "Полевой игрок в зоне защиты направляет шайбу рукой партнеру по команде предплечем, а партнер принимает шайбу в нейтральной зоне.\nВаши действия?", "refs": [], "media": []}, {"id": 1234, "active": false, "numRule": "", "text": "Полевой игрок в зоне защиты направляет шайбу рукой партнеру по команде перчаткой, а партнер принимает шайбу в нейтральной зоне.\nВаши действия?", "refs": [], "media": []}, {"id": 1238, "active": false, "numRule": "83.6", "text": "Где будет проводиться вбрасывание, если атакующий хоккеист попадает шайбой в партнера по команде, который находится в зоне атаки?", "refs": [{"num": "83.6", "doc": null, "key": null}], "media": []}, {"id": 1247, "active": false, "numRule": "91", "text": "Перед вбрасыванием на обе команды налагается по одному малому штрафу. Могут ли обе команды провести смену игрового состава?", "refs": [{"num": "91", "doc": null, "key": null}], "media": []}, {"id": 1253, "active": false, "numRule": "94", "text": "После броска атакующего игрока, шайба попадет в ворота срикошетив от шлема соперника. \nВаши действия?", "refs": [{"num": "94", "doc": null, "key": null}], "media": []}, {"id": 1255, "active": false, "numRule": "94", "text": "После броска атакующего игрока, шайба попадет в ворота срикошетив от шлема соперника. \nВаши действия?", "refs": [{"num": "94", "doc": null, "key": null}], "media": []}, {"id": 1259, "active": false, "numRule": "", "text": "Могут ли Линейные судьи остановить игру, если за попытку Колющего удара?", "refs": [], "media": []}, {"id": 1270, "active": false, "numRule": "110", "text": "Матч-штраф ведет к незамедлительному удалению Главного тренера команды на пять минут игрового времени с удалением до конца матча. \nКто отбывает пятиминутный штраф на скамейке штрафников?", "refs": [{"num": "110", "doc": null, "key": null}], "media": []}, {"id": 1271, "active": false, "numRule": "19.1", "text": "В случае, если команды играют не в полных составах, будет ли их дальнейшее сокращение в результате наложения совпадающих штрафов?", "refs": [{"num": "19.1", "doc": null, "key": null}], "media": []}, {"id": 1276, "active": false, "numRule": "62", "text": "Хоккеист наносит колющий удар безответственно подвергая опасности соперника.\nВаши действия?", "refs": [{"num": "62", "doc": null, "key": null}], "media": []}, {"id": 1282, "active": false, "numRule": "", "text": "Может ли полевой игрок, штрафное время  которого не закончилось участвовать в проведения серии бросков, определяющих победителя матча?", "refs": [], "media": []}, {"id": 1289, "active": false, "numRule": "", "text": "Вратарь подъехал к скамейке игроков во время тридцатисекундного перерыва, взятого командой соперника.\nВаши действия?", "refs": [], "media": []}, {"id": 1290, "active": false, "numRule": "0", "text": "Вратарь подъехал к скамейке игроков во время тридцатисекундного перерыва, взятого командой соперника.\nВаши действия?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 1291, "active": false, "numRule": "", "text": "Вратарь подъехал к скамейке игроков во время коммерческой паузы, взятого его командой.\nВаши действия?", "refs": [], "media": []}, {"id": 1292, "active": false, "numRule": "", "text": "Вратарь подъехал к скамейке игроков во время телевизионного (рекламного) перерыва.\nВаши действия?", "refs": [], "media": []}, {"id": 1293, "active": false, "numRule": "0", "text": "Вратарь подъехал к скамейке игроков во время тридцатисекундного перерыва, взятого его командой.\nВаши действия?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 1294, "active": false, "numRule": "", "text": "Вратарь подъехал к скамейке игроков во время коммерческой паузы, взятого командой соперника.\nВаши действия?", "refs": [], "media": []}, {"id": 1295, "active": false, "numRule": "0", "text": "Вратарь подъехал к скамейке игроков во время телевизионного (рекламного) перерыва.\nВаши действия?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 1296, "active": false, "numRule": "27.3", "text": "На вратаря наложен Дисциплинарный штраф.\nКто будет отбывать штраф?", "refs": [{"num": "27.3", "doc": null, "key": null}], "media": []}, {"id": 1299, "active": false, "numRule": "", "text": "Какое решение должен принять Главный судья, по отношению к вратарю, действия которого приводят к задержке игры в результате ремонта своего снаряжения?", "refs": [], "media": []}, {"id": 1300, "active": false, "numRule": "10.2", "text": "Максимально разрешенный загиб крюка клюшки вратаря?", "refs": [{"num": "10.2", "doc": null, "key": null}], "media": []}, {"id": 1302, "active": false, "numRule": "41", "text": "От команды «А» поступила просьба измерить величину загиба крюка игрока команды «Б», который находится на скамье для оштрафованных.\nВаши действия?", "refs": [{"num": "41", "doc": null, "key": null}], "media": []}, {"id": 1304, "active": false, "numRule": "57", "text": "Хоккеист бросает шайбу по воротам соперника из нейтральной зоны. Шайба попадает в каркас ворот и выходит из игры. Где будет вбрасывание?", "refs": [{"num": "57", "doc": null, "key": null}], "media": []}, {"id": 1305, "active": false, "numRule": "57", "text": "Хоккеист бросает шайбу по воротам соперника из нейтральной зоны. Шайба попадает в каркас ворот и выходит из игры. \nГде будет вбрасывание?", "refs": [{"num": "57", "doc": null, "key": null}], "media": []}, {"id": 1316, "active": false, "numRule": "", "text": "Хоккеист касается шайбы высоко поднятой клюшкой выше уровня плеча в нейтральной зоне, а его партнер играет в шайбу в этой же зоне?", "refs": [], "media": []}, {"id": 1320, "active": false, "numRule": "", "text": "Шайба касается движущейся клюшки атакующего игрока, расположенной выше перекладины ворот, отскакивает от судьи, затем касается тела защищающегося игрока и заходит в ворота. \nВаши действия?", "refs": [], "media": []}, {"id": 1321, "active": false, "numRule": "", "text": "Шайба касается движущейся клюшки атакующего игрока, расположенной выше перекладины ворот, отскакивает от судьи, затем касается тела защищающегося игрока и заходит в ворота. \nВаши действия?", "refs": [], "media": []}, {"id": 1322, "active": false, "numRule": "", "text": "Шайба касается движущейся клюшки атакующего игрока, расположенной выше перекладины ворот, отскакивает от судьи, затем попадает к игроку атакующей команды, который забрасывает шайбу в ворота. \nВаши действия?", "refs": [], "media": []}, {"id": 1325, "active": false, "numRule": "99", "text": "2. В каких ситуациях Главный судья не может запросить видеопросмотр взятия ворот?", "refs": [{"num": "99", "doc": null, "key": null}], "media": []}, {"id": 1329, "active": false, "numRule": "99", "text": "4. В каких ситуациях главный судья может запросить видеопросмотр?", "refs": [{"num": "99", "doc": null, "key": null}], "media": []}, {"id": 1334, "active": false, "numRule": "", "text": "Может ли каждый Главный судья, при судействе с двумя Главными судьями, наложить штраф на одного хоккеиста за одно и то же нарушение правил?", "refs": [], "media": []}, {"id": 1338, "active": false, "numRule": "140", "text": "Какое решение должен принять Главный судья, по отношению к представителю команды, который предпринимает ответные действия к зрителю?", "refs": [{"num": "140", "doc": null, "key": null}], "media": []}, {"id": 1341, "active": false, "numRule": "", "text": "Что означает фраза \"На льду\"?", "refs": [], "media": []}, {"id": 41, "active": false, "numRule": "2", "text": "Допускается ли участие  мужчин в соревнованиях женских команд и участие женщин в соревнованиях мужских команд в соревнованиях ИИХФ?", "refs": [{"num": "2", "doc": null, "key": null}], "media": []}, {"id": 42, "active": false, "numRule": "", "text": "Какой минимальный возраст для соревнований с возрастными ограничениями до 18 и до 20 лет", "refs": [], "media": []}, {"id": 43, "active": false, "numRule": "4", "text": "Имеют ли право Национальные федерации применять двойную систему судейства, когда двое Судей на льду выполняют обязанности как главных, так и линейных Судей или другие системы?", "refs": [{"num": "4", "doc": null, "key": null}], "media": []}, {"id": 53, "active": false, "numRule": "12", "text": "Размер ледовой площадки для соревнований ИИХФ высшего уровня?", "refs": [{"num": "12", "doc": null, "key": null}], "media": []}, {"id": 54, "active": false, "numRule": "12", "text": "Размер ледовой площадки для Чемпионатов мира ИИХФ?", "refs": [{"num": "12", "doc": null, "key": null}], "media": []}, {"id": 55, "active": false, "numRule": "12", "text": "Что делать организаторам, если невозможно соблюсти стандартные размеры на соревнованиях ИИХФ?", "refs": [{"num": "12", "doc": null, "key": null}], "media": []}, {"id": 56, "active": false, "numRule": "0", "text": "Как должны открываться калитки ведущие к игровой площадке?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 67, "active": false, "numRule": "", "text": "Имеет ли право официальный представитель команды, который находится на скамейке или рядом со скамейкой хоккеистов или вблизи от нее во время матча , использовать какие-либо технические средства?", "refs": [], "media": []}, {"id": 69, "active": false, "numRule": "", "text": "Имеет ли право команда осуществлять замену своего капитана,  если капитан удален до конца матча или не в состоянии играть дальше вследствие травмы?", "refs": [], "media": []}, {"id": 71, "active": false, "numRule": "", "text": "Если капитан выходит со скамейки запасных игроков на лед, для обсуждения с Главным судьёй наложенного штрафа, то:", "refs": [], "media": []}, {"id": 79, "active": false, "numRule": "", "text": "До какого возраста игроки должны играть с капой?", "refs": [], "media": []}, {"id": 80, "active": false, "numRule": "", "text": "Какая конструкция решетчетой маски разрешена?", "refs": [], "media": []}, {"id": 81, "active": false, "numRule": "", "text": "Разрешено ли хоккеисту, у которого треснул или сломался козырек для защиты глаз или решетчатая маска, продолжать участвовать в матче?", "refs": [], "media": []}, {"id": 83, "active": false, "numRule": "", "text": "Какую часть руки должны закрывать перчатки полевого хоккеиста ?", "refs": [], "media": []}, {"id": 101, "active": false, "numRule": "", "text": "Может ли хоккеист принимать участие в матче с длинными волосами, которые закрывают фамилию или номер на спине хоккейной майки?", "refs": [], "media": []}, {"id": 106, "active": false, "numRule": "0", "text": "Свисток судьи во время матча дается на?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 110, "active": false, "numRule": "0", "text": "В случае, если от шайбы откололся кусок каучука, то?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 111, "active": false, "numRule": "0", "text": "Как проводится третий период, если матч проводится на открытом воздухе?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 112, "active": false, "numRule": "0", "text": "Какие ворота должны защищать команды в начале матча?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 115, "active": false, "numRule": "58", "text": "Может ли судья проводить вбрасывание шайбы, если только один из хоккеистов, разыгрывающих вбрасывание готов к вбрасыванию шайбы, когда все другие полевые игроки, не участвующие в розыгрыше вбрасывания заняли соответствующие позиции?", "refs": [{"num": "58", "doc": null, "key": null}], "media": []}, {"id": 118, "active": false, "numRule": "59", "text": "После замены игрока на вбрасывании происходит повторное нарушение порядка вбрасывания той же командой. \nВаши действия?", "refs": [{"num": "59", "doc": null, "key": null}], "media": []}, {"id": 128, "active": false, "numRule": "0", "text": "Должен ли судья на льду останавливать матч, если любой участок или часть защитного стекла повреждаются во время проведения матча?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 139, "active": false, "numRule": "0", "text": "Где будет вбрасывание, если отложенное положение «вне игры» влечет за собой остановку матча?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 141, "active": false, "numRule": "", "text": "Кто может быть привлечен  к ответственности в соответствии с Кодексом поведения ИИХФ за деятельность связанную с подтасовкой результатов соревнований?", "refs": [], "media": []}, {"id": 142, "active": false, "numRule": "", "text": "Всегда ли на хоккейном матче в рамках Чемпионатов ИИХФ присутствует представитель ИИХФ?", "refs": [], "media": []}, {"id": 143, "active": false, "numRule": "", "text": "Должны ли национальные федерации, члены ИИХФ, неукоснительно соблюдать требования Всемирного антидопингового кодекса, в том числе,  признание требований его политики, правил и программ?", "refs": [], "media": []}, {"id": 145, "active": false, "numRule": "0", "text": "Допускаются ли отверстия для видео/фото съемки на поверхности защитного стекла?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 147, "active": false, "numRule": "1.3", "text": "Допускается ли наличие защитного стекла перед скамейками игроков", "refs": [{"num": "1.3", "doc": null, "key": null}], "media": []}, {"id": 148, "active": false, "numRule": "", "text": "Является ли обязательным установка защитной сетки позади обоих ворот в конечных зонах при проведении соревнований ИИХФ?", "refs": [], "media": []}, {"id": 153, "active": false, "numRule": "", "text": "Команда не может выставить на лед требуемое количество игроков, по причине штрафов и/или травм. \nВаши действия?", "refs": [], "media": []}, {"id": 154, "active": false, "numRule": "", "text": "Какое решение должно быть принято в случае, если одна из команд отказывается от выполнения серии бросков, определяющих победителя матча?", "refs": [], "media": []}, {"id": 156, "active": false, "numRule": "", "text": "Команда забрасывают шайбу, но один из хоккеистов этой команды, находящийся на льду , не заявлен на матч. \nВаши действия?", "refs": [], "media": []}, {"id": 159, "active": false, "numRule": "70.5", "text": "Может ли Главный тренер команды выходить на лед в любое время матча?", "refs": [{"num": "70.5", "doc": null, "key": null}], "media": []}, {"id": 160, "active": false, "numRule": "5.4", "text": "С каким минимальным количеством представителей команды, команда может начать матч?", "refs": [{"num": "5.4", "doc": null, "key": null}], "media": []}, {"id": 162, "active": false, "numRule": "", "text": "Какое наказание должен понести хоккеист, который оспаривает свое удаление с Главным судьей?", "refs": [], "media": []}, {"id": 163, "active": false, "numRule": "11.9", "text": "Может ли Главный судья, по своему усмотрению, измерить щитки вратаря?", "refs": [{"num": "11.9", "doc": null, "key": null}], "media": []}, {"id": 165, "active": false, "numRule": "0", "text": "Может ли  игрок находиться на скамейке запасных без шлема?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 166, "active": false, "numRule": "0", "text": "Может ли игрок находиться на скамейке штрафников без шлема?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 167, "active": false, "numRule": "", "text": "Сколько раз в течение  хоккейного матча,  можно требовать замер клюшки соперника?", "refs": [], "media": []}, {"id": 173, "active": false, "numRule": "", "text": "Где будет проводиться вбрасывание , если обеими командами совершено нарушение правил, повлекшее за собой остановку матча (игра высоко поднятой клюшкой и умышленное положение «вне игры»)?", "refs": [], "media": []}, {"id": 177, "active": false, "numRule": "", "text": "Где будет проводиться вбрасывание после взятия ворот, если на одну из команд в эту же остановку был наложен малый штраф, время которого будет отображено на табло?", "refs": [], "media": []}, {"id": 178, "active": false, "numRule": "", "text": "Где будет проводиться вбрасывание, если на хоккеиста атакующей команды налагается штраф во время проведения вбрасывания в зоне атаки?", "refs": [], "media": []}, {"id": 180, "active": false, "numRule": "", "text": "Где будет проводиться вбрасывание, когда штраф должен быть наложен на обороняющуюся команду, а атакующий хоккеист пересекает воображаемую линию, соединяющую внешние края кругов конечного вбрасывания в ситуации конфронтации?", "refs": [], "media": []}, {"id": 181, "active": false, "numRule": "", "text": "Где будет проведено вбрасывание, если в зоне атаки на атакующего игрока , наложен Дисциплинарный штраф?", "refs": [], "media": []}, {"id": 182, "active": false, "numRule": "", "text": "Где будет проведено вбрасывание, если в зоне атаки на атакующего игрока , наложен Дисциплинарный до конца матча штраф?", "refs": [], "media": []}, {"id": 186, "active": false, "numRule": "", "text": "Травмированный игрок в нейтральной зоне. Где будет проводиться вбрасывание, если его команда владеет шайбой в зоне защиты?", "refs": [], "media": []}, {"id": 187, "active": false, "numRule": "", "text": "Травмированный игрок в зоне защиты. Где будет проводиться вбрасывание, если его команда владеет шайбой в этой же зоне?", "refs": [], "media": []}, {"id": 188, "active": false, "numRule": "", "text": "Травмированный игрок в зоне защиты. Где будет проводиться вбрасывание, если его команда владеет шайбой в нейтральной зоне?", "refs": [], "media": []}, {"id": 189, "active": false, "numRule": "", "text": "Травмированный игрок в зоне защиты. Где будет проводиться вбрасывание, если его команда владеет шайбой в зоне атаки?", "refs": [], "media": []}, {"id": 190, "active": false, "numRule": "", "text": "Травмированный игрок в зоне атаки. Где будет проводиться вбрасывание, если его команда владеет шайбой в этой же зоне?", "refs": [], "media": []}, {"id": 191, "active": false, "numRule": "", "text": "Травмированный игрок в зоне атаки. Где будет производится вбрасывание, если его команда владеет шайбой в нейтральной зоне?", "refs": [], "media": []}, {"id": 192, "active": false, "numRule": "", "text": "Травмированный игрок в зоне атаки. Где будет проводиться вбрасывание, если его команда владеет шайбой в зоне защиты?", "refs": [], "media": []}, {"id": 193, "active": false, "numRule": "", "text": "Где будет проводиться вбрасывание, в случае, если кто-то из судей на льду получает травму?", "refs": [], "media": []}, {"id": 194, "active": false, "numRule": "55", "text": "Где будет проведено вбрасывание, если атакующий полевой игрок совершает бросок либо делает передачу вперед по льду, а шайба отскакивает от обороняющегося полевого игрока, находящегося в своей зоне защиты и выходит из игры?", "refs": [{"num": "55", "doc": null, "key": null}], "media": []}, {"id": 195, "active": false, "numRule": "55", "text": "Где будет проведено вбрасывание, если атакующий полевой игрок делает передачу вперед по льду, а шайба отскакивает от обороняющегося полевого игрока, находящегося в нейтральной зоне и выходит из игры?", "refs": [{"num": "55", "doc": null, "key": null}], "media": []}, {"id": 197, "active": false, "numRule": "56", "text": "Где будет производиться вбрасывание после ошибки Судей на льду при фиксации проброса?", "refs": [{"num": "56", "doc": null, "key": null}], "media": []}, {"id": 198, "active": false, "numRule": "", "text": "Где будет проводиться вбрасывание, если шайба входит в ворота в результате рикошета или отскока от судьи на льду?", "refs": [], "media": []}, {"id": 199, "active": false, "numRule": "", "text": "Где будет проводиться вбрасывание, если атакующий хоккеист бросает шайбу через защитное стекло в зоне атаки и шайба при этом не задевает хоккеиста соперника или его клюшку?", "refs": [], "media": []}, {"id": 205, "active": false, "numRule": "", "text": "Какие действия должен предпринять судья в случае, если игроки, не участвующие в розыгрыше вбрасывания, постоянно меняют свое местоположение на льду за пределами места вбрасывания?", "refs": [], "media": []}, {"id": 206, "active": false, "numRule": "", "text": "Имеет ли право тренер провести замену игрового состава после  неправильного вбрасывания, после того, как судья удалил хоккеиста, что повлияло на численный состав одной из команд?", "refs": [], "media": []}, {"id": 207, "active": false, "numRule": "", "text": "В каких случаях телевизионные  перерывы не допускаются?", "refs": [], "media": []}, {"id": 208, "active": false, "numRule": "", "text": "Допускается ли командный  тридцатисекундный  перерыв после неправильно проведенного вбрасывания?", "refs": [], "media": []}, {"id": 209, "active": false, "numRule": "", "text": "Какой регламент  при назначении двадцатиминутного дополнительного периода?", "refs": [], "media": []}, {"id": 212, "active": false, "numRule": "63", "text": "Может ли один и тот же полевой игрок выполнять броски для определения победителя матча?", "refs": [{"num": "63", "doc": null, "key": null}], "media": []}, {"id": 213, "active": false, "numRule": "", "text": "Если исход серии становится ясным до завершения всех шести бросков, то?", "refs": [], "media": []}, {"id": 214, "active": false, "numRule": "", "text": "Где должно проводиться вбрасывание после вынужденной остановки матча по причине вмешательства зрителей, которые выбрасывают посторонние предметы на лед?", "refs": [], "media": []}, {"id": 216, "active": false, "numRule": "", "text": "При смене игрового состава полевой игрок, уходящий со льда, не играет в шайбу, посланную на проброс соперником.", "refs": [], "media": []}, {"id": 218, "active": false, "numRule": "", "text": "Шайба, брошенная атакующим хоккеистом, со своей половины поля до центральной красной линии ударяется в перекладину или стойку ворот и пересекает линию ворот. Шайба не попадает в ворота.\nВаше решение?", "refs": [], "media": []}, {"id": 219, "active": false, "numRule": "", "text": "Шайба вылетела от полевого игрока за пределы игровой поверхности непосредственно на вбрасывании. Должен ли Главный судья наложить штраф?", "refs": [], "media": []}, {"id": 221, "active": false, "numRule": "", "text": "Шайба падает на внешнюю часть сетки ворот (на основание позади каркаса ворот либо сверху на нее) от защищающегося полевого игрока. Остановка игры. Где будет вбрасывание?", "refs": [], "media": []}, {"id": 222, "active": false, "numRule": "", "text": "Шайба падает на внешнюю часть сетки ворот (на основание позади каркаса ворот либо сверху на нее) от атакующего игрока. Остановка игры. Где будет вбрасывание?", "refs": [], "media": []}, {"id": 223, "active": false, "numRule": "", "text": "Шайба, брошенная атакующим хоккеистом, находящимся на своей половине поля до центральной красной линии попадает на сетку ворот, в результате отскока от борта или защитного стекла. \nГде будет вбрасывание?", "refs": [], "media": []}, {"id": 224, "active": false, "numRule": "", "text": "Шайба, брошенная атакующим хоккеистом, находящимся на своей половине поля до центральной красной линии попадает на сетку ворот, срикошетив от хоккеиста обороняющейся команды в зоне защиты.\nГде будет вбрасывание?", "refs": [], "media": []}, {"id": 225, "active": false, "numRule": "", "text": "Должен ли Главный судья остановить матч, в случае, если один из хоккеистов сбивает шайбу с сетки ворот, попавшую на внешнюю часть сетки  (на основание позади каркаса ворот либо сверху на нее)?", "refs": [], "media": []}, {"id": 226, "active": false, "numRule": "", "text": "Шайба, брошенная атакующим хоккеистом, в зоне атаки попадает в защитную сетку за воротами непосредственно после броска.\nГде будет вбрасывание?", "refs": [], "media": []}, {"id": 227, "active": false, "numRule": "", "text": "Шайба, брошенная атакующим хоккеистом,  в зоне атаки попадает в защитную сетку за воротами, срикошетив от соперника.\nГде будет вбрасывание?", "refs": [], "media": []}, {"id": 228, "active": false, "numRule": "", "text": "Шайба, брошенная атакующим хоккеистом, из нейтральной зоны и попадает в защитную сетку за воротами, срикошетив в нейтральной зоне от соперника.\nГде будет вбрасывание?", "refs": [], "media": []}, {"id": 229, "active": false, "numRule": "", "text": "Шайба брошена хоккеистом из нейтральной зоны и попадает в защитную сетку за воротами, срикошетив в зоне защиты от соперника.\nГде будет вбрасывание?", "refs": [], "media": []}, {"id": 230, "active": false, "numRule": "", "text": "Шайба, брошенная защищающимся хоккеистом, из зоны защиты, срикошетив в этой же зоне от соперника, попадает в защитную сетку за противоположными воротами.\nГде будет вбрасывание?", "refs": [], "media": []}, {"id": 231, "active": false, "numRule": "", "text": "Шайба, брошенная защищающтмся хоккеистом, из зоны защиты, срикошетив в этой же зоне от партнера по команде, попадает в защитную сетку за противоположными воротами.\nГде будет вбрасывание?", "refs": [], "media": []}, {"id": 232, "active": false, "numRule": "", "text": "Где будет проводиться следующее вбрасывание, если шайба оказывается вне поля зрения Главного судьи?", "refs": [], "media": []}, {"id": 233, "active": false, "numRule": "", "text": "Шайба попала в судью. В каких случаях игра должна быть остановлена?", "refs": [], "media": []}, {"id": 234, "active": false, "numRule": "", "text": "Шайба попала в судью. В каких случаях игра должна быть остановлена?", "refs": [], "media": []}, {"id": 235, "active": false, "numRule": "", "text": "Шайба попала в судью. В каких случаях игра должна быть остановлена?", "refs": [], "media": []}, {"id": 237, "active": false, "numRule": "", "text": "Шайба зашла в ворота от судьи, после рикошета в нейтральной зоне. Взятие ворот не засчитано. Где будет вбрасывание?", "refs": [], "media": []}, {"id": 238, "active": false, "numRule": "", "text": "Где будет проводиться последующее вбрасывание, если шайба покидает игровую площадку после попадания в Судью на льду, находящегося в конечной зоне?", "refs": [], "media": []}, {"id": 239, "active": false, "numRule": "", "text": "Где будет проводиться последующее вбрасывание, если шайба покидает игровую площадку после попадания в Судью на льду в нейтральной зоне?", "refs": [], "media": []}, {"id": 240, "active": false, "numRule": "", "text": "Что должен сделать судья на льду, если хоккеист в своей зоне защиты намеренно направляет шайбу партнеру по команде перчаткой или предплечьем?", "refs": [], "media": []}, {"id": 241, "active": false, "numRule": "", "text": "Если хоккеист касается шайбы клюшкой, поднятой выше уровня плеча, а шайбой завладевает хоккеист команды соперника,  то?", "refs": [], "media": []}, {"id": 242, "active": false, "numRule": "", "text": "Должен ли Главный судья зафиксировать взятие ворот, в случае, если хоккеист забрасывает шайбу в свои ворота высоко поднятой клюшкой?", "refs": [], "media": []}, {"id": 243, "active": false, "numRule": "78", "text": "Оба конька игрока полностью находятся в зоне атаки, а шайба все еще на синей линии.", "refs": [{"num": "78", "doc": null, "key": null}], "media": []}, {"id": 244, "active": false, "numRule": "", "text": "Где будет проводиться вбрасывание, если атакующий хоккеист попадает шайбой в партнера по команде, который находится в зоне атаки раньше шайбы?", "refs": [], "media": []}, {"id": 245, "active": false, "numRule": "", "text": "Где будет проводиться вбрасывание, если  хоккеист делает пас из своей зоны защиты партнеру, находящемуся в зоне атаки и фиксируется положение «Вне игры»?", "refs": [], "media": []}, {"id": 246, "active": false, "numRule": "", "text": "Где будет проводиться вбрасывание, если  хоккеист делает пас из нейтральной  зоны партнеру,  находящемуся в зоне атаки и фиксируется положение «Вне игры»?", "refs": [], "media": []}, {"id": 247, "active": false, "numRule": "78", "text": "Атакующий хоккеист, в позиции когда синяя линия находится между его коньками, принимает пас на свою клюшку в нейтральной зоне. Затем он переносит конек, который был в нейтральной зоне через синюю линию, сохраняя шайбу на своей клюшке в нейтральной зоне, а затем переводит шайбу через синюю линию.", "refs": [{"num": "78", "doc": null, "key": null}], "media": []}, {"id": 248, "active": false, "numRule": "", "text": "Матч остановлен из-за положения «вне игры», так как хоккеист отдал  пас  партнеру из точки между синей линией зоны защиты и центральной красной линией. \nГде будет проводиться следующее вбрасывание?", "refs": [], "media": []}, {"id": 249, "active": false, "numRule": "", "text": "Матч остановлен из-за положения «вне игры», так как хоккеист отдал  пас партнеру из точки между центральной красной линией и синей линией зоны атаки. \nГде будет проводится следующее вбрасывание?", "refs": [], "media": []}, {"id": 250, "active": false, "numRule": "", "text": "Матч остановлен из-за того, что хоккеист умышленно создал положение «вне игры». Где будет проводиться следующее вбрасывание?", "refs": [], "media": []}, {"id": 252, "active": false, "numRule": "83.3", "text": "Где будет вбрасывание, если при возникновении отложенного положения «Вне игры», защищающаяся команда не прилагает усилий по выводу шайбы из своей зоны, а атакующая команда не пытается выйти из зоны, что влечет за собой остановку матча?", "refs": [{"num": "83.3", "doc": null, "key": null}], "media": []}, {"id": 254, "active": false, "numRule": "", "text": "Может ли хоккеист, указанный в заявке на турнир, принимать участие в предыгровой разминке, если он не внесен в официальный протокол матча?", "refs": [], "media": []}, {"id": 255, "active": false, "numRule": "", "text": "Может ли представитель команды добавлять или вычеркивать имена хоккеистов в заявке команды на  матч в турнирах ИИХФ?", "refs": [], "media": []}, {"id": 259, "active": false, "numRule": "10.1", "text": "Максимально разрешенный загиб крюка клюшки игрока?", "refs": [{"num": "10.1", "doc": null, "key": null}], "media": []}, {"id": 262, "active": false, "numRule": "", "text": "Хоккеист производит бросок по воротам соперника из зоны защиты. Шайба попадает в каркас ворот и выходит из игры. Где будет вбрасывание?", "refs": [], "media": []}, {"id": 263, "active": false, "numRule": "57", "text": "Хоккеист  бросает по воротам соперника из нейтральной зоны. Шайба попадает в каркас ворот и выходит из игры. Где будет вбрасывание?", "refs": [{"num": "57", "doc": null, "key": null}], "media": []}, {"id": 265, "active": false, "numRule": "", "text": "Вбрасывание выиграно пасом рукой. Ваши действия?", "refs": [], "media": []}, {"id": 267, "active": false, "numRule": "61", "text": "Могут ли обе команды взять тридцатисекундный  перерыв в одну остановку матча?", "refs": [{"num": "61", "doc": null, "key": null}], "media": []}, {"id": 269, "active": false, "numRule": "85.1", "text": "Где будет проводиться вбрасывание, если матч остановлен по причине попадания шайбы в партнера по команде, перегнувшегося через борт со скамейки игроков?", "refs": [{"num": "85.1", "doc": null, "key": null}], "media": []}, {"id": 271, "active": false, "numRule": "85.1", "text": "Где будет проводиться вбрасывание, если в первом периоде матч остановлен по причине попадания шайбы в открытую калитку своей команды?", "refs": [{"num": "85.1", "doc": null, "key": null}], "media": []}, {"id": 275, "active": false, "numRule": "", "text": "Где будет проводиться следующее вбрасывание, если шайба брошена атакующим хоккеистом из зоны атаки и попадает в каркас или в сетку ворот, после чего выходит из игры, не коснувшись соперника?", "refs": [], "media": []}, {"id": 276, "active": false, "numRule": "", "text": "Где будет проводиться следующее вбрасывание, если шайба брошена атакующим хоккеистом из нейтральной зоны и попадает в каркас или в сетку ворот, после чего выходит из игры, не коснувшись соперника?", "refs": [], "media": []}, {"id": 277, "active": false, "numRule": "", "text": "Что должен сделать судья на льду, если хоккеист в своей зоне защиты намеренно направляет шайбу партнеру по команде перчаткой или предплечьем, а партнер принимает шайбу в нейтральной зоне?", "refs": [], "media": []}, {"id": 278, "active": false, "numRule": "", "text": "Где будет проводиться следующее вбрасывание, если хоккеист касается шайбы высоко поднятой клюшкой выше уровня плеча и это нарушение зафиксировано в нейтральной зоне?", "refs": [], "media": []}, {"id": 284, "active": false, "numRule": "", "text": "Оба конька атакующего игрока находятся полностью в зоне атаки, в то время, когда хоккеист противоположной команды, владеющей шайбой в нейтральной зоне, пасует шайбу обратно в зону своей защиты, в которой все еще находится атакующий хоккеист.", "refs": [], "media": []}, {"id": 285, "active": false, "numRule": "", "text": "Игрок защищающейся команды выбрасывает шайбу из своей зоны защиты и в нейтральной зоне шайба отскакивает от игрока атакующей команды обратно в зону защиты, в то время, когда атакующий хоккеист все еще находится в зоне атаки.", "refs": [], "media": []}, {"id": 286, "active": false, "numRule": "", "text": "Игрок защищающейся команды выбрасывает шайбу из своей зоны защиты и в нейтральной зоне шайба отскакивает от игрока защищающейся команды обратно в зону защиты, в то время, когда атакующий хоккеист все еще находится в зоне атаки.", "refs": [], "media": []}, {"id": 288, "active": false, "numRule": "", "text": "Атакующий хоккеист, находящийся вне зоны атаки, вбрасывает шайбу в зону атаки и она выходит из игры. Где будет вбрасывание?", "refs": [], "media": []}, {"id": 293, "active": false, "numRule": "83.1", "text": "Оба конька игрока на синей линии, он принимает шайбу на клюшку и спиной вперед заезжает в зону, затаскивая за собой шайбу. Когда оба конька оказались в зоне игрок оторвал клюшку от шайбы и затем затащил шайбу в зону.", "refs": [{"num": "83.1", "doc": null, "key": null}], "media": []}, {"id": 297, "active": false, "numRule": "", "text": "Команда «А» играет 3 на 5. В остановку матча, на последней минуте матча , капитан команды «А» просит Главного судью измерить клюшку игрока команды «Б». Клюшка оказывается правильных размеров.\nВаши действия?", "refs": [], "media": []}, {"id": 298, "active": false, "numRule": "", "text": "Игрок команды «А» пытается остановить шайбу рукой в нейтральной зоне и шайба отскакивает в зону защиты команды «А»\nВаши действия?", "refs": [], "media": []}, {"id": 300, "active": false, "numRule": "", "text": "Что должен сделать судья на льду, если хоккеист из своей зоны защиты намеренно направляет шайбу рукой, а партнер принимает шайбу клюшкой в этой же зоне хотя его коньки находятся в нейтральной зоне?", "refs": [], "media": []}, {"id": 313, "active": false, "numRule": "", "text": "Когда запасной (резервный) судья должен выйти на лед, в случае, если матч проводится с запасными судьями, и один из судей на льду получает травму, которая не дает ему возможности продолжать матч?", "refs": [], "media": []}, {"id": 315, "active": false, "numRule": "88", "text": "Хоккеист, выходящий на лед, играет в шайбу, когда выходящий и уходящий хоккеисты, находятся в разрешенной полутораметровой зоне замены игроков?", "refs": [{"num": "88", "doc": null, "key": null}], "media": []}, {"id": 316, "active": false, "numRule": "", "text": "Хоккеист, уходящий со льда, вступает в контакт с соперником или иначе участвует в игровых действиях, когда выходящий и уходящий хоккеисты, находятся в разрешенной полутораметровой зоне замены игроков?", "refs": [], "media": []}, {"id": 317, "active": false, "numRule": "", "text": "Хоккеист, уходящий со льда, играет в шайбу, когда уходящий и выходящий хоккеисты, находятся в разрешенной полутораметровой зоне замены игроков?", "refs": [], "media": []}, {"id": 318, "active": false, "numRule": "88", "text": "Хоккеист, выходящий на лед, вступает в контакт с соперником или иначе участвует в игровых действиях, когда уходящий и выходящий хоккеисты, находятся в разрешенной полутораметровой зоне замены игроков?", "refs": [{"num": "88", "doc": null, "key": null}], "media": []}, {"id": 321, "active": false, "numRule": "", "text": "После взятия ворот, запасные хоккеисты, в количестве 6 человек, выходят на лед чтобы поздравить партнеров, которые были на льду впятером. \nВаши действия?", "refs": [], "media": []}, {"id": 330, "active": false, "numRule": "80", "text": "Отложенное положение «вне игры» рассматривается, как умышленное положение «вне игры», если?", "refs": [{"num": "80", "doc": null, "key": null}], "media": []}, {"id": 331, "active": false, "numRule": "80", "text": "Отложенное положение «вне игры» рассматривается, как умышленное положение «вне игры», если?", "refs": [{"num": "80", "doc": null, "key": null}], "media": []}, {"id": 340, "active": false, "numRule": "82.3", "text": "По Правилу смены игрового состава какая из команд должна проводить смену игроков первой?", "refs": [{"num": "82.3", "doc": null, "key": null}], "media": []}, {"id": 343, "active": false, "numRule": "", "text": "Какой штраф предполагается в случае, повторного нарушения смены игрового состава в течение матча, при условии, что при первом нарушении Главный судья уже отправлял обратно на скамейку хоккеистов и делал предупреждение тренеру?", "refs": [], "media": []}, {"id": 346, "active": false, "numRule": "93", "text": "Команда, совершившая проброс шайбы, берет тридцатисекундный перерыв. Можно ли этой команде произвести смену игроков после тридцатисекундного перерыва?", "refs": [{"num": "93", "doc": null, "key": null}], "media": []}, {"id": 347, "active": false, "numRule": "", "text": "Команда берет тридцатисекундный перерыв после проброса шайбы, совершенного командой соперника. Можно ли команде, совершившей проброс шайбы, произвести смену игроков после тридцатисекундного перерыва?", "refs": [], "media": []}, {"id": 348, "active": false, "numRule": "", "text": "Должно ли быть засчитано взятие ворот, если шайба попадает в ворота после удара по ней ногой совершенным защищающимся хоккеистом?", "refs": [], "media": []}, {"id": 351, "active": false, "numRule": "", "text": "Хоккеист совершил бросок по воротам. Перед тем как попасть в ворота, она попадает в шлем или в любую часть тела атакующего игрока. \nВаши действия?", "refs": [], "media": []}, {"id": 352, "active": false, "numRule": "", "text": "Атакующий хоккеист наносит удар по шайбе коньком, после чего она пересекает линию ворот, срикошетив от любого хоккеиста. \nВаши действия?", "refs": [], "media": []}, {"id": 361, "active": false, "numRule": "", "text": "Защищающаяся команда забивает гол в свои ворота в ситуации отложенного положения «вне игры».", "refs": [], "media": []}, {"id
