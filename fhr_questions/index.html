 [{"num": "85.5", "doc": null, "key": null}], "media": []}, {"id": 1197, "active": true, "numRule": "85.5", "text": "Где будет вбрасывание, если атакующий игрок делает передачу вперед по льду, а шайба отскакивает от защищающегося игрока, находящегося в нейтральной зоне и выходит из игры?", "refs": [{"num": "85.5", "doc": null, "key": null}], "media": []}, {"id": 1198, "active": true, "numRule": "81.2", "text": "Где будет проводиться вбрасывание после ошибки судей на льду при фиксации проброса?", "refs": [{"num": "81.2", "doc": null, "key": null}], "media": []}, {"id": 1199, "active": true, "numRule": "85.4", "text": "Где будет проводиться вбрасывание, если шайба заходит в ворота в результате рикошета или отскока от судьи на льду?", "refs": [{"num": "85.4", "doc": null, "key": null}], "media": []}, {"id": 1202, "active": true, "numRule": "76.5", "text": "Какие действия должен предпринять судья в случае, если игрок, не участвующий в розыгрыше вбрасывания, не занимает стационарную позицию?", "refs": [{"num": "76.5", "doc": null, "key": null}], "media": []}, {"id": 1203, "active": true, "numRule": "76.7", "text": "Имеет ли право тренер провести замену игрового состава после  неправильного вбрасывания, если тут же Главный судья удалил хоккеиста, что повлияло на численный состав одной из команд?", "refs": [{"num": "76.7", "doc": null, "key": null}], "media": []}, {"id": 1204, "active": true, "numRule": "87.1", "text": "Допускается ли тридцатисекундный перерыв после неправильно проведенного вбрасывания?", "refs": [{"num": "87.1", "doc": null, "key": null}], "media": []}, {"id": 1205, "active": true, "numRule": "84.4", "text": "Можно ли менять вратаря после каждого броска для определения победителя матча?", "refs": [{"num": "84.4", "doc": null, "key": null}], "media": []}, {"id": 1206, "active": true, "numRule": "84.4", "text": "Может ли один и тот же  игрок выполнять броски для определения победителя матча на первой стадии?", "refs": [{"num": "84.4", "doc": null, "key": null}], "media": []}, {"id": 1207, "active": true, "numRule": "84.4", "text": "Может ли один и тот же игрок выполнять броски, для определения победителя матча, в серии до решающей заброшенной шайбы?", "refs": [{"num": "84.4", "doc": null, "key": null}], "media": []}, {"id": 1208, "active": true, "numRule": "84.4", "text": "Если исход серии бросков для определения победителя матча становится ясным до завершения всех бросков, то?", "refs": [{"num": "84.4", "doc": null, "key": null}], "media": []}, {"id": 1209, "active": true, "numRule": "84.4", "text": "Если серия бросков для определения победителя матча закончилась вничью, то?", "refs": [{"num": "84.4", "doc": null, "key": null}], "media": []}, {"id": 1210, "active": true, "numRule": "76.2", "text": "Зритель выбросил посторонний предмет на лед и судья остановил игру.\nГде будет вбрасывание?", "refs": [{"num": "76.2", "doc": null, "key": null}], "media": []}, {"id": 1212, "active": true, "numRule": "81.5", "text": "При смене игрового состава игрок, уходящий со льда, не играет в шайбу, посланную на проброс соперником.\nВаши действия?", "refs": [{"num": "81.5", "doc": null, "key": null}], "media": []}, {"id": 1213, "active": true, "numRule": "85.1", "text": "Шайба вылетела от игрока за пределы игровой поверхности непосредственно на вбрасывании. Должен ли Главный судья наложить штраф?", "refs": [{"num": "85.1", "doc": null, "key": null}], "media": []}, {"id": 1214, "active": true, "numRule": "85.2", "text": "Шайба падает на внешнюю часть сетки ворот (на основание позади рамы ворот либо сверху на ворота) от защищающегося игрока. Остановка игры. \nГде будет вбрасывание?", "refs": [{"num": "85.2", "doc": null, "key": null}], "media": []}, {"id": 1215, "active": true, "numRule": "85.2", "text": "Шайба падает на внешнюю часть сетки ворот (на основание позади рамы ворот либо сверху на ворота) от атакующего хоккеиста. Остановка игры. \nГде будет вбрасывание?", "refs": [{"num": "85.2", "doc": null, "key": null}], "media": []}, {"id": 1219, "active": true, "numRule": "85.5", "text": "Шайба, брошенная защищающимся хоккеистом, из зоны защиты, срикошетив в этой же зоне от соперника, попадает в защитную сетку за противоположными воротами.\nГде будет вбрасывание?", "refs": [{"num": "85.5", "doc": null, "key": null}], "media": []}, {"id": 1221, "active": true, "numRule": "85.1", "text": "Шайба, брошенная защищающимся  хоккеистом, из зоны защиты, срикошетив в этой же зоне от партнера по команде, попадает в защитную сетку за противоположными воротами.\nГде будет вбрасывание?", "refs": [{"num": "85.1", "doc": null, "key": null}], "media": []}, {"id": 1222, "active": true, "numRule": "85.3", "text": "Главный судья остановил матч, так как шайба оказалась вне его поля зрения.\nГде будет вбрасывание?", "refs": [{"num": "85.3", "doc": null, "key": null}], "media": []}, {"id": 1223, "active": true, "numRule": "85.4", "text": "Шайба попала в судью. В каких случаях игра должна быть остановлена?", "refs": [{"num": "85.4", "doc": null, "key": null}], "media": []}, {"id": 1224, "active": true, "numRule": "32.6", "text": "Шайба попала в судью. В каких случаях игра должна быть остановлена?", "refs": [{"num": "32.6", "doc": null, "key": null}], "media": []}, {"id": 1225, "active": true, "numRule": "85.4", "text": "Шайба попала в судью. В каких случаях игра должна быть остановлена?", "refs": [{"num": "85.4", "doc": null, "key": null}], "media": []}, {"id": 1226, "active": true, "numRule": "85.4", "text": "Шайба зашла в ворота, после рикошета от судьи в нейтральной зоне. Взятие ворот не засчитано. \nГде будет вбрасывание?", "refs": [{"num": "85.4", "doc": null, "key": null}], "media": []}, {"id": 1227, "active": true, "numRule": "85.4", "text": "Шайба покидает игровую площадку после попадания в судью в конечной зоне. \nГде будет вбрасывание?", "refs": [{"num": "85.4", "doc": null, "key": null}], "media": []}, {"id": 1228, "active": true, "numRule": "85.4", "text": "Шайба покидает игровую площадку после попадания в судью в нейтральной зоне. \nГде будет вбрасывание?", "refs": [{"num": "85.4", "doc": null, "key": null}], "media": []}, {"id": 1231, "active": true, "numRule": "85.4", "text": "Шайба отскакивает от судьи, после чего, игрок забрасывает ее в ворота.\nВаши действия?", "refs": [{"num": "85.4", "doc": null, "key": null}], "media": []}, {"id": 1232, "active": true, "numRule": "79.2", "text": "Игрок в зоне защиты направляет шайбу партнеру по команде, находящемуся в этой же зоне, перчаткой или предплечьем.\nВаши действия?", "refs": [{"num": "79.2", "doc": null, "key": null}], "media": []}, {"id": 1235, "active": true, "numRule": "80.1", "text": "Если хоккеист касается шайбы клюшкой, поднятой выше уровня плеч, а шайбой завладевает хоккеист команды соперника, то?", "refs": [{"num": "80.1", "doc": null, "key": null}], "media": []}, {"id": 1236, "active": true, "numRule": "80.1", "text": "Должен ли Главный судья зафиксировать взятие ворот, в случае, если хоккеист забрасывает шайбу в свои ворота высоко поднятой клюшкой?", "refs": [{"num": "80.1", "doc": null, "key": null}], "media": []}, {"id": 1237, "active": true, "numRule": "83.1", "text": "Игрок принимает пас, когда оба конька игрока полностью находятся в зоне атаки, но шайба все еще на синей линии.\nВаши действия?", "refs": [{"num": "83.1", "doc": null, "key": null}], "media": []}, {"id": 1239, "active": true, "numRule": "85.5", "text": "Атакующий игрок в зоне атаки бросает шайбу по воротам и она перелетает через защитное стекло и при этом не задевает соперника. \nГде будет проводиться вбрасывание?", "refs": [{"num": "85.5", "doc": null, "key": null}], "media": []}, {"id": 1240, "active": true, "numRule": "83.6", "text": "Атакующий хоккеист совершает пас из нейтральной  зоны партнеру находящемуся в зоне атаки и фиксируется положение «Вне игры».\nГде будет проводиться вбрасывание?", "refs": [{"num": "83.6", "doc": null, "key": null}], "media": []}, {"id": 1241, "active": true, "numRule": "83.6", "text": "Атакующий хоккеист совершает пас из своей зоны защиты партнеру, находящемуся в зоне атаки и фиксируется положение «Вне игры».\nГде будет проводиться вбрасывание?", "refs": [{"num": "83.6", "doc": null, "key": null}], "media": []}, {"id": 1242, "active": true, "numRule": "83.1", "text": "Атакующий игрок, в позиции когда синяя линия находится между его коньками, принимает пас на свою клюшку в нейтральной зоне. Затем он переносит конек, который был в нейтральной зоне через синюю линию, сохраняя шайбу на своей клюшке в нейтральной зоне, а затем переводит шайбу через синюю линию.\nВаши действия?", "refs": [{"num": "83.1", "doc": null, "key": null}], "media": []}, {"id": 1243, "active": true, "numRule": "83.6", "text": "Передача совершена партнеру из точки между синей линией зоны защиты и центральной красной линией. Линейный судья зафиксировал положение «Вне игры».\nГде будет проводиться вбрасывание?", "refs": [{"num": "83.6", "doc": null, "key": null}], "media": []}, {"id": 1244, "active": true, "numRule": "83.6", "text": "Передача была совершена партнеру из точки между центральной красной линией и синей линией зоны атаки. Линейный судья зафиксировал положение «Вне игры».\nГде будет проводиться вбрасывание?", "refs": [{"num": "83.6", "doc": null, "key": null}], "media": []}, {"id": 1245, "active": true, "numRule": "83.7", "text": "Матч остановлен из-за того, что хоккеист умышленно создал ситуацию положения «Вне игры». \nГде будет проводиться вбрасывание?", "refs": [{"num": "83.7", "doc": null, "key": null}], "media": []}, {"id": 1246, "active": true, "numRule": "82.1", "text": "Команда продолжает задерживать смену состава, нарушая процедуру замены игроков в остановку матча. Главный судья ранее предупредил тренера.\nВаши действия?", "refs": [{"num": "82.1", "doc": null, "key": null}], "media": []}, {"id": 1248, "active": true, "numRule": "82.3", "text": "Какой вид штрафа предполагается в случае, повторного нарушения смены игрового состава в течение матча?", "refs": [{"num": "82.3", "doc": null, "key": null}], "media": []}, {"id": 1249, "active": true, "numRule": "87", "text": "Команда \"А\" берет тридцатисекундный перерыв после проброса шайбы командой \"Б\". Можно ли команде \"Б\" провести смену игроков после тридцатисекундного перерыва?", "refs": [{"num": "87", "doc": null, "key": null}], "media": []}, {"id": 1250, "active": true, "numRule": "87.1", "text": "Команда \"А\", совершила проброс шайбы. Можно ли команде \"Б\" провести смену игроков после тридцатисекундного перерыва?", "refs": [{"num": "87.1", "doc": null, "key": null}], "media": []}, {"id": 1251, "active": true, "numRule": "78.4", "text": "Должно ли быть засчитано взятие ворот, если шайба попадает в ворота после удара по шайбе ногой защищающимся хоккеистом?", "refs": [{"num": "78.4", "doc": null, "key": null}], "media": []}, {"id": 1252, "active": true, "numRule": "78.5", "text": "После броска атакующего игрока, шайба попадет в ворта срикошетив от шлема партнера по команде. \nВаши действия?", "refs": [{"num": "78.5", "doc": null, "key": null}], "media": []}, {"id": 1254, "active": true, "numRule": "78.5", "text": "После броска атакующего игрока, шайба попадет в ворота срикошетив от шлема соперника. \nВаши действия?", "refs": [{"num": "78.5", "doc": null, "key": null}], "media": []}, {"id": 1256, "active": true, "numRule": "78.4", "text": "После броска защищающегося игрока, шайба срикошетив от шлема соперника залетает в ворота защищающегося игрока. \nВаши действия?", "refs": [{"num": "78.4", "doc": null, "key": null}], "media": []}, {"id": 1257, "active": true, "numRule": "37.4, 49.2", "text": "Атакующий игрок наносит удар по шайбе коньком, после чего она заходит в ворота. \nВаши действия?", "refs": [{"num": "37.4", "doc": null, "key": null}, {"num": "49.2", "doc": null, "key": null}], "media": []}, {"id": 1258, "active": true, "numRule": "32.5", "text": "Могут ли Линейные судьи остановить игру, за попытку Колющего удара?", "refs": [{"num": "32.5", "doc": null, "key": null}], "media": []}, {"id": 1260, "active": true, "numRule": "84.4", "text": "Имеет ли право хоккеист, на которого Главный судья наложил Дисциплинарный штраф в последние 5 минут третьего периода, участвовать в дополнительном 5 минутном периоде?", "refs": [{"num": "84.4", "doc": null, "key": null}], "media": []}, {"id": 1261, "active": true, "numRule": "84.4", "text": "Имеет ли право хоккеист, на которого Главный судья наложил Дисциплинарный штраф в 5:00 до конца третьего периода, участвовать в серии бросков, определяющих победителя матча после окончания дополнительного 5- минутного периода?", "refs": [{"num": "84.4", "doc": null, "key": null}], "media": []}, {"id": 1262, "active": true, "numRule": "15.3", "text": "В течение отложенного Малого штрафа, не нарушившая правила команда, забрасывает шайбу в ворота команды соперника. \nЧто делать с отложенным штрафом?", "refs": [{"num": "15.3", "doc": null, "key": null}], "media": []}, {"id": 1263, "active": true, "numRule": "15.3", "text": "В течение отложенного двойного Малого штрафа, не нарушившая правила команда, забрасывает шайбу в ворота команды соперника. \nЧто делать с отложенными штрафами?", "refs": [{"num": "15.3", "doc": null, "key": null}], "media": []}, {"id": 1264, "active": true, "numRule": "15.3", "text": "В течение отложенного Большого штрафа команда, владеющая шайбой, забрасывает шайбу в ворота команды соперника. \nЧто делать с отложенным штрафом?", "refs": [{"num": "15.3", "doc": null, "key": null}], "media": []}, {"id": 1265, "active": true, "numRule": "22.1", "text": "Когда хоккеист, отбывающий Дисциплинарный штраф, должен вернуться на лед?", "refs": [{"num": "22.1", "doc": null, "key": null}], "media": []}, {"id": 1266, "active": true, "numRule": "26.3", "text": "Малый штраф наложен на хоккеиста, а на его партнера Большой штраф. В какой последовательности хоккеисты отбывают штрафы?", "refs": [{"num": "26.3", "doc": null, "key": null}], "media": []}, {"id": 1267, "active": true, "numRule": "26.3", "text": "Малый штраф наложен на хоккеиста, а на его партнера Большой штраф, когда команда ведет игру в численном меньшинстве. \nВ какой последовательности хоккеисты отбывают штрафы?", "refs": [{"num": "26.3", "doc": null, "key": null}], "media": []}, {"id": 1268, "active": true, "numRule": "27.3", "text": "Вратарь наказан Дисциплинарным штрафом. Кто будет его отбывать?", "refs": [{"num": "27.3", "doc": null, "key": null}], "media": []}, {"id": 1269, "active": true, "numRule": "15.2", "text": "Если на тренера  команды наложен только Дисциплинарный штраф до конца матча, должна ли команда поместить  игрока на скамейку штрафников?", "refs": [{"num": "15.2", "doc": null, "key": null}], "media": []}, {"id": 1272, "active": true, "numRule": "5.1", "text": "Какое минимальное количество ИГРОКОВ любой из команд должно находится в  любой момент во время матча на льду?", "refs": [{"num": "5.1", "doc": null, "key": null}], "media": []}, {"id": 1273, "active": true, "numRule": "78.5", "text": "При отложенном штрафе команда, нарушившая правила, забрасывает шайбу в ворота команды соперника. \nВаши действия?", "refs": [{"num": "78.5", "doc": null, "key": null}], "media": []}, {"id": 1274, "active": true, "numRule": "9.8", "text": "Имеет ли право Главный судья запретить использование любого элемента снаряжения хоккеистов, который, по его мнению, может быть травмоопасным или потенциально опасным?", "refs": [{"num": "9.8", "doc": null, "key": null}], "media": []}, {"id": 1275, "active": true, "numRule": "63.2", "text": "Хоккеист выбрасывает шайбу за заградительное стекло за скамейкой запасных игроков из зоны защиты.\nВаши действия?", "refs": [{"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 1277, "active": true, "numRule": "39.4", "text": "Хоккеист выбрасывает свою перчатку за пределы игровой поверхности.\nВаши действия?", "refs": [{"num": "39.4", "doc": null, "key": null}], "media": []}, {"id": 1278, "active": true, "numRule": "75.4", "text": "Хоккеист преднамеренно выбрасывает перчатку соперника за пределы игровой поверхности.\nВаши действия?", "refs": [{"num": "75.4", "doc": null, "key": null}], "media": []}, {"id": 1279, "active": true, "numRule": "75.2", "text": "Какой штраф должен быть наложен на атакующего игрока, который намеренно тормозит перед вратарем и направляет осколки льда во вратаря команды соперника, прижимающего шайбу для остановки матча?", "refs": [{"num": "75.2", "doc": null, "key": null}], "media": []}, {"id": 1280, "active": true, "numRule": "53.3", "text": "Какой штраф необходимо наложить, если невозможно определить, того кто бросил клюшку со скамейки игроков на лед?", "refs": [{"num": "53.3", "doc": null, "key": null}], "media": []}, {"id": 1281, "active": true, "numRule": "75.3", "text": "Какой штраф необходимо наложить, если невозможно определить, того кто бросил пластиковую бутылку со скамейки игроков на лед?", "refs": [{"num": "75.3", "doc": null, "key": null}], "media": []}, {"id": 1283, "active": true, "numRule": "69.1", "text": "Допускается ли существенный контакт с вратарем, инициированный атакующим игроком?", "refs": [{"num": "69.1", "doc": null, "key": null}], "media": []}, {"id": 1284, "active": true, "numRule": "69.1", "text": "Допускается ли случайный контакт атакующего игрока с вратарем?", "refs": [{"num": "69.1", "doc": null, "key": null}], "media": []}, {"id": 1285, "active": true, "numRule": "69.1", "text": "Атакующий игрок падает на вратаря после того, как его толкнул защищающийся игрок и происходит взятие ворот.\nВаши действия?", "refs": [{"num": "69.1", "doc": null, "key": null}], "media": []}, {"id": 1286, "active": true, "numRule": "67.3", "text": "Вратарь выбрасывает шайбу вперед, и первым играет в шайбу партнер по команде в своей зоне защиты.\nВаши действия?", "refs": [{"num": "67.3", "doc": null, "key": null}], "media": []}, {"id": 1287, "active": true, "numRule": "67.3", "text": "Вратарь выбрасывает шайбу вперед, и первым шайбы касается хоккеист команды соперника, в своей зоне атаки.\nВаши действия?", "refs": [{"num": "67.3", "doc": null, "key": null}], "media": []}, {"id": 1288, "active": true, "numRule": "67.3", "text": "Вратарь выбрасывает шайбу вперед, и первым шайбы касается хоккеист команды соперника. \nВаши действия?", "refs": [{"num": "67.3", "doc": null, "key": null}], "media": []}, {"id": 1297, "active": true, "numRule": "10.4", "text": "Имеет ли право вратарь подъехать к своей скамейке игроков для замены клюшки в остановку матча?", "refs": [{"num": "10.4", "doc": null, "key": null}], "media": []}, {"id": 1298, "active": true, "numRule": "63.2.10", "text": "Какое решение должен принять Главный судья, по отношению к вратарю, действия которого приводят к задержке игры в результате ремонта своего снаряжения?", "refs": [{"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 1301, "active": true, "numRule": "10.5", "text": "От команды «А» поступила просьба измерить величину загиба крюка игрока команды «Б», который находится на скамейке игроков\nВаши действия?", "refs": [{"num": "10.5", "doc": null, "key": null}], "media": []}, {"id": 1303, "active": true, "numRule": "76.2, 85.5", "text": "Хоккеист бросает шайбу по воротам соперника из своей зоны защиты. Шайба попадает в каркас ворот и выходит из игры. \nГде будет вбрасывание?", "refs": [{"num": "76.2", "doc": null, "key": null}, {"num": "85.5", "doc": null, "key": null}], "media": []}, {"id": 1306, "active": true, "numRule": "76.2, 85.5", "text": "Хоккеист бросает шайбу по воротам соперника из нейтральной зоны. Шайба попадает в каркас ворот и выходит из игры. \nГде будет вбрасывание?", "refs": [{"num": "76.2", "doc": null, "key": null}, {"num": "85.5", "doc": null, "key": null}], "media": []}, {"id": 1307, "active": true, "numRule": "67.2", "text": "Вбрасывание выиграно пасом рукой и шайбой завладел партнер по команде. \nВаши действия?", "refs": [{"num": "67.2", "doc": null, "key": null}], "media": []}, {"id": 1308, "active": true, "numRule": "67.2", "text": "Вбрасывание выиграно пасом рукой и шайбой завладел соперник. \nВаши действия?", "refs": [{"num": "67.2", "doc": null, "key": null}], "media": []}, {"id": 1310, "active": true, "numRule": "85.5", "text": "Где будет проводиться следующее вбрасывание, если шайба брошена атакующим игроком из зоны атаки и попадает в сетку ворот, после чего выходит из игры, не коснувшись соперника?", "refs": [{"num": "85.5", "doc": null, "key": null}], "media": []}, {"id": 1311, "active": true, "numRule": "85.5", "text": "Где будет проводиться следующее вбрасывание, если шайба брошена атакующим хоккеистом из нейтральной зоны и попадает в сетку ворот, после чего выходит из игры, не коснувшись соперника?", "refs": [{"num": "85.5", "doc": null, "key": null}], "media": []}, {"id": 1312, "active": true, "numRule": "76.2, 85.5", "text": "Игрок бросает шайбу по воротам соперника из зоны атаки. Шайба попадает в каркас ворот и выходит из игры. \nГде будет вбрасывание?", "refs": [{"num": "76.2", "doc": null, "key": null}, {"num": "85.5", "doc": null, "key": null}], "media": []}, {"id": 1313, "active": true, "numRule": "85.5", "text": "Где будет проводиться следующее вбрасывание, если шайба брошена атакующим хоккеистом из зоны защиты и попадает в сетку ворот, после чего выходит из игры, не коснувшись соперника?", "refs": [{"num": "85.5", "doc": null, "key": null}], "media": []}, {"id": 1314, "active": true, "numRule": "79.2", "text": "Игрок из своей зоны защиты намеренно направляет шайбу рукой, а партнер принимает шайбу клюшкой в этой же зоне хотя его коньки находятся в нейтральной зоне.\nВаши действия?", "refs": [{"num": "79.2", "doc": null, "key": null}], "media": []}, {"id": 1315, "active": true, "numRule": "80.2", "text": "Игрок касается шайбы высоко поднятой клюшкой выше уровня плеча в нейтральной зоне, а его партнер играет в шайбу в этой же зоне.\nГде будет проводится следующее вбрасывание?", "refs": [{"num": "80.2", "doc": null, "key": null}], "media": []}, {"id": 1317, "active": true, "numRule": "83.1", "text": "Игрок, у которого оба конька полностью находятся в зоне атаки, получает передачу от товарища по команде. Он останавливает шайбу своей клюшкой до того, как шайба пересечет синюю линию, а затем касается одним коньком синей линии и перемещает шайбу за синюю линию.", "refs": [{"num": "83.1", "doc": null, "key": null}], "media": []}, {"id": 1318, "active": true, "numRule": "69", "text": "Защищающийся игрок посылает шайбу в свои ворота, в то время, когда в площади ворот игрок атакующей команды инициирует контакт с вратарем. \nВаши действия?", "refs": [{"num": "69", "doc": null, "key": null}], "media": []}, {"id": 1319, "active": true, "numRule": "67.6", "text": "Атакующий игрок умышленно бьет по шайбе рукой. Шайба последовательно отскакивает от вратаря соперника, другого защищающегося игрока и попадает к игроку атакующей команды, который забрасывает шайбу в ворота. \nВаши действия?", "refs": [{"num": "67.6", "doc": null, "key": null}], "media": []}, {"id": 1323, "active": true, "numRule": "25.2", "text": "Выполнение какого условия необходимо для того, чтобы было засчитано взятие ворот,  если защищающийся хоккеист сдвигает каркас своих ворот, в то время, как соперник, забрасывает шайбу в ворота?", "refs": [{"num": "25.2", "doc": null, "key": null}], "media": []}, {"id": 1324, "active": true, "numRule": "37.3", "text": "В каких ситуациях Главный судья не может запросить видеопросмотр взятия ворот?", "refs": [{"num": "37.3", "doc": null, "key": null}], "media": []}, {"id": 1326, "active": true, "numRule": "37.3", "text": "1. В каких ситуациях главный судья может запросить видеопросмотр взятия ворот?", "refs": [{"num": "37.3", "doc": null, "key": null}], "media": []}, {"id": 1327, "active": true, "numRule": "37.3", "text": "2. В каких ситуациях главный судья может запросить видеопросмотр взятия ворот?", "refs": [{"num": "37.3", "doc": null, "key": null}], "media": []}, {"id": 1328, "active": true, "numRule": "37.3", "text": "3. В каких ситуациях главный судья может запросить видеопросмотр взятия ворот?", "refs": [{"num": "37.3", "doc": null, "key": null}], "media": []}, {"id": 1330, "active": true, "numRule": "37.3", "text": "4. В каких ситуациях главный судья может запросить видеопросмотр взятия ворот?", "refs": [{"num": "37.3", "doc": null, "key": null}], "media": []}, {"id": 1331, "active": true, "numRule": "37.3", "text": "5. В каких ситуациях главный судья может запросить видеопросмотр взятия ворот?", "refs": [{"num": "37.3", "doc": null, "key": null}], "media": []}, {"id": 1332, "active": true, "numRule": "37.3", "text": "6. В каких ситуациях главный судья может запросить видеопросмотр взятия ворот?", "refs": [{"num": "37.3", "doc": null, "key": null}], "media": []}, {"id": 1333, "active": true, "numRule": "5.6", "text": "На предыгровой разминке хоккеист одной из команд ударил клюшкой соперника. Вы и линейный судьи находились в раздевалке. Запасной судья контролировал разминку и видел нарушение. \nВаши действия?", "refs": [{"num": "5.6", "doc": null, "key": null}], "media": []}, {"id": 1335, "active": true, "numRule": "0", "text": "Может ли каждый Главный судья, при судействе по системе \"Четыре судьи\", наложить штраф на одного хоккеиста за одно и то же нарушение правил?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 1336, "active": true, "numRule": "16.2", "text": "2. Выберите правильный вопрос, с помощью которого Вы должны определить может ли выйти на лед удаленный игрок со скамейки штрафников после взятия ворот", "refs": [{"num": "16.2", "doc": null, "key": null}], "media": []}, {"id": 1337, "active": true, "numRule": "53.9", "text": "Заменяющий вратаря игрок уже вышел на лед, пока вратарь ещё на льду, но ворота уже пустые, и бросает клюшку в соперника, владеющего шайбой в зоне атаки. \nМожно ли засчитать взятие ворот?", "refs": [{"num": "53.9", "doc": null, "key": null}], "media": []}, {"id": 1339, "active": true, "numRule": "23.8, 75.5", "text": "Какое решение должен принять Главный судья, по отношению к представителю команды, который предпринимает ответные действия к зрителю?", "refs": [{"num": "23.8", "doc": null, "key": null}, {"num": "75.5", "doc": null, "key": null}], "media": []}, {"id": 1340, "active": true, "numRule": "74.1", "text": "Что означает фраза \"На льду\" в процессе замены игроков во время игры?", "refs": [{"num": "74.1", "doc": null, "key": null}], "media": []}, {"id": 1342, "active": true, "numRule": "74.1", "text": "Что означает фраза \"Вне льда\" в процессе замены игроков во время игры?", "refs": [{"num": "74.1", "doc": null, "key": null}], "media": []}, {"id": 1343, "active": true, "numRule": "74.1", "text": "Выходящий на лед хоккеист играет в шайбу, когда уходящий хоккеист поставил одну ногу на скамейку запасных.\nВаши действия?", "refs": [{"num": "74.1", "doc": null, "key": null}], "media": []}, {"id": 1344, "active": true, "numRule": "56.2.8", "text": "Уходящий со льда игрок поставил одну ногу на скамейку запасных и играет в шайбу, когда выходящий на лед игрок поставил одну ногу на лед.\nВаши действия?", "refs": [{"num": "56.2", "doc": null, "key": null}], "media": []}, {"id": 1345, "active": true, "numRule": "74.1", "text": "Хоккеист покидает площадку, ставит одну ногу на скамейку запасных и играет в шайбу. А заменяющий его хоккеист уже находится обеими ногами на льду.\nВаши действия?", "refs": [{"num": "74.1", "doc": null, "key": null}], "media": []}, {"id": 1346, "active": true, "numRule": "81.5", "text": "Шайба, брошенная на проброс, задевает тело соперника.\nВаши действия?", "refs": [{"num": "81.5", "doc": null, "key": null}], "media": []}, {"id": 3, "active": true, "numRule": "", "text": "Ваши действия?", "refs": [], "media": [{"k": "video", "u": "https://referees.fhr.ru/static/files/videos/exam-platform/iblock/c98/c98bb1fa524606cc0f3581127619c5cb.mp4?0"}]}, {"id": 4, "active": true, "numRule": "", "text": "Ваши действия?", "refs": [], "media": [{"k": "video", "u": "https://referees.fhr.ru/static/files/videos/exam-platform/iblock/e51/e512d2f071ea19c8bfa , "media": [{"k": "video", "u": "https://referees.fhr.ru/static/files/videos/exam-platform/88e/dfa/88edfa0a288d012db759c36b1bd6d559.mp4?1"}]}, {"id": 569, "active": true, "numRule": "", "text": "Хоккеист в синей майке потерял свою клюшку. На хоккеиста какой команды необходимо наложить Малый штраф?", "refs": [], "media": [{"k": "video", "u": "https://referees.fhr.ru/static/files/videos/exam-platform/iblock/c64/c64b01d096296e84e249f0b337ccc7ab.mp4?0"}]}, {"id": 570, "active": true, "numRule": "80.2", "text": "Линейный судья зафиксировал игру высоко поднятой клюшкой. В какой точке будет произведено вбрасывание?", "refs": [{"num": "80.2", "doc": null, "key": null}], "media": [{"k": "video", "u": "https://referees.fhr.ru/static/files/videos/exam-platform/iblock/6d1/6d1c4c38c49f276a79b399befd3b311a.mp4?0"}]}, {"id": 578, "active": true, "numRule": "83", "text": "В ситуации проброса ближний линейный судья зафиксировал отложенное положение «вне игры» и дал свисток на остановку игры. Где будет вбрасывание?", "refs": [{"num": "83", "doc": null, "key": null}], "media": [{"k": "video", "u": "https://referees.fhr.ru/static/files/videos/exam-platform/iblock/95b/95b268a38afc471232597aed4e6a1aca.mp4?0"}]}, {"id": 1230, "active": true, "numRule": "", "text": "Ваши действия?", "refs": [], "media": [{"k": "video", "u": "https://referees.fhr.ru/static/files/videos/exam-platform/iblock/873/8731f12febd982177507157001245ad7.mp4?0"}]}, {"id": 1309, "active": true, "numRule": "79.1", "text": "Шайба от перчатки отскакивает из зоны атаки в нейтральную зону к партнеру по команде.  Ваши действия?", "refs": [{"num": "79.1", "doc": null, "key": null}], "media": [{"k": "video", "u": "https://referees.fhr.ru/static/files/videos/exam-platform/iblock/1b5/1b5fb5f83cbd7eb9b6b033a33750540a.mp4?0"}]}, {"id": 1605, "active": true, "numRule": "213", "text": "Ваши действия, если сдвиг ворот происходит в первом периоде?", "refs": [{"num": "213", "doc": null, "key": null}], "media": [{"k": "video", "u": "https://referees.fhr.ru/static/files/videos/exam-platform/iblock/438/43872b1f56fa3d9da7402063ae47a343.mp4?0"}]}, {"id": 1606, "active": true, "numRule": "213", "text": "Ваши действия, если сдвиг ворот происходит в дополнительном периоде?", "refs": [{"num": "213", "doc": null, "key": null}], "media": [{"k": "video", "u": "https://referees.fhr.ru/static/files/videos/exam-platform/iblock/24b/24bfd2b535e304f21a2757e1f5cbb138.mp4?0"}]}, {"id": 4333, "active": true, "numRule": "78.5", "text": "Засчитывается ли взятие ворот?\nЧто делать со штрафом?", "refs": [{"num": "78.5", "doc": null, "key": null}], "media": [{"k": "video", "u": "https://referees.fhr.ru/static/files/videos/exam-platform/d74/b1d/d74b1d1280b47dd968ebea.mp4?0"}]}, {"id": 4345, "active": true, "numRule": "53.2", "text": "Какой штраф накладывается?", "refs": [{"num": "53.2", "doc": null, "key": null}], "media": [{"k": "video", "u": "https://referees.fhr.ru/static/files/videos/exam-platform/dc7/096/dc7096dc4558c6a829fa9b.mp4?0"}]}, {"id": 4363, "active": true, "numRule": "75.3.4", "text": "Какие действия Главного судьи если этот момент происходит впервые в матче?", "refs": [{"num": "75.3", "doc": null, "key": null}], "media": [{"k": "video", "u": "https://referees.fhr.ru/static/files/videos/exam-platform/3f3/bc2/3f3bc2f332371f1d11b7b2.mp4?0"}]}, {"id": 4364, "active": true, "numRule": "75.3.4", "text": "Какие действия должен предпринять Главный судья, если ранее судья вынес предупреждение  этой команде за то, что игрок сидит на борту и/или свесил ногу за борт?", "refs": [{"num": "75.3", "doc": null, "key": null}], "media": [{"k": "video", "u": "https://referees.fhr.ru/static/files/videos/exam-platform/3f2/015/3f2015f412c85561d94b60.mp4?0"}]}, {"id": 4370, "active": true, "numRule": "53.8", "text": "Какие действия судьи?", "refs": [{"num": "53.8", "doc": null, "key": null}], "media": [{"k": "video", "u": "https://referees.fhr.ru/static/files/videos/exam-platform/546/eb7/546eb79404a743a551fa06.mp4?0"}]}, {"id": 4420, "active": true, "numRule": "75.2", "text": "Какой штраф должен наложить Главный судья?", "refs": [{"num": "75.2", "doc": null, "key": null}], "media": [{"k": "video", "u": "https://referees.fhr.ru/static/files/videos/exam-platform/3df/af6/3dfaf6341d77647a240b3d.mp4?0"}]}, {"id": 2, "active": true, "numRule": "12.1", "text": "Ваши действия по отношению к игроку, если вы заметили это первый раз?", "refs": [{"num": "12.1", "doc": null, "key": null}], "media": [{"k": "photo", "u": "https://referees.fhr.ru/static/files/images/exam-platform/iblock/eb9/eb90110df419e9df4d4d291a120f61d3.png?1"}]}, {"id": 6, "active": true, "numRule": "Прил. 1", "text": "Назовите жест судьи", "refs": [], "media": [{"k": "photo", "u": "https://referees.fhr.ru/static/files/images/exam-platform/iblock/7d9/7d99e3187d9a3c93b5f667de6a77f807.jpg?1"}]}, {"id": 9, "active": true, "numRule": "12.1", "text": "Ваши действия по отношению к игроку, если Вы уже вынесли предупреждение команде по опасной экипировке?", "refs": [{"num": "12.1", "doc": null, "key": null}], "media": [{"k": "photo", "u": "https://referees.fhr.ru/static/files/images/exam-platform/iblock/321/321fcbfefb13ff413c81a2f3ed617f0e.png?1"}]}, {"id": 12, "active": true, "numRule": "Прил. 1", "text": "Назовите жест судьи", "refs": [], "media": [{"k": "photo", "u": "https://referees.fhr.ru/static/files/images/exam-platform/iblock/cba/cba179ec667538e893e46e11dd47f9e7.jpg?1"}]}, {"id": 13, "active": true, "numRule": "Прил. 1", "text": "Назовите жест судьи", "refs": [], "media": [{"k": "photo", "u": "https://referees.fhr.ru/static/files/images/exam-platform/iblock/0ae/0aec578811a96337a7a50334aa7b16f0.jpg?1"}]}, {"id": 15, "active": true, "numRule": "0", "text": "Назовите жест судьи", "refs": [{"num": "0", "doc": null, "key": null}], "media": [{"k": "photo", "u": "https://referees.fhr.ru/static/files/images/exam-platform/iblock/5cb/5cb64397847b76119d5f229a7527bddb.jpg?1"}]}, {"id": 17, "active": true, "numRule": "Прил. 1", "text": "Назовите жест судьи", "refs": [], "media": [{"k": "photo", "u": "https://referees.fhr.ru/static/files/images/exam-platform/iblock/156/156a5537d375b14430357ca93f944860.jpg?1"}]}, {"id": 4319, "active": true, "numRule": "9.7", "text": "Разрешено игроку использовать данную маску для защиты лица ?", "refs": [{"num": "9.7", "doc": null, "key": null}], "media": [{"k": "photo", "u": "https://referees.fhr.ru/static/files/images/exam-platform/508/2e4/5082e468a1c192cf9da632.jpg?1"}]}, {"id": 4320, "active": true, "numRule": "9.7", "text": "После предупреждения игрок продолжает играть в данной защите для лица.\nДействия Главного судьи ?", "refs": [{"num": "9.7", "doc": null, "key": null}], "media": [{"k": "photo", "u": "https://referees.fhr.ru/static/files/images/exam-platform/bf7/04d/bf704d796ae61898f3ac39.jpg?1"}]}, {"id": 1729, "active": false, "numRule": "67.3", "text": "Вратарь выбрасывает шайбу вперед, и первым шайбы касается партнер по команде.\nВаши действия?", "refs": [{"num": "67.3", "doc": null, "key": null}], "media": []}, {"id": 1734, "active": false, "numRule": "57.6", "text": "В ситуации выхода «один на один» вратарь первоначально выбивает шайбу клюшкой, после чего совершает подножку заставляя соперника упасть на лед. \nВаши действия?", "refs": [{"num": "57.6", "doc": null, "key": null}], "media": []}, {"id": 1737, "active": false, "numRule": "", "text": "Хоккеисты это?", "refs": [], "media": []}, {"id": 1738, "active": false, "numRule": "", "text": "Какое минимальное количество хоккеистов может находится на льду во время матча?", "refs": [], "media": []}, {"id": 1739, "active": false, "numRule": "", "text": "Кто может обсуждать с Главным судьей  вопросы, связанные с Правилами во время матча?", "refs": [], "media": []}, {"id": 1740, "active": false, "numRule": "", "text": "Разрешается ли хоккеисту приделывать к щиткам какие-либо выступы или дополнения?", "refs": [], "media": []}, {"id": 1741, "active": false, "numRule": "", "text": "Разрешается ли игроку использовать какие-либо приспособления и дополнительные детали, которые могли бы повысить скорость и маневренность?", "refs": [], "media": []}, {"id": 1742, "active": false, "numRule": "", "text": "Можно ли менять вратаря после каждого броска для определения победителя матча?", "refs": [], "media": []}, {"id": 1743, "active": false, "numRule": "", "text": "Должен ли Главный судья зафиксировать взятие ворот, в случае, если шайба отскакивает от судьи и после чего хоккеист забрасывает ее в ворота?", "refs": [], "media": []}, {"id": 1744, "active": false, "numRule": "", "text": "Имеет ли право хоккеист, из-за травмы которого был остановлен матч, продолжать в нем участвовать?", "refs": [], "media": []}, {"id": 1745, "active": false, "numRule": "87", "text": "Будет ли считаться хоккеист находящимся на льду, если он играет в шайбу, в то время когда один конек находится на льду, а другой вне льда или участвует в игре против соперника?", "refs": [{"num": "87", "doc": null, "key": null}], "media": []}, {"id": 1746, "active": false, "numRule": "", "text": "5. В каких ситуациях Главный судья может запросить видеопросмотр взятия ворот ?", "refs": [], "media": []}, {"id": 1747, "active": false, "numRule": "", "text": "Шайбой владеет команда, на которую будет наложен штраф, что должен сделать Главный судья?", "refs": [], "media": []}, {"id": 1748, "active": false, "numRule": "", "text": "Что такое \"игра в численном меньшинстве\"?", "refs": [], "media": []}, {"id": 1749, "active": false, "numRule": "", "text": "Что такое \"Надлежащие инстанции\"?", "refs": [], "media": []}, {"id": 1750, "active": false, "numRule": "", "text": "5. В каких ситуациях главный судья не может запросить видеопросмотр взятия ворот?", "refs": [], "media": []}, {"id": 1751, "active": false, "numRule": "", "text": "Какое минимальное количество полевых игроков любой из команд должно находится в  любой момент во время матча на льду?", "refs": [], "media": []}, {"id": 1752, "active": false, "numRule": "", "text": "Имеет ли право Главный судья запретить использование любого элемента снаряжения хоккеистов, который, по его мнению, может быть травмоопасным или потенциально опасным?", "refs": [], "media": []}, {"id": 1753, "active": false, "numRule": "", "text": "После измерения клюшки она оказалась правильных размеров. \nВаши действия?", "refs": [], "media": []}, {"id": 1754, "active": false, "numRule": "", "text": "После замера Клюшка признана нестандартной. \nКто будет отбывать штраф?", "refs": [], "media": []}, {"id": 1755, "active": false, "numRule": "", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который продолжает лежать на льду, симулируя травму, или отказывается встать и покинуть лед?", "refs": [], "media": []}, {"id": 1756, "active": false, "numRule": "", "text": "Хоккеист, получивший травму, отказывается покинуть лед для оказания медицинской помощи. \nВаши действия?", "refs": [], "media": []}, {"id": 1757, "active": false, "numRule": "", "text": "Хоккеист на льду бросает клюшку в шайбу, которая находится в нейтральной зоне.\nВаши действия?", "refs": [], "media": []}, {"id": 1758, "active": false, "numRule": "", "text": "Вратарь заменен на игрока. В нейтральной зоне игрок команды соперника владеет шайбой, а замененный вратарь незаконно выходит на ледовую поверхность со скамейки игроков, и атакует соперника. \nВаши действия?", "refs": [], "media": []}, {"id": 1759, "active": false, "numRule": "", "text": "Могут ли вратари соответствующих команд, защищающие ворота находится одновременно на льду во время выполнения Штрафного броска?", "refs": [], "media": []}, {"id": 1760, "active": false, "numRule": "", "text": "Кто может выполнить Штрафной бросок, если полевой игрок, против которого были нарушены правила, травмирован?", "refs": [], "media": []}, {"id": 1761, "active": false, "numRule": "", "text": "Когда Штрафной бросок считается выполненным?", "refs": [], "media": []}, {"id": 1762, "active": false, "numRule": "", "text": "Когда Штрафной бросок считается выполненным?", "refs": [], "media": []}, {"id": 1763, "active": false, "numRule": "", "text": "Может ли вратарь выполнять функции  капитана команды?", "refs": [], "media": []}, {"id": 1764, "active": false, "numRule": "", "text": "Разрешается ли вратарю использовать  шлем, который отличается от шлемов его партнеров по команде по цвету и конструкции?", "refs": [], "media": []}, {"id": 1765, "active": false, "numRule": "190", "text": "Разрешается ли вратарю носить шлем, который отличается по цвету и конструкции от шлемов его партнеров по команде?", "refs": [{"num": "190", "doc": null, "key": null}], "media": []}, {"id": 1766, "active": false, "numRule": "", "text": "Вратарь направляется к своей скамейке во время матча и пытается играть в шайбу, идущую на проброс.\nВаши действия?", "refs": [], "media": []}, {"id": 4283, "active": false, "numRule": "", "text": "Deleted", "refs": [], "media": []}, {"id": 4284, "active": false, "numRule": "", "text": "Deleted", "refs": [], "media": []}, {"id": 4285, "active": false, "numRule": "", "text": "Deleted", "refs": [], "media": []}, {"id": 4286, "active": false, "numRule": "", "text": "Deleted", "refs": [], "media": []}, {"id": 4287, "active": false, "numRule": "", "text": "Deleted", "refs": [], "media": []}, {"id": 4288, "active": false, "numRule": "", "text": "Deleted", "refs": [], "media": []}, {"id": 4289, "active": false, "numRule": "", "text": "Deleted", "refs": [], "media": []}, {"id": 4290, "active": false, "numRule": "", "text": "Deleted", "refs": [], "media": []}, {"id": 4291, "active": false, "numRule": "", "text": "Deleted", "refs": [], "media": []}, {"id": 4292, "active": false, "numRule": "", "text": "Deleted", "refs": [], "media": []}, {"id": 4293, "active": false, "numRule": "", "text": "Deleted", "refs": [], "media": []}, {"id": 4294, "active": false, "numRule": "", "text": "Deleted", "refs": [], "media": []}, {"id": 4295, "active": false, "numRule": "", "text": "Deleted", "refs": [], "media": []}, {"id": 4296, "active": false, "numRule": "", "text": "Deleted", "refs": [], "media": []}, {"id": 4297, "active": false, "numRule": "", "text": "Deleted", "refs": [], "media": []}, {"id": 4313, "active": false, "numRule": "70.5", "text": "Хоккеист получил травму и Главный судья остановил матч.\nМожет ли тренер или неигровой персонал команды выйти на лед?", "refs": [{"num": "70.5", "doc": null, "key": null}], "media": []}, {"id": 4323, "active": false, "numRule": "39.3", "text": "Игрок отказывается отправиться непосредственно на скамейку штрафников после драки или конфронтации. \nВаши действия?", "refs": [{"num": "39.3", "doc": null, "key": null}], "media": []}, {"id": 4356, "active": false, "numRule": "19.4", "text": "Штрафы каких игроков будут на табло в дополнительном периоде, если он проводится в формате 5 на 5?\nКоманда «А» \n Команда «Б»\n\n \n Б35 – 5 мин в  55:00\n\nА4 – 2 мин в  58:00", "refs": [{"num": "19.4", "doc": null, "key": null}], "media": []}, {"id": 4374, "active": false, "numRule": "26.6", "text": "Ваши действия, если во время выхода один на один защищающийся игрок сзади дважды делает сопернику подножку?", "refs": [{"num": "26.6", "doc": null, "key": null}], "media": []}, {"id": 4375, "active": false, "numRule": "24.6", "text": "Ваши действия, если во время выхода один на один защищающийся игрок сзади сначала совершает задержку клюшкой после делает подножку?", "refs": [{"num": "24.6", "doc": null, "key": null}], "media": []}, {"id": 4378, "active": false, "numRule": "63.6", "text": "Если защищающийся игрок в дополнительном периоде намеренно сдвигает свои ворота в зоне защиты, но при этом шайба не находится в его зоне защиты (то есть его команда может атаковать соперника), какой штраф должен наложить Главный судья?", "refs": [{"num": "63.6", "doc": null, "key": null}], "media": []}, {"id": 4379, "active": false, "numRule": "63.6", "text": "Если игрок намеренно сдвигает свои ворота с нормального положения в течение последних двух минут основного времени матча, при этом шайба не находится в его зоне защиты (команда может атаковать соперника), какой штраф должен наложить Главный судья?", "refs": [{"num": "63.6", "doc": null, "key": null}], "media": []}, {"id": 4381, "active": false, "numRule": "63.6", "text": "Если вратарь атакующей команды намеренно сдвигает каркас своих ворот в последние две минуты основного времени матча, при этом шайба находится в зоне защиты соперника, какой штраф должен наложить Главный судья?", "refs": [{"num": "63.6", "doc": null, "key": null}], "media": []}, {"id": 4382, "active": false, "numRule": "63.6", "text": "Если вратарь намеренно сдвигает каркас своих ворот в дополнительном периоде.\nКакой штраф должен наложить Главный судья?", "refs": [{"num": "63.6", "doc": null, "key": null}], "media": []}, {"id": 1348, "active": false, "numRule": "", "text": "Шайба, брошенная атакующим хоккеистом из нейтральной зоны, после рикошета от соперника в его зоне защиты, попадает в защитную сетку за воротами.\nГде будет вбрасывание?", "refs": [], "media": []}, {"id": 1370, "active": false, "numRule": "62", "text": "Хоккеист безответственно подвергает опасности соперника, в результате колющего удара, удерживая клюшку одной рукой.\nВаши действия?", "refs": [{"num": "62", "doc": null, "key": null}], "media": []}, {"id": 1371, "active": false, "numRule": "62", "text": "Хоккеист безответственно подвергает опасности соперника, в результате колющего удара, удерживая клюшку двумя руками.\nВаши действия?", "refs": [{"num": "62", "doc": null, "key": null}], "media": []}, {"id": 1375, "active": false, "numRule": "80.3", "text": "Шайба касается клюшки атакующего игрока, расположенной выше перекладины ворот, отскакивает от судьи, попадает к игроку атакующей команды, который забрасывает шайбу в ворота. \nВаши действия?", "refs": [{"num": "80.3", "doc": null, "key": null}], "media": []}, {"id": 1381, "active": false, "numRule": "39.2", "text": "Игрок отказывается отправиться непосредственно на скамейку штрафников после драки или конфронтации. \nВаши действия?", "refs": [{"num": "39.2", "doc": null, "key": null}], "media": []}, {"id": 1382, "active": false, "numRule": "137", "text": "Хоккеист, отстранен от розыгрыша вбрасывания, а заменивший его партнер  не спешит занять соответствующее положение.\nВаши действия, если команде уже было вынесено предупреждение?", "refs": [{"num": "137", "doc": null, "key": null}], "media": []}, {"id": 1391, "active": false, "numRule": "43.3, 43.5", "text": "Какой штраф должен быть наложен Главным судьей на хоккеиста, который безответственно подвергает опасности  соперника в результате атаки сзади?", "refs": [{"num": "43.3", "doc": null, "key": null}, {"num": "43.5", "doc": null, "key": null}], "media": []}, {"id": 1394, "active": false, "numRule": "63.2", "text": "Если атакующий игрок намеренно сдвигает ворота соперника в течение последних двух минут основного времени матча, при этом шайба находится в зоне защиты соперника, какой штраф должен наложить Главный судья?", "refs": [{"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 1395, "active": false, "numRule": "63.2", "text": "Атакующий игрок намеренно сдвигает ворота соперника в дополнительном периоде, при этом шайба находится в зоне защиты соперника, какой штраф должен наложить Главный судья?", "refs": [{"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 1396, "active": false, "numRule": "63.6", "text": "Если защищающийся игрок намеренно сдвигает свои ворота в течение последних двух минут основного времени матча, при этом шайба находится в его зоне защиты, какой штраф должен наложить Главный судья?", "refs": [{"num": "63.6", "doc": null, "key": null}], "media": []}, {"id": 1397, "active": false, "numRule": "63.6", "text": "Если защищающийся игрок в своей зоне защиты намеренно сдвигает ворота с нормального положения в любое время дополнительного периода, при этом шайба находится в зоне защиты, должен ли назначаться штрафной бросок?", "refs": [{"num": "63.6", "doc": null, "key": null}], "media": []}, {"id": 1398, "active": false, "numRule": "63.2", "text": "Защищающийся игрок намеренно сдвигает свои ворота с нормального положения в течение основного времени матча. \nВаши действия?", "refs": [{"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 1399, "active": false, "numRule": "63.6", "text": "Вратарь намеренно сдвигает ворота с нормального положения в течение последних двух минут основного времени матча. \nВаши действия?", "refs": [{"num": "63.6", "doc": null, "key": null}], "media": []}, {"id": 1400, "active": false, "numRule": "63.2", "text": "Вратарь намеренно сдвигает ворота с нормального положения в основное время матча. \nВаши действия?", "refs": [{"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 1401, "active": false, "numRule": "63.6", "text": "Вратарь намеренно сдвигает ворота с нормального положения в любое время в овертайме. \nВаши действия?", "refs": [{"num": "63.6", "doc": null, "key": null}], "media": []}, {"id": 1403, "active": false, "numRule": "63.2", "text": "Вратарь ловит шайбу, а затем бросает ее, или бьет по ней любым способом, используя свое снаряжение, направляя шайбу своими умышленными действиями за пределы игровой площадки. \nВаши действия?", "refs": [{"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 1412, "active": false, "numRule": "", "text": "Имеет ли право полевой игрок выполнять функции вратаря при выполнении серии бросков, определяющих победителя матча?", "refs": [], "media": []}, {"id": 1413, "active": false, "numRule": "", "text": "Имеет ли право полевой игрок выполнять функции вратаря при выполнении серии бросков, определяющих победителя матча?", "refs": [], "media": []}, {"id": 1415, "active": false, "numRule": "45", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который безответственно ударом локтем подвергает соперника опасности нанося очевидную травму?", "refs": [{"num": "45", "doc": null, "key": null}], "media": []}, {"id": 1416, "active": false, "numRule": "141", "text": "Хоккеист определен, как Зачинщик в Драке. Какой дополнительный штраф на него должны быть наложен, помимо прочих возможных?", "refs": [{"num": "141", "doc": null, "key": null}], "media": []}, {"id": 1420, "active": false, "numRule": "", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который лежит на льду, симулируя травму, или отказывается встать и покинуть лед?", "refs": [], "media": []}, {"id": 1432, "active": false, "numRule": "69.2", "text": "Вратарь владеет шайбой позади своих ворот, а атакующий игрок с силой отталкивает его и завладевает шайбой. \nВаши действия?", "refs": [{"num": "69.2", "doc": null, "key": null}], "media": []}, {"id": 1435, "active": false, "numRule": "24.8, 63.9", "text": "Игрок команды «А» находится в положении выхода \"один на один\", а игрок, находясь за воротами, сдвигает их.\nВаши действия?", "refs": [{"num": "24.8", "doc": null, "key": null}, {"num": "63.9", "doc": null, "key": null}], "media": []}, {"id": 1438, "active": false, "numRule": "171", "text": "Игрок команды «А», в положении «выхода один на один», атакован сзади игроком команды «Б» с нарушением правил, за которое полагается наложение Матч-штрафа.\nВаши действия?", "refs": [{"num": "171", "doc": null, "key": null}], "media": []}, {"id": 1439, "active": false, "numRule": "24.8, 63.9", "text": "Защищающийся игрок намеренно сдвигает свои ворота с их нормального положения в момент, когда атакующий игрок выходит один на один с вратарём его команды, какой штраф должен наложить Главный судья?", "refs": [{"num": "24.8", "doc": null, "key": null}, {"num": "63.9", "doc": null, "key": null}], "media": []}, {"id": 1448, "active": false, "numRule": "27.1", "text": "Кто должен отбывать штраф за нарушение, которое совершил вратарь?", "refs": [{"num": "27.1", "doc": null, "key": null}], "media": []}, {"id": 1464, "active": false, "numRule": "", "text": "Какой штраф должен наложить Главный судья на хоккеиста, который безответственно подвергает опасности жизнь и здоровье соперника, за толчок  соперника на борт?", "refs": [], "media": []}, {"id": 1465, "active": false, "numRule": "", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который не предпринимая усилий сыграть в шайбу, задерживает соперника у борта с помощью нижней части тела, чтобы не позволить тому отъехать от бортов площадки?", "refs": [], "media": []}, {"id": 1469, "active": false, "numRule": "43.1", "text": "Какой штраф должен быть наложен на атакующего хоккеиста, если соперник умышленно разворачивается к нему спиной, тем самым ставя себя в уязвимое положение непосредственно перед атакой?", "refs": [{"num": "43.1", "doc": null, "key": null}], "media": []}, {"id": 1476, "active": false, "numRule": "", "text": "Игрок команды «А», преследуя противника в нейтральной зоне, проезжает мимо сломанной клюшки лежащей на льду и толкает её в направлении игрока ведущего шайбу. \nВаши действия?", "refs": [], "media": []}, {"id": 1479, "active": false, "numRule": "57", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который безответственно подвергает опасности соперника, нанося ему удар коленом?", "refs": [{"num": "57", "doc": null, "key": null}], "media": []}, {"id": 1481, "active": false, "numRule": "57.3", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который наносит опасный удар по коньку соперника сзади и одновременно тянет его рукой или клюшкой назад, тем самым пытаясь сбить его с ног?", "refs": [{"num": "57.3", "doc": null, "key": null}], "media": []}, {"id": 1493, "active": false, "numRule": "53.8", "text": "Хоккеист на льду бросает свою клюшку в соперника, выходящего один на один с вратарем.\nВаши действия?", "refs": [{"num": "53.8", "doc": null, "key": null}], "media": []}, {"id": 1494, "active": false, "numRule": "", "text": "Хоккеист на льду бросает часть сломанной клюшки, лежащей на льду, в соперника, который выходит один на один с пустыми воротами. В ситуации когда вратарь покинул ледовую площадку.\nВаши действия?", "refs": [], "media": []}, {"id": 1495, "active": false, "numRule": "", "text": "Хоккеист на льду бросает часть сломанной клюшки, лежащей на льду, в соперника, который владеет шайбой в нейтральной зоне. В ситуации когда вратарь покинул ледовую площадку.\nВаши действия?", "refs": [], "media": []}, {"id": 1502, "active": false, "numRule": "39.3.3, 39.5.7", "text": "Официальный представитель команды, находящейся за пределами льда выбрасывает на лед клюшку в протест на решение судьи.\nВаши действия?", "refs": [{"num": "39.3", "doc": null, "key": null}, {"num": "39.5", "doc": null, "key": null}], "media": []}, {"id": 1503, "active": false, "numRule": "39.3.3, 39.5.7", "text": "Официальный представитель команды, находящейся за пределами льда выбрасывает на лед планшетку в протест на решение судьи.\nВаши действия?", "refs": [{"num": "39.3", "doc": null, "key": null}, {"num": "39.5", "doc": null, "key": null}], "media": []}, {"id": 1504, "active": false, "numRule": "39.3.3, 39.5.7", "text": "Официальный представитель команды, находящейся за пределами льда выбрасывает на лед пустую пластиковую бутылку в протест на решение судьи.\nВаши действия?", "refs": [{"num": "39.3", "doc": null, "key": null}, {"num": "39.5", "doc": null, "key": null}], "media": []}, {"id": 1512, "active": false, "numRule": "1.2", "text": "Что делать организаторам, если невозможно соблюсти стандартные размеры на соревнованиях ФХР?", "refs": [{"num": "1.2", "doc": null, "key": null}], "media": []}, {"id": 1517, "active": false, "numRule": "54", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который не предпринимая усилий сыграть в шайбу, задерживает соперника у борта, чтобы не позволить тому отъехать от бортов площадки?", "refs": [{"num": "54", "doc": null, "key": null}], "media": []}, {"id": 1542, "active": false, "numRule": "63.2", "text": "Хоккеист выбрасывает шайбу в направлении скамейки из своей зоны защиты. Шайба перелетает через защитное стекло позади скамеек игроков. Ваши действия?", "refs": [{"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 1555, "active": false, "numRule": "63.2", "text": "Может ли вратарь прижимать шайбу находясь за пределами ограниченной зоны вратаря не касаясь площади ворот, если он подвергся давлению со стороны соперника?", "refs": [{"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 1557, "active": false, "numRule": "49", "text": "В ходе игровых действий, на льду появляется вторая шайба, отличная от той, что в игре. Ваши действия?", "refs": [{"num": "49", "doc": null, "key": null}], "media": []}, {"id": 1558, "active": false, "numRule": "49", "text": "В ходе игровых действий, на льду появляется вторая шайба, отличная от той, что в игре. Ваши действия?", "refs": [{"num": "49", "doc": null, "key": null}], "media": []}, {"id": 1559, "active": false, "numRule": "23.8", "text": "Какой штраф должен наложить Главный судья на хоккеиста, укусившего соперника?", "refs": [{"num": "23.8", "doc": null, "key": null}], "media": []}, {"id": 1564, "active": false, "numRule": "43.3", "text": "Какой штраф должен быть наложен Главным судьей на хоккеиста, который безответственно подвергает опасности соперника в результате атаки сзади?", "refs": [{"num": "43.3", "doc": null, "key": null}], "media": []}, {"id": 1565, "active": false, "numRule": "43.3", "text": "Какой штраф должен быть наложен Главным судьей на хоккеиста за атаку сзади?", "refs": [{"num": "43.3", "doc": null, "key": null}], "media": []}, {"id": 1579, "active": false, "numRule": "55", "text": "Какой штраф должен наложить Главный судья за задержку клюшкой, если Малого штрафа будет недостаточным наказанием?", "refs": [{"num": "55", "doc": null, "key": null}], "media": []}, {"id": 1581, "active": false, "numRule": "151", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который пытается нанести удар ногой по хоккеисту команды соперника?", "refs": [{"num": "151", "doc": null, "key": null}], "media": []}, {"id": 1584, "active": false, "numRule": "0 временно убрать", "text": "Какие штрафы могут быть наложены на хоккеиста, который поднимает клюшку, расположенную между ног соперника, что бы ударить игрока в область паха?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 1586, "active": false, "numRule": "57", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который использует свою ногу и одновременно тянет соперника рукой или клюшкой назад, заставляя упасть на лед?", "refs": [{"num": "57", "doc": null, "key": null}], "media": []}, {"id": 1587, "active": false, "numRule": "57", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который использует свою ногу и одновременно тянет соперника рукой или клюшкой назад, заставляя с силой упасть на лед?", "refs": [{"num": "57", "doc": null, "key": null}], "media": []}, {"id": 1588, "active": false, "numRule": "62", "text": "Хоккеист безответственно подвергает опасности соперника, в результате колющего удара, удерживая клюшку двумя руками.\n\nВаши действия?", "refs": [{"num": "62", "doc": null, "key": null}], "media": []}, {"id": 1589, "active": false, "numRule": "62", "text": "Хоккеист безответственно подвергает опасности соперника, в результате колющего удара, удерживая клюшку одной рукой.\n\nВаши действия?", "refs": [{"num": "62", "doc": null, "key": null}], "media": []}, {"id": 1593, "active": false, "numRule": "57", "text": "Какой штраф должен быть наложить Главный судья за подножку, если хоккеист  безответственно подвергает опасности соперника с возможным нанесением травмы?", "refs": [{"num": "57", "doc": null, "key": null}], "media": []}, {"id": 1594, "active": false, "numRule": "167", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который сбивает соперника на лед, поставив ему подножку, используя клюшку, стопу или ногу?", "refs": [{"num": "167", "doc": null, "key": null}], "media": []}, {"id": 1603, "active": false, "numRule": "", "text": "", "refs": [], "media": []}, {"id": 1608, "active": false, "numRule": "26", "text": "Имеет ли право официальный представитель команды, который находится рядом со скамейкой хоккеистов во время матча использовать какие-либо радиотехнические средства?", "refs": [{"num": "26", "doc": null, "key": null}], "media": []}, {"id": 1610, "active": false, "numRule": "26", "text": "Имеет ли право официальный представитель команды, который находится рядом со скамейкой хоккеистов во время матча использовать какие-либо радиотехнические средства?", "refs": [{"num": "26", "doc": null, "key": null}], "media": []}, {"id": 1614, "active": false, "numRule": "101", "text": "Действия Главного судьи, в случае, если в течении одного матча на команду наложено пятнадцать штрафов, включая комбинацию из Малых штрафов и Дисциплинарного штрафа?", "refs": [{"num": "101", "doc": null, "key": null}], "media": []}, {"id": 1619, "active": false, "numRule": "73.2", "text": "Одна из команда, находящаяся на льду,  отказывается играть после указаний главного судьи начать матч. Ваши действия?", "refs": [{"num": "73.2", "doc": null, "key": null}], "media": []}, {"id": 1620, "active": false, "numRule": "73.2", "text": "Одна из команда, находящаяся на льду,  отказывается играть по истечении 15 секунд после указаний главного судьи начать матч. Ваши действия?", "refs": [{"num": "73.2", "doc": null, "key": null}], "media": []}, {"id": 1623, "active": false, "numRule": "10.4", "text": "Можно ли вратарю играть сломанной клюшкой?", "refs": [{"num": "10.4", "doc": null, "key": null}], "media": []}, {"id": 1629, "active": false, "numRule": "83.7", "text": "Отложенное положение «вне игры» рассматривается, как умышленное положение «вне игры», если?", "refs": [{"num": "83.7", "doc": null, "key": null}], "media": []}, {"id": 1630, "active": false, "numRule": "37.3", "text": "В каких ситуациях Главный судья может запросить видеопросмотр взятия ворот?", "refs": [{"num": "37.3", "doc": null, "key": null}], "media": []}, {"id": 1634, "active": false, "numRule": "37.3", "text": "10. В каких ситуациях Главный судья может запросить видеопросмотр взятия ворот?", "refs": [{"num": "37.3", "doc": null, "key": null}], "media": []}, {"id": 1635, "active": false, "numRule": "37.3", "text": "11. В каких ситуациях Главный судья может запросить видеопросмотр взятия ворот?", "refs": [{"num": "37.3", "doc": null, "key": null}], "media": []}, {"id": 1639, "active": false, "numRule": "6.1", "text": "Имеет ли право вратарь выполнять функции ассистента капитана команды?", "refs": [{"num": "6.1", "doc": null, "key": null}], "media": []}, {"id": 1651, "active": false, "numRule": "8.1", "text": "Травмированный игрок во время игровых действий покидает лед через скамейку запасных игроков команды соперника. Ваши действия?", "refs": [{"num": "8.1", "doc": null, "key": null}], "media": []}, {"id": 1653, "active": false, "numRule": "43.3", "text": "Какой штраф должен быть наложен на хоккеиста за Атаку сзади?", "refs": [{"num": "43.3", "doc": null, "key": null}], "media": []}, {"id": 1657, "active": false, "numRule": "55", "text": "Какой штраф должен быть наложен за задержку клюшкой, если хоккеист безответственно подвергает опасности соперника с возможным нанесением травмы?", "refs": [{"num": "55", "doc": null, "key": null}], "media": []}, {"id": 1658, "active": false, "numRule": "55", "text": "Какой штраф должен быть наложен Главным судьей за задержку клюшкой, если Малый штраф будет недостаточным наказанием?", "refs": [{"num": "55", "doc": null, "key": null}], "media": []}, {"id": 1660, "active": false, "numRule": "45.5", "text": "Какое решение должен принять Главный судья по отношению к хоккеисту, который ударом локтем безответственно подвергает опасности соперника с возможным нанесением травмы?", "refs": [{"num": "45.5", "doc": null, "key": null}], "media": []}, {"id": 1661, "active": false, "numRule": "46.3", "text": "Какое решение должен принять Главный судья по отношению к хоккеисту, который является зачинщиком драки в МХЛ, ВХЛ или ЖХЛ", "refs": [{"num": "46.3", "doc": null, "key": null}], "media": []}, {"id": 1677, "active": false, "numRule": "53.8", "text": "Врач команды со скамейки игроков бросает клюшку в соперника, владеющего шайбой в зоне защиты команды врача.\nВаши действия?", "refs": [{"num": "53.8", "doc": null, "key": null}], "media": []}, {"id": 1680, "active": false, "numRule": "53.8", "text": "Игрок со скамейки оштрафованных бросает клюшку в соперника, владеющего шайбой в зоне защиты бросающего клюшку игрока.\nВаши действия?", "refs": [{"num": "53.8", "doc": null, "key": null}], "media": []}, {"id": 1681, "active": false, "numRule": "53.8", "text": "Игрок со скамейки оштрафованных бросает перчатку в шайбу, находящуюся в зоне защиты команды бросающего перчатку игрока.\nВаши действия?", "refs": [{"num": "53.8", "doc": null, "key": null}], "media": []}, {"id": 1682, "active": false, "numRule": "53.8", "text": "Представитель команды со скамейки игроков направляет потерянную клюшку, лежащую на льду в шайбу, находящуюся в зоне защиты пердставителя команды. \nВаши действия?", "refs": [{"num": "53.8", "doc": null, "key": null}], "media": []}, {"id": 1683, "active": false, "numRule": "53.8", "text": "Хоккеист со скамейки игроков направляет потерянную клюшку, лежащую на льду, в шайбу, находящуюся в зоне защиты бросающего клюшку хоккеиста. \nВаши действия?", "refs": [{"num": "53.8", "doc": null, "key": null}], "media": []}, {"id": 1684, "active": false, "numRule": "76.2", "text": "Где будет проводиться вбрасывание, если Малый штраф был наложен до начала периода?", "refs": [{"num": "76.2", "doc": null, "key": null}], "media": []}, {"id": 1685, "active": false, "numRule": "76.2", "text": "Где будет проводиться вбрасывание, если сразу после взятия ворот, на пропустившую шайбу команду, будет наложен Малый штраф?", "refs": [{"num": "76.2", "doc": null, "key": null}], "media": []}, {"id": 1686, "active": false, "numRule": "76.2", "text": "Где будет проводиться вбрасывание, если сразу после взятия ворот, на забросившую шайбу команду, будет наложен Малый штраф?", "refs": [{"num": "76.2", "doc": null, "key": null}], "media": []}, {"id": 1687, "active": false, "numRule": "76.2, 85.5", "text": "Хоккеист бросает шайбу по воротам соперника из зоны защиты. Шайба попадает в каркас ворот и выходит из игры. \nГде будет вбрасывание?", "refs": [{"num": "76.2", "doc": null, "key": null}, {"num": "85.5", "doc": null, "key": null}], "media": []}, {"id": 1688, "active": false, "numRule": "76.2, 85.5", "text": "Хоккеист бросает шайбу по воротам соперника из нейтральной зоны. Шайба попадает в каркас ворот и выходит из игры. Где будет вбрасывание?", "refs": [{"num": "76.2", "doc": null, "key": null}, {"num": "85.5", "doc": null, "key": null}], "media": []}, {"id": 1689, "active": false, "numRule": "76.2, 85.5", "text": "Игрок бросает шайбу по воротам соперника из зоны атаки. Шайба попадает в каркас ворот и выходит из игры. Где будет вбрасывание?", "refs": [{"num": "76.2", "doc": null, "key": null}, {"num": "85.5", "doc": null, "key": null}], "media": []}, {"id": 1696, "active": false, "numRule": "67.3", "text": "Вратарь перчаткой выбрасывает шайбу вперед, и первым шайбы касается партнер по команде.\nВаши действия?", "refs": [{"num": "67.3", "doc": null, "key": null}], "media": []}, {"id": 1700, "active": false, "numRule": "МОМ", "text": "На какой срок, на конечность, можно накладывать кровоостанавливающий жгут в теплое время года?", "refs": [], "media": []}, {"id": 609, "active": false, "numRule": "67.2.3", "text": "Какой штраф должен быть наложен Главным судьей, если хоккеист подбирает шайбу со льда перчаткой, за пределами своей площади ворот?", "refs": [{"num": "67.2", "doc": null, "key": null}], "media": []}, {"id": 611, "active": false, "numRule": "127", "text": "Какой штраф должен быть наложен Главным судьей, за Толчок клюшкой?", "refs": [{"num": "127", "doc": null, "key": null}], "media": []}, {"id": 612, "active": false, "numRule": "", "text": "На хоккеиста, который умышленно сдвигает ворота с их нормального положения, должен быть наложен?", "refs": [], "media": []}, {"id": 613, "active": false, "numRule": "", "text": "Хоккеист выбрасывает шайбу за пределы игровой площадки из своей зоны защиты в любое место арены (за исключением случаев, когда нет защитного стекла).\nВаши действия?", "refs": [], "media": []}, {"id": 619, "active": false, "numRule": "", "text": "В случае, если команды играют не в полных составах, будет ли их дальнейшее сокращение в результате наложения совпадающих штрафов?", "refs": [], "media": []}, {"id": 625, "active": false, "numRule": "23.8", "text": "Какой штраф должен наложить Главный судья на хоккеиста, укусившего соперника?", "refs": [{"num": "23.8", "doc": null, "key": null}], "media": []}, {"id": 634, "active": false, "numRule": "63.2", "text": "Может ли хоккеист, находящийся на льду начать ремонтировать/подгонять по размеру свое снаряжение, что повлечет задержку следующего вбрасывания шайбы?", "refs": [{"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 635, "active": false, "numRule": "82.2", "text": "Команда забрасывает шайбу в ворота соперника, находясь в численном меньшинстве. Со скамейки запасных выходит игрок и едет праздновать забитый гол.\nВаши действия?", "refs": [{"num": "82.2", "doc": null, "key": null}], "media": []}, {"id": 636, "active": false, "numRule": "82.2", "text": "Команда забрасывает шайбу в ворота соперника, находясь в численном меньшинстве 3 на 5. Со скамейки запасных этой команды выходят пять игроков и едут праздновать забитый гол. Такая ситуация произошла первый раз в матче.\nВаши действия?", "refs": [{"num": "82.2", "doc": null, "key": null}], "media": []}, {"id": 637, "active": false, "numRule": "135", "text": "Хоккеист выбрасывает шайбу за заградительное стекло за скамейкой запасных игроков, непосредственно через борт из зоны защиты.\nВаши действия?", "refs": [{"num": "135", "doc": null, "key": null}], "media": []}, {"id": 639, "active": false, "numRule": "", "text": "Выберите один правильный критерий, который входит в число трёх определяющих критериев, для сокращения совпадающих штрафов", "refs": [], "media": []}, {"id": 640, "active": false, "numRule": "", "text": "Выберите один правильный критерий, который входит в число трёх определяющих критериев, для сокращения совпадающих штрафов", "refs": [], "media": []}, {"id": 641, "active": false, "numRule": "", "text": "Выберите один правильный критерий, который входит в число трёх определяющих критериев, для сокращения совпадающих штрафов", "refs": [], "media": []}, {"id": 642, "active": false, "numRule": "", "text": "2. Если команда, нарушившая правила, не контролирует шайбу, а Главный судья поднимает руку, показывая намерение наложить штраф. Когда он сможет остановить матч и наложить штраф?", "refs": [], "media": []}, {"id": 644, "active": false, "numRule": "", "text": "4. Если команда, нарушившая правила, не контролирует шайбу, а Главный судья поднимает руку, показывая намерение наложить штраф. Когда он сможет остановить матч и наложить штраф?", "refs": [], "media": []}, {"id": 649, "active": false, "numRule": "10.3", "text": "Игрок, находящийся на скамейке для оштрафованных игроков, отдает свою клюшку игроку, у которого сломалась на льду клюшка.\nВаши действия?", "refs": [{"num": "10.3", "doc": null, "key": null}], "media": []}, {"id": 653, "active": false, "numRule": "", "text": "Какой штраф должен быть наложен Главным судьей на хоккеиста, который наносит сопернику травму в результате удара концом клюшки?", "refs": [], "media": []}, {"id": 654, "active": false, "numRule": "", "text": "Какой штраф должен быть наложен Главным судьей на хоккеиста, который наносит травму или  безответственно подвергает опасности жизнь и здоровье соперника в результате неправильной атаки?", "refs": [], "media": []}, {"id": 655, "active": false, "numRule": "", "text": "Какой штраф должен быть наложен Главным судьей на хоккеиста, который безответственно подвергает опасности жизнь и здоровье соперника в результате атаки сзади?", "refs": [], "media": []}, {"id": 656, "active": false, "numRule": "", "text": "Какой штраф должен быть наложен Главным судьей на хоккеиста, который травмирует соперника в результате атаки сзади?", "refs": [], "media": []}, {"id": 657, "active": false, "numRule": "", "text": "Какой штраф должен быть наложен Главным судьей на хоккеиста, который наносит травму или пытается нанести травму хоккеисту команды соперника в результате атаки в голову или в область шеи?", "refs": [], "media": []}, {"id": 658, "active": false, "numRule": "", "text": "Какой штраф должен быть наложен Главным судьей на хоккеиста, который низко приседает у борта, чтобы избежать применения силового приема, в результате чего соперник совершает кувырок  через него?", "refs": [], "media": []}, {"id": 663, "active": false, "numRule": "12.1", "text": "Какой штраф должен быть наложен на хоккеиста, который игнорирует предупреждение о замене или приведении в порядок любого незаконного элемента снаряжения?", "refs": [{"num": "12.1", "doc": null, "key": null}], "media": []}, {"id": 664, "active": false, "numRule": "", "text": "Вратарь намеренно сдвигает ворота с их нормального положения в течение последних двух минут основного времени матча или в любое время дополнительного периода . \nВаши действия?", "refs": [], "media": []}, {"id": 665, "active": false, "numRule": "", "text": "Полевой игрок намеренно сдвигает свои ворота с их нормального положения в течение последних двух минут основного времени матча или в любое время  дополнительного периода.\n Ваши действия?", "refs": [], "media": []}, {"id": 667, "active": false, "numRule": "", "text": "Полевой игрок намеренно сдвигает чужие ворота с их нормального положения в течение последних двух минут основного времени матча или в любое время дополнительного периода. \nВаши действия?", "refs": [], "media": []}, {"id": 669, "active": false, "numRule": "63.2", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который прижимает шайбу к борту и не находится под прессингом команды соперника?", "refs": [{"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 672, "active": false, "numRule": "", "text": "Хоккеист выбрасывает шайбу, играя высоко поднятой клюшкой из зоны защиты и попадает в табло над ледовой площадкой в пределах плоскости, ограниченной бортами площадки, в результате чего происходит остановка матча?", "refs": [], "media": []}, {"id": 673, "active": false, "numRule": "", "text": "Вратарь ловит шайбу, а затем бросает ее, или бьет по ней любым способом, используя свое снаряжение, направляя шайбу своими умышленными действиями за пределы площадки.", "refs": [], "media": []}, {"id": 674, "active": false, "numRule": "", "text": "Шайба, брошена из зоны защиты и попадает в заградительную сетку за воротами в противоположном конце площадки.", "refs": [], "media": []}, {"id": 677, "active": false, "numRule": "", "text": "Хоккеист, участвующий во вбрасывании, отстранен от вбрасывания Судьей на льду, а заменивший его партнер  не спешит принять соответствующее положение.\nВаши действия, если команде уже было вынесено предупреждение?", "refs": [], "media": []}, {"id": 683, "active": false, "numRule": "", "text": "Какой штраф должен быть наложен на хоккеиста, который намеренно толкнул судью на льду?", "refs": [], "media": []}, {"id": 684, "active": false, "numRule": "116", "text": "Какой штраф должен быть наложен на официального представителя команды, который намеренно и безответственно причиняет вред любому Судье на льду?", "refs": [{"num": "116", "doc": null, "key": null}], "media": []}, {"id": 685, "active": false, "numRule": "", "text": "Какой штраф должен быть наложен на хоккеиста, который замахнулся клюшкой на судью?", "refs": [], "media": []}, {"id": 686, "active": false, "numRule": "", "text": "Какой штраф должен наложить Главный судья на хоккеиста, который  безответственно подвергает опасности жизнь и здоровье соперника, за толчок  соперника на борт?", "refs": [], "media": []}, {"id": 688, "active": false, "numRule": "", "text": "Хоккеист сломал свою клюшку и выхватил клюшку у соперника, находящегося на скамейке запасных игроков. \nВаши действия?", "refs": [], "media": []}, {"id": 694, "active": false, "numRule": "", "text": "Какой вид штрафа должен быть наложен на атакующего хоккеиста, если соперник умышленно разворачивается спиной к атакующему его сопернику, тем самым оказываясь в уязвимом положении непосредственно перед атакой, создавая условия для атаки сзади?", "refs": [], "media": []}, {"id": 696, "active": false, "numRule": "126", "text": "Какой штраф должен быть наложен, если хоккеист накрывает шайбу на льду перчаткой за пределами площади ворот, и затаскивает шайбу в площадь ворот, когда его вратарь находится на льду?", "refs": [{"num": "126", "doc": null, "key": null}], "media": []}, {"id": 701, "active": false, "numRule": "65.2", "text": "Если хоккеист не может снять персональные аксессуары, которые по мнению Главного судьи, могут представлять потенциальную опасность то:", "refs": [{"num": "65.2", "doc": null, "key": null}], "media": []}, {"id": 702, "active": false, "numRule": "128", "text": "Если хоккеист после предупреждения продолжает использовать персональные аксессуары, которые по мнению Главного судьи, могут представлять потенциальную опасность то:", "refs": [{"num": "128", "doc": null, "key": null}], "media": []}, {"id": 706, "active": false, "numRule": "63.2.5", "text": "Вратарь заменен на игрока, который блокирует бросок в площади ворот и шайба застревает под ним. Он не предпринимает ни каких попыток накрыть шайбу, упасть на нее или переместить шайбу под себя. \nВаши действия?", "refs": [{"num": "63.2", "doc": null, "key": null}], "media": []}, {"id": 707, "active": false, "numRule": "63.3", "text": "Команда забрасывает шайбу в ворота соперника, находясь в численном меньшинстве 3 на 5. Со скамейки запасных выходят пять игроков этой команды и едут праздновать забитый гол. Главный судья уже делал предупреждение.\nВаши действия?", "refs": [{"num": "63.3", "doc": null, "key": null}], "media": []}, {"id": 710, "active": false, "numRule": "", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который является зачинщиком драки?", "refs": [], "media": []}, {"id": 711, "active": false, "numRule": "", "text": "Какой штраф необходимо наложить на хоккеиста, который наносит сопернику удар рукой в перчатке, например в отместку.", "refs": [], "media": []}, {"id": 712, "active": false, "numRule": "", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который пытается или наносит удар сопернику головой?", "refs": [], "media": []}, {"id": 715, "active": false, "numRule": "", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который пытается чинить препятствия сопернику, не владеющему шайбой?", "refs": [], "media": []}, {"id": 719, "active": false, "numRule": "0", "text": "Какой штраф нужно наложить на хоккеиста, который использует колено, чтобы атаковать хоккеиста команды соперника?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 723, "active": false, "numRule": "0", "text": "Какое решение должен принять Главный судья, по отношению к хоккеисту, который сбивает соперника на лед, сделав  ему подножку, рукой?", "refs": [{"num": "0", "doc": null, "key": null}], "media": []}, {"id": 726, "active": false, "numRule": "46.3, 46.12", "text": "Какой штраф будет наложен на хоккеиста, который сбрасывает перчатку(и) или шлем и ввязывается в конфронтацию с соперником?", "refs": [{"num": "46.3", "doc": null, "key": null}, {"num": "46.12", "doc": null, "key": null}], "media": []}, {"id": 732, "active": false, "numRule": "62", "text": "Хоккеист наносит сопернику колющий удар.\nВаши действия?", "refs": [{"num": "62", "doc": null, "key": null}],
